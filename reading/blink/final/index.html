ot everything in America", 0], [16, "was bad. He thought his answer balanced. The", 0], [17, "reports that followed, he felt, kept the", 0], [18, "sharpest phrase and dropped the rest. That", 0], [19, "night the league suspended him. When his agent", 0], [20, "protested, the official in charge of enforcing", 0], [21, "the rules admitted that no rule actually", 0], [22, "required players to stand.", 0], [23, "Abdul-Rauf was troubled less by the lost pay", 1], [24, "than by being portrayed as a troublemaker", 0], [25, "rather than as a man acting on principle.", 0], [26, "Unsure what to do, he consulted a mentor, Imam", 0], [27, "Muhammad al-Asi, who told him of a time the", 0], [28, "Prophet had risen to his feet out of respect", 0], [29, "as the funeral of someone of another faith", 0], [30, "passed by. Standing, the imam suggested, need", 0], [31, "not mean endorsing; he could stand and pray", 0], [32, "for people who were suffering. Abdul-Rauf", 0], [33, "agreed to return on those terms, standing with", 0], [34, "his team, his hands held open in prayer. He", 0], [35, "knew some would call it surrender. He", 0], [36, "considered it another way to say the same", 0], [37, "thing.", 0], [38, "It did not save his place. Although he was the", 1], [39, "team’s leading scorer, his coach soon called", 0], [40, "the matter a distraction and told him to stay", 0], [41, "home for the rest of the season; that summer", 0], [42, "he was traded. He had read enough history, he", 0], [43, "wrote, to expect that people who embarrass", 0], [44, "powerful institutions are usually made to pay.", 0], [45, "What he asked himself during those weeks was a", 0], [46, "different question: what did he want his life", 0], [47, "to say? More, he decided, than a scoring", 0], [48, "average or the size of a contract.", 0]], "qs": [{"type": "main-idea", "prompt": "The passage is primarily concerned with", "choices": ["a player who acted on his beliefs, compromised, and still paid a price.", "a league’s effort to write a new rule in response to one player’s protest.", "the reasons reporters often misquote professional athletes.", "a mentor’s success in changing a player’s opinion about the national flag."], "answer": 0, "explain": "Stance (paragraphs 1–2), compromise (3), cost and what he decided mattered (4). His opinion did not change, so the last choice is wrong."}, {"type": "detail", "prompt": "According to the passage, the mentor’s story was useful to Abdul-Rauf because it showed that", "choices": ["standing could show respect without showing approval.", "the league had no power to punish a player for his faith.", "other athletes had faced the same decision in the past.", "his teammates would support him if he returned."], "answer": 0, "explain": "“Standing, the imam suggested, need not mean endorsing.”"}, {"type": "vocab", "prompt": "In line 31, the word “endorsing” most nearly means", "choices": ["approving.", "ignoring.", "questioning.", "remembering."], "answer": 0, "explain": "He could stand without signaling that he supported what he objected to."}, {"type": "inference", "prompt": "The detail that “no rule actually required players to stand” (lines 21–22) suggests that", "choices": ["the league punished him for something its rules did not forbid.", "the agent had misunderstood the real reason for the suspension.", "most players had already stopped standing for the anthem.", "the suspension was lifted as soon as the agent complained."], "answer": 0, "explain": "The league’s own rules official said there was no such rule."}, {"type": "purpose", "prompt": "The first paragraph (lines 1–10) mainly serves to", "choices": ["show that his practice was long-standing and little noticed before it was reported.", "explain in careful detail the religious reasons that lay behind his decision not to stand.", "describe how angry the fans in Denver had become with him over the past year.", "introduce the teammates who would later defend him in front of reporters."], "answer": 0, "explain": "More than a year, in full view, “old news” to teammates, and then one reporter asked."}, {"type": "tone", "prompt": "The sentence “He considered it another way to say the same thing” (lines 35–37) indicates that Abdul-Rauf believed the compromise", "choices": ["left his convictions unchanged.", "proved that his critics were right.", "would end the controversy quickly.", "was forced on him by his mentor."], "answer": 0, "explain": "Others would call it surrender; to him the message was the same in a different form."}]}, {"id": "bf_p6", "rows": [[1, "At forty-eight, Mahmoud Abdul-Rauf went to Las", 1], [2, "Vegas to try out for a new three-on-three", 0], [3, "league of former professionals. He doubted the", 0], [4, "promise that the selections would be free of", 0], [5, "politics, but he was in superb condition and,", 0], [6, "by his own account, hardly missed a shot. Then", 0], [7, "he sat and watched team after team choose", 0], [8, "other players, some of them badly out of", 0], [9, "shape, apparently because they were friends.", 0], [10, "He was rescued only on the final pick, when a", 0], [11, "friend of his persuaded one team that it", 0], [12, "needed a second guard. That team reached the", 0], [13, "championship game, and Abdul-Rauf, given real", 0], [14, "minutes only after a teammate was injured,", 0], [15, "finished near the top of the league in assists", 0], [16, "and steals.", 0], [17, "A different kind of recognition had been", 1], [18, "delayed far longer. At Louisiana State", 0], [19, "University, where he had set a national", 0], [20, "scoring record that still stood three decades", 0], [21, "later, the jerseys of other great players hung", 0], [22, "above the court. His did not. He insisted that", 0], [23, "part of him did not care: an honor like that,", 0], [24, "he said, would count for nothing before God.", 0], [25, "But another part of him cared a great deal. A", 0], [26, "name in the rafters is a kind of record, and a", 0], [27, "record left out is a history erased. Some", 0], [28, "child might look up one day, he thought,", 0], [29, "wonder who that was, and go find out.", 0], [30, "He would not ask for it himself. An LSU", 1], [31, "graduate named Katrina Dunn asked for him, and", 0], [32, "his old coach spoke up as well. When the", 0], [33, "university finally agreed, Abdul-Rauf judged", 0], [34, "that it had acted less from altruism than from", 0], [35, "embarrassment, since his absence had become", 0], [36, "hard to explain. His response was brief: do it", 0], [37, "anyway. Asked which name should go on the", 0], [38, "jersey, he picked the one he had taken as an", 0], [39, "adult rather than the one he was born with,", 0], [40, "because it was the name he had chosen.", 0], [41, "At the ceremony, with his children beside him,", 1], [42, "he wept. He spoke of his mother, his first", 0], [43, "teacher and protector. And he told the crowd", 0], [44, "what had really gotten him out of bed for", 0], [45, "those workouts in the dark, a boy growing up", 0], [46, "without a father. It was not, in the end,", 0], [47, "wealth or fame. It was the hope of someday", 0], [48, "having a family of his own.", 0]], "qs": [{"type": "main-idea", "prompt": "Which of the following best states the main idea of the passage?", "choices": ["Late honors lead a man to reflect on why recognition matters and what truly drove him.", "A university corrected an old mistake only because a former player publicly demanded it.", "An older athlete proved he could still outplay much younger opponents.", "A new basketball league gave retired players a fair chance to compete."], "answer": 0, "explain": "Two delayed recognitions (the league, the jersey), then the real motive: family."}, {"type": "detail", "prompt": "According to the passage, Abdul-Rauf wanted his jersey retired chiefly because", "choices": ["seeing his name might lead a young person to learn his story.", "he believed the honor would matter a great d const LS_KEY = "sotc-final-blink-v1";
const EXAM_ID = "blink-final";
const LET = "ABCD";
const RESULT_ENDPOINT = "";   // empty = do not send results anywhere
const FULL = new URLSearchParams(location.search).has("full");
const PLAN = FULL ? { passages: 6, recall: 12, apply: 8, minutes: 50 } : { passages: 4, recall: 12, apply: 4, minutes: 40 };
const TYPE_LABEL = { "main-idea": "Main idea", detail: "Supporting detail", vocab: "Vocabulary in context", inference: "Inference",
  purpose: "Purpose and organization", tone: "Tone and figurative language", recall: "The whole book", apply: "Your game" };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || { attempts: [] }; } catch (e) { return { attempts: [] }; } }
function save(r) { try { localStorage.setItem(LS_KEY, JSON.stringify(r)); } catch (e) {} }
function mmss(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

let rec = load(), T = null, view = "home", tick = null;

function mix(q, extra) {            // shuffle the four choices; remember where the right one went
  const order = shuffle([0, 1, 2, 3]);
  return Object.assign({ prompt: q.prompt, type: q.type, explain: q.explain, choices: order.map(i => q.choices[i]), answer: order.indexOf(q.answer) }, extra);
}
function draw() {
  const lastIds = (rec.attempts.slice(-1)[0] || {}).recall || [];
  const qs = [];
  // Section 1: passages in book order so the story still runs forward
  const ps = shuffle(DATA.passages.map((_, i) => i)).slice(0, PLAN.passages).sort((a, b) => a - b);
  ps.forEach((pi, k) => DATA.passages[pi].qs.forEach(q => qs.push(mix(q, { sec: 1, p: pi, pk: k }))));
  // Section 2a: whole-book questions, spread evenly over the three thirds of the book, avoiding last attempt's draw
  const per = PLAN.recall / 3, picked = [];
  ["A", "B", "C"].forEach(g => {
    const pool = DATA.recall.map((q, i) => i).filter(i => DATA.recall[i].g === g);
    const fresh = pool.filter(i => !lastIds.includes(i));
    const byCh = {}; shuffle(fresh.length >= per ? fresh : pool).forEach(i => (byCh[DATA.recall[i].ch] = byCh[DATA.recall[i].ch] || []).push(i));
    const chs = shuffle(Object.keys(byCh)); let n = 0;                 // one per chapter before any chapter repeats
    for (let round = 0; n < per; round++) for (const c of chs) { if (n < per && byCh[c][round] !== undefined) { picked.push(byCh[c][round]); n++; } }
  });
  picked.sort((a, b) => DATA.recall[a].ch - DATA.recall[b].ch).forEach(i => qs.push(mix(DATA.recall[i], { sec: 2, id: i, type: "recall" })));
  shuffle(DATA.apply).slice(0, PLAN.apply).forEach(q => qs.push(mix(q, { sec: 3, type: "apply" })));
  return { qs, picked: qs.map(() => null), flag: qs.map(() => false), cur: 0, started: Date.now(), recall: picked };
}

function sectionOf(q) { return q.sec === 1 ? "Section 1 · Reading" : q.sec === 2 ? "Section 2 · The whole book" : "Section 2 · Your game"; }
function groupIdx(i) {           // questions that share the number strip with question i
  const q = T.qs[i]; return T.qs.map((x, j) => j).filter(j => q.sec === 1 ? (T.qs[j].sec === 1 && T.qs[j].pk === q.pk) : T.qs[j].sec === q.sec);
}
function passageHtml(pi) {
  return DATA.passages[pi].rows.map(r => `<div class="row"><span class="ln">${r[0] === 1 || r[0] % 5 === 0 ? r[0] : ""}</span><span class="${r[2] ? "ind" : ""}">${esc(r[1])}</span></div>`).join("");
}

function renderHome() {

    <ul class="rules">

      <li><strong>${need} of ${n} (${DATA.passPct}%) to pass.</strong> No penalty for a wrong answer, so answer everything. A retake draws a different test.</li>

      <li>You can mark a question <em>Come back later</em> and jump between questions. Nothing is graded until you submit.</li>
      ${RESULT_ENDPOINT ? "<li>When you submit, your name and score are sent to your coach.</li>" : ""}
    </ul>
    <p style="margin:18px 0 6px"><label class="sans" style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)" for="nm">Your name (shown on your result)</label><br>

  </div>`;
  $("#go").onclick = () => {
    const nm = $("#nm").value.replace(/\s+/g, " ").trim();
    if (RESULT_ENDPOINT && nm.length < 2) { $("#nmErr").hidden = false; $("#nm").focus(); return; }
    rec.name = nm; save(rec); T = draw(); view = "test"; startClock(); render();
  };
}

function startClock() { clearInterval(tick); tick = setInterval(() => { const c = $("#clk"); if (c && T) c.innerHTML = clockText(); }, 1000); }
function clockText() { const s = (Date.now() - T.started) / 1000; return `<b>${mmss(s)}</b> of about ${PLAN.minutes}:00`; }

function renderTest() {
  const i = T.cur, q = T.qs[i], grp = groupIdx(i), total = T.qs.length;
  const nums = grp.map(j => `<button class="num ${j === i ? "cur" : T.picked[j] !== null ? "done" : ""} ${T.flag[j] ? "flag" : ""}" data-j="${j}" aria-label="Question ${j + 1}">${j + 1}</button>`).join("");
  const qHtml = `
    <div class="nums">${nums}</div>
    <p class="qcount sans">Question ${i + 1} of ${total}${q.sec === 1 ? ` · Passage ${q.pk + 1} of ${PLAN.passages}` : ""}</p>
    <p class="stem">${esc(q.prompt)}</p>
    <div role="radiogroup" aria-label="Answer choices">${q.choices.map((c, k) => `
      <label class="choice ${T.picked[i] === k ? "sel" : ""}"><input type="radio" name="c" value="${k}" ${T.picked[i] === k ? "checked" : ""}>
      <span class="let">${LET[k]}</span><span>${esc(c)}</span></label>`).join("")}</div>
    <div class="actions">
      <button id="prev" ${i === 0 ? "disabled" : ""}>← Prev</button>
      <button id="flag">${T.flag[i] ? "★ Marked — unmark" : "Come back later"}</button>
      <span class="sp"></span>
      ${i === total - 1 ? `<button class="primary" id="review">Review and submit</button>` : `<button class="primary" id="next">Next →</button>`}
    </div>`;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">${sectionOf(q)}</span><button id="toReview" style="padding:6px 12px;font-size:13px">Review all</button>
      <span class="clock" id="clk">${clockText()}</span></div>
    ${q.sec === 1
      ? `<div class="split"><div class="card passage" id="psg">${passageHtml(q.p)}</div><div class="card">${qHtml}</div></div>`
      : `<div class="card" style="max-width:760px;margin:0 auto">${qHtml}</div>`}`;
  if (q.sec === 1 && T.lastP === q.p && T.scroll) $("#psg").scrollTop = T.scroll;
  T.lastP = q.sec === 1 ? q.p : null;
  const go = j => { const p = $("#psg"); T.scroll = p ? p.scrollTop : 0; T.cur = j; render(); if (!(T.qs[j].sec === 1 && T.qs[j].p === T.lastP)) window.scrollTo(0, 0); };
  document.querySelectorAll(".num").forEach(b => b.onclick = () => go(+b.dataset.j));
  document.querySelectorAll('input[name=c]').forEach(r => r.onchange = () => { T.picked[i] = +r.value; const p = $("#psg"); T.scroll = p ? p.scrollTop : 0; render(); });
  $("#prev").onclick = () => go(i - 1);

  const rv = () => { view = "review"; render(); window.scrollTo(0, 0); };
  if ($("#review")) $("#review").onclick = rv; $("#toReview").onclick = rv;
}

function renderReview() {
  const blank = T.picked.filter(x => x === null).length, flagged = T.flag.filter(Boolean).length;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">Review</span><span class="clock" id="clk">${clockText()}</span></div>
    <div class="card"><h2>Before you submit</h2>
      <p>${blank ? `<strong>${blank} question${blank === 1 ? " is" : "s are"} blank.</strong> There is no penalty for a wrong answer, so answer ${blank === 1 ? "it" : "them"}.` : "Every question is answered."}
      ${flagged ? ` You marked ${flagged} to come back to.` : ""} Tap a number to go to that question.</p>
      <div class="grid">${T.qs.map((q, j) => `<button class="num ${T.picked[j] !== null ? "done" : ""} ${T.flag[j] ? "flag" : ""}" data-j="${j}">${j + 1}</button>`).join("")}</div>
      <p class="legend">Shaded = answered · gold dot = marked to come back · white = blank</p>
      <div class="actions"><button id="back">← Back to the test</button><span class="sp"></span><button class="primary big" id="submit">Submit for grading</button></div>
    </div>`;
  document.querySelectorAll(".num").forEach(b => b.onclick = () => { T.cur = +b.dataset.j; view = "test"; render(); window.scrollTo(0, 0); });
  $("#back").onclick = () => { view = "test"; render(); };
  $("#submit").onclick = () => { if (blank && !confirm(`${blank} blank. Submit anyway?`)) return; grade(); };
}

function grade() {
  clearInterval(tick);
  const total = T.qs.length, correct = T.qs.filter((q, j) => T.picked[j] === q.answer).length;
  const pct = Math.round(correct / total * 100), need = Math.ceil(total * DATA.passPct / 100), passed = correct >= need;
  T.result = { total, correct, pct, need, passed, secs: Math.round((Date.now() - T.started) / 1000), when: new Date().toLocaleString() };
  rec.attempts.push({ pct, passed, correct, total, at: Date.now(), recall: T.recall });
  save(rec); view = "results"; render(); window.scrollTo(0, 0);
  sendResult();
}

function tallies() {
  const by = {}, sec = {};
  T.qs.forEach((q, j) => { const ok = T.picked[j] === q.answer;
    const t = TYPE_LABEL[q.type] || q.type; (by[t] = by[t] || [0, 0])[1]++; if (ok) by[t][0]++;
    const s = q.sec === 1 ? "Section 1 · Reading comprehension" : q.sec === 2 ? "Section 2 · The whole book" : "Section 2 · Your game";
    (sec[s] = sec[s] || [0, 0])[1]++; if (ok) sec[s][0]++; });
  return { by, sec };
}
function sendResult() {
  if (!RESULT_ENDPOINT || !T || !T.result || T.sent === "ok" || T.sent === "sending") return;
  const R = T.result, t = tallies();
  T.sent = "sending"; paintSent();
  fetch(RESULT_ENDPOINT, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ exam: EXAM_ID, name: rec.name, correct: R.correct, total: R.total, secs: R.secs,
      attempt: rec.attempts.length, sections: t.sec, types: t.by }) })
    .then(r => { T.sent = r.ok ? "ok" : "fail"; }).catch(() => { T.sent = "fail"; }).then(paintSent);
}
function paintSent() {
  const el = $("#sent"); if (!el || !T) return;
  el.innerHTML = T.sent === "ok" ? `<span class="chip ok">Result sent to your coach ✓</span>`
    : T.sent === "sending" ? `<span class="chip">Sending your result…</span>`
    : T.sent === "fail" ? `<span class="chip no">Result was not sent</span> <button id="resend" style="padding:5px 10px;font-size:13px">Try again</button> <span class="small">or print this page and hand it in.</span>` : "";
  const b = $("#resend"); if (b) b.onclick = sendResult;
}

function renderResults() {
  const R = T.result, { by, sec } = tallies();
  const rows = o => Object.keys(o).map(k => `<tr><td>${esc(k)}</td><td class="r">${o[k][0]} / ${o[k][1]}</td></tr>`).join("");
  const review = T.qs.map((q, j) => { const ok = T.picked[j] === q.answer;
    return `<div class="rev"><span class="chip ${ok ? "ok" : "no"}">${j + 1} · ${ok ? "correct" : T.picked[j] === null ? "blank" : "missed"}</span>
      <span class="chip">${esc(TYPE_LABEL[q.type] || q.type)}</span>
      <p class="stem">${esc(q.prompt)}</p>
      ${ok ? "" : T.picked[j] !== null ? `<p class="a wrong">${LET[T.picked[j]]}. ${esc(q.choices[T.picked[j]])}</p>` : ""}
      <p class="a right">${LET[q.answer]}. ${esc(q.choices[q.answer])}</p>
      <p class="why">${esc(q.explain)}</p></div>`; }).join("");
  $("#app").innerHTML = `
    <div class="card">
      <div class="eyebrow">${esc(DATA.title)} · Book Final${rec.name ? " · " + esc(rec.name) : ""}</div>
      <div><span class="stamp ${R.passed ? "pass" : "fail"}">${R.passed ? "Passed" : "Retake"}</span></div>
      <h2>${R.correct} of ${R.total} · ${R.pct}%</h2>
      <p>${R.passed ? "That is a passing score. The book is in the books." : `You need ${R.need} of ${R.total} (${DATA.passPct}%) to pass. Read the explanations below, go back to the chapters they point to, and take it again. The retake draws a different test.`}</p>
      <p class="small">${esc(R.when)} · time ${mmss(R.secs)} · attempt ${rec.attempts.length}</p>
      <p id="sent" style="margin:8px 0 0"></p>
      <div class="actions"><button class="primary" id="again">${R.passed ? "Take another version" : "Retake — new questions"}</button><button id="print">Print this result</button><button id="home">Home</button></div>
    </div>
    <div class="card"><h2>Where the points went</h2>
      <table><tr><th>Section</th><th class="r">Score</th></tr>${rows(sec)}</table>
      <table style="margin-top:14px"><tr><th>Question type</th><th class="r">Score</th></tr>${rows(by)}</table></div>
    <div class="card"><h2>Section 3 · Essay <span class="small">— on paper, 30 minutes, two pages at most</span></h2>
      <div class="essay">${DATA.essay}</div>
      <p class="small" style="margin-bottom:0">On the real ISEE the essay is not scored, but a copy goes to every school you apply to. Plan for a few minutes, then write in pen.</p></div>
    <div class="card"><h2>Every question</h2>${review}</div>`;
  $("#again").onclick = () => { T = draw(); view = "test"; startClock(); render(); window.scrollTo(0, 0); };
  $("#home").onclick = () => { T = null; view = "home"; render(); window.scrollTo(0, 0); };
  $("#print").onclick = () => window.print();
  paintSent();
}

function render() { ({ home: renderHome, test: renderTest, review: renderReview, results: renderResults })[view](); }
window.addEventListener("beforeunload", e => { if (T && (view === "test" || view === "review")) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if (view !== "test" || e.target.tagName === "INPUT" && e.target.type === "text") return;
  const k = e.key.toLowerCase(), i = T.cur;
  if ("abcd".includes(k) && k.length === 1) { T.picked[i] = "abcd".indexOf(k); render(); }
  else if (e.key === "ArrowRight" && i < T.qs.length - 1) { T.cur++; render(); }
  else if (e.key === "ArrowLeft" && i > 0) { T.cur--; render(); }
});
render();
</script>
</body>
</html>
