nt."}]}, {"id": "mf_p5", "rows": [[1, "After his first professional season, in which", 1], [2, "he was named Rookie of the Year, Allen Iverson", 0], [3, "learned that the Philadelphia 76ers had hired", 0], [4, "a new coach without asking him. Larry Brown", 0], [5, "would become, he later wrote, one of the two", 0], [6, "great coaching relationships of his life. It", 0], [7, "took him years to see it.", 0], [8, "The two men wanted different things from a", 1], [9, "practice. Iverson lived for the scrimmage at", 0], [10, "the end, the way a child waits for dessert.", 0], [11, "Brown loved drills and fundamentals, and even", 0], [12, "the scrimmage was not safe from him: play", 0], [13, "would begin, and then the whistle would blow", 0], [14, "so that he could correct the angle of a screen", 0], [15, "or a defensive rotation. Iverson found it long", 0], [16, "and tiresome. He admits that he was sometimes", 0], [17, "late and sometimes absent. About games there", 0], [18, "was never a dispute. Brown did not question", 0], [19, "his effort, and their only quarrels came when", 0], [20, "the coach tried to rest him.", 0], [21, "Yet the same demanding coach changed Iverson’s", 1], [22, "career with an act of imagination. Brown", 0], [23, "brought in two guards, Aaron McKie and Eric", 0], [24, "Snow, who could start the offense and defend", 0], [25, "bigger opponents, and gradually persuaded", 0], [26, "Iverson, and himself, that the team’s best", 0], [27, "scorer did not have to be its point guard.", 0], [28, "Freed from bringing the ball up, Iverson ran", 0], [29, "along the three-point line past teammates’", 0], [30, "screens and caught the pass on the far side", 0], [31, "with his defender a step behind. Coaches", 0], [32, "everywhere now call that pattern an “Iverson", 0], [33, "cut.” In their second season together he won", 0], [34, "his first scoring title, and the team reached", 0], [35, "the playoffs.", 0], [36, "The friction did not vanish. Benched during a", 1], [   return `<p class="cite"><label for="cite">${q.sec === 1 ? "Line number that proves your answer" : "Page in your book where you found it"}</label>
    <input type="text" inputmode="numeric" id="cite" maxlength="4" autocomplete="off" value="${esc(v || "")}">
    <span class="small">${q.sec === 1 ? `Use the line numbers beside the passage (1–${citeMax(q)}).` : "Open the book, find it, and type the page number."}</span></p>`;
}

function sectionOf(q) { return q.sec === 1 ? "Section 1 · Reading" : q.sec === 2 ? "Section 2 · The whole book" : "Section 2 · Your game"; }
function groupIdx(i) {           // questions that share the number strip with question i
  const q = T.qs[i]; return T.qs.map((x, j) => j).filter(j => q.sec === 1 ? (T.qs[j].sec === 1 && T.qs[j].pk === q.pk) : T.qs[j].sec === q.sec);
}
function passageHtml(pi) {
  return DATA.passages[pi].rows.map(r => `<div class="row"><span class="ln">${r[0] === 1 || r[0] % 5 === 0 ? r[0] : ""}</span><span class="${r[2] ? "ind" : ""}">${esc(r[1])}</span></div>`).join("");
}
function numClass(j) { return T.picked[j] === null ? "" : citeOk(T.qs[j], T.cite[j]) ? "done" : "half"; }
function lap() { const now = Date.now(); if (T.on !== null) T.ms[T.on] += now - T.stamp; T.stamp = now; }   // seconds spent on each question

function gapOpen() { return rec.gap && !rec.gap.done ? rec.gap : null; }
function toGo(g) { return Math.max(0, g.need - g.base - g.got); }

function renderHome() {
  const best = rec.attempts.reduce((m, a) => Math.max(m, a.pct), 0), passed = rec.attempts.some(a => a.passed);
  const n = PLAN.passages * 6 + PLAN.recall + PLAN.apply, need = Math.ceil(n * DATA.passPct / 100), g = gapOpen();
  $("#app").innerHTML = `
  <div class="card">
    <div class="eyebrow"><a href="../../" style="color:inherit;text-decoration:none">← All book exams</a> · Book Final</div>
    <h1>${esc(DATA.title)}</h1>
    <p class="sub">${esc(DATA.byline)}</p>
    ${g ? `<div class="essay" style="margin:14px 0"><strong>You have a gap to close${rec.name ? ", " + esc(rec.name) : ""}.</strong> You scored ${g.base} of ${g.total} and need ${g.need}.
      You do not start over. You earn the missing points one question at a time: <strong>${toGo(g)} more correct answer${toGo(g) === 1 ? "" : "s"}</strong>, each with the line or page where you found it.</div>
      <div class="actions"><button class="primary big" id="gap">Close the gap · ${toGo(g)} to go</button></div>
      <p class="small" style="margin:14px 0 0">Someone else on this device? <a href="#" id="fresh">Start a new test</a> (this erases the open gap).</p>` : `
    <p>This final is built like the reading section of the ISEE: a passage with numbered lines on one side, one question at a time on the other. Finish the book before you start.</p>
    <ul class="rules">
      <li><strong>${n} questions.</strong> ${PLAN.passages} passages with six questions each, then ${PLAN.recall} questions about the whole book and ${PLAN.apply} about using its ideas in your own game.</li>
      <li><strong>Open book.</strong> Keep your copy next to you. In Section 1 every answer is in the passage on the screen. In Section 2 the answers are in the book.</li>
      <li><strong>Show where you found it.</strong> Every passage answer needs the line number that proves it. Every whole-book answer needs the page number from your book. You cannot submit without them.</li>
      <li><strong>${need} of ${n} (${DATA.passPct}%) to pass.</strong> No penalty for a wrong answer, so answer everything.</li>
      <li><strong>Miss the mark and you close the gap.</strong> You do not retake the whole test. You earn back each missing point: one try at a question you missed, and a brand-new question every time you miss again.</li>
      <li><strong>About ${PLAN.minutes} minutes.</strong> The clock shows your pace. It does not stop you.</li>
      <li>You can mark a question <em>Come back later</em> and jump between questions. Nothing is graded until you submit.</li>
      ${RESULT_ENDPOINT ? "<li>Your name, answers, and the lines and pages you give are sent to your coach.</li>" : ""}
    </ul>
    <p style="margin:18px 0 6px"><label class="sans" style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)" for="nm">Your name (shown on your result)</label><br>
    <input type="text" id="nm" maxlength="40" autocomplete="off" value="${esc(rec.name || "")}">

    <div class="actions"><button class="primary big" id="go">Begin the final</button>
      ${rec.attempts.length ? `<span class="chip ${passed ? "ok" : ""}">${passed ? "Passed ✓ · " : ""}Best ${best}% · ${rec.attempts.length} attempt${rec.attempts.length === 1 ? "" : "s"}</span>` : ""}</div>`}
  </div>`;
  if (g) {
    $("#gap").onclick = startGap;
    $("#fresh").onclick = e => { e.preventDefault(); if (!confirm("Erase the open gap and start a brand-new test?")) return; rec.gap = null; rec.name = ""; save(rec); render(); };
    return;

  $("#go").onclick = () => {
    const nm = $("#nm").value.replace(/\s+/g, " ").trim();
    if (RESULT_ENDPOINT && nm.length < 2) { $("#nmErr").hidden = false; $("#nm").focus(); return; }
    rec.name = nm; save(rec); T = draw(); view = "test"; startClock(); render();
  };
}

function startClock() { clearInterval(tick); tick = setInterval(() => { const c = $("#clk"); if (c && T && view !== "gap") c.innerHTML = clockText(); }, 1000); }
function clockText() { const s = (Date.now() - T.started) / 1000; return `<b>${mmss(s)}</b> of about ${PLAN.minutes}:00`; }

function renderTest() {
  const i = T.cur, q = T.qs[i], grp = groupIdx(i), total = T.qs.length;
  lap(); T.on = i;
  const nums = grp.map(j => `<button class="num ${j === i ? "cur" : numClass(j)} ${T.flag[j] ? "flag" : ""}" data-j="${j}" aria-label="Question ${j + 1}">${j + 1}</button>`).join("");
  const qHtml = `
    <div class="nums">${nums}</div>
    <p class="qcount sans">Question ${i + 1} of ${total}${q.sec === 1 ? ` · Passage ${q.pk + 1} of ${PLAN.passages}` : ""}</p>
    <p class="stem">${esc(q.prompt)}</p>
    <div role="radiogroup" aria-label="Answer choices">${q.choices.map((c, k) => `
      <label class="choice ${T.picked[i] === k ? "sel" : ""}"><input type="radio" name="c" value="${k}" ${T.picked[i] === k ? "checked" : ""}>
      <span class="let">${LET[k]}</span><span>${esc(c)}</span></label>`).join("")}</div>
    ${citeHtml(q, T.cite[i])}
    <div class="actions">
      <button id="prev" ${i === 0 ? "disabled" : ""}>← Prev</button>
      <button id="flag">${T.flag[i] ? "★ Marked — unmark" : "Come back later"}</button>
      <span class="sp"></span>
      ${i === total - 1 ? `<button class="primary" id="review">Review and submit</button>` : `<button class="primary" id="next">Next →</button>`}
    </div>`;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">${sectionOf(q)}</span><button id="toReview" style="padding:6px 12px;font-size:13px">Review all</button>
      <span class="clock" id="clk">${clockText()}</span></div>
    ${q.sec === 1
      ? `<div class="split"><div class="card passage" id="psg">${passageHtml(q.p)}</div><div class="card">${qHtml}</div></div>`
      : `<div class="card" style="max-width:760px;margin:0 auto">${qHtml}</div>`}`;
  if (q.sec === 1 && T.lastP === q.p && T.scroll) $("#psg").scrollTop = T.scroll;
  T.lastP = q.sec === 1 ? q.p : null;
  const go = j => { const p = $("#psg"); T.scroll = p ? p.scrollTop : 0; T.cur = j; render(); if (!(T.qs[j].sec === 1 && T.qs[j].p === T.lastP)) window.scrollTo(0, 0); };
  document.querySelectorAll(".num").forEach(b => b.onclick = () => go(+b.dataset.j));
  document.querySelectorAll('input[name=c]').forEach(r => r.onchange = () => { T.picked[i] = +r.value; const p = $("#psg"); T.scroll = p ? p.scrollTop : 0; render(); });
  if ($("#cite")) $("#cite").oninput = e => { e.target.value = e.target.value.replace(/\D/g, ""); T.cite[i] = e.target.value; };
  $("#prev").onclick = () => go(i - 1);
  if ($("#next")) $("#next").onclick = () => go(i + 1);
  $("#flag").onclick = () => { T.flag[i] = !T.flag[i]; const p = $("#psg"); T.scroll = p ? p.scrollTop : 0; render(); };
  const rv = () => { view = "review"; render(); window.scrollTo(0, 0); };
  if ($("#review")) $("#review").onclick = rv; $("#toReview").onclick = rv;
}

function renderReview() {
  lap(); T.on = null;
  const blank = T.picked.filter(x => x === null).length, flagged = T.flag.filter(Boolean).length;
  const nocite = T.qs.filter((q, j) => T.picked[j] !== null && !citeOk(q, T.cite[j])).length;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">Review</span><span class="clock" id="clk">${clockText()}</span></div>
    <div class="card"><h2>Before you submit</h2>
      <p>${blank ? `<strong>${blank} question${blank === 1 ? " is" : "s are"} blank.</strong> There is no penalty for a wrong answer, so answer ${blank === 1 ? "it" : "them"}.` : "Every question is answered."}
      ${flagged ? ` You marked ${flagged} to come back to.` : ""} Tap a number to go to that question.</p>
      ${nocite ? `<p style="color:var(--bad)"><strong>${nocite} answer${nocite === 1 ? " is" : "s are"} missing a line or page number</strong> (dashed circles). You cannot submit until each one has it.</p>` : ""}
      <div class="grid">${T.qs.map((q, j) => `<button class="num ${numClass(j)} ${T.flag[j] ? "flag" : ""}" data-j="${j}">${j + 1}</button>`).join("")}</div>
      <p class="legend">Shaded = answered · dashed = needs its line or page number · gold dot = marked to come back · white = blank</p>
      <div class="actions"><button id="back">← Back to the test</button><span class="sp"></span><button class="primary big" id="submit" ${nocite ? "disabled" : ""}>Submit for grading</button></div>
    </div>`;
  document.querySelectorAll(".num").forEach(b => b.onclick = () => { T.cur = +b.dataset.j; view = "test"; render(); window.scrollTo(0, 0); });
  $("#back").onclick = () => { view = "test"; render(); };
  $("#submit").onclick = () => { if (nocite) return; if (blank && !confirm(`${blank} blank. Submit anyway?`)) return; grade(); };
}

function grade() {
  clearInterval(tick); lap(); T.on = null;
  const total = T.qs.length, correct = T.qs.filter((q, j) => T.picked[j] === q.answer).length;
  const pct = Math.round(correct / total * 100), need = Math.ceil(total * DATA.passPct / 100), passed = correct >= need;
  T.result = { total, correct, pct, need, passed, secs: Math.round((Date.now() - T.started) / 1000), when: new Date().toLocaleString() };
  rec.attempts.push({ pct, passed, correct, total, at: Date.now(), recall: T.recall, key: T.key });
  rec.gap = passed ? null : {
    key: T.key, total, need, base: correct, got: 0, pos: 0, log: [], started: Date.now(),
    used: T.qs.map(q => q.qid), usedP: [...new Set(T.qs.filter(q => q.sec === 1).map(q => q.p))],
    queue: T.qs.map((q, j) => ({ q, j })).filter(x => T.picked[x.j] !== x.q.answer)
      .map(x => ({ qid: x.q.qid, kind: "fix", first: T.picked[x.j] === null ? null : x.q.order[T.picked[x.j]] })) };
  const t = tallies();
  T.payload = { kind: "first", key: T.key, exam: EXAM_ID, ver: DATA.ver || "", full: FULL, name: rec.name, correct, total, secs: T.result.secs,
    attempt: rec.attempts.length, sections: t.sec, types: t.by,
    answers: T.qs.map((q, j) => ({ q: q.qid, t: q.type, ch: q.ch, pick: T.picked[j] === null ? null : q.order[T.picked[j]],
      ok: T.picked[j] === q.answer, cite: T.cite[j] || null, s: Math.round(T.ms[j] / 1000), pr: q.prompt.slice(0, 90) })) };
  save(rec); view = "results"; render(); window.scrollTo(0, 0);
  send(T.payload, true);
}

function tallies() {
  const by = {}, sec = {};
  T.qs.forEach((q, j) => { const ok = T.picked[j] === q.answer;
    const t = TYPE_LABEL[q.type] || q.type; (by[t] = by[t] || [0, 0])[1]++; if (ok) by[t][0]++;
    const s = q.sec === 1 ? "Section 1 · Reading comprehension" : q.sec === 2 ? "Section 2 · The whole book" : "Section 2 · Your game";
    (sec[s] = sec[s] || [0, 0])[1]++; if (ok) sec[s][0]++; });
  return { by, sec };
}
// show = paint the "sent to your coach" chip (a finished test or a closed gap); progress saves stay quiet
function send(payload, show) {
  if (!RESULT_ENDPOINT) return;
  if (show) { if (SENT.state === "sending") return; SENT.last = payload; SENT.state = "sending"; paintSent(); }
  fetch(RESULT_ENDPOINT, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
    .then(r => r.ok, () => false).then(ok => { if (show) { SENT.state = ok ? "ok" : "fail"; paintSent(); } });
}
function paintSent() {
  const el = $("#sent"); if (!el) return;
  el.innerHTML = SENT.state === "ok" ? `<span class="chip ok">Result sent to your coach ✓</span>`
    : SENT.state === "sending" ? `<span class="chip">Sending your result…</span>`
    : SENT.state === "fail" ? `<span class="chip no">Result was not sent</span> <button id="resend" style="padding:5px 10px;font-size:13px">Try again</button> <span class="small">or print this page and hand it in.</span>` : "";
  const b = $("#resend"); if (b) b.onclick = () => send(SENT.last, true);
}

function essayCard() {
  return `<div class="card"><h2>Section 3 · Essay <span class="small">— on paper, 30 minutes, two pages at most</span></h2>
      <div class="essay">${DATA.essay}</div>
      <p class="small" style="margin-bottom:0">On the real ISEE the essay is not scored, but a copy goes to every school you apply to. Plan for a few minutes, then write in pen.</p></div>`;
}

function renderResults() {
  const R = T.result, { by, sec } = tallies(), g = gapOpen();
  const rows = o => Object.keys(o).map(k => `<tr><td>${esc(k)}</td><td class="r">${o[k][0]} / ${o[k][1]}</td></tr>`).join("");
  // A missed question keeps its answer hidden: it comes back in the gap round.
  const review = T.qs.map((q, j) => { const ok = T.picked[j] === q.answer;
    return `<div class="rev"><span class="chip ${ok ? "ok" : "no"}">${j + 1} · ${ok ? "correct" : T.picked[j] === null ? "blank" : "missed"}</span>
      <span class="chip">${esc(TYPE_LABEL[q.type] || q.type)}</span>
      <p class="stem">${esc(q.prompt)}</p>
      ${ok ? `<p class="a right">${LET[q.answer]}. ${esc(q.choices[q.answer])}</p><p class="why">${esc(q.explain)}</p>`
           : `<p class="why">You will see this one again when you close the gap.</p>`}</div>`; }).join("");
  $("#app").innerHTML = `
    <div class="card">
      <div class="eyebrow">${esc(DATA.title)} · Book Final${rec.name ? " · " + esc(rec.name) : ""}</div>
      <div><span class="stamp ${R.passed ? "pass" : "fail"}">${R.passed ? "Passed" : "Not yet"}</span></div>
      <h2>${R.correct} of ${R.total} · ${R.pct}%</h2>
      <p>${R.passed ? "That is a passing score. The book is in the books." : `You need ${R.need} of ${R.total} (${DATA.passPct}%) to pass, so you are <strong>${R.need - R.correct} short</strong>. You do not retake the test. You close the gap: each question you missed comes back once, and you earn its point by answering it correctly and showing the line or page. Miss it again and you get a new question instead.`}</p>
      <p class="small">${esc(R.when)} · time ${mmss(R.secs)} · attempt ${rec.attempts.length}</p>
      <p id="sent" style="margin:8px 0 0"></p>
      <div class="actions">${R.passed ? `<button class="primary" id="again">Take another version</button>` : `<button class="primary big" id="gap">Close the gap · ${g ? toGo(g) : 0} to go</button>`}<button id="print">Print this result</button><button id="home">Home</button></div>
    </div>
    <div class="card"><h2>Where the points went</h2>
      <table><tr><th>Section</th><th class="r">Score</th></tr>${rows(sec)}</table>
      <table style="margin-top:14px"><tr><th>Question type</th><th class="r">Score</th></tr>${rows(by)}</table></div>
    ${R.passed ? essayCard() : ""}
    <div class="card"><h2>Every question</h2>${review}</div>`;
  if ($("#again")) $("#again").onclick = () => { T = draw(); view = "test"; startClock(); render(); window.scrollTo(0, 0); };
  if ($("#gap")) $("#gap").onclick = startGap;
  $("#home").onclick = () => { T = null; view = "home"; render(); window.scrollTo(0, 0); };
  $("#print").onclick = () => window.print();
  paintSent();
}

// ---------------------------------------------------------------- close the gap
// A test finished before this round existed kept only its score, so its gap is closed with new questions.
function legacyGap() {
  const a = rec.attempts[rec.attempts.length - 1];
  if (!a || rec.gap || rec.attempts.some(x => x.passed) || !a.total) return;
  const need = Math.ceil(a.total * DATA.passPct / 100), gap = need - a.correct;
  if (gap <= 0) return;
  const g = { key: uuid(), legacy: true, total: a.total, need, base: a.correct, got: 0, pos: 0, log: [], started: Date.now(),
    used: (a.recall || []).map(i => "r" + i), usedP: [], queue: [] };
  shuffle(DATA.passages.map((_, i) => i)).slice(0, 2).sort((x, y) => x - y).forEach(pi =>
    DATA.passages[pi].qs.forEach((_, k) => { if (g.queue.length < gap) g.queue.push({ qid: `p${pi}.${k}`, kind: "new" }); }));
  const pool = shuffle(DATA.recall.map((_, i) => "r" + i).filter(id => !g.used.includes(id)));
  while (g.queue.length < gap && pool.length) g.queue.push({ qid: pool.pop(), kind: "new" });
  rec.gap = g; save(rec);
}
// The replacement for a question missed in the gap round: never one already seen, and as close in kind as the pool allows.
function makeup(src) {
  const g = rec.gap, used = new Set(g.used.concat(g.queue.map(x => x.qid)));
  const free = ids => shuffle(ids.filter(id => !used.has(id)));
  const recall = f => free(DATA.recall.map((q, i) => i).filter(i => f(DATA.recall[i])).map(i => "r" + i));
  let c = [];
  if (src.sec === 1) {             // stay on a new passage already opened in this round, then open another unseen one
    const opened = g.queue.filter(x => x.kind !== "fix" && x.qid[0] === "p").map(x => +x.qid.slice(1).split(".")[0]).reverse();
    const order = [...new Set(opened.concat(shuffle(DATA.passages.map((_, i) => i).filter(i => !g.usedP.includes(i)))))];
    for (const pi of order) { c = free(DATA.passages[pi].qs.map((_, k) => `p${pi}.${k}`)); if (c.length) break; }
    c.sort((a, b) => (srcOf(b).q.type === src.type) - (srcOf(a).q.type === src.type));
  } else if (src.sec === 3) c = free(DATA.apply.map((_, i) => "a" + i));
  else { c = recall(q => q.ch === src.ch); if (!c.length) c = recall(q => q.g === DATA.recall[src.id].g); }
  if (!c.length) c = recall(() => true);
  return c[0] || null;
}
function startGap() { T = null; clearInterval(tick); GV = null; view = "gap"; render(); window.scrollTo(0, 0); }
function gapPayload(g) {
  return { kind: "gap", key: g.key, exam: EXAM_ID, ver: DATA.ver || "", full: g.total === 56, name: rec.name, total: g.total, need: g.need, base: g.base,
    got: g.got, done: !!g.done, closed: g.base + g.got >= g.need, legacy: !!g.legacy, secs: g.log.reduce((s, x) => s + x.s, 0),
    attempt: rec.attempts.length, answers: g.log };
}
function lockIn() {
  const g = rec.gap, it = g.queue[g.pos], q = GV.q, ok = GV.pick === q.answer;
  g.log.push({ q: q.qid, kind: it.kind, t: q.type, ch: q.ch, pick: q.order[GV.pick], ok, cite: GV.cite || null,
    s: Math.round((Date.now() - GV.at) / 1000), pr: q.prompt.slice(0, 90) });
  let added = false;
  if (ok) g.got++; else { const id = makeup(q); if (id) { g.queue.push({ qid: id, kind: "new" }); added = true; } }
  g.pos++;
  const closed = g.base + g.got >= g.need, out = !closed && g.pos >= g.queue.length;
  if (closed || out) g.done = true;
  if (closed) { const a = rec.attempts[rec.attempts.length - 1]; if (a) { a.first = a.pct; a.pct = Math.round((g.base + g.got) / g.total * 100); a.passed = true; a.viaGap = true; } }
  save(rec);
  GV.fb = { ok, added, closed, out };
  send(gapPayload(g), closed || out);
  render(); window.scrollTo(0, 0);
}
function renderGap() {
  const g = rec.gap;
  if (!g) { view = "home"; return render(); }
  if (GV && GV.fb) return renderGapFeedback(g);
  if (g.done) return renderGapDone(g);
  const it = g.queue[g.pos];
  if (!GV) GV = { q: build(it.qid), pick: null, cite: "", at: Date.now(), fb: null };
  const q = GV.q, firstAt = it.kind === "fix" && it.first !== null && it.first !== undefined ? q.order.indexOf(it.first) : -1;
  const ready = GV.pick !== null && citeOk(q, GV.cite);
  const qHtml = `
    <p class="qcount sans">${it.kind === "fix" ? "A question you missed · one try" : "New question · one try"} · ${esc(TYPE_LABEL[q.type] || q.type)}</p>
    <p class="stem">${esc(q.prompt)}</p>
    <div role="radiogroup" aria-label="Answer choices">${q.choices.map((c, k) => k === firstAt
      ? `<div class="choice out"><span class="let">${LET[k]}</span><span>${esc(c)} <em class="small">— your first answer. Not this one.</em></span></div>`
      : `<label class="choice ${GV.pick === k ? "sel" : ""}"><input type="radio" name="c" value="${k}" ${GV.pick === k ? "checked" : ""}>
      <span class="let">${LET[k]}</span><span>${esc(c)}</span></label>`).join("")}</div>
    ${citeHtml(q, GV.cite)}
    <div class="actions"><span class="small">Find it first. You get one try, and a miss costs you a new question.</span><span class="sp"></span>
      <button class="primary" id="lock" ${ready ? "" : "disabled"}>Lock in my answer</button></div>`;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">Close the gap</span>
      <span class="clock"><b>${g.base + g.got}</b> of ${g.need} needed · <b>${toGo(g)}</b> to go</span></div>
    ${q.sec === 1
      ? `<div class="split"><div class="card passage" id="psg">${passageHtml(q.p)}</div><div class="card">${qHtml}</div></div>`
      : `<div class="card" style="max-width:760px;margin:0 auto">${qHtml}</div>`}`;
  if (q.sec === 1 && GV.scroll) $("#psg").scrollTop = GV.scroll;
  const keep = () => { const p = $("#psg"); GV.scroll = p ? p.scrollTop : 0; };
  document.querySelectorAll('input[name=c]').forEach(r => r.onchange = () => { GV.pick = +r.value; keep(); render(); });
  if ($("#cite")) $("#cite").oninput = e => { e.target.value = e.target.value.replace(/\D/g, ""); GV.cite = e.target.value;
    $("#lock").disabled = !(GV.pick !== null && citeOk(q, GV.cite)); };
  $("#lock").onclick = () => { if (GV.pick !== null && citeOk(q, GV.cite)) lockIn(); };
}
function renderGapFeedback(g) {
  const q = GV.q, f = GV.fb;
  $("#app").innerHTML = `
    <div class="hud"><span class="where sans">Close the gap</span>
      <span class="clock"><b>${g.base + g.got}</b> of ${g.need} needed · <b>${toGo(g)}</b> to go</span></div>
    <div class="card" style="max-width:760px;margin:0 auto">
      <span class="chip ${f.ok ? "ok" : "no"}">${f.ok ? "Correct · point earned" : "Not it · no point"}</span>
      <p class="stem" style="margin-top:8px">${esc(q.prompt)}</p>
      ${f.ok ? "" : `<p class="rev a wrong" style="border:0;padding:0">${LET[GV.pick]}. ${esc(q.choices[GV.pick])}</p>`}
      <p class="rev a right" style="border:0;padding:0;color:var(--ok);font-weight:700">${LET[q.answer]}. ${esc(q.choices[q.answer])}</p>
      <p class="small" style="font-style:italic">${esc(q.explain)}</p>
      ${f.ok ? "" : f.added ? `<p>A new question has been added to the end of your list.</p>` : ""}
      <div class="actions"><span class="sp"></span><button class="primary" id="nx">${f.closed ? "See my result" : f.out ? "Continue" : "Next question →"}</button></div>
    </div>`;
  $("#nx").onclick = () => { GV = null; render(); window.scrollTo(0, 0); };
}
function renderGapDone(g) {
  const closed = g.base + g.got >= g.need, asked = g.log.length;
  $("#app").innerHTML = `
    <div class="card">
      <div class="eyebrow">${esc(DATA.title)} · Book Final${rec.name ? " · " + esc(rec.name) : ""}</div>
      <div><span class="stamp ${closed ? "pass" : "fail"}">${closed ? "Passed" : "See your coach"}</span></div>
      <h2>${g.base + g.got} of ${g.total} · gap ${closed ? "closed" : "still open"}</h2>
      <p>${closed ? `You scored ${g.base} on the test and earned ${g.got} more, one question at a time. It took ${asked} question${asked === 1 ? "" : "s"} to earn them. The book is in the books.`
        : `You have used every question this test has. Show this page to your coach.`}</p>
      <p id="sent" style="margin:8px 0 0"></p>
      <div class="actions"><button id="print">Print this result</button><button id="home">Home</button></div>
    </div>
    ${closed ? essayCard() : ""}`;
  $("#home").onclick = () => { view = "home"; render(); window.scrollTo(0, 0); };
  $("#print").onclick = () => window.print();
  paintSent();
}

function render() { ({ home: renderHome, test: renderTest, review: renderReview, results: renderResults, gap: renderGap })[view](); }
window.addEventListener("beforeunload", e => { if (T && (view === "test" || view === "review")) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if (view !== "test" || e.target.tagName === "INPUT" && e.target.type === "text") return;
  const k = e.key.toLowerCase(), i = T.cur;
  if ("abcd".includes(k) && k.length === 1) { T.picked[i] = "abcd".indexOf(k); render(); }
  else if (e.key === "ArrowRight" && i < T.qs.length - 1) { T.cur++; render(); }
  else if (e.key === "ArrowLeft" && i > 0) { T.cur--; render(); }
});
legacyGap();
render();
</script>
</body>
</html>
