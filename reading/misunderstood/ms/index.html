did the DA's office do a few months later?", "choices": ["Put Iverson on trial again", "Dropped the whole case", "Apologized to Iverson's family", "Charged someone else"], "answer": 1, "explanation": "The DA's office could have retried Iverson on smaller charges, but instead it quietly gave up and dismissed the whole case."}, {"q": "The court's decision was called a \"reversal.\" What does that mean?", "choices": ["The court changed the earlier decision to the opposite result.", "The court asked for more time.", "The court repeated the earlier decision.", "The court moved the trial to a new city."], "answer": 0, "explanation": "A reversal means the higher court flipped the earlier ruling. Here, it undid Iverson's conviction completely."}, {"q": "Coach Thompson told Iverson it was not a time to \"gloat.\" What does gloat mean?", "choices": ["To cry about a loss", "To thank your supporters", "To brag about a victory", "To celebrate quietly at home"], "answer": 2, "explanation": "To gloat means to show off or brag when you win. Coach Thompson wanted Iverson to stay humble even after the great news."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first season with the 76ers", "A summer that brought both the loss of Nana and the clearing of Iverson's name", "Iverson's training plan for his second college season", "The history of the World University Games"], "answer": 1, "explanation": "The chapter tells about two huge events in one summer: Nana's death, which hurt Iverson deeply, and the court decision that erased his conviction."}]}, {"id": "ch26-season-two", "num": "26", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Season Two", "bank": [{"q": "About how many points did Iverson score in his biggest Summer League game in Virginia?", "choices": ["More than 80", "Exactly 40", "About 25", "More than 100"], "answer": 0, "explanation": "Iverson lit up the Summer League, scoring over 80 points in one game and over 70 in another."}, {"q": "What did the U.S. team do at the World University Games in Japan?", "choices": ["Lost in the semifinal", "Finished third", "Won the gold medal easily", "Dropped out because of injuries"], "answer": 2, "explanation": "The team won easily, and Iverson led the team in scoring in both the semifinal and the gold medal game."}, {"q": "Who was the freshman who became Iverson's partner in the backcourt?", "choices": ["Don Reid", "Victor Page", "Jerome", "Mike Jackson"], "answer": 1, "explanation": "On the first day of practice, Iverson met Victor Page, a freshman from Washington, DC, who became his backcourt partner."}, {"q": "The Summer League games drew \"capacity crowds.\" What does that mean?", "choices": ["Only players' families attended.", "The games were shown on TV.", "Tickets were free that summer.", "The stands were completely full."], "answer": 3, "explanation": "A capacity crowd means every seat is taken. So many people came out to watch Iverson and his friends play."}, {"q": "Why did Coach Thompson make Boubacar Iverson's roommate?", "choices": ["So Boubacar could practice English, since Allen talked all the time.", "Because they were both from Senegal.", "Because Boubacar asked to switch rooms.", "As a punishment for missing practice."], "answer": 0, "explanation": "Coach Thompson joked that Boubacar, who was from Senegal, could work on his English by living with Allen, because Allen never stopped talking."}, {"q": "Coach Thompson finally \"relented\" and allowed Midnight Madness. What does relented mean?", "choices": ["He canceled the event.", "He forgot about it.", "He stopped refusing and gave in.", "He complained to the school."], "answer": 2, "explanation": "To relent means to give in after saying no for a long time. Thompson had always refused Midnight Madness, but that fall he finally agreed."}, {"q": "Why did Iverson stay in practice even though he needed about ten stitches?", "choices": ["The trainer could not be found.", "He loved scrimmaging and did not want to miss the chance to compete.", "Coach Thompson ordered him to stay.", "He did not notice he was hurt."], "answer": 1, "explanation": "Scrimmaging was Iverson's favorite part of practice, so he stayed to finish before getting his stitches."}, {"q": "Who was the only person who had ever beaten Iverson in a race?", "choices": ["Victor Page", "Boubacar", "Don Reid", "Mike Jackson"], "answer": 3, "explanation": "Iverson won every sprint in practice every day. He says Mike Jackson was still the only person who had ever beaten him in a race."}, {"q": "What happened after Iverson hurt his shoulder trying to dunk on Adonal Foyle?", "choices": ["He went back into the game and finished it.", "He missed the rest of the tournament.", "He had surgery the next day.", "He switched to playing center."], "answer": 0, "explanation": "Even with new stitches and a hurt shoulder, Iverson reentered the game against Colgate and finished it."}, {"q": "What did Iverson learn from guarding Stephon Marbury?", "choices": ["Marbury could not shoot from outside.", "Marbury was afraid of big crowds.", "Marbury was one of the toughest players he ever had to guard.", "Marbury only used his left hand."], "answer": 2, "explanation": "Marbury got past Iverson several times with his crossover and strength. Iverson says Marbury was one of the toughest players for him to guard in his whole career."}, {"q": "Where were the NIT semifinal and final played?", "choices": ["Tallahassee, Florida", "Madison Square Garden in New York", "Georgetown's home gym", "Tokyo, Japan"], "answer": 1, "explanation": "Madison Square Garden hosted both the semifinal and the final. Playing there was exactly what Iverson wanted."}, {"q": "What did Iverson's two favorite plays against Georgia Tech, the passes to Othella and Jerome, show?", "choices": ["That he only cared about scoring", "That he was too tired to shoot", "That the team needed a new point guard", "That he could make his teammates better by setting them up to score"], "answer": 3, "explanation": "Both highlights were passes that led to easy baskets for teammates. Iverson was proud of getting others involved, not just scoring."}, {"q": "How did Iverson feel carrying the MVP trophy back to the locker room?", "choices": ["Furious, because his team had lost the game", "Thrilled, because the trophy was all that mattered", "Nervous about meeting Patrick Ewing", "Embarrassed to hold it in front of the fans"], "answer": 0, "explanation": "Even though he scored 40 points and won the MVP trophy, Iverson was angry because Georgetown lost the final to Arizona."}, {"q": "Why was Coach Thompson smiling after the loss to Arizona?", "choices": ["He thought the referees would change the result.", "He believed the loss would push the team to work harder on defense.", "He was proud the team shot so well.", "He had won a bet with another coach."], "answer": 1, "explanation": "Thompson called the loss the wake-up call the team needed. Now he had a reason to push everyone hard on defense for the rest of the year."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first year with the Philadelphia 76ers", "Iverson's trial and time in jail", "The start of Iverson's second Georgetown season, with new teammates and a big early tournament", "Coach Thompson's retirement"], "answer": 2, "explanation": "The chapter covers Iverson's confident return for year two: new roommate, new backcourt partner, Midnight Madness, and the preseason NIT run."}]}, {"id": "ch27-crossover", "num": "27", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Crossover", "bank": [{"q": "Who taught Allen Iverson the crossover at Georgetown?", "choices": ["Victor", "Othella", "Dean Berry", "Tim Hardaway"], "answer": 2, "explanation": "Dean Berry, a freshman walk-on, beat Iverson with the crossover every day in practice, so Iverson asked Berry to teach him the move."}, {"q": "What was unusual about Dean Berry making the Georgetown team?", "choices": ["He was a walk-on without a scholarship, which almost never happened at Georgetown", "He was the tallest player on the team", "He had already played professional basketball", "He was Coach Thompson's nephew"], "answer": 0, "explanation": "Berry showed up without a scholarship and made the team, which Iverson says was unheard-of at Georgetown back then."}, {"q": "Where was Dean Berry from?", "choices": ["Hampton", "Washington, DC", "Newport News", "Brooklyn"], "answer": 3, "explanation": "The chapter says Dean Berry was from Brooklyn and was shorter and skinnier than Iverson."}, {"q": "Why did Iverson finally ask Berry to teach him the crossover?", "choices": ["Coach Thompson ordered him to learn it", "The move was so good that he knew he had to learn it", "Berry offered to teach him for money", "Victor told him he needed a new move"], "answer": 1, "explanation": "Even though his pride made it hard to ask, Iverson says the move was so effective that he swallowed his ego and asked Berry to show him."}, {"q": "When did Iverson and Berry work on the crossover?", "choices": ["After practice, again and again, every day", "Only during summer break", "During halftime of home games", "Once a month before big games"], "answer": 0, "explanation": "Starting late that fall, Iverson stayed after practice with Berry, and they worked on the move again and again, every day."}, {"q": "What special touch did Iverson add to the crossover?", "choices": ["A spin move at the end", "Dribbling behind his back first", "Holding the ball high and away from his body with a little cradle, almost pausing it", "A jump stop before shooting"], "answer": 2, "explanation": "Iverson's signature was bringing the ball high and away with a little cradle so he could pause, watch the defender, and then decide what to do."}, {"q": "Why does the crossover work, according to Iverson?", "choices": ["Because referees cannot see it happen", "Because the defender is scared of the ball handler's first step", "Because it makes the ball too hard to see", "Because it tires out the defender's legs"], "answer": 1, "explanation": "Iverson explains that the crossover works because the defender is afraid of your first step, so he would watch the defender's eyes and feet for fear."}, {"q": "How many points did Iverson score against Seton Hall?", "choices": ["18", "25", "30", "40"], "answer": 3, "explanation": "Iverson scored forty against Seton Hall, tying the Georgetown record he had set in the Arizona game."}, {"q": "Which player did Iverson cross over in the famous play against Seton Hall?", "choices": ["Danny Hurley", "Ray Allen", "Alvin Williams", "Donnell Williams"], "answer": 0, "explanation": "Iverson crossed over Danny Hurley in the first half; Donnell Williams was the player who came over to help on defense afterward."}, {"q": "What happened during the timeout after the crossover play?", "choices": ["Iverson was taken out of the game", "Coach Thompson yelled at the team", "The play was shown on the big screen two times", "Seton Hall's coach walked out of the arena"], "answer": 2, "explanation": "When the game stopped for a timeout, the arena put the play on the big screen twice, and the crowd got louder each time."}, {"q": "How did Iverson most likely feel when Berry kept beating him in practice?", "choices": ["Bored", "Proud of his own defense", "Relaxed and calm", "Frustrated, but eager to learn the move"], "answer": 3, "explanation": "Iverson says it made him mad in practice, but at the same time he knew he needed to learn what Berry was doing."}, {"q": "Iverson was 'hesitant' to ask Berry for help. What does hesitant mean?", "choices": ["Excited", "Unsure and slow to act", "Angry", "Forgetful"], "answer": 1, "explanation": "Hesitant means unsure and slow to do something. Iverson waited a long time to ask because his pride got in the way."}, {"q": "What is this chapter mostly about?", "choices": ["How Iverson learned the crossover and made it part of his game", "How Georgetown lost to Seton Hall", "How Dean Berry earned a scholarship", "How Iverson became a better free-throw shooter"], "answer": 0, "explanation": "The chapter tells how Dean Berry taught Iverson the crossover, how Iverson added his own touch, and how the move became part of his show."}, {"q": "Where did Georgetown play its home game against Seton Hall?", "choices": ["Madison Square Garden", "The Anderson Park courts", "Bethel High School's gym", "The USAir Arena"], "answer": 3, "explanation": "The game was played at the USAir Arena, Georgetown's home court, in front of more than 18,000 fans on a Saturday."}, {"q": "What did Coach Thompson tell the team to do at the end of close games?", "choices": ["Slow the game down and hold the ball", "Get the ball to Iverson", "Foul the other team on purpose", "Pass the ball to Dean Berry"], "answer": 1, "explanation": "By that point in the season, Coach Thompson had told everyone to get Iverson the ball at the end of tight games."}]}, {"id": "ch28-mastering-the-college-game", "num": "28", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Mastering the College Game", "bank": [{"q": "How many points did Iverson score in the loss to St. John's at the Garden?", "choices": ["18", "24", "30", "39"], "answer": 3, "explanation": "Iverson scored 39 against St. John's and 'lit up the place,' but Georgetown still lost the game."}, {"q": "Why was it seen as a bad sign when Iverson scored 40 points?", "choices": ["He got too tired to play defense", "The team lost or almost lost because his teammates were not involved", "Coach Thompson benched him for shooting too much", "The fans booed him for being selfish"], "answer": 1, "explanation": "His three highest-scoring games were a loss, a near-loss, and another loss, because the other players were not getting involved in the offense."}, {"q": "Who hit the game-sealing three-pointer against Miami after a pass from Iverson?", "choices": ["Jerry Nichols", "Othella", "Victor", "Boubacar"], "answer": 0, "explanation": "Iverson fed Jerry Nichols for the three-pointer that sealed the win over Miami; Jerry also hit a key three at Notre Dame."}, {"q": "What defense did Villanova use against Iverson?", "choices": ["A full-court press for the whole game", "Man-to-man defense on every player", "A box and one, with one player following him everywhere", "A double team on Othella near the basket"], "answer": 2, "explanation": "Villanova played the box and one: four players in a zone and one player, mostly Alvin Williams, following Iverson wherever he went."}, {"q": "What did the players ask Coach Thompson before the UConn game?", "choices": ["To cancel practice for the week", "To let them press full-court from start to finish", "To let them wear new uniforms", "To play a slow, careful style of offense"], "answer": 1, "explanation": "Iverson, Jerome, Boubacar, Othella, and Vic went to Coach Thompson as a group and asked to press full-court the whole game, and he said he was for it."}, {"q": "How many steals did Iverson have against UConn?", "choices": ["Eight", "Three", "Twelve", "Five"], "answer": 0, "explanation": "Iverson had eight steals in the UConn game, just two short of the record he had set a couple of weeks before."}, {"q": "Who guarded Ray Allen for most of the UConn game?", "choices": ["Jerome", "Victor", "Othella", "Boubacar"], "answer": 3, "explanation": "Boubacar locked up Ray Allen most of the time, and Georgetown shut Allen down while building a big lead."}, {"q": "Which play does Iverson call his favorite dunk he ever did?", "choices": ["A dunk in the first half against Memphis", "A dunk at Madison Square Garden against St. John's", "The dunk over 6'6\" Rudy Johnson in the UConn game", "A dunk in his first NBA game"], "answer": 2, "explanation": "In the first minute of the second half against UConn, Iverson rose over Rudy Johnson and threw it down; he says it is still his favorite dunk ever."}, {"q": "Why did Iverson stop dunking later, in the NBA?", "choices": ["He played so many minutes that he had to save his energy", "A knee injury made it too painful", "Referees kept calling him for hanging on the rim", "His coaches told him dunking was too risky"], "answer": 0, "explanation": "At his NBA peak he played so many minutes that he had to conserve his energy, so he stopped dunking."}, {"q": "What happened with Iverson's dad, Michael Freeman, that January?", "choices": ["He moved to Washington, DC, to be near Allen", "He was paroled from jail and wore an ankle monitor", "He came to every Georgetown home game", "He got a new job at the shipyard"], "answer": 1, "explanation": "Michael Freeman was paroled that January and had an ankle monitor, living with his brothers in Hampton, where Iverson would visit him."}, {"q": "Which song did Iverson play over and over in his dorm room?", "choices": ["A song by Tupac", "The Georgetown fight song", "A jazz record Coach Thompson gave him", "\"Juicy\" by Biggie"], "answer": 3, "explanation": "Iverson played Biggie's song 'Juicy' over and over, and his teammates tried to take his Biggie tapes away."}, {"q": "How did Coach Thompson most likely feel when the players asked to play more defense?", "choices": ["Pleased and a little amused", "Angry that they questioned his plan", "Worried they would get hurt", "Confused about what they wanted"], "answer": 0, "explanation": "Thompson smiled because players did not usually ask to play more defense, and he even joked that he didn't know much about offense anyway."}, {"q": "The chapter says the NBA was Iverson's number one 'distraction.' What is a distraction?", "choices": ["A type of injury", "A kind of defense", "Something that pulls your attention away", "A reward for hard work"], "answer": 2, "explanation": "A distraction is something that takes your mind off what you should be doing; thinking about the NBA and its riches pulled at Iverson's focus."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's decision to leave Georgetown for the NBA", "Dean Berry teaching Iverson a new move", "The championship game of March Madness", "Iverson learning to lead his team while big games and thoughts of the future filled his mind"], "answer": 3, "explanation": "The chapter covers Iverson balancing scoring with getting teammates involved, big wins like the UConn game, and the pull of home and the NBA on his mind."}, {"q": "After the team beat Memphis, Iverson joked about skipping practice. What did Coach Thompson do instead?", "choices": ["He gave the team two days off", "He doubled the practice", "He canceled the UConn game", "He let only Iverson skip practice"], "answer": 1, "explanation": "Instead of easing up, Coach Thompson doubled practice because the big UConn game was coming next."}]}, {"id": "ch29-another-villanova-controversy", "num": "29", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Another Villanova Controversy", "bank": [{"q": "What was the final score of Georgetown's big home win over Villanova?", "choices": ["66-63", "106-68", "32-12", "100-99"], "answer": 1, "explanation": "Georgetown destroyed Villanova 106-68 in the last home game for seniors Jerome and Othella."}, {"q": "Why did Kerry Kittles miss that game for Villanova?", "choices": ["He was hurt in the last game", "He was sick with the flu", "He had graduated early", "He was suspended for making unauthorized phone calls on a calling card"], "answer": 3, "explanation": "Kittles was sitting out the third game of a three-game suspension because the NCAA punished him for phone calls made on a calling card."}, {"q": "What did the Georgetown students chant during the blowout?", "choices": ["\"Two more years!\"", "\"We want UConn!\"", "\"M-V-P!\"", "\"Defense!\""], "answer": 0, "explanation": "The students chanted 'Two more years!' because they wanted Iverson to stay for his junior and senior seasons instead of going to the NBA."}, {"q": "Why did Coach Thompson scowl at the chanting students?", "choices": ["They were being too quiet", "They were cheering for Villanova", "He didn't want everyone obsessing over whether Iverson would enter the draft", "They were throwing towels onto the court"], "answer": 2, "explanation": "Thompson did not want the whole season to become about whether Iverson would leave for the NBA, so he scowled and even threw a towel toward the students."}, {"q": "Who made the offensive comment about Iverson during the TV broadcast?", "choices": ["Jim Calhoun", "Billy Packer", "Tom Brokaw", "A Villanova player"], "answer": 1, "explanation": "Billy Packer, the announcer calling the game, used the word 'monkey' while praising a tough play by Iverson, and people complained it was a slur."}, {"q": "What did Billy Packer do before the game was even over?", "choices": ["He apologized on the air", "He left the arena", "He was fired by CBS", "He interviewed Iverson courtside"], "answer": 0, "explanation": "Packer apologized on the air before the game ended, saying he did not mean it in a bad way."}, {"q": "What did Iverson tell the media about Billy Packer?", "choices": ["That Packer should be fired right away", "That he never wanted to speak to Packer again", "That he had watched Packer's games all his life and never considered him a racist", "That Packer had apologized to him in person"], "answer": 2, "explanation": "Iverson told the media he had watched Packer's CBS games all his life, never heard him say anything offensive, and did not take the comment that way."}, {"q": "How many points did Iverson score against Miami in the first round of the Big East Tournament?", "choices": ["18", "24", "28", "38"], "answer": 3, "explanation": "Iverson scored 38 points as Georgetown beat Miami in the first round; the 28 points came in the next game against Villanova."}, {"q": "Who scored 34 points against Villanova in the tournament game?", "choices": ["Othella", "Victor", "Jerome", "Boubacar"], "answer": 1, "explanation": "Victor found his rhythm and scored 34 points from all over, which made Iverson proud because Vic had struggled during the season."}, {"q": "What happened in the last sixteen seconds of the final against UConn?", "choices": ["Ray Allen made an awkward shot that bounced on the rim and went in", "Iverson made a three-pointer to win the game", "The game went to overtime", "Georgetown stole the ball and ran out the clock"], "answer": 0, "explanation": "With Georgetown up one, Ray Allen threw up an awkward shot that bounced around the rim three or four times before falling in."}, {"q": "Who missed the putback after grabbing the rebound on Georgetown's last chance?", "choices": ["Victor", "Othella", "Iverson", "Jerome"], "answer": 3, "explanation": "After Iverson's shot missed, Jerome got the rebound but could not make the putback, and Georgetown lost the final."}, {"q": "How did Iverson most likely feel in the locker room after the final?", "choices": ["Relieved that the season was over", "Angry at his teammates", "Heartbroken, trying to hold back tears", "Excited for the next game"], "answer": 2, "explanation": "Iverson says he was trying to hold back tears and calls it the toughest loss of his time at Georgetown."}, {"q": "What did Coach Thompson do after the tough loss?", "choices": ["He put his arm around Iverson and said, \"Don't worry about it.\"", "He made the team practice that same night", "He yelled at the referees in the hallway", "He sent Iverson home to Hampton for a break"], "answer": 0, "explanation": "Thompson came over to the downcast Iverson, put his arm around him, and told him not to worry, since the team still had more games to play."}, {"q": "The chapter title mentions a 'controversy.' What is a controversy?", "choices": ["A kind of basketball play", "A big celebration", "A championship game", "A public argument or disagreement"], "answer": 3, "explanation": "A controversy is a public argument or disagreement, like the one that started when people complained about the announcer's comment."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first game at Georgetown", "A controversy over an announcer's comment and a painful loss in the Big East final", "How Iverson learned the crossover", "Iverson's decision to go to the NBA"], "answer": 1, "explanation": "The chapter covers the Billy Packer controversy, how Coach Thompson handled it, and Georgetown's one-point loss to UConn in the Big East Championship."}]}, {"id": "ch30-a-second-dance", "num": "30", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "A Second Dance", "bank": [{"q": "Where were Georgetown's first two tournament games played?", "choices": ["Philadelphia, Pennsylvania", "New York City", "Richmond, Virginia", "Washington, DC"], "answer": 2, "explanation": "The first games were in Richmond, Virginia, which Iverson calls \"pretty much my backyard,\" so his family and friends could come."}, {"q": "What nickname did fans from home shout at the open practice?", "choices": ["Bubbachuck", "Snapper", "House Mouse", "Juicy"], "answer": 0, "explanation": "People in the stands called him \"Bubbachuck,\" his hometown nickname, which made his teammates and Coach Thompson laugh."}, {"q": "When did Iverson's mom arrive at the first tournament game?", "choices": ["Before the game started", "At halftime", "After the game ended", "She could not come"], "answer": 1, "explanation": "Iverson jokes that his mom showed up at halftime, \"that's how late she was,\" wearing her Georgetown number 3 jersey."}, {"q": "Who suggested that Georgetown switch to man-to-man defense against New Mexico?", "choices": ["Othella", "Jerome", "Jahidi White", "Boubacar"], "answer": 3, "explanation": "Boubacar, who was usually quiet, said, \"Coach, let's go man,\" and Coach Thompson told him, \"Do it.\""}, {"q": "Which award did Iverson win that season?", "choices": ["Big East Defensive Player of the Year", "Big East Player of the Year", "NCAA champion", "The Wooden Award"], "answer": 0, "explanation": "He won Big East Defensive Player of the Year again. He was only a finalist for the Wooden Award, and he says he did not win Player of the Year."}, {"q": "Why did Georgetown change its defense during the New Mexico game?", "choices": ["The referees made them change it", "The players were too tired to run the zone", "New Mexico was scoring easily against the zone", "Iverson asked to guard the tallest player"], "answer": 2, "explanation": "New Mexico had been \"picking apart\" Georgetown's zone, so the team switched to man-to-man defense and locked them down."}, {"q": "What happened while the team was in the locker room after beating New Mexico?", "choices": ["Coach Thompson did his victory dance", "They flew home to Washington", "Governor Wilder visited the team", "They heard a backboard had been shattered and ran out to see the glass"], "answer": 3, "explanation": "They found out Darvin Ham had shattered a backboard in the Texas Tech game and ran back out to see the broken glass being picked up."}, {"q": "Why was it hard for Iverson to score against UMass?", "choices": ["He was sick that day", "The UMass guards defended him well, and Marcus Camby blocked shots", "Coach Thompson kept him on the bench", "He hurt his ankle in the first half"], "answer": 1, "explanation": "Iverson says Travieso and Padilla could really guard, and when he got past them, Camby, one of the best shot blockers he ever faced, was waiting."}, {"q": "What is this chapter mostly about?", "choices": ["Georgetown winning three tournament games, then losing one game before the Final Four", "Iverson's first year at Georgetown", "Iverson deciding to buy a new car", "Coach Thompson retiring from coaching"], "answer": 0, "explanation": "The chapter tells the story of the NCAA Tournament run: wins over Mississippi Valley State, New Mexico, and Texas Tech, and then the loss to UMass in the Elite Eight."}, {"q": "What does the New Mexico game show about the Georgetown team?", "choices": ["Iverson had to do everything by himself", "The players argued with each other under pressure", "His teammates supported Iverson when his shots were not falling", "Georgetown always played better in the first half"], "answer": 2, "explanation": "When Iverson started slow, Jahidi White and Jerome stepped up, and his teammates told him to relax and keep shooting."}, {"q": "How did Iverson most likely feel when he saw Governor Wilder at his game?", "choices": ["Embarrassed", "Grateful", "Angry", "Bored"], "answer": 1, "explanation": "Iverson calls Wilder the man who set him free and says he would have loved to thank him and shake his hand that day."}, {"q": "How did the team feel after beating Texas Tech?", "choices": ["Ashamed that they had won", "Certain they would win the championship", "Angry at each other", "Relieved, like they had survived a tough game"], "answer": 3, "explanation": "Iverson says they left for the locker room relieved, \"feeling like we survived more than played great.\""}, {"q": "Iverson says Governor Wilder took it upon himself to \"emancipate\" him. Emancipate means to", "choices": ["set someone free", "punish someone", "train someone", "hire someone"], "answer": 0, "explanation": "To emancipate means to set free. Governor Wilder was the one who released Iverson from jail."}, {"q": "Coach Thompson \"was known as an authoritarian.\" An authoritarian is someone who", "choices": ["listens to everyone's ideas first", "demands that things be done their way", "never speaks in public", "always makes jokes"], "answer": 1, "explanation": "An authoritarian insists on being obeyed. Iverson says people saw Thompson that way, but he actually listened to his players."}, {"q": "Which team ended Georgetown's season?", "choices": ["Texas Tech", "New Mexico", "UMass", "Mississippi Valley State"], "answer": 2, "explanation": "Georgetown lost to UMass, the number one team in the country, in the Elite Eight on March 23. \"Season over.\""}]}, {"id": "ch31-leaving-georgetown", "num": "31", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Leaving Georgetown", "bank": [{"q": "What car did Iverson drive off the dealership lot?", "choices": ["A red Ford Taurus", "A new Lexus", "A Jeep", "A black Mercedes S600 Coupe"], "answer": 3, "explanation": "At the dealership in Arlington, he saw a black Mercedes S600 Coupe, used but with only a few thousand miles on it."}, {"q": "How much did Iverson pay for the car that day?", "choices": ["A little over $100,000", "Nothing — the salesman let him take it without paying", "Half the full price", "One thousand dollars"], "answer": 1, "explanation": "The salesman knew who he was and let him take the car with no papers, no contract, and no money, saying they could settle up later."}, {"q": "Which newspaper first reported that Iverson would enter the NBA Draft?", "choices": ["The Daily Press", "The Washington Post", "The Georgetown student paper", "The Philadelphia Inquirer"], "answer": 0, "explanation": "His local paper, the Daily Press, announced it at the end of Easter weekend, using unnamed local sources."}, {"q": "Why did people think Iverson had already decided to turn pro?", "choices": ["He told everyone at a party", "He stopped going to class", "They saw him driving the expensive Mercedes", "Coach Thompson announced it on TV"], "answer": 2, "explanation": "Iverson says people \"looked at that car and figured my decision was made,\" even though he had not paid for it and had not decided."}, {"q": "Who was David Falk?", "choices": ["A Georgetown assistant coach", "An agent who represented Michael Jordan and Coach Thompson", "A reporter for the Daily Press", "The decision-maker for the Toronto Raptors"], "answer": 1, "explanation": "Falk was the famous agent who represented Jordan, Coach Thompson, and most Georgetown players who went pro. Iverson later signed with him."}, {"q": "Why did Coach Thompson tell reporters, \"Allen's not going anywhere unless I tell him it's time to go\"?", "choices": ["He wanted to take the pressure off Iverson", "He planned to make Iverson stay four years", "He was angry with Iverson", "He wanted to become Iverson's agent"], "answer": 0, "explanation": "Some people thought Thompson was being controlling, but Iverson explains he was really trying to protect him from outside pressure."}, {"q": "What did Isiah Thomas do when Coach Thompson asked where Iverson might be drafted?", "choices": ["He said Iverson should stay in school", "He laughed and changed the subject", "He said the tenth pick", "He silently held up one finger"], "answer": 3, "explanation": "Isiah did not say a word — he just raised one finger, meaning Iverson could be the number one pick."}, {"q": "What was the biggest reason Iverson entered the draft?", "choices": ["He disliked his college classes", "Coach Thompson told him to leave", "His family needed help right away", "He wanted to play in Canada"], "answer": 2, "explanation": "With his dad facing charges, his sister needing medical care, and his mom struggling to pay bills, Iverson says, \"It wasn't a choice.\""}, {"q": "What did Iverson do after Coach Thompson told him to return the Benz?", "choices": ["He hid the car at a friend's house", "He returned it", "He bought it with sneaker money", "He drove it to Philadelphia"], "answer": 1, "explanation": "When Coach Thompson confronted him about the car and told him to return it, Iverson did."}, {"q": "What was the hardest part of leaving Georgetown for Iverson?", "choices": ["Feeling like he had unfinished business — he wanted to win a championship for Coach Thompson", "Saying goodbye to his dorm room", "Missing the campus meals", "Leaving the Kenner League"], "answer": 0, "explanation": "Iverson says he wanted to come back and win a championship for Coach Thompson too, and that feeling of unfinished business was the hardest part."}, {"q": "How did Iverson say the press conference felt?", "choices": ["Like a big party", "Boring", "Sad, even though he knew he was helping his family", "Scary"], "answer": 2, "explanation": "He calls it a sad day, to be honest, even as he explained that his family's needs had to be addressed right away."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first NBA game", "Iverson's junior year of high school", "A road trip with his teammates", "How Iverson decided to leave Georgetown for the NBA"], "answer": 3, "explanation": "The chapter follows the whole decision — the car, the rumors, his family's troubles, the advice he got, and finally the press conference announcing he would enter the draft."}, {"q": "What lesson did losing Nana teach Iverson?", "choices": ["Never trust doctors", "Life is short, so waiting is not always possible", "Always save your money", "Family can always wait a little longer"], "answer": 1, "explanation": "When a writer said his family could wait another year, Iverson answered that losing Nana taught him \"there are only so many days in a person's life.\""}, {"q": "The newspaper used \"anonymous\" sources. Anonymous means", "choices": ["not named", "famous", "angry", "paid"], "answer": 0, "explanation": "Anonymous sources are people whose names are kept secret. The Daily Press did not say who told them about Iverson's plans."}, {"q": "Falk told Iverson to stay in school and \"refine\" his game. Refine means to", "choices": ["forget", "record", "improve", "repeat"], "answer": 2, "explanation": "To refine something is to make it better. Falk thought another year of college would improve Iverson's game and draft position."}]}, {"id": "ch32-the-76ers", "num": "32", "part": "Part V — From the Draft to Rookie of the Year", "title": "The 76ers", "bank": [{"q": "Who was with Iverson when he watched the draft lottery on TV?", "choices": ["Coach Thompson", "His Uncle Stevie", "David Falk", "Pat Croce"], "answer": 1, "explanation": "Back home, about two weeks after leaving Georgetown, Iverson watched the lottery on NBC with his Uncle Stevie."}, {"q": "Which team won the first pick of the 1996 draft?", "choices": ["Toronto Raptors", "Vancouver Grizzlies", "Philadelphia 76ers", "Milwaukee Bucks"], "answer": 2, "explanation": "Russ Granik announced that the third pick went to Vancouver, the second to Toronto, and the first pick to the Philadelphia 76ers."}, {"q": "Who jumped up and celebrated on TV when Philadelphia won the first pick?", "choices": ["Pat Croce", "Ed Snider", "Brad Greenberg", "Johnny Davis"], "answer": 0, "explanation": "Pat Croce, the team president, jumped up, pumped his fists, and high-fived the other representatives. Iverson had to ask who he was."}, {"q": "How big was Iverson's sneaker deal with Reebok?", "choices": ["$9 million for three years", "$6.7 million for three years", "$100,000 for one year", "$50 million for ten years"], "answer": 3, "explanation": "About a week before the draft, Falk negotiated a sneaker deal worth $50 million over ten years."}, {"q": "Who sat on Iverson's lap in the greenroom on draft night?", "choices": ["His little sister", "His nephew", "His daughter Tiaura", "His cousin"], "answer": 2, "explanation": "His daughter Tiaura, just one and a half years old and wearing a navy and white striped dress, sat on his lap while they waited."}, {"q": "What did Iverson do right after David Stern called his name?", "choices": ["He ran straight onto the stage", "He kissed his daughter's head and handed her to his mom", "He called Coach Thompson", "He left the arena"], "answer": 1, "explanation": "He picked up his baby, kissed her head, handed her to his mother and kissed her too, then hugged his family and friends before going on stage."}, {"q": "Why did Iverson work out for only one team before the draft?", "choices": ["It was a plan to help him become the number one pick for Philadelphia", "No other teams invited him", "He was injured", "Coach Thompson would not allow more workouts"], "answer": 0, "explanation": "He and his agent chose a strategy of working out only for the 76ers, because being the first overall pick would raise his profile and value."}, {"q": "Why didn't Iverson want to be picked by Vancouver or Toronto?", "choices": ["Their coaches did not like him", "They already had star point guards", "He did not want to live and play in Canada", "Their arenas were too old"], "answer": 2, "explanation": "Iverson says plainly that there was no way he wanted to live and play in Canada."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's last game at Georgetown", "Iverson's rookie season in Philadelphia", "Iverson's court case in Virginia", "How Iverson became the number one pick of the 76ers"], "answer": 3, "explanation": "The chapter covers the lottery, his workouts for Philadelphia, the Reebok deal, and draft night, when the 76ers picked him first overall."}, {"q": "What is the \"Self-Expression\" section mostly about?", "choices": ["Iverson's daughter Dream wanting to be herself, just like her dad", "Iverson's first game in the NBA", "How Iverson learned to draw", "Buying a tuxedo for the ceremony"], "answer": 0, "explanation": "Seven-year-old Dream refused a fancy dress and put on Reebok sweats with IVERSON down the side, showing she wanted to be herself just like her father."}, {"q": "How did Iverson feel when he put on the Sixers hat on stage?", "choices": ["Nervous and afraid", "So happy he smiled like a little kid", "Disappointed with the team", "Angry at the commissioner"], "answer": 1, "explanation": "He tried to put on his game face, but on stage he \"just had to smile like a little kid.\" He writes, \"I had made it.\""}, {"q": "How did Iverson feel about the two-hour meeting with the team psychologist?", "choices": ["He thought it was fun", "He fell asleep during it", "He wished it had lasted longer", "He did not trust it and only did it because he had to"], "answer": 3, "explanation": "The meeting felt totally foreign to him, and he says he did not trust it at all and only went through with it because he had to."}, {"q": "Iverson says he was \"elated\" when his name was called. Elated means", "choices": ["confused", "exhausted", "extremely happy", "nervous"], "answer": 2, "explanation": "Elated means filled with joy. He was so elated he smiled, kissed his daughter and mom, and hugged everyone."}, {"q": "Iverson calls his kids his \"legacy.\" A legacy is", "choices": ["something a person passes down to those who come after them", "a type of contract", "a basketball play", "a kind of shoe"], "answer": 0, "explanation": "A legacy is what you leave behind for others. Iverson says his kids, and NBA players who are free to be themselves, are his legacy."}, {"q": "What did Dream want to wear to the Hall of Fame ceremony?", "choices": ["A big, beautiful dress", "Reebok sweats with IVERSON down the side", "A Sixers jersey", "A tuxedo like her dad"], "answer": 1, "explanation": "Dream refused the dress her family picked and came back wearing custom Reebok sweats with her family name, IVERSON, down the side."}]}, {"id": "ch33-from-va-to-pa", "num": "33", "part": "Part V — From the Draft to Rookie of the Year", "title": "From VA to PA", "bank": [{"q": "Which city threw Allen a parade after he was drafted?", "choices": ["Norfolk", "Hampton", "Philadelphia", "Poquoson"], "answer": 1, "explanation": "The chapter says the city of Hampton threw Allen a parade on July 6 to celebrate its first-ever No. 1 draft pick."}, {"q": "Where did the parade begin?", "choices": ["Bethel High School", "The Coliseum", "Hampton University", "Aberdeen Elementary"], "answer": 3, "explanation": "The parade started at Aberdeen Elementary, the school where Allen once went to play pickup basketball as a kid. It ended at the Coliseum."}, {"q": "Who led the practices at the Sixers minicamp?", "choices": ["Johnny Davis", "John Thompson", "Jerry Stackhouse", "Joe Smith"], "answer": 0, "explanation": "Allen says Johnny Davis led the minicamp practices and made the players work very hard."}, {"q": "How many points did Allen score in his first public game as a Sixer?", "choices": ["36", "29", "22", "30"], "answer": 2, "explanation": "In the exhibition against local all-stars at Temple University, Allen scored 22 points. He scored 36 and 29 in later summer games."}, {"q": "How much did Allen weigh during summer league?", "choices": ["220 pounds", "165 pounds", "250 pounds", "190 pounds"], "answer": 1, "explanation": "Allen says he was still just 165 pounds, but he kept driving to the basket even when he got knocked down."}, {"q": "What is this chapter mostly about?", "choices": ["Allen leaving Virginia behind and starting his new life with the 76ers", "Allen's high school football season", "Allen's time at Georgetown with Coach Thompson", "Allen winning an NBA championship"], "answer": 0, "explanation": "The chapter covers the draft, the goodbye parade in Hampton, and Allen's first camp and summer games as a Sixer, showing him moving from Virginia to Philadelphia."}, {"q": "What did Allen's summer league games show?", "choices": ["He was too small to play against professionals", "He needed more time to get in shape", "His confidence grew as he scored against pro players", "He preferred passing over shooting"], "answer": 2, "explanation": "Allen says his confidence was growing with each game as he averaged about 30 points against bigger, stronger players."}, {"q": "What does the parade part of the chapter show?", "choices": ["Everyone in Hampton was against the parade", "Allen skipped the parade to practice", "The parade was canceled because of rain", "Many people celebrated Allen even though some still criticized him"], "answer": 3, "explanation": "Crowds lined the streets cheering, but one woman held a critical sign and people kept debating. Allen says seeing his community pay tribute meant a lot to him."}, {"q": "What did Allen do three days after the parade?", "choices": ["He played the Knicks in New York", "He went to a three-day minicamp in Philadelphia", "He visited the Reebok headquarters", "He played another exhibition at Hampton University"], "answer": 1, "explanation": "Three days after the July 6 parade, on July 9, Allen was at the Community College of Philadelphia for a three-day minicamp for rookies."}, {"q": "Why were some summer league teammates upset with Allen?", "choices": ["He showed up late to practice", "He refused to talk to them", "He took so many shots", "He asked to switch teams"], "answer": 2, "explanation": "After a few games, some players trying to make the NBA were unhappy that Allen was taking so many shots instead of passing more."}, {"q": "What happened right after the minicamp ended?", "choices": ["Allen played an exhibition against local all-stars at Temple University", "Allen flew home to Virginia for the parade", "Allen hurt his shoulder", "Allen met Michael Jordan"], "answer": 0, "explanation": "Right after the camp, Allen got on the court in public for the first time as a Sixer, in an exhibition at McGonigle Hall on Temple's campus."}, {"q": "How did Allen most likely feel seeing his community at the parade?", "choices": ["Embarrassed by all the attention", "Angry at the people who came", "Bored by the long speeches", "Touched and thankful"], "answer": 3, "explanation": "Allen says it meant so much to him to see his own community paying tribute, and he thanked his family, God, and everyone who stuck with him."}, {"q": "Why did Allen refuse to sit out a summer league game?", "choices": ["He did not want to miss any chance to play", "He was afraid of being cut from the team", "His mom told him he had to play", "The coaches promised him extra money"], "answer": 0, "explanation": "When the coaches wanted to hold him out of a game, Allen would not accept it because he loved playing and refused to miss games."}, {"q": "A dealership \"loaned\" Allen a convertible for the parade. What does \"loaned\" mean?", "choices": ["Sold it to him", "Painted it for him", "Let him borrow it", "Gave it to him to keep"], "answer": 2, "explanation": "To loan something means to let someone borrow it for a while. The dealership let the parade use the convertible for the occasion."}, {"q": "Allen played an \"exhibition\" game at Hampton University. What is an exhibition game?", "choices": ["A playoff game", "A game played for show that does not count in the standings", "A practice with no fans allowed", "A championship game"], "answer": 1, "explanation": "An exhibition is a game put on for fans to watch, not part of the regular season. More than 7,000 people came to watch Allen's exhibition."}]}, {"id": "ch34-let-the-games-begin", "num": "34", "part": "Part V — From the Draft to Rookie of the Year", "title": "Let the Games Begin", "bank": [{"q": "Which team did the Sixers play in Allen's first NBA game?", "choices": ["The Chicago Bulls", "The New York Knicks", "The Milwaukee Bucks", "The Phoenix Suns"], "answer": 2, "explanation": "The Sixers opened the season on November 1 against the Milwaukee Bucks at the CoreStates Center."}, {"q": "How many points did Allen score in his first NBA game?", "choices": ["30", "35", "22", "26"], "answer": 0, "explanation": "Allen scored 30 points in the opener against the Bucks, and the crowd got excited even though the Sixers lost."}, {"q": "What did Allen's mom wear to his first NBA game?", "choices": ["A red dress", "A Georgetown sweatshirt", "A Bucks cap", "His number 3 jersey"], "answer": 3, "explanation": "The chapter says his mom wore her number 3 jersey, and Allen had tickets waiting for twenty or thirty family members and friends."}, {"q": "What did the NBA's memo say about Allen's crossover move?", "choices": ["It was too slow to work in the NBA", "It was a carrying violation", "It should be taught to other rookies", "It could only be used once per game"], "answer": 1, "explanation": "After just his fourth game, the league sent out a memo saying his crossover was a carrying violation, meaning it broke the rules."}, {"q": "What happened on the first play when Allen returned from his shoulder injury?", "choices": ["Charles Oakley hit him in the sore shoulder", "He made a three-pointer", "He was called for a carry", "He passed to Stackhouse for a dunk"], "answer": 0, "explanation": "On the very first play, Charles Oakley hit him in the shoulder. It hurt badly, but Allen shook it off and kept playing."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's summer vacation in Virginia", "Allen's decision to leave Georgetown", "Allen's exciting first NBA games and the challenges that came with them", "The Bulls winning the championship"], "answer": 2, "explanation": "The chapter covers Allen's first games as a rookie, including his big debut, facing Jordan, the league's new rule about his crossover, and playing through an injury."}, {"q": "What does the Bulls game part of the chapter show about Allen?", "choices": ["He was afraid to play against Chicago", "He admired Michael Jordan but still stood up for himself", "He thought the Bulls were overrated", "He wanted to be traded to the Bulls"], "answer": 1, "explanation": "Allen says Jordan was his hero and even seemed to glow, but when told he had to respect the Bulls, he said that on the court he would not back down from anyone."}, {"q": "Why did Allen miss a few games during the season?", "choices": ["He was suspended by the league", "He was benched for shooting too much", "He had the flu", "He hurt his shoulder in a loss to Toronto"], "answer": 3, "explanation": "After the loss to Toronto, Allen injured his shoulder, and the training staff said he had to sit out a few games."}, {"q": "What happened in the Phoenix game, right after the league's memo?", "choices": ["Allen scored his career high", "Allen sat out to rest his shoulder", "Referees called Allen for two carries, and neither was on a crossover", "The game was canceled"], "answer": 2, "explanation": "In the first game after the memo, refs called him for two carries. One call came while he was just walking the ball up the court. The Sixers still won."}, {"q": "How did Allen score his first NBA points?", "choices": ["On a goaltending call after he crossed over a defender and drove to the basket", "On two free throws", "On a half-court shot", "On a tip-in after a missed shot"], "answer": 0, "explanation": "Allen crossed over Sherman Douglas and went up to dunk. A defender touched the ball too late, so it counted as a goaltend and Allen got the points."}, {"q": "How did Allen most likely feel watching Jordan receive his championship ring?", "choices": ["Jealous and angry", "Bored and sleepy", "Embarrassed for the Bulls", "Amazed, like he was watching his hero glow"], "answer": 3, "explanation": "Allen says Jordan did not even look real to him and that he could see his aura. He had idolized Jordan since he was a kid."}, {"q": "How did Allen feel about the four minutes he sat on the bench at Madison Square Garden?", "choices": ["Glad to get some rest", "Upset, because he wanted to play the whole game", "Worried about his shoulder", "Proud of his backup"], "answer": 1, "explanation": "Allen played forty-four minutes that night and says he was mad about the four minutes he did not play. He always wanted to be on the court."}, {"q": "Allen \"idolized\" Michael Jordan. What does \"idolized\" mean?", "choices": ["Copied his haircut", "Played against him often", "Looked up to and admired him greatly", "Was afraid of him"], "answer": 2, "explanation": "To idolize someone means to admire them like a hero. Allen had Jordan's poster on his door and wore his shoes growing up."}, {"q": "The league issued a \"memorandum\" about Allen's crossover. What is a memorandum?", "choices": ["An official written notice", "A type of penalty shot", "A trophy", "A television interview"], "answer": 0, "explanation": "A memorandum is an official written message. The league sent one saying Allen's crossover move was against the rules."}, {"q": "Why did the Philly crowd go wild at the second Knicks game?", "choices": ["The Sixers set a scoring record", "Michael Jordan was in the crowd", "The team gave away free jerseys", "They thought Allen would not play, but he played hurt and helped win the game"], "answer": 3, "explanation": "Fans came thinking Allen would sit out with his shoulder injury. Instead he played 42 minutes, had 26 points, 9 rebounds, and 9 assists, and the Sixers won."}]}, {"id": "ch35-philly-my-home", "num": "35", "part": "Part V — From the Draft to Rookie of the Year", "title": "Philly, My Home", "bank": [{"q": "Where did Allen buy a house during his rookie year?", "choices": ["Conshohocken, just outside Philadelphia", "Camden, New Jersey", "Hampton, Virginia", "North Philly, near Temple University"], "answer": 0, "explanation": "Allen bought a house in Conshohocken, just outside Philly, and it became a home for his whole family."}, {"q": "What car did Allen get for his mom?", "choices": ["A black Mercedes", "A Range Rover", "A red Jaguar", "A Lexus"], "answer": 2, "explanation": "Just as his mom had wished after he got out of jail, Allen got her the red Jaguar. He bought himself a Range Rover and gave his Lexus to his aunt."}, {"q": "What board game did the TGI Fridays keep ready for Allen?", "choices": ["Chess", "Monopoly", "Checkers", "Scrabble"], "answer": 1, "explanation": "Allen kept his Monopoly habit, and the TGI Fridays near the practice gym kept a Monopoly board there, ready for him."}, {"q": "What was Allen's first signature shoe called?", "choices": ["The Crossover", "The Rookie", "The Answer", "The Question"], "answer": 3, "explanation": "His first Reebok shoe was called The Question. Every Allen Iverson release after that one was called The Answer."}, {"q": "What food did Allen get at DiNardo's Seafood a couple times a week?", "choices": ["Crabs", "Shrimp", "Cheesesteaks", "Fried fish"], "answer": 0, "explanation": "Allen got crabs at DiNardo's a couple times a week. It reminded him of home, except now he did not have to catch them off the bridge."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's games against the Chicago Bulls", "Allen's time in jail", "Allen making Philadelphia his home while staying true to himself", "Allen's senior year of high school"], "answer": 2, "explanation": "The chapter is about Allen settling into Philly with his family and friends, defending the people he loved, and dressing and living the way he wanted."}, {"q": "What does this chapter show about Allen and his friends from home?", "choices": ["He stopped talking to them once he made the NBA", "They only liked him for his money", "He barely knew most of them", "He stayed loyal to them because they helped him when he had nothing"], "answer": 3, "explanation": "Allen says his friends had his back and kept his family's lights on when he was in jail and at Georgetown, so loyalty to them meant everything."}, {"q": "Why did Allen dress the way he did?", "choices": ["Reebok told him what to wear", "It was how people back home dressed, and it was what felt comfortable to him", "He wanted to copy his teammates", "The NBA required baggy clothes"], "answer": 1, "explanation": "Allen says he was not trying to make a statement. He wore what people from his neighborhood wore and what he felt best expressed himself."}, {"q": "Why did Allen's friends stay in hotels during his second year?", "choices": ["The house had gotten too chaotic", "His mom asked them to leave", "The team made a rule against guests", "They moved back to Virginia"], "answer": 0, "explanation": "That first year his friends crashed at the house, but it sometimes got chaotic, so by the next year he had them staying at hotels."}, {"q": "What happened when Coach Davis suggested Allen wear a suit on the sideline?", "choices": ["Allen was fined by the league", "Allen agreed to wear one for the rest of the season", "Allen said no, and Coach Davis accepted that his style was his choice", "Allen was benched for the next game"], "answer": 2, "explanation": "Allen told him no because he wanted to be himself, and Coach Davis, unlike Coach Thompson, could not force him. Davis understood it was Allen's choice."}, {"q": "What happened when Allen visited Reebok headquarters in October 1996?", "choices": ["He signed his first contract", "He filmed a television commercial", "He met Michael Jordan", "The company showed him his first signature shoe"], "answer": 3, "explanation": "At the Reebok headquarters in Massachusetts, they showed Allen his first signature shoe, which he thought was almost perfect."}, {"q": "How did Allen most likely feel when DiNardo's closed its doors years later?", "choices": ["Relieved", "Sad", "Confused", "Excited"], "answer": 1, "explanation": "Allen says it broke his heart when DiNardo's closed, because it had been one of his favorite spots."}, {"q": "How did Allen feel when Pat Croce's joke about his friends was printed in the press?", "choices": ["Proud", "Thankful", "Angry", "Amused"], "answer": 2, "explanation": "Allen did not mind Croce joking with his friends, but when the joke was reported in the press, it made him mad."}, {"q": "Allen says \"loyalty was everything\" to him. What does loyalty mean?", "choices": ["Staying faithful to the people who support you", "Paying everyone's bills", "Winning every game", "Following all the rules"], "answer": 0, "explanation": "Loyalty means standing by the people who stand by you. Allen stuck with the friends who had helped him and his family through hard times."}, {"q": "Allen says the house was sometimes \"chaotic.\" What does chaotic mean?", "choices": ["Quiet and peaceful", "Empty and lonely", "Clean and organized", "Wild and out of control"], "answer": 3, "explanation": "Chaotic means messy, noisy, and out of control. With so many family members and friends staying there, the house sometimes got that way."}]}, {"id": "ch36-winning-and-losing", "num": "36", "part": "Part V — From the Draft to Rookie of the Year", "title": "Winning and Losing", "bank": [{"q": "Which team did the Sixers play in the sold-out game that set a Pennsylvania attendance record?", "choices": ["The Lakers", "The Bulls", "The Rockets", "The Spurs"], "answer": 0, "explanation": "The city was so excited that the game against the Lakers sold out, and people said it was the most fans ever to see a basketball game in Pennsylvania."}, {"q": "At the worst point of the losing streak, how many games did the Sixers lose out of 24?", "choices": ["12", "16", "20", "23"], "answer": 3, "explanation": "Iverson says that at its worst, the team lost 23 of 24 games during December and January."}, {"q": "Why did Iverson drop out of the slam-dunk contest?", "choices": ["He was not invited to it.", "His shoulder was injured.", "His coach told him to skip it.", "He wanted to rest for the playoffs."], "answer": 1, "explanation": "Iverson was invited to the slam-dunk contest, but his shoulder injury meant he had to pull out of it."}, {"q": "Who was in charge of Iverson's Reebok account and moved to Philadelphia?", "choices": ["Stack", "Pat Croce", "Que", "Coach Thompson"], "answer": 2, "explanation": "Que was Reebok's man in charge of the Iverson account. He moved to Philadelphia and became one of Iverson's close friends."}, {"q": "In which city was All-Star Weekend held that year?", "choices": ["Cleveland", "Philadelphia", "New York", "Milwaukee"], "answer": 0, "explanation": "All-Star Weekend was in Cleveland that year. Karl Malone even got booed for complaining about the Cleveland weather."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first playoff run with the Sixers", "A long losing streak and heavy criticism during Iverson's rookie season", "How Iverson met his friend Que in college", "Iverson's decision to leave Georgetown for the NBA"], "answer": 1, "explanation": "The chapter covers the Sixers losing 23 of 24 games and the criticism Iverson faced from older players and the press, plus his big night at the rookie game."}, {"q": "What did many of the fifty greatest players complain about during All-Star Weekend?", "choices": ["The cold weather in Cleveland", "The referees at the rookie game", "The prices of tickets", "The young players and a lack of respect"], "answer": 3, "explanation": "Instead of just being honored, many legends talked about how the young players lacked respect, and Iverson became the symbol of the new generation."}, {"q": "What happened right after Iverson accepted the MVP trophy at the rookie game?", "choices": ["The crowd chanted his name", "Kobe congratulated him on stage", "The crowd booed even louder", "Coach Thompson gave a speech"], "answer": 2, "explanation": "When Iverson went out to accept the trophy, the Cleveland crowd booed again, this time much louder than before."}, {"q": "Why did Iverson start growing his hair out for cornrows?", "choices": ["Reebok asked him to change his look", "He liked the style from back home and was tired of barbers ruining his haircut on road trips", "The team required a new hairstyle", "He lost a bet with Que"], "answer": 1, "explanation": "People back home had started wearing cornrows, and Iverson was tired of getting bad haircuts while traveling, so he and Que decided to grow their hair out together."}, {"q": "Which player scored 31 points for the West team in the rookie game?", "choices": ["Kobe Bryant", "Steve Nash", "Marcus Camby", "Ray Allen"], "answer": 0, "explanation": "Kobe was the West team's top player that night with 31 points, but his team lost and Iverson won MVP."}, {"q": "How did Iverson feel when he heard boos during the rookie game introductions?", "choices": ["He thought the boos were meant for the West team", "He felt like quitting basketball right away", "He began to feel that the negative stories were turning people against him", "He was sure the fans were booing Karl Malone"], "answer": 2, "explanation": "When he heard boos mixed with cheers, Iverson says that is when he began to feel that all the stories and hate were having an effect."}, {"q": "How did Iverson feel after his talk with Charles Barkley and Patrick Ewing?", "choices": ["Angry that they had interrupted his warm-up", "Sure that the newspapers would now defend him", "Confused about why they came to see him", "Glad they talked, but aware it would not change what people were saying"], "answer": 3, "explanation": "Iverson says he was glad to have the conversation with Barkley and Ewing, but it did not change how everyone was talking about him."}, {"q": "Iverson said he was 'in awe' of the fifty greatest players. What does 'in awe' mean?", "choices": ["Amazed and full of wonder", "Bored and tired", "Angry and jealous", "Scared and confused"], "answer": 0, "explanation": "Being 'in awe' means being amazed. Iverson was amazed to see the greatest collection of basketball talent ever gathered in one place."}, {"q": "The chapter says Iverson had to 'withdraw' from the dunk contest. What does 'withdraw' mean?", "choices": ["Win easily", "Sign up late", "Practice harder", "Drop out"], "answer": 3, "explanation": "To 'withdraw' means to drop out or pull out. Iverson had to drop out of the dunk contest because of his shoulder injury."}, {"q": "Iverson said he was the only player in the top ten in scoring who did not:", "choices": ["win Rookie of the Year", "play in the rookie game", "make the All-Star team", "have a shoe deal"], "answer": 2, "explanation": "Iverson was averaging 23 points a game, but he was the only player in the top ten in scoring who was not picked for the All-Star team."}]}, {"id": "ch37-more-losses-and-tragedy", "num": "37", "part": "Part V — From the Draft to Rookie of the Year", "title": "More Losses and Tragedy", "bank": [{"q": "What sneaker did Reebok release during Iverson's rookie season?", "choices": ["The Answer", "The Crossover", "The Rookie", "The Question"], "answer": 3, "explanation": "Reebok officially released The Question, Iverson's signature shoe, with the real Iverson front and center in the marketing campaign."}, {"q": "Who told Iverson, 'you got to talk to these guys,' about the reporters?", "choices": ["Coach Thompson", "Pat Croce", "Johnny Davis", "Que"], "answer": 1, "explanation": "After a win over the Clippers, Pat Croce came up to Iverson in the arena and convinced him to start talking to reporters again."}, {"q": "Whose idea did Iverson borrow when he decided to answer only basketball questions?", "choices": ["Coach Thompson's", "Pat Croce's", "His mom's", "Stack's"], "answer": 0, "explanation": "Iverson says he took a page from the Coach Thompson playbook and agreed to talk to the media, but only about basketball."}, {"q": "Who surprised Iverson with a visit after a game in Los Angeles?", "choices": ["Kobe Bryant", "Coach Thompson", "Biggie", "Michael Jordan"], "answer": 2, "explanation": "Iverson came out of the locker room and found Biggie waiting for him. Biggie said he came because he needed to get a pair of the Questions."}, {"q": "At which famous spot did Iverson meet Biggie for the first time?", "choices": ["Bethel High's gym", "Rucker Park in Harlem", "A club in Philadelphia", "Georgetown's gym"], "answer": 1, "explanation": "Before the draft, Iverson went to play at Rucker Park in Harlem, and that is where he first met Biggie and Lil' Cease."}, {"q": "Who woke Iverson up at the hotel to tell him the sad news about Biggie?", "choices": ["Tawanna", "Pat Croce", "His friend Ra", "His mom"], "answer": 3, "explanation": "Iverson's mom had come to DC for his homecoming game and was staying in his hotel. She woke him up to tell him that Biggie had died."}, {"q": "Why did Iverson stop his car and put it in park one day in the city?", "choices": ["He saw a kid walking down the street wearing his sneakers", "He saw Biggie crossing the street", "His car broke down after the game", "Fans surrounded his car asking for autographs"], "answer": 0, "explanation": "Iverson spotted a kid wearing the Questions on the street. He parked and watched the kid in his rearview mirror until he walked out of sight."}, {"q": "Which sentence best tells what this chapter is about?", "choices": ["Iverson won his first All-Star Game MVP", "Iverson learned how to braid hair from Que", "The Sixers kept losing while Iverson enjoyed amazing moments, until he lost his friend Biggie", "The Sixers made a late push for the playoffs"], "answer": 2, "explanation": "The chapter mixes more losses and criticism with dream-like moments, like his shoe coming out and his friendship with Biggie, and ends with the sad news of Biggie's death."}, {"q": "What advice did Iverson's mom give when he said he was scared that life was too perfect?", "choices": ["Save money in case things go wrong", "Stop going out with his friends", "Practice harder so nothing bad happens", "Enjoy the good times, because they are a blessing"], "answer": 3, "explanation": "His mom told him never to live in fear like that. She said things going well is a blessing and he should not expect something bad to happen."}, {"q": "How did Iverson most likely feel watching the kid in his shoes walk away?", "choices": ["Proud and amazed at how far he had come", "Annoyed that the kid did not notice him", "Worried that the shoes would sell out", "Embarrassed by all the attention"], "answer": 0, "explanation": "Iverson says it might as well have been him walking in those shoes. The moment reminded him how much his life had changed in just a few years."}, {"q": "How did Iverson feel when he learned that Biggie had died?", "choices": ["Calm and unbothered", "Shocked and heartbroken", "Relieved the season was almost over", "Confused about who Biggie was"], "answer": 1, "explanation": "Iverson got up 'shook.' He says the news was crushing because Biggie had been a friend and a model for making it out and building a better life."}, {"q": "Iverson 'vowed' to show the Cleveland crowd what he could do. What does 'vowed' mean?", "choices": ["Forgot", "Refused", "Promised", "Pretended"], "answer": 2, "explanation": "To vow means to make a serious promise. Iverson promised himself he would play well in Cleveland after the fans booed him."}, {"q": "Reporters asked Iverson about 'rumors.' What are rumors?", "choices": ["Stories people spread that may not be true", "Official team announcements", "Questions about basketball plays", "Newspaper headlines about wins"], "answer": 0, "explanation": "Rumors are stories that get passed around without proof. Reporters brought up rumors they had heard about Iverson instead of asking about basketball."}, {"q": "Why was the game in Washington special for Iverson?", "choices": ["It was his first NBA game ever", "The Sixers could win the championship there", "Biggie was performing at halftime", "It was the closest arena to his hometown, so it felt like a homecoming"], "answer": 3, "explanation": "The arena in Washington was the closest NBA arena to Newport News and Hampton, so Iverson finally got to play in front of everyone from home, including his mom."}, {"q": "In the 'Hypnotize' music video, what was Biggie wearing?", "choices": ["A Sixers jersey", "An NBA blazer", "The Questions, Iverson's sneakers", "A Georgetown hat"], "answer": 2, "explanation": "Iverson says that if you watch the video closely, you can see Biggie wearing the Questions, his signature Reebok shoes."}]}, {"id": "ch38-breaking-records", "num": "38", "part": "Part V — From the Draft to Rookie of the Year", "title": "Breaking Records", "bank": [{"q": "Which team did the Sixers play three days after Iverson got the sad news about his friend?", "choices": ["The Atlanta Hawks", "The Minnesota Timberwolves", "The Chicago Bulls", "The Milwaukee Bucks"], "answer": 2, "explanation": "Three days after that terrible night, the Sixers hosted the Chicago Bulls, and the arena was packed with more people than ever before."}, {"q": "Which player did Iverson beat with his famous crossover move in that game?", "choices": ["Michael Jordan", "Scottie Pippen", "Dennis Rodman", "Terrell Brandon"], "answer": 0, "explanation": "When the defenders switched, Michael Jordan ended up guarding Iverson. Iverson hit him with his crossover and made the jumper."}, {"q": "How many points did Iverson score against the Bulls on the night of the crossover?", "choices": ["19", "24", "31", "37, a career high at the time"], "answer": 3, "explanation": "Iverson scored 37 points that night, which was his career high at the time, but the Sixers still lost a close game."}, {"q": "In the game at Cleveland near the end of the season, how many points did Iverson score?", "choices": ["44", "50", "40", "37"], "answer": 1, "explanation": "Iverson finished with 50 points in Cleveland, making two free throws at the end to reach that number. He scored 39 of the 50 in the second half."}, {"q": "How many 40-point games in a row did Iverson have to end the season?", "choices": ["Five", "Three", "Four", "Eight"], "answer": 0, "explanation": "Iverson scored 40 or more points in five straight games, something no rookie had ever done before."}, {"q": "What is the main idea of this chapter?", "choices": ["The Sixers finally made the playoffs behind Iverson", "Iverson stopped playing hard because the season was lost", "Iverson put his pain aside and played record-breaking basketball, even though the team kept losing", "The Bulls tried to trade for Iverson at the end of the season"], "answer": 2, "explanation": "After all the criticism, losses, and sad news, Iverson pushed everything aside and put his game first, crossing over Jordan and scoring 40 or more in five straight games."}, {"q": "Why was Iverson still unhappy about his five-game scoring streak?", "choices": ["He was benched during the streak", "The Sixers lost all five of those games", "The record was given to Wilt instead", "Fans stopped coming to the games"], "answer": 1, "explanation": "All five of his 40-point games went in the loss column. Iverson said he did not want his legacy to include the fact that his team lost every one."}, {"q": "What happened right after Iverson's jumper over Jordan went in?", "choices": ["Phil Jackson called a timeout", "The game ended and the Sixers won", "Coach Davis took him out for a rest", "The crowd erupted, and he hurried back to play defense"], "answer": 3, "explanation": "The crowd went wild when the shot fell, but Iverson only had a second to enjoy it because he had to get back on defense—and soon he picked up his fourth foul."}, {"q": "Why did Iverson play 48 minutes in so many games near the end of the season?", "choices": ["So many teammates were injured that the team dressed only nine players for some games", "Coach Davis was punishing him for missing practice", "The NBA required rookies to play full games", "He wanted to avoid sitting near reporters on the bench"], "answer": 0, "explanation": "The team was hit with so many injuries that only nine players dressed for a few games, so Coach Davis had little choice but to leave Iverson in."}, {"q": "How did Coach Davis help Iverson keep the streak alive against the Bullets?", "choices": ["He put the injured players back in the game", "He told Iverson to shoot only free throws", "He called timeouts near the end to run plays for Iverson", "He asked the referees for extra time"], "answer": 2, "explanation": "With less than a minute left and Iverson stuck on 37 points, Coach Davis called a couple of timeouts to set up plays, and Iverson made a three to reach 40."}, {"q": "How did the Cleveland fans act as Iverson kept scoring in his 50-point game?", "choices": ["They booed louder than ever", "They left the arena at halftime", "They chanted for their own team the whole game", "They stopped booing and stood up to cheer for him"], "answer": 3, "explanation": "The boos faded as Iverson kept scoring and getting up after being knocked down. By the end, the crowd stood for him as he left the court."}, {"q": "How did Iverson feel when the scoring streak finally ended?", "choices": ["Angry at Coach Davis", "Glad, because winning mattered more to him than records", "Jealous of Stack", "Ready to quit basketball"], "answer": 1, "explanation": "Iverson says the streak ended the next game 'and I was glad.' He had never lost like that in his life and never wanted to again."}, {"q": "The Bulls game was a 'sellout.' What does that mean?", "choices": ["The game was moved to a bigger city", "The tickets were free that night", "The team sold its best players", "Every ticket to the game was sold"], "answer": 3, "explanation": "A sellout means all the tickets were sold. That night they fit more people into the arena than ever before."}, {"q": "The crowd 'erupted' after the crossover. What does 'erupted' mean?", "choices": ["Burst out with loud cheers all at once", "Left their seats quietly", "Fell completely silent", "Started booing softly"], "answer": 0, "explanation": "To erupt means to burst out suddenly, like a volcano. The crowd exploded with cheers when Iverson's jumper over Jordan went in."}, {"q": "What happened the day after the season ended?", "choices": ["Iverson was traded to Cleveland", "The team fired Coach Johnny Davis and Brad Greenberg", "The Sixers made the playoffs", "Iverson signed a new deal with Reebok"], "answer": 1, "explanation": "The Sixers finished with 22 wins and 60 losses, and a day after the season ended, Pat fired both Johnny Davis and Brad Greenberg."}]}, {"id": "ch39-back-to-the-courtroom", "num": "39", "part": "Part V — From the Draft to Rookie of the Year", "title": "Back to the Courtroom", "bank": [{"q": "What award did Iverson win in this chapter?", "choices": ["Most Valuable Player", "All-Star Game MVP", "Rookie of the Year", "Scoring Champion"], "answer": 2, "explanation": "The 76ers tracked Iverson down to tell him he was going to be named Rookie of the Year, the first Sixer ever to win it."}, {"q": "Who was Bill Bonsiewicz?", "choices": ["A 76ers public relations man who was trying to find Iverson.", "The lawyer who defended Iverson's dad.", "An FBI agent looking for Iverson.", "A reporter who criticized Iverson's style."], "answer": 0, "explanation": "Bill Bonsiewicz was the great PR guy from the Sixers who searched for Iverson to tell him about the award and the press conference."}, {"q": "Who did Iverson thank first at the press conference?", "choices": ["Pat Croce", "His mother", "His teammates", "Coach Thompson"], "answer": 1, "explanation": "Iverson says he thanked his mother first, of course, for her belief in him."}, {"q": "What did Iverson wear at the Rookie of the Year press conference?", "choices": ["A gray suit and tie", "His 76ers game jersey", "A do-rag and a Georgetown jacket", "A white skullcap and a white warm-up suit"], "answer": 3, "explanation": "Iverson and his friends decided to wear the all-white skullcaps and matching white warm-up suits from Reebok instead of a suit."}, {"q": "What did Iverson wear to his dad's trial?", "choices": ["A gray suit", "A white warm-up suit", "A skullcap and jeans", "His team jacket"], "answer": 0, "explanation": "For criminal court Iverson chose a gray suit, with no do-rag and no cornrows."}, {"q": "What happened the day after the press conference?", "choices": ["Iverson flew to Cleveland for All-Star Weekend.", "The Sixers started the playoffs.", "Iverson's dad went on trial in Hampton.", "Iverson signed a new contract."], "answer": 2, "explanation": "His dad's trial was scheduled for the day after the press conference, so Iverson flew back to Virginia to be there."}, {"q": "Why was Iverson ignoring his beeper when the Sixers were calling?", "choices": ["The beeper was broken.", "He was trying to get away and rest after a hard year.", "He was angry at the team for benching him.", "He had lost the beeper at the arena."], "answer": 1, "explanation": "Iverson says that after the year he had, he was trying to escape for a minute, so he was not paying attention to his beeper."}, {"q": "Why did Iverson's dad say he was living in the house where drugs were found?", "choices": ["He was paroled to that address and was not allowed to move.", "He owned the house and rented rooms out.", "He was only visiting for one night.", "He was hiding from the police there."], "answer": 0, "explanation": "His dad's defense was that parole required him to live at that address, and his parole officer said he had even begged to move away because of the drugs."}, {"q": "What did Iverson do with his trophy at the press conference?", "choices": ["He left it with the team's owner.", "He held it up for photographers.", "He sent it home to Virginia.", "He gave it to his mom."], "answer": 3, "explanation": "In front of everyone, Iverson gave the trophy to his mom as thanks and as a statement about his loyalty to family."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first playoff series with the Sixers.", "Iverson's summer vacation in Virginia.", "Iverson winning Rookie of the Year and then supporting his dad at his trial.", "Iverson's problems with Coach Brown at practice."], "answer": 2, "explanation": "The chapter covers the Rookie of the Year announcement and press conference, followed the next day by his dad's trial at the Hampton courthouse."}, {"q": "What did winning the award mean to Iverson?", "choices": ["That he needed to change his style to keep winning.", "That he belonged in the NBA without changing who he was.", "That reporters would finally stop criticizing him.", "That he was now the highest-paid player in the league."], "answer": 1, "explanation": "Staring at the trophy, Iverson felt it said he belonged and was accepted the way he was, since he had never changed how he dressed or who he spent time with."}, {"q": "How did Iverson most likely feel walking back into the Hampton courthouse?", "choices": ["Excited to see old friends from home.", "Bored, because trials take a long time.", "Calm, because this trial
