t": "Part II — My Trials On and Off the Court", "title": "The Bowling Alley", "bank": [{"q": "What is this chapter mostly about?", "choices": ["Allen's first football championship at Bethel.", "A summer basketball trip to Indianapolis.", "A fight at a bowling alley that led to Allen being charged with a crime.", "Allen's family moving to a new apartment."], "answer": 2, "explanation": "The chapter tells about the night of February 13, 1993, when a fight broke out at the bowling alley, and how Allen ended up arrested and charged even though he says he did nothing."}, {"q": "Where did Allen and his friends go on the night of February 13, 1993?", "choices": ["Circle Lanes Bowling Alley in Hampton.", "A hotel in Newport News.", "The Coliseum in downtown Hampton.", "Anderson Field House at Fort Eustis."], "answer": 0, "explanation": "Allen went with a group of friends to the Circle Lanes Bowling Alley, which was in Hampton."}, {"q": "Why wasn't Mike Jackson with Allen at the bowling alley?", "choices": ["He had basketball practice with Coach Bailey.", "He never liked bowling.", "He was visiting Tawanna.", "He was out of town at an AAU tournament."], "answer": 1, "explanation": "Mike Jackson was almost always with Allen, but he just was not a bowler. The book says he still blames himself for not being there."}, {"q": "What did Allen's friend Michael Simmons have with him at the bowling alley?", "choices": ["A boom box.", "A basketball.", "A pager.", "A video camera."], "answer": 3, "explanation": "Michael Simmons brought a camcorder that night and filmed much of what happened. Allen says the video never shows him doing anything."}, {"q": "Which three friends with Allen that night became important to the case?", "choices": ["Mo, Coach Bailey, and Tony Rutland.", "Ra, Arnie, and Marlon.", "Michael Simmons, Melvin Stephens, and Samuel Wynn.", "Mike Jackson, Aaron Brooks, and Joe Smith."], "answer": 2, "explanation": "Allen names Michael Simmons, Melvin Stephens, and Samuel Wynn as the three important friends there that night. All three were later charged along with Allen."}, {"q": "What did Allen's friends do when the fight broke out?", "choices": ["They grabbed Allen and got him out of the bowling alley.", "They called the police right away.", "They ran to Mo's house for help.", "They kept bowling in their two lanes."], "answer": 0, "explanation": "Allen says his friends came over, defended him, and took him right out of there. Then they got him into a car and drove away."}, {"q": "Why did Mo get worried when Allen called and told him about the fight?", "choices": ["He thought Allen was badly hurt.", "He knew Coach Bailey would bench Allen.", "He thought Allen would miss the playoffs.", "The fight was with white men, and Mo knew the race problems around that bowling alley."], "answer": 3, "explanation": "Mo remembered that in his day, people would not even go to that bowling alley because of race issues. When he heard the fight was with white men, he got concerned right away — and he was right."}, {"q": "Why did Allen agree to go to the police station before the big Hampton game?", "choices": ["He wanted to report the men who started the fight.", "The police said they needed pictures, and he would be arrested if he refused to come.", "Coach Bailey drove him there to apologize.", "He wanted to watch the video with the officers."], "answer": 1, "explanation": "The police said they just needed to take some pictures and warned that if he did not come on his own, they would arrest him — even at the Coliseum during the game. Allen refused to miss the game, so he went."}, {"q": "Who scored 18 points in the first half against Hampton when defenders double-teamed Allen?", "choices": ["Tony Rutland.", "Joe Smith.", "Aaron Brooks.", "Lovett Gaither."], "answer": 0, "explanation": "When Hampton put two defenders on Allen, he passed the ball to Tony Rutland, who scored 18 points in the first half and kept Bethel in the game."}, {"q": "Why did Coach Bailey tell Allen to go have some regular kid fun?", "choices": ["Allen had skipped practice that week.", "Coach Bailey was going out of town.", "He could feel how much pressure Allen was under.", "The team had a week off from games."], "answer": 2, "explanation": "Coach Bailey cared about Allen and could feel all the pressure on him, so after the Friday game he told Allen to go do some regular kid stuff and have some fun."}, {"q": "How did Allen feel about basketball games compared to the rest of his life?", "choices": ["Games made him more nervous than anything else.", "Games were the calm place where he could focus and feel in control.", "He cared more about football than basketball.", "He wished the crowds at games were smaller."], "answer": 1, "explanation": "Allen says the court was 'the quietest place' he knew. Other parts of his life felt out of control, but the game was something he could control."}, {"q": "How did Mike Jackson most likely feel about missing the bowling alley that night?", "choices": ["Relieved that he stayed away.", "Angry at Allen for going without him.", "Glad he got a night to himself.", "He blamed himself for not being there."], "answer": 3, "explanation": "The book says Mike Jackson still blames himself for not being there with Allen that night."}, {"q": "How did Allen react when he heard the charge of 'maiming by mob'?", "choices": ["He was confused — he thought it was just a fight, not a mob.", "He was proud that people were talking about him.", "He was certain he would go to prison.", "He was happy because the charge was small."], "answer": 0, "explanation": "Allen's reaction was, 'Where was the mob? It was a fight.' He could not believe such a serious charge came from that night."}, {"q": "The worker said his requests 'were ignored.' What does 'ignored' mean?", "choices": ["followed right away", "paid no attention to", "written down", "shouted back"], "answer": 1, "explanation": "The worker claimed he told the group to be quiet and stop standing on chairs, but they paid no attention to what he asked. That is what 'ignored' means."}, {"q": "The police said Allen could come in 'voluntarily.' What does 'voluntarily' mean?", "choices": ["with a lawyer", "in secret", "after the game", "by his own choice"], "answer": 3, "explanation": "Doing something voluntarily means doing it by your own choice. The police said if Allen did not come on his own, they would have to arrest him."}]}, {"id": "ch13-bethel-continues", "num": "13", "part": "Part II — My Trials On and Off the Court", "title": "Bethel Continues", "bank": [{"q": "What is this chapter mostly about?", "choices": ["Allen's trial in the courtroom.", "Bethel winning the state basketball championship.", "Allen's first AAU tournament.", "Football season at Bethel High."], "answer": 1, "explanation": "The chapter follows Bethel through the playoffs, game by game, all the way to winning the state championship — the school's second state title with Allen."}, {"q": "Whose Virginia scoring record did Allen tie with 896 points in one season?", "choices": ["Joe Smith's.", "Tony Rutland's.", "Damion Keyes's.", "Moses Malone's."], "answer": 3, "explanation": "The record for points in a single season was held by Moses Malone. Allen needed just one more basket or free throw to make the record his."}, {"q": "How many points did Joe Smith score for Maury against Bethel?", "choices": ["19", "30", "37", "42"], "answer": 2, "explanation": "Joe Smith scored 37 of Maury's 50 points. Bethel had no answer for him until late in the game."}, {"q": "Who scored 9 points in overtime to help Bethel beat Woodbridge?", "choices": ["Lovett Gaither.", "Tony Rutland.", "Joe Smith.", "Aaron Brooks."], "answer": 0, "explanation": "After Allen fouled out, the young big man Lovett Gaither came through and scored 9 of Bethel's 13 overtime points in the 72-65 win."}, {"q": "What was the final score of Bethel's game against Maury?", "choices": ["72-65", "52-50", "69-67", "59-50"], "answer": 1, "explanation": "Bethel won the defensive battle against Maury 52-50 after holding Joe Smith without a meaningful score in the final minutes."}, {"q": "How did Allen finish off the state final against John Marshall?", "choices": ["He grabbed the ball from a rebounder and slammed a two-hand dunk.", "He made two free throws at the buzzer.", "He passed to Tony Rutland for the last shot.", "He fouled out before the game ended."], "answer": 0, "explanation": "After Tony missed a free throw, Allen snatched the ball from the rebounder and two-hand dunked it to let everyone know the game was over."}, {"q": "What did Allen show by guarding big men like Joe Smith and Damion Keyes?", "choices": ["He wanted to play center the next season.", "He was taller than people thought.", "He would do anything to keep his team from losing.", "He was tired of scoring points."], "answer": 2, "explanation": "Even though Allen was only six feet tall, he asked to guard the other team's biggest stars. He says the one thing he refused to do was let his team lose."}, {"q": "What surprising fact does Allen share at the end of the chapter?", "choices": ["Coach Bailey was leaving Bethel.", "Tony Rutland was hurt in the final.", "Bethel had to give back the trophy.", "The state final was the last high school game he ever played."], "answer": 3, "explanation": "Allen says he did not know it at the time, but the championship game turned out to be his last high school game ever."}, {"q": "What happened after Allen fouled out in overtime against Woodbridge?", "choices": ["The game was stopped early.", "He stood next to Coach Bailey, cheering while his teammates finished the win.", "He went to the locker room by himself.", "Woodbridge pulled ahead and won the game."], "answer": 1, "explanation": "From the bench, Allen and Coach Bailey barked out orders and encouragement together while the rest of the team closed out the 72-65 win."}, {"q": "What did Allen do right after John Marshall tied the game at 69?", "choices": ["He stole the ball and made a layup to take the lead.", "He called a timeout to calm the team.", "He missed a free throw.", "He passed to Lovett Gaither for a dunk."], "answer": 0, "explanation": "Allen saw the other team's guard was uncomfortable, stole the ball off the dribble, and raced in for a layup that gave Bethel a two-point lead."}, {"q": "Why did Allen ask Coach Bailey to let him guard Joe Smith?", "choices": ["Smith had been trash-talking him all game.", "Coach Bailey was about to bench him.", "Smith was his old AAU teammate.", "Nobody on Bethel could stop Smith from scoring."], "answer": 3, "explanation": "Maury kept going to Smith again and again, and Bethel had no answer for him. So Allen asked to guard him, and the team kept Smith from scoring in the final minutes."}, {"q": "How did Allen most likely feel watching his teammates win the overtime against Woodbridge?", "choices": ["Jealous that he was not the one scoring.", "Bored sitting on the bench.", "Proud of his teammates and close to Coach Bailey.", "Angry at the referees."], "answer": 2, "explanation": "Allen says that watching from the bench, he felt pride and kinship with the players on the floor and with Coach Bailey."}, {"q": "How did Allen feel when the final buzzer sounded in the championship game?", "choices": ["Full of joy, with no worries on his mind.", "Nervous about his trial.", "Upset about his shooting.", "Sad that the season was over."], "answer": 0, "explanation": "Allen stood tall, chest out, smiling. He says there was no thought of the bowling alley or a trial — just the excitement of winning."}, {"q": "The book says everyone 'erupted' from the bench. What does 'erupted' mean here?", "choices": ["fell down", "burst out with excitement", "walked away slowly", "argued loudly"], "answer": 1, "explanation": "When the buzzer sounded, the whole bench jumped up and burst out onto the floor with excitement, jumping around to celebrate the title."}, {"q": "Allen says he and Tony started 'hounding' the other team. What does 'hounding' mean here?", "choices": ["barking at them", "fouling them on purpose", "ignoring them", "chasing and pressuring them nonstop"], "answer": 3, "explanation": "When Allen and Tony 'hounded' opponents, they turned up their defense — chasing the ball and pressuring the other team into mistakes and steals."}]}, {"id": "ch14-the-trial", "num": "14", "part": "Part II — My Trials On and Off the Court", "title": "The Trial", "bank": [{"q": "What is this chapter mostly about?", "choices": ["Allen's senior football season.", "Allen's first visit to Georgetown.", "The state championship game.", "Allen's trial and the guilty verdict."], "answer": 3, "explanation": "The chapter covers the court hearings, the trial in front of Judge Overton, and the moment Allen was found guilty on all three charges."}, {"q": "What was the name of the judge who decided Allen's trial?", "choices": ["Judge Kelly.", "Judge Overton.", "Judge Forrest.", "Judge Gibbons."], "answer": 1, "explanation": "Judge Overton heard the case. There was no jury, so he alone decided the verdict."}, {"q": "Who testified that he pulled Allen out of the bowling alley when the fight started?", "choices": ["Dwayne Campbell.", "Mike Jackson.", "Michael Simmons.", "Boo Williams."], "answer": 0, "explanation": "Dwayne Campbell testified that he was one of the friends who grabbed Allen and got him away, so Allen was not even there for most of the fight."}, {"q": "On May 5, what did the judge decide about Allen's case?", "choices": ["Allen was not guilty.", "The trial would move to another city.", "Allen would be tried as an adult.", "Allen could play football again."], "answer": 2, "explanation": "On May 5, the judge ruled that Allen would be tried as an adult instead of as a juvenile, and set the trial for July 9."}, {"q": "Which school did Mike Jackson leave for in August?", "choices": ["Marquette.", "Hampton University.", "University of Maryland.", "Virginia Military Institute."], "answer": 3, "explanation": "Mike Jackson went to Virginia Military Institute, where he would run track and maybe play football. Allen says something felt missing after he left."}, {"q": "What rule did the judge give Allen while he waited for sentencing?", "choices": ["He had to be home by 8 p.m. every night.", "He had to stay in jail.", "He could not talk to his friends.", "He had to leave Virginia."], "answer": 0, "explanation": "The judge let Allen stay out of jail until sentencing but gave him an 8 p.m. curfew, which meant he could not travel for tournaments."}, {"q": "How did people in the community react to Allen's case?", "choices": ["Everyone in town supported him.", "People were split — some wrote angry letters, while the mayor, ministers, and a group called SWIS stood up for him.", "Nobody paid much attention to it.", "Only his teammates cared about it."], "answer": 1, "explanation": "The newspaper printed harsh letters and columns about Allen, but he also had supporters: Mayor Jessie Rattley, two ministers, and the group SWIS, which raised money for the legal defenses."}, {"q": "Why did Allen still play in the Nike Tournament during the week of his trial?", "choices": ["His lawyer said it would help the case.", "The judge ordered him to go.", "He wanted to keep doing something positive with his life.", "Coach Bailey made him go."], "answer": 2, "explanation": "Allen felt that sticking with sports was doing something positive with his life, even though some people acted like he was doing something wrong by playing."}, {"q": "What did Allen do the day after his Friday court date?", "choices": ["He flew back to Indianapolis and played in the televised All-Star Game.", "He went straight to his sentencing.", "He started football practice at Bethel.", "He visited a prep school in Maine."], "answer": 0, "explanation": "On Saturday morning Allen rushed to the airport, returned to the Nike camp, and played in the All-Star Game shown on ESPN."}, {"q": "Why couldn't Allen defend his AAU national title?", "choices": ["His team did not qualify that year.", "He was injured over the summer.", "Boo Williams removed him from the team.", "His 8 p.m. curfew meant he could not travel to the tournament."], "answer": 3, "explanation": "The curfew the judge set after the verdict made it impossible for Allen to travel to the AAU national tournament the next week."}, {"q": "Why did Tawanna get in trouble at school?", "choices": ["She skipped class to watch the trial.", "She argued with a teacher who said unkind things about Allen.", "She failed an important test.", "She left school early without permission."], "answer": 1, "explanation": "One of Tawanna's teachers said something about Allen and his situation, and Tawanna stood up for him and got into it with the teacher. It was probably the only time she ever got in trouble at school."}, {"q": "How did Allen's mom most likely feel when the judge said the word 'guilty'?", "choices": ["Relieved that the trial was over.", "Surprised but calm.", "Heartbroken.", "Proud of the lawyer."], "answer": 2, "explanation": "When Allen turned around after the verdict, he saw that his mom was 'broken' — the guilty verdict crushed her."}, {"q": "How did the word 'guilty' make Allen feel?", "choices": ["Like the judge had decided he did not deserve a future.", "Sure that he would win on appeal.", "Like it was no big deal.", "Glad the trial was finally finished."], "answer": 0, "explanation": "Allen says the word felt heavier than just a verdict — it was like being told he was not worth anything and did not deserve a future."}, {"q": "Juvenile records were supposed to be 'sealed.' What does 'sealed' mean here?", "choices": ["destroyed forever", "kept private", "printed in the paper", "sent to the judge"], "answer": 1, "explanation": "Sealed records are kept private from the public. Allen was upset because the newspaper printed his name anyway, even though he was a juvenile."}, {"q": "The judge gave Allen a 'curfew.' What is a curfew?", "choices": ["a fine he had to pay", "a warning from the police", "community service work", "a set time he had to be home by"], "answer": 3, "explanation": "A curfew is a rule about when you must be home. Allen's curfew was 8 p.m., which kept him from traveling to play basketball."}]}, {"id": "ch15-sentencing-day", "num": "15", "part": "Part II — My Trials On and Off the Court", "title": "Sentencing Day", "bank": [{"q": "What was September 8, 1993, supposed to be for Allen?", "choices": ["His first day at a new job", "The day of the state basketball championship", "His second day of senior year of high school", "His eighteenth birthday"], "answer": 2, "explanation": "Allen says that day was supposed to be his second day of senior year, but instead it became his sentencing day."}, {"q": "What did Allen wear to court on sentencing day?", "choices": ["A Bethel basketball jacket", "A gray suit", "A white shirt and jeans", "His football jersey"], "answer": 1, "explanation": "Allen put on the gray suit, checked his collar and tie in the mirror, and headed to court."}, {"q": "Which teacher told the judge Allen was \"the kind of student you like to teach\"?", "choices": ["Ms. Abernathy", "Mrs. Bailey", "Sue Lambiotte", "Coach Koz"], "answer": 0, "explanation": "Ms. Abernathy, one of his teachers at Bethel, said this to the judge to show Allen was not a bad kid."}, {"q": "How many years in total did the judge give Allen?", "choices": ["Five years", "Ten years", "Twenty years", "Fifteen years"], "answer": 3, "explanation": "Judge Overton gave five years for each count, which added up to fifteen years, and the courtroom gasped."}, {"q": "Where did Mr. Kelly say Allen could go instead of jail?", "choices": ["A prep school in Maine", "A college in Virginia", "A basketball camp in Georgetown", "A work program in Newport News"], "answer": 0, "explanation": "Mr. Kelly told the judge Allen could attend a prep school in Maine that had strict rules and would take care of his education."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's last football game at Bethel", "The day a judge sentenced Allen to jail", "Allen's first day at the City Farm", "How Allen's lawyers won his appeal"], "answer": 1, "explanation": "The whole chapter tells the story of sentencing day, from getting dressed that morning to being driven away in the van."}, {"q": "Why did Allen practice what he would say in front of the mirror and his family?", "choices": ["He was giving a speech at school the next day", "He was being interviewed on television", "He wanted to be ready to speak in court", "He was trying out for the school play"], "answer": 2, "explanation": "The night before sentencing, Allen practiced his statement because he knew he would have a chance to speak to the judge."}, {"q": "What happened right after the judge said no to the bond?", "choices": ["The judge changed the sentence to probation", "Allen's teachers spoke to the court again", "Allen walked out the front door with his family", "Officers put handcuffs on Allen"], "answer": 3, "explanation": "When the judge refused the bond, officers came over, quietly told Allen to put his hands behind his back, and handcuffed him."}, {"q": "What did some supporters do when the van drove Allen away?", "choices": ["They ran after the van, waving", "They blocked the road with signs", "They followed the van in their cars", "They went inside to talk to the judge"], "answer": 0, "explanation": "Allen looked out the back window and saw a few people run after the van, waving, until it drove too fast for them."}, {"q": "Why did Mr. Kelly ask for a bond while Allen appealed his case?", "choices": ["The prosecutor suggested the idea in court", "Stephens, another defendant, had already been given one", "The judge offered it to every defendant", "Allen's mom had raised the bond money that morning"], "answer": 1, "explanation": "Stephens had asked for and received the chance to stay out on bond while waiting for his appeal, so Mr. Kelly asked for the same thing for Allen."}, {"q": "How did Allen's mom react when he was handcuffed?", "choices": ["She argued with the officers", "She stayed calm and quiet", "She cried her heart out", "She left the courtroom before it happened"], "answer": 2, "explanation": "Allen says that while he showed no smile and no tears, his mom cried her heart out."}, {"q": "How did Allen most likely feel the night before his sentencing?", "choices": ["Bored, because nothing important was happening", "Worried, because the judge had so much power over his future", "Excited, because he was sure he would go free", "Angry at his friends for visiting him"], "answer": 1, "explanation": "That night it hit Allen how much power the judge had, since the judge could give him probation or lock him up for years past his chance at college and the NBA."}, {"q": "When Coach Bailey said \"We lost a friend,\" what did he mean?", "choices": ["The team had lost an important game", "A player had transferred to another school", "Allen mattered to them as a person, not just as an athlete", "The coaches were quitting their jobs at Bethel"], "answer": 2, "explanation": "Coach Bailey said they did not just lose a great athlete or a student that day; they lost a friend, showing how much Allen meant to him as a person."}, {"q": "Coach Koz said he was \"appalled\" by the decision. What does appalled mean?", "choices": ["Shocked and upset", "Pleased and relieved", "Confused and sleepy", "Calm and patient"], "answer": 0, "explanation": "Coach Koz was shocked and upset that a teenager with a bright future had been locked up, so appalled means shocked and upset."}, {"q": "Allen walked past \"supporters\" from SWIS outside the courthouse. What are supporters?", "choices": ["Reporters looking for a story", "Guards who watch the courthouse", "Lawyers who work on a case", "People who are on your side"], "answer": 3, "explanation": "The people from SWIS came to the courthouse because they were on Allen's side and wanted to help him."}]}, {"id": "ch16-city-farm", "num": "16", "part": "Part III — From the Jungle to Georgetown", "title": "City Farm", "bank": [{"q": "Where was Allen sent to serve his sentence?", "choices": ["A prison in Maine", "The Hampton city jail", "The Newport News City Farm", "A prep school in Georgetown"], "answer": 2, "explanation": "Allen was sent to the Newport News City Farm, a minimum-security jail he had already heard about from people he knew."}, {"q": "What job was Allen given at the City Farm?", "choices": ["Working in the kitchen bakery", "Picking crops in the fields", "Cleaning the visiting area", "Working outside at a halfway house"], "answer": 0, "explanation": "While many inmates did farm work outside, Allen's job was inside, in the kitchen bakery."}, {"q": "What time did Allen have to wake up for his job?", "choices": ["Six in the morning", "Noon", "Eight in the morning", "Four in the morning"], "answer": 3, "explanation": "Allen had to be up at four in the morning every day for his bakery job."}, {"q": "Who told Allen, \"Never question God\"?", "choices": ["His mom", "Nana, his great-grandmother", "Tawanna", "Coach Bailey"], "answer": 1, "explanation": "When Allen asked why God would let this happen if he was not guilty, Nana set him straight by telling him never to question God."}, {"q": "What did Mike Jackson do almost every week while Allen was in jail?", "choices": ["He wrote Allen a letter", "He visited the City Farm", "He sent Allen money for the bakery", "He called the judge to complain"], "answer": 0, "explanation": "Mike Jackson, who was away at Virginia Military Institute, sent Allen a letter almost every week, and hearing from him meant the world to Allen."}, {"q": "What did Allen do in the afternoons after his bakery work was done?", "choices": ["He went to classes at the jail school", "He worked a second job in the fields", "He got some sleep and played basketball", "He met with news reporters"], "answer": 2, "explanation": "The good thing about the bakery was finishing in the morning, so Allen spent his afternoons sleeping and playing basketball at the one bent-up hoop."}, {"q": "Why did colleges stop sending Allen recruiting mail?", "choices": ["He told them he did not want to play college basketball", "Their interest ended when the judge locked him up", "The jail refused to deliver any mail to him", "He had already signed with Georgetown"], "answer": 1, "explanation": "Every university had been recruiting Allen, but when the judge sent him to jail, the college interest ended and the mail stopped."}, {"q": "What happened after an older inmate knocked the cigarette out of Allen's mouth?", "choices": ["Allen never smoked a cigarette again", "Allen got into a fight with him", "Allen reported him to the guards", "Allen started smoking in secret"], "answer": 0, "explanation": "The older man told Allen not to give up on his future, and Allen says he did not smoke any more cigarettes after that."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's championship season at Bethel", "Allen's first meeting with Coach Thompson", "How Allen escaped from the City Farm", "How Allen got through his time in jail and kept his dream alive"], "answer": 3, "explanation": "The chapter describes Allen's daily life at the City Farm, the people who supported him, and how he kept working toward college and the NBA."}, {"q": "In the short \"Freedom\" section before the chapter, what does freedom mean to Allen?", "choices": ["Having enough money to buy anything", "Simple things like basketball, family, friends, and music", "Living far away from Virginia", "Never having to go to school again"], "answer": 1, "explanation": "Allen describes freedom as playing basketball, being with Tawanna, his friends, and his family, and listening to his music."}, {"q": "Which famous TV newsman came to interview Allen at the City Farm?", "choices": ["A sports announcer from ESPN", "A local radio host from Hampton", "Tom Brokaw from NBC News", "A writer from the school newspaper"], "answer": 2, "explanation": "Tom Brokaw of NBC News flew in on his private jet and spent the morning interviewing Allen, his mom, and others at the City Farm."}, {"q": "How did Allen feel after his friend told him, \"You doing the time\"?", "choices": ["Furious at his friend for giving up on him", "Scared that his sentence would get longer", "Jealous that his friend was free", "Calmer, because he could stop hoping every day for release"], "answer": 3, "explanation": "People kept promising tomorrow was the day he would get out; once his friend told him the truth, Allen says it became easier and he could relax."}, {"q": "How did Allen feel about not being able to see Tawanna alone?", "choices": ["It hurt him", "He did not mind at all", "He felt relieved", "He forgot about her quickly"], "answer": 0, "explanation": "Allen lists the things jail took away and says not being able to see Tawanna alone was the one that hurt."}, {"q": "Allen says his life at the Farm was \"a routine.\" What is a routine?", "choices": ["A special reward for good behavior", "Doing the same things in the same order every day", "A type of jail cell", "A plan for escaping"], "answer": 1, "explanation": "Allen's days followed the same quiet pattern of waking early, working in the bakery, and passing the time, which is what a routine means."}, {"q": "Allen learned he had to be \"patient\" while waiting to get out. What does patient mean?", "choices": ["Angry about waiting", "Sick and in the hospital", "Able to wait calmly without giving up", "Too tired to do anything"], "answer": 2, "explanation": "Nana's advice and his friend's honesty taught Allen to wait calmly for his chance instead of getting upset every day, which is what being patient means."}]}, {"id": "ch17-finding-georgetown", "num": "17", "part": "Part III — From the Jungle to Georgetown", "title": "Finding Georgetown", "bank": [{"q": "Who first suggested that Allen think about Georgetown?", "choices": ["Coach Bailey", "His mom", "Boo Williams", "Mike Jackson"], "answer": 1, "explanation": "One day during a visit, Allen's mom said it: what about Georgetown?"}, {"q": "Which coach did Allen's mom say could coach him at Georgetown?", "choices": ["Coach Koz", "Butch Harper", "John Thompson", "Boo Williams"], "answer": 2, "explanation": "His mom said John Thompson, the Georgetown coach, could be his coach."}, {"q": "Why did Allen first say no to the Georgetown idea?", "choices": ["He thought it was a school for big men, not guards like him", "It was too close to home", "He wanted to play football instead", "The school did not have a basketball team"], "answer": 0, "explanation": "Allen thought of Georgetown as a big man's school where centers like Mourning, Mutombo, and Ewing had played, so he did not think it fit a six-foot guard."}, {"q": "Who called Coach Thompson to talk about Allen?", "choices": ["Allen's lawyer", "Jamil Blackmon", "Allen himself", "Boo Williams"], "answer": 3, "explanation": "Boo Williams already knew Coach Thompson from coaching Alonzo Mourning in AAU ball, so he made the phone call."}, {"q": "Where did the group meet with Coach Thompson?", "choices": ["At the City Farm", "At McDonough Gymnasium on the Georgetown campus", "At Bethel High School", "At a restaurant in Newport News"], "answer": 1, "explanation": "The group drove to Washington, DC, and met Coach Thompson at McDonough Gymnasium, where his office and the practice court were."}, {"q": "Which player does the chapter say went to Georgetown?", "choices": ["Alonzo Mourning", "Michael Jordan", "Mike Jackson", "Allen's teammate Clay"], "answer": 0, "explanation": "Allen names Alonzo Mourning, Dikembe Mutombo, and Patrick Ewing as big men who played at Georgetown."}, {"q": "What did Allen's mom do after the meeting started badly?", "choices": ["She drove everyone back to Virginia", "She yelled at Coach Thompson", "She asked to speak with Coach Thompson alone", "She called Allen at the jail for advice"], "answer": 2, "explanation": "When the meeting got off to a terrible start, Allen's mom stopped it and asked to talk with Coach Thompson by herself."}, {"q": "Why did Coach Thompson almost kick people out of the meeting?", "choices": ["They arrived very late to his office", "Someone questioned whether he could coach a guard", "They asked him for money", "They brought too many people with them"], "answer": 1, "explanation": "Somebody in the room questioned whether Coach Thompson could coach a guard, and that made him angry."}, {"q": "What did Coach Thompson say he would do after the meeting?", "choices": ["Give Allen a scholarship right away", "Visit Allen in jail the next week", "Ask the judge to free Allen", "Send his academic advisor to Virginia to check Allen's schoolwork"], "answer": 3, "explanation": "Coach Thompson agreed to help but made no promises; his next step was sending his athletic department academic advisor to look at Allen's work."}, {"q": "What is this chapter mostly about?", "choices": ["How Allen's mom convinced Coach Thompson to give him a chance", "Allen's first basketball game at Georgetown", "How Allen was released from the City Farm", "Coach Thompson's career as a player"], "answer": 0, "explanation": "The chapter tells how Allen's mom pushed the Georgetown idea, met with Coach Thompson, and moved him to consider helping her son."}, {"q": "Why did the private talk change Coach Thompson's mind?", "choices": ["Allen's mom offered to pay for everything", "He learned Allen had the best grades in his class", "He saw how much Allen's mom loved her son and feared for his life", "He needed a new guard for the next season"], "answer": 2, "explanation": "Coach Thompson later said he saw the love of a mother who was afraid for her child's life, and that is why he chose to help."}, {"q": "How did Allen's mom most likely feel during her private talk with Coach Thompson?", "choices": ["Calm and relaxed", "Bored and tired", "Angry at Allen", "Desperate to save her son"], "answer": 3, "explanation": "She cried and begged Coach Thompson to take Allen, telling him that without his help her son could die."}, {"q": "Allen's mom and Coach Thompson walked out of the office arm in arm. What does this show?", "choices": ["Coach Thompson was walking her out to say no", "They had come to an understanding and trusted each other", "They were old friends from many years before", "She was too tired to walk on her own"], "answer": 1, "explanation": "After starting as strangers in a tense meeting, they left arm in arm, which shows the talk ended with trust and an agreement to help Allen."}, {"q": "Coach Thompson was willing to \"consider\" taking Allen. What does consider mean?", "choices": ["To think carefully about something", "To refuse something right away", "To forget about something", "To promise something for sure"], "answer": 0, "explanation": "Coach Thompson did not say yes or no at first; he was willing to think it over, which is what consider means."}, {"q": "Allen imagines Coach Thompson getting \"stern\" and serious. What does stern mean?", "choices": ["Funny and playful", "Quiet and shy", "Strict and firm", "Confused and unsure"], "answer": 2, "explanation": "Allen pictures Coach Thompson speaking in a strict, no-nonsense way about studies and behavior, which is what stern means."}]}, {"id": "ch18-out-of-jail", "num": "18", "part": "Part III — From the Jungle to Georgetown", "title": "Out of Jail", "bank": [{"q": "Who ordered Allen's release from jail?", "choices": ["Mr. Payne, the warden", "The judge from his trial", "Governor Douglas Wilder", "The head of the NAACP"], "answer": 2, "explanation": "Governor Wilder of Virginia ordered Allen's release on December 30, 1993. The warden only delivered the news."}, {"q": "What job was Allen happy to have at the City Farm in December?", "choices": ["Working in the kitchen", "Cutting grass outside", "Painting buildings", "Washing the vans"], "answer": 0, "explanation": "Allen says he was happy to be working in the kitchen instead of outside in the winter cold."}, {"q": "On what date was Allen released from the City Farm?", "choices": ["Christmas Day, 1993", "January 1, 1994", "Thanksgiving Day, 1993", "December 30, 1993"], "answer": 3, "explanation": "Allen was released on December 30, 1993, four and a half months after he was locked up."}, {"q": "Who told Allen that the governor had ordered his release?", "choices": ["His boss in the bakery", "Mr. Payne, the warden", "His lawyer Tom Shuttleworth", "His mother"], "answer": 1, "explanation": "Mr. Payne, the warden, came to the kitchen and told Allen the governor had seen fit to order his release."}, {"q": "What did Allen put on to wear home from jail?", "choices": ["Green and gold sweats, Bethel's school colors", "The suit from the start of his jail time", "His white prison clothes", "A Georgetown jersey"], "answer": 0, "explanation": "His family sent clothes with the lawyers, and Allen changed into green and gold sweats — Bethel's colors — plus a Fila hat."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's trial in the courtroom", "Allen's first season at Georgetown", "How Allen got out of jail with help from many people", "How Allen learned to bake bread"], "answer": 2, "explanation": "The chapter tells how lawyers, the community, and Governor Wilder worked to free Allen, and describes the day he was released."}, {"q": "Allen says he \"didn't make it by myself.\" What does he mean?", "choices": ["He always played on a team, so he never had to work alone", "Many people, like his family, lawyers, and community, helped him succeed", "His teammates finished his schoolwork for him", "The governor taught him how to play basketball"], "answer": 1, "explanation": "Allen thanks the protesters, donors, lawyers, and the governor, saying they are all part of his legacy because he could not have made it without them."}, {"q": "What did the men around Allen do when they heard he was being released?", "choices": ["They ignored him and kept working", "They got angry and jealous", "They asked the warden to release them too", "They shouted with excitement and grabbed his shoulders"], "answer": 3, "explanation": "The guys around Allen started shouting, all excited, grabbing him by the back and shoulders when the news came."}, {"q": "Why did Allen's family ask the governor for help?", "choices": ["The appeal could take years, and only the governor could free Allen sooner", "Allen's first lawyers had moved to Washington, DC", "The judge told them to write to the governor", "The NAACP refused to help with the case"], "answer": 0, "explanation": "The appeal was still in the works but might take years, so the family and new lawyers asked the governor, who alone could grant a pardon or clemency."}, {"q": "What did Allen see when he pulled up to his house on release day?", "choices": ["An empty, quiet street", "His Bethel teammates in their uniforms", "Cameras and news crews all along the block", "Governor Wilder waiting to meet him"], "answer": 2, "explanation": "When the car pulled up to his house, there were cameras and news crews up and down the whole block."}, {"q": "How did Allen most likely feel when the warden said he was free?", "choices": ["Bored", "Angry", "Sleepy", "Shocked — he could hardly believe it"], "answer": 3, "explanation": "Allen says he was in shock and just looked at the warden like he was not serious, because he had made himself believe he would serve all his time."}, {"q": "How did Allen act outside for the cameras, and how did he act inside the house?", "choices": ["He cried outside and stayed serious inside", "He looked serious outside, but let his feelings out with his family inside", "He laughed and joked with the reporters outside", "He refused to go inside the house"], "answer": 1, "explanation": "Allen kept a serious face for the cameras, but once his mom, aunt, and sisters hugged him behind closed doors, he let his emotions go."}, {"q": "Allen heard a \"commotion\" from the kitchen that morning. What is a commotion?", "choices": ["Noisy excitement or a stir of activity", "A type of holiday bread", "A quiet whisper", "A kitchen machine"], "answer": 0, "explanation": "A commotion is a burst of noise and excitement — the stir Allen heard just before the warden brought him the big news."}, {"q": "The governor ordered Allen's \"release.\" What does release mean here?", "choices": ["A new album coming out", "A basketball pass", "A letter from a fan", "Letting someone go free"], "answer": 3, "explanation": "Release means letting someone out of jail — the governor ordered that Allen be set free."}, {"q": "In the newspaper poll, what did most people who answered say?", "choices": ["Allen should run for governor someday", "Allen should have stayed in jail", "Allen was innocent all along", "Allen deserved a new trial"], "answer": 1, "explanation": "In the Daily Press poll, 762 people said Allen should have stayed in jail, while only 288 supported freeing him."}]}, {"id": "ch19-back-home", "num": "19", "part": "Part III — From the Jungle to Georgetown", "title": "Back Home", "bank": [{"q": "What did the governor say Allen could NOT do after his release?", "choices": ["Leave his house at all", "Play organized sports", "Talk to his old friends", "Practice basketball alone"], "answer": 1, "explanation": "One of the governor's conditions was no organized sports, which is why Allen could practice but could not play for Bethel."}, {"q": "Where were Michael Simmons and Samuel Wynn serving their time?", "choices": ["The City Farm", "The Newport News Jail", "A prison in Washington, DC", "Hampton Jail"], "answer": 3, "explanation": "The chapter says the two men were in Hampton Jail, not the City Farm where Allen had been."}, {"q": "Who met with Allen every weekday to help him earn his diploma?", "choices": ["Ms. Lambiotte", "Mary Fenlon", "Coach Thompson", "Coach Kozlowski"], "answer": 0, "explanation": "Allen studied with Ms. Lambiotte every weekday, and the Milburn School counted the credits toward his diploma."}, {"q": "What game did Allen and Thrilla play together, like old times?", "choices": ["Checkers", "Football video games", "Monopoly", "Card games"], "answer": 2, "explanation": "After Thrilla transferred to Hampton University, he and Allen hung out a lot and played Monopoly, like old times."}, {"q": "Who secretly opened the Bethel gym so Allen could practice?", "choices": ["Coach Bailey", "The school principal", "Tony Rutland", "Coach Kozlowski, the athletic director"], "answer": 3, "explanation": "Coach Kozlowski was so glad Allen was out of jail that he quietly opened the Bethel gym for him, even though he probably was not supposed to."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's championship season at Bethel", "Allen's life after jail — following the rules, studying, and getting ready for Georgetown", "Allen's first game in the NBA", "Allen's time working at the City Farm"], "answer": 1, "explanation": "The chapter covers the governor's conditions, Allen's studies with Ms. Lambiotte, time with friends, and signing with Georgetown."}, {"q": "Why did Allen keep working on basketball even though he could not play in games?", "choices": ["Basketball was his way to a better life for himself, his family, and his friends", "The governor ordered him to practice every day", "Coach Bailey made practice a rule", "He was getting ready for football season"], "answer": 0, "explanation": "Allen says the games were what would get him, his family, and his friends out of their hard situation, so he kept practicing and stayed ready."}, {"q": "Why did Ra pull Allen out of the club when a fight started?", "choices": ["Ra was scared of fighting", "The club was about to close", "He did not want Allen to break the rules of his release", "Ra wanted to leave and get food"], "answer": 2, "explanation": "Ra grabbed Allen and forced him out so Allen would not violate his conditions — Allen says that showed the bond they had."}, {"q": "Why did people believe Coach Bailey was fired?", "choices": ["Because the team lost every game that season", "Because he had supported Allen", "Because he took a job at Wake Forest", "Because he wanted to retire"], "answer": 1, "explanation": "The school never said why, but everyone figured Coach Bailey was fired because he had stood up for Allen."}, {"q": "What did Allen do right after he and Jamil came up with the nickname \"The Answer\"?", "choices": ["He went to a tattoo shop that same night and got the name on his arm", "He called Coach Thompson to tell him", "He announced the nickname to the newspapers", "He printed the name on his jersey"], "answer": 0, "explanation": "Allen was so excited that he went to a tattoo shop in Yorktown that same night and got 'The Answer' tattooed on his left arm — his first tattoo."}, {"q": "How did Allen most likely feel when he hugged Nana after getting home?", "choices": ["Embarrassed", "Annoyed", "Confused", "Relieved and thankful"], "answer": 3, "explanation": "Allen says he was relieved that Nana's last memories of him would not be of him locked up in jail."}, {"q": "Why did Allen tell his friends \"don't leave\" when he went to shower?", "choices": ["He wanted them to meet Coach Thompson", "He needed help planning a party", "He did not want to be alone — having his people near made his freedom feel real", "He wanted them to watch a game with him"], "answer": 2, "explanation": "Allen says he needed his people around him to feel sure that being free was really true."}, {"q": "The governor gave Allen a \"curfew.\" What is a curfew?", "choices": ["A rule that you must be home by a set time", "A kind of haircut", "A jail uniform", "A basketball penalty"], "answer": 0, "explanation": "A curfew is a rule that says you must be home by a certain time — one of the conditions Allen mostly followed."}, {"q": "Coach Bailey \"never did anything but encourage\" Allen. What does encourage mean?", "choices": ["To punish someone", "To ignore someone", "To copy someone", "To give someone support and confidence"], "answer": 3, "explanation": "Even after losing his job, Coach Bailey kept supporting Allen and cheering him on — that is what it means to encourage someone."}, {"q": "Which college did Allen sign a letter of intent with that June?", "choices": ["Hampton University", "Georgetown", "Wake Forest", "VMI"], "answer": 1, "explanation": "That June, Allen's letter of intent with Georgetown became official after a phone call with Coach Thompson."}]}, {"id": "ch20-back-to-basketball", "num": "20", "part": "Part III — From the Jungle to Georgetown", "title": "Back to Basketball", "bank": [{"q": "What league did Allen get to play in during August 1994?", "choices": ["The AAU national tournament", "The Nike camp", "The Big East tournament", "The Kenner Summer League in Washington, DC"], "answer": 3, "explanation": "The parole office let Allen join the Kenner Summer League playoffs in DC, starting Thursday, August 4, 1994."}, {"q": "In what building were the Kenner League games played?", "choices": ["The Bethel High School gym", "McDonough Hall at Georgetown", "Langley Air Force Base", "Hampton University's arena"], "answer": 1, "explanation": "The games were at McDonough Hall — the same building where Allen's mom had once asked Coach Thompson to let her son play for him."}, {"q": "How many points did Allen score in his first Kenner League game?", "choices": ["40", "26", "34", "37"], "answer": 0, "explanation": "Allen scored 30 points in the first half and finished with 40, and his team won to reach the semifinal."}, {"q": "Who scored 37 points in the semifinal game?", "choices": ["Dikembe Mutombo", "Tony Rutland", "Jerome Williams", "Patrick Ewing"], "answer": 2, "explanation": "Jerome Williams, a junior college transfer about to start at Georgetown, scored 37 in the semifinal, while Allen scored 34."}, {"q": "What were Allen's last two classes before earning his diploma?", "choices": ["Math and English", "Art and History", "Biology and Spanish", "US Government and Psychology"], "answer": 3, "explanation": "Allen's final classes were US Government and Psychology, and passing them let the Milburn School approve his diploma."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's return to real basketball games and finishing his schoolwork", "Allen's first season playing for Georgetown", "Allen's trial in the courtroom", "Allen's jobs at the City Farm"], "answer": 0, "explanation": "The chapter tells how Allen played three big Kenner League games and then earned his last credits to graduate."}, {"q": "What did playing in the Kenner League prove to Allen?", "choices": ["That he needed a lot more practice", "That he could dominate against college-level players", "That he should switch back to football", "That the fans had forgotten about him"], "answer": 1, "explanation": "Allen says that after those games he finally knew he could dominate the college game — 'you don't know until you know.'"}, {"q": "What did Allen do right after the announcer said his name?", "choices": ["He called a timeout", "He left the gym", "He stole a pass and dunked at the other end", "He asked for a new jersey"], "answer": 2, "explanation": "Just as the crowd was whispering about the announcement, Allen jumped the passing lane, stole the ball, and dunked, so everyone knew it was really him."}, {"q": "Why was Allen allowed to play even though the governor had banned organized sports?", "choices": ["His lawyers asked, and the parole office made an exception because he was doing well", "The governor's rules had already ended", "Coach Thompson paid a fine for him", "He played under a different name"], "answer": 0, "explanation": "Allen's lawyers talked to the parole office, and since Allen had been following his rules, they let him join the end-of-summer playoff."}, {"q": "What did Allen do after his diploma became official?", "choices": ["He got a tattoo that said 'The Answer'", "He bought his mom a red Jaguar", "He moved to Washington, DC right away", "He got a Bulldog tattoo for the Georgetown mascot"], "answer": 3, "explanation": "When the diploma was official, Allen got his next tattoo — a Bulldog, Georgetown's mascot — under 'The Answer' on his left arm."}, {"q": "How did Allen most likely feel walking onto the court in front of the huge semifinal crowd?", "choices": ["Bored with the games", "Amazed that he had made it there after everything", "Angry at the fans", "Afraid to take a shot"], "answer": 1, "explanation": "Allen kept a serious face, but inside he felt like he belonged there and also wondered how he had made it to that point after jail and two curfews."}, {"q": "How did Ms. Lambiotte most likely feel at Allen's graduation ceremony?", "choices": ["Disappointed in him", "Jealous of him", "Proud of him", "Confused about the ceremony"], "answer": 2, "explanation": "Ms. Lambiotte planned the whole ceremony herself, with a cap and gown waiting, and even named Allen valedictorian — signs of how proud she was."}, {"q": "Allen's SAT score made him \"eligible.\" What does eligible mean?", "choices": ["Famous", "Exhausted", "Wealthy", "Qualified and allowed to take part"], "answer": 3, "explanation": "Being eligible means meeting the requirements to take part — his SAT score was high enough for college basketball rules."}, {"q": "Ms. Lambiotte said Allen was the \"valedictorian.\" What is a valedictorian?", "choices": ["The top student in a graduating class", "The tallest player on a team", "A school principal", "A guest speaker at a game"], "answer": 0, "explanation": "A valedictorian is the number one student in a graduating class — Allen was No. 1 in a class of one, so he had to give a speech."}, {"q": "Which NBA player stood in the crowd at the championship game because he could not get a seat?", "choices": ["Michael Jordan", "Dikembe Mutombo", "Patrick Ewing", "Magic Johnson"], "answer": 1, "explanation": "Allen spotted Dikembe Mutombo, already three years into his NBA career, standing in the packed gym of about 4,000 people."}]}, {"id": "ch21-adjusting-to-georgetown", "num": "21", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Adjusting to Georgetown", "bank": [{"q": "When did Iverson arrive on the Georgetown campus?", "choices": ["January 1995", "September 1994", "June 1993", "October 1992"], "answer": 1, "explanation": "The chapter says he arrived in September 1994, just a couple of days after his high school graduation, and made the late registration window."}, {"q": "Who was Iverson's roommate at Copley Hall?", "choices": ["Don Reid", "Othella Harrington", "Jerome Williams", "Jahidi White"], "answer": 0, "explanation": "Coach Thompson put Iverson with Don Reid, a quiet, serious senior who became team captain, to keep Iverson on the right track."}, {"q": "What nickname did Jerome Williams later become known by?", "choices": ["House Mouse", "Thrilla", "The Junkyard Dog", "Bubba Chuck"], "answer": 2, "explanation": "Jerome Williams was later called the Junkyard Dog because he fought for every rebound and loose ball."}, {"q": "What was Coach Thompson's rule about cars?", "choices": ["Players could only drive on weekends.", "Only seniors could have cars.", "Players had to share one team van.", "Players were not allowed to have cars at all."], "answer": 3, "explanation": "The chapter says Coach Thompson did not let his players have cars, \"whether it was a Benz or a hooptie,\" so everyone walked."}, {"q": "What did players have to wear when arriving at games?", "choices": ["A suit and tie", "Team warm-up suits", "Georgetown T-shirts", "Whatever they wanted"], "answer": 0, "explanation": "Coach Thompson was very strict about the dress code and would only accept a suit and tie, so the players looked professional at the arenas."}, {"q": "Why did Iverson start walking the long way to the gym?", "choices": ["To get extra exercise before practice", "So he would not have to see the football team practicing", "To avoid Coach Thompson's office", "To stop at the dining hall on the way"], "answer": 1, "explanation": "Watching football practice made him sad because he missed the sport, so after Coach Thompson said no to football, he changed his route to avoid the field."}, {"q": "Why did Georgetown have to pay Nike back?", "choices": ["Iverson lost the sneakers Nike sent him.", "Nike charged too much for the team's shoes.", "Nike had paid for an extra flight, which broke NCAA rules.", "Iverson signed autographs for money."], "answer": 2, "explanation": "The rules allowed only one round-trip flight to the Nike camp, so the second flight Nike added was not allowed; Nike had to be repaid before Iverson could practice."}, {"q": "What did Iverson find at his locker after Coach Thompson yelled at him for asking about number 3?", "choices": ["The number 3 jersey, hanging there", "A note telling him to see the coach", "The number 1 jersey", "A new suit and tie"], "answer": 0, "explanation": "Even though Coach Thompson yelled at him for asking, the number 3 jersey was hanging in his locker at the next practice, which showed how much the coach cared."}, {"q": "How did Iverson feel when he watched the football team practice?", "choices": ["Excited to try out for the team someday", "Glad that he had chosen basketball", "Angry at the football players", "So sad that his eyes teared up"], "answer": 3, "explanation": "He says his eyes would literally get teary because football was his first love and his old plan had been to play both sports."}, {"q": "How did Iverson most likely feel after Coach Thompson said no to football?", "choices": ["Happy that the decision was made for him", "Hurt, but he accepted it and moved on", "Sure that he would ask again soon", "Angry enough to quit basketball"], "answer": 1, "explanation": "Iverson says \"it did hurt,\" but he never thought seriously about playing football again after that talk."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first season in the NBA", "Iverson's high school graduation party", "Iverson getting used to college life under Coach Thompson's rules", "Iverson learning to play college football"], "answer": 2, "explanation": "The chapter covers his first months at Georgetown: his dorm, his teammates, and all the ways Coach Thompson guided and protected him."}, {"q": "What was the hardest part of Georgetown life for Iverson?", "choices": ["His family was still struggling back home and he could not help them yet.", "The dorm food was bad.", "His classes were too easy.", "His room had no hot water."], "answer": 0, "explanation": "While he had a nice dorm and plenty of food, his mom and sisters still lived with broken plumbing and shut-off electricity, and NCAA rules kept him from earning money to help."}, {"q": "The chapter says the university \"reinstated\" Iverson. This means he was", "choices": ["given a new dorm room", "sent home to Virginia", "moved to a new position on the court", "officially allowed back on the team"], "answer": 3, "explanation": "After Georgetown showed proof that Nike had been repaid, the NCAA accepted it and the school put Iverson back in good standing in time for practice."}, {"q": "Iverson \"gathered up the courage\" to ask Coach Thompson about football. Courage means", "choices": ["anger", "bravery", "patience", "kindness"], "answer": 1, "explanation": "Courage means being brave; Iverson needed to be brave to ask the intimidating Coach Thompson for something he knew the coach might not like."}, {"q": "In \"The Benz,\" what did Coach Thompson tell Iverson to do with the car?", "choices": ["Sell it and save the money", "Hide it off campus", "Return it", "Give it to a teammate"], "answer": 2, "explanation": "Coach Thompson told Iverson to do what he had to do about going pro, but ordered him to return the loaner Benz, and Iverson did."}]}, {"id": "ch22-hoya-season-begins", "num": "22", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Hoya Season Begins", "bank": [{"q": "Which team did Georgetown play in its first exhibition game?", "choices": ["Morgan State", "Arkansas", "Fort Hood", "A Croatian team"], "answer": 2, "explanation": "The first exhibition was against Fort Hood at little McDonough Hall, where the packed crowd went wild."}, {"q": "How many points did Iverson score in his first exhibition game?", "choices": ["36", "28", "39", "21"], "answer": 0, "explanation": "He had 28 points by halftime and finished the game with 36; the 39 came later in the second exhibition against a Croatian team."}, {"q": "Where did Georgetown play its first official game, against Arkansas?", "choices": ["McDonough Hall on campus", "The Pyramid in Memphis", "The Capital Centre", "The Spectrum in Philadelphia"], "answer": 1, "explanation": "The game was at the Pyramid in Memphis, an arena shaped like an Egyptian pyramid, with 20,000 fans and CBS cameras."}, {"q": "What was the result of the Arkansas game?", "choices": ["Georgetown won, 97-79.", "The game went to overtime.", "Georgetown won on a buzzer-beater.", "Arkansas won, 97-79."], "answer": 3, "explanation": "The defending national champions beat Georgetown 97-79; Iverson made only five of eighteen shots that day."}, {"q": "Who led Georgetown in scoring in the win over Morgan State?", "choices": ["Don Reid, with 21 points", "Allen Iverson, with 36 points", "Othella Harrington, with 27 points", "Jerome Williams, with 18 points"], "answer": 0, "explanation": "Iverson focused on passing that game and had 10 assists, while his roommate Don Reid led the team with 21 points."}, {"q": "What did Coach Thompson do when a Fort Hood player knocked Iverson down?", "choices": ["He called a timeout to check on Iverson.", "He took Iverson out of the game.", "He ran onto the court shouting and got a technical foul.", "He asked the referees to end the game early."], "answer": 2, "explanation": "Thompson ran out on the floor yelling \"Don't hurt my boy!\" and had to be held back, which earned him a technical."}, {"q": "Why did Iverson pass the ball more in the Morgan State game?", "choices": ["Don Reid asked him to share the ball.", "He had been criticized for shooting too much against Arkansas.", "His ankle was hurting that night.", "Coach Thompson benched him for the first half."], "answer": 1, "explanation": "After hearing criticism about his shooting and turnovers in the Arkansas game, he made a point of getting his teammates involved."}, {"q": "What happened when the second semester began?", "choices": ["Iverson transferred to a new dorm.", "The basketball season ended.", "Iverson went home to Hampton for a month.", "The no-interview rule ended, and Iverson spoke at a big press conference."], "answer": 3, "explanation": "Coach Thompson's no-interview policy only covered the first semester, so with the new year the school held a press conference where only basketball questions were allowed."}, {"q": "How did Iverson most likely feel seeing the TV announcers before the Arkansas game?", "choices": ["Thrilled, like he had finally arrived at the big time", "Too nervous to finish his warm-ups", "Bored, because he had seen it all before", "Embarrassed by all the attention"], "answer": 0, "explanation": "Seeing Billy Packer and Jim Nantz ready to call the game, he thought he had arrived, and he says he loved the anticipation and spotlight."}, {"q": "How did Iverson feel right after the Arkansas loss?", "choices": ["Ready to give up basketball", "Afraid to face another pressing team", "Still confident, and eager to play the next game", "Angry at Coach Thompson's game plan"], "answer": 2, "explanation": "Even after the blowout, he felt he was the best player on the floor and says he could not wait for the next game."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's high school football championship", "Iverson's exciting first games at Georgetown", "Iverson's summer job in Hampton", "Iverson's first season in Philadelphia"], "answer": 1, "explanation": "The chapter covers the exhibitions, the Arkansas game, the winning streak, and the attention Iverson got during his first college season."}, {"q": "What did Iverson tell Tawanna when their daughter Tiaura was born?", "choices": ["He would take care of the child by making it in basketball.", "He would leave Georgetown and move back home.", "He wanted them to move to Washington, DC right away.", "He planned to quit basketball to find a job."], "answer": 0, "explanation": "He told Tawanna he had to take care of the child by concentrating on making it in basketball, and she never questioned that plan."}, {"q": "An \"exhibition\" game is best described as", "choices": ["a championship game", "a playoff game", "a practice game that does not count in the standings", "a game played with no fans"], "answer": 2, "explanation": "The exhibitions came before the real games began; they were warm-up contests, even though the crowds treated them like big events."}, {"q": "The crowd went into a \"frenzy\" when Iverson hit a late three. Frenzy means", "choices": ["quiet worry", "wild excitement", "angry silence", "deep confusion"], "answer": 1, "explanation": "A frenzy is a burst of wild excitement; the fans went crazy when his three-pointer put the game out of reach."}, {"q": "When was Iverson's daughter Tiaura born?", "choices": ["September 1994", "June 1995", "December 16, 1993", "December 16, 1994"], "answer": 3, "explanation": "Tiaura was born on December 16, 1994, during Iverson's freshman year, while Tawanna was living in Hampton with her mother."}]}, {"id": "ch23-the-big-east", "num": "23", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Big East", "bank": [{"q": "What did the Pitt crowd chant when Iverson shot free throws?", "choices": ["\"Airball\"", "\"Convict U\"", "\"Go home\"", "\"Jailbird\""], "answer": 3, "explanation": "The Pitt fans chanted \"Jailbird\" in a sing-song way whenever he went to the line; \"CONVICT U\" was a sign at the Villanova game, not a chant at Pitt."}, {"q": "Why was George Butler dismissed from the team?", "choices": ["He did not meet the academic standards.", "He broke the team curfew.", "He was injured for the season.", "He transferred to Villanova."], "answer": 0, "explanation": "The team announced that Butler failed to meet the academic standards; it hurt Iverson because George was his friend and the team's second-leading scorer."}, {"q": "Which famous person came to watch the second Georgetown-Villanova game?", "choices": ["Moses Malone", "President Bill Clinton", "Patrick Ewing", "Michael Jordan"], "answer": 1, "explanation": "President Bill Clinton, who had gone to Georgetown, arrived just before tip-off with the Secret Service, and Iverson wanted to play his best for him."}, {"q": "Which two awards did Iverson win at the end of the regular season?", "choices": ["Big East MVP and scoring champion", "Most Improved Player and All-American", "Big East Rookie of the Year and Defensive Player of the Year", "Team captain and Coach's Award"], "answer": 2, "explanation": "He won Rookie of the Year and Defensive Player of the Year, and he says the defensive award meant more to him."}, {"q": "Which team beat Georgetown three times that season?", "choices": ["UConn", "Villanova", "St. John's", "Syracuse"], "answer": 0, "explanation": "Connecticut beat Georgetown in Hartford, again in DC, and a third time in the Big East Tournament; no team had ever beaten Georgetown three times in one season before."}, {"q": "Why did Iverson score only 2 points in the first Villanova game?", "choices": ["He fouled out in the first half.", "He was benched for being late to the bus.", "Villanova triple-teamed him the whole game.", "His sprained ankle still hurt, so Coach Thompson took him out."], "answer": 3, "explanation": "His ankle was still hurt from the UConn game, and when Coach Thompson saw him limping, he pulled him to protect the ankle; it was his lowest-scoring college game."}, {"q": "Why did Coach Thompson say the team might not play the game at Villanova?", "choices": ["The locker room was too small for the team.", "Students were holding insulting signs about Iverson.", "The referees were unfair in warm-ups.", "The team bus arrived late to the arena."], "answer": 1, "explanation": "Fans in orange jumpsuits held disrespectful signs about Iverson, and Thompson said the team would not play unless the signs were put down. They were."}, {"q": "What did President Clinton do after the Villanova game in DC?", "choices": ["He came into the locker room and shook Iverson's hand.", "He gave a speech at half court.", "He left before the game ended.", "He invited the whole team to the White House."], "answer": 0, "explanation": "After the big win, Clinton visited the locker room, spoke to Coach Thompson first, then came over and shook Iverson's hand."}, {"q": "How did Iverson most likely feel knowing the president was watching him play?", "choices": ["Too nervous to start the game", "Angry about the extra security", "Extra motivated to play his best", "Embarrassed by the attention"], "answer": 2, "explanation": "He says it always mattered to him who was watching, and with the president there he told himself, \"I had to bring it.\""}, {"q": "How did Iverson react to the \"Jailbird\" chant at Pitt?", "choices": ["He asked to leave the game.", "He turned to the crowd and smiled.", "He yelled back at the fans.", "He refused to shoot his free throws."], "answer": 1, "explanation": "After his first free throw he just turned and smiled at the crowd; he says name-calling could not bother someone who had really been in jail."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's first Big East season, with tough crowds, losses, and big honors", "Iverson's summer vacation back in Hampton", "Iverson's high school football championship", "Iverson's first NBA draft night"], "answer": 0, "explanation": "The chapter follows Georgetown through the Big East schedule, the taunting, the losing streak, the Villanova win with Clinton watching, and Iverson's season awards."}, {"q": "At his appeal hearing in Norfolk, how did Iverson see his old court case?", "choices": ["As something he wanted to relive", "As more important than basketball", "As a fun trip back home", "As part of a former life that was behind him"], "answer": 3, "explanation": "Listening to the arguments felt like a flashback to a life that was over; he says he was done with it and was now a rising star in the nation's capital."}, {"q": "Why did Iverson leave game tickets for friends and family from home?", "choices": ["Coach Thompson required players to fill the seats.", "He wanted to sell the tickets for extra money.", "He was not abandoning anyone and wanted to share his success.", "His friends refused to watch the games on TV."], "answer": 2, "explanation": "He left tickets for Ms. Lambiotte, Mo, Thrilla, Arnie, Ra, and others, saying he was not abandoning anyone and his dream of lifting everyone up was coming into view."}, {"q": "The chapter talks about \"taunts\" from other crowds. A taunt is", "choices": ["a loud cheer of support", "a mean comment meant to upset someone", "a team chant before the game", "a quiet whisper between friends"], "answer": 1, "explanation": "The taunts were insults like \"You criminal!\" shouted at Iverson by opposing fans to try to upset him."}, {"q": "The Villanova students \"relented\" and put down their signs. Relented means", "choices": ["got even louder", "stood up to argue", "gave in", "walked out of the arena"], "answer": 2, "explanation": "To relent means to give in; after Coach Thompson said the team would not play, the students gave in and lowered the signs."}]}, {"id": "ch24-the-big-dance", "num": "24", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Big Dance", "bank": [{"q": "What seed did Georgetown get in the NCAA Tournament?", "choices": ["First", "Sixth", "Second", "Tenth"], "answer": 1, "explanation": "When the bracket came out, Georgetown was seeded sixth in the Southeast region. Iverson thought the team should have done better."}, {"q": "Who did Georgetown play in its first tournament game?", "choices": ["North Carolina", "Weber State", "Michigan State", "Xavier"], "answer": 3, "explanation": "Georgetown's first game was against Xavier in Tallahassee. Weber State and North Carolina came later in the tournament."}, {"q": "Why was Iverson confused when Coach Thompson told him he was proud of him?", "choices": ["Coach Thompson usually yelled at players instead of praising them.", "Iverson thought Coach Thompson was joking with him.", "Coach Thompson had already said it many times that season.", "Iverson could not hear him over the crowd."], "answer": 0, "explanation": "Coach Thompson was usually loud and tough with his players, so being nice felt strange. Iverson did not know what to do and just shook his hand."}, {"q": "Against Weber State, what happened right after Iverson's last-second shot came up short?", "choices": ["The game went to overtime.", "Weber State grabbed the rebound and won.", "Don Reid caught the ball in the air and scored just before time ran out.", "The referees called a foul on Iverson."], "answer": 2, "explanation": "Don Reid caught the short shot in the air like an alley-oop and put it in over his shoulder as the clock ran out, winning the game for Georgetown."}, {"q": "How many three-pointers did Georgetown make in the whole Weber State game?", "choices": ["Three", "None", "Ten", "One"], "answer": 1, "explanation": "Iverson says the team did not make a single three-pointer the entire game, which shows how much of a struggle it was."}, {"q": "Why does Iverson say Coach Thompson saved his life?", "choices": ["Thompson paid for his family's house.", "Thompson taught him how to play defense.", "Thompson drove him home every summer.", "Thompson's faith in him gave him confidence, not just a scholarship."], "answer": 3, "explanation": "Iverson explains it was not only the scholarship or the chance to play basketball. It was the belief Coach Thompson had in him that gave him confidence."}, {"q": "Who did Georgetown play in the Sweet Sixteen?", "choices": ["North Carolina", "Kentucky", "Arizona State", "Xavier"], "answer": 0, "explanation": "After beating Weber State, Georgetown faced North Carolina in the Sweet Sixteen in Birmingham, Alabama."}, {"q": "Which North Carolina player kept dunking on Georgetown even with a hurt ankle?", "choices": ["Jerry Stackhouse", "Jeff McInnis", "Rasheed Wallace", "Ruben Nembhard"], "answer": 2, "explanation": "Rasheed Wallace had an ankle injury, but it did not hold him back. Once Georgetown moved its defense out, he started dunking and could not be stopped."}, {"q": "How did Iverson most likely feel at halftime of the North Carolina game?", "choices": ["Relaxed, because Georgetown was winning.", "Upset, because he felt he was letting his team down.", "Bored, because the game was too easy.", "Happy, because he had scored 21 points."], "answer": 1, "explanation": "Iverson had missed all six of his shots in the first half. He says he felt like he was letting the team down."}, {"q": "What did Coach Thompson tell Iverson to do in the second half against North Carolina?", "choices": ["Pass the ball more and shoot less.", "Slow the game down.", "Guard Rasheed Wallace by himself.", "Speed up the game and look for his own shot."], "answer": 3, "explanation": "Coach Thompson told him to stop trying so hard to be a point guard, push the tempo, and get himself involved in the scoring."}, {"q": "How many points did Iverson score in the second half against North Carolina?", "choices": ["21", "7", "40", "55"], "answer": 0, "explanation": "After scoring almost nothing in the first half, Iverson took control and scored 21 points in the second half."}, {"q": "The crowd gave Iverson an \"ovation\" when he fouled out. What is an ovation?", "choices": ["A penalty from the referees", "A long timeout", "Loud clapping and cheering", "A silent protest"], "answer": 2, "explanation": "An ovation is when a crowd stands up, claps, and cheers. Fans from all over the country cheered for Iverson as he walked off the court."}, {"q": "Why did Iverson miss Michael Jordan's first game back in the NBA?", "choices": ["He had to study for exams.", "It happened at the same time as Georgetown's game against Weber State.", "His dorm did not have a television.", "Coach Thompson would not let the team watch TV."], "answer": 1, "explanation": "Jordan's first game back was played at the exact same time Georgetown was beating Weber State, so Iverson could not watch it."}, {"q": "What is this chapter mostly about?", "choices": ["Georgetown's NCAA Tournament run during Iverson's freshman year", "Iverson's decision to leave college and join the NBA", "Michael Jordan's comeback season with the Bulls", "Iverson's childhood in Hampton, Virginia"], "answer": 0, "explanation": "The chapter tells the story of the tournament, from the exciting win over Weber State to the Sweet Sixteen loss to North Carolina."}, {"q": "Why did Iverson start going to class again after the season ended?", "choices": ["The school threatened to take away his scholarship.", "His teammates promised to study with him.", "Coach Thompson reminded him that doing well could change his family's hard life.", "His mother moved to campus to check on him."], "answer": 2, "explanation": "Coach Thompson told him his mom and sisters were living without heat and hot water, and that Iverson had a chance to change that. The speech put him back on the right path."}]}, {"id": "ch25-summertime", "num": "25", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Summertime", "bank": [{"q": "Where was Iverson set to travel in August for the World University Games?", "choices": ["France", "Brazil", "Japan", "Spain"], "answer": 2, "explanation": "Iverson was going to Japan that August for the World University Games. It would be his first trip overseas."}, {"q": "Who was Nana living with that summer?", "choices": ["Uncle Stevie", "Iverson's mother", "Coach Thompson", "Iverson's sisters"], "answer": 0, "explanation": "Nana was still in Aberdeen, living with Uncle Stevie, who took care of her while she was sick."}, {"q": "Why did Uncle Stevie leave the Marines early?", "choices": ["He wanted to play basketball.", "He got a job in Washington, DC.", "He was asked to coach Allen's team.", "He went home to take care of Nana."], "answer": 3, "explanation": "Stevie had joined the Marines, but he left early so he could care for Nana, who had been in and out of the hospital."}, {"q": "What was taped all over the walls of Nana's room?", "choices": ["Get-well cards from the hospital", "Newspaper articles and pictures about Allen", "Maps of places she wanted to visit", "Photos of her childhood"], "answer": 1, "explanation": "Her walls were covered with articles about Allen, held up with masking tape, including pictures of him with Coach Thompson and of him dunking."}, {"q": "How did Iverson most likely feel when he saw the articles on Nana's wall?", "choices": ["Embarrassed by the attention", "Angry at the newspapers", "Proud and happy that he brought her joy", "Worried that she would lose them"], "answer": 2, "explanation": "Iverson says seeing those articles on her wall meant everything to him, because he knew he was bringing her joy and pride."}, {"q": "What happened to Nana later that summer?", "choices": ["She passed away.", "She moved in with Allen at Georgetown.", "She recovered and left the hospital for good.", "She traveled to Japan to watch him play."], "answer": 0, "explanation": "Nana was not doing well, and later that summer she passed away. Iverson said she had gotten tired of going back and forth to the hospital."}, {"q": "How did Iverson feel for a long while after Nana died?", "choices": ["Relieved that the summer was over", "Excited about the new season", "Angry at Uncle Stevie", "Heartbroken and full of mixed feelings"], "answer": 3, "explanation": "Iverson says he was hurting for a long time. He missed her and felt both guilt and comfort, telling himself she got to see the start of his journey."}, {"q": "What woke Iverson up on June 20, 1995?", "choices": ["A phone call from Coach Thompson", "His mother shouting with joy in the house", "A knock from a newspaper reporter", "His alarm for summer practice"], "answer": 1, "explanation": "Iverson was asleep at home when he heard his mom hollering from the other side of the house, celebrating the big news."}, {"q": "At first, what did Iverson think his mother was celebrating?", "choices": ["A new job", "A birthday", "Winning the lottery", "A letter from Georgetown"], "answer": 2, "explanation": "Hearing all the excitement, Iverson thought his mom had won the lottery. The real news turned out to be even better."}, {"q": "What was the real news that day?", "choices": ["A court had thrown out his conviction, clearing his record.", "He had been picked first in the NBA Draft.", "Georgetown had won the national championship.", "The governor had ordered a new trial."], "answer": 0, "explanation": "The Virginia Court of Appeals completely reversed his conviction. Iverson was no longer a criminal and had no record."}, {"q": "Why did the appeals court reverse the decision?", "choices": ["New witnesses came forward.", "The judge admitted he made a mistake.", "A video proved Iverson was somewhere else.", "There was not enough evidence against him."], "answer": 3, "explanation": "The court agreed with the point his side had made from the beginning: there was not enough evidence of a mob, or that Iverson was part of one."}, {"q": "What
