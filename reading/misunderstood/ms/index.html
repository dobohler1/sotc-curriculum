  }
  .masthead h1 {
    font-family: 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;

  .scout {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .scout p { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .scout .tally { text-align: right; flex: none; }
  .scout .tally .big { font-size: 26px; font-weight: 700; color: var(--ink); display: block; line-height: 1.1; }
  .scout .tally .sub { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; }

  .part-label {
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-faint);
    margin: 26px 0 10px;
    font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;
  }
  .roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ch-row {
    width: 100%;
    display: flex; align-items: center; gap: 16px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    color: var(--ink);
    font: inherit;
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .ch-row:hover { border-color: var(--ink-soft); transform: translateX(3px); }
  .ch-row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ch-row .qnum {
    flex: none; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--bg);
    font-size: 26px; font-weight: 700;
    border-radius: 4px;
  }
  .ch-row.is-passed .qnum { background: var(--gold); color: #1E1503; }
  .ch-row .meta { flex: 1; min-width: 0; }
  .ch-row .title { font-weight: 700; font-size: 18px; margin: 0; font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  .ch-row .stats { margin: 3px 0 0; font-size: 13px; color: var(--ink-faint); }
  .chip {
    flex: none;
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    background: var(--surface-2);
  }
  .chip.passed { background: var(--gold-bg); color: var(--gold); border-color: var(--gold); }
  .chip.attempted { background: var(--wrong-bg); color: var(--wrong); border-color: transparent; }
  .locked-note {
    margin-top: 26px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    color: var(--ink-faint);
    font-size: 14px;
  }
  .rules { margin-top: 22px; font-size: 14px; color: var(--ink-soft); }
  .rules strong { color: var(--ink); }

  /* ---------- exam ---------- */
  .exam-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 2px solid var(--ink);
    padding: 12px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .exam-bar .ch { font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; font-weight: 700; text-transform: uppercase; font-size: 16px; letter-spacing: .03em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exam-bar .count { flex: none; font-size: 14px; color: var(--ink-soft); }
  .exam-bar .count b { color: var(--ink); }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin: 18px 0;
    box-shadow: var(--shadow);
  }
  .q-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 12px; }
  .q-head .qnum {
    flex: none;
    font-weight: 700; font-size: 15px;
    color: var(--accent);
    letter-spacing: .06em;

    flex: none; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    font-size: 13px; font-weight: 700;
    font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .choice .ctext { font-size: 16px; }
  .choice.selected { border-color: var(--ink); background: var(--surface-2); }
  .choice.selected .letter { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .choice:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

  .submit-zone {
    margin-top: 30px;
    border-top: 3px solid var(--ink);
    padding-top: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .submit-zone .warn { color: var(--wrong); font-size: 14px; margin: 0; }
  .btn {
    font-size: 16px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    border: none; border-radius: var(--radius);
    padding: 13px 26px;
    cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    transition: transform .1s ease, opacity .1s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn.quiet { background: transparent; color: var(--ink-soft); border: none; padding: 8px 10px; font-size: 14px; }

  /* ---------- results ---------- */
  .scoreboard {
    background: var(--ink);
    color: var(--bg);
    border-radius: var(--radius);
    padding: 34px 24px 30px;
    text-align: center;
    margin: 24px 0 30px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  :root[data-theme="dark"] .scoreboard, .dark-sb { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .scoreboard { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  }
  .scoreboard .label { text-transform: uppercase; letter-spacing: .16em; font-size: 13px; opacity: .7; font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; }
  .scoreboard .digits {
    font-family: 'Avenir Next Condensed', 'Arial Narrow', Arial, sans-serif;
    font-size: clamp(64px, 16vw, 104px);
    font-weight: 700;
    line-height: 1;
    margin: 8px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .pct { font-size: 20px; opacity: .85; font-family: ui-monospace, Menlo, monospace; }
  .stamp {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 22px;
    border: 3px solid currentColor;
    border-radius: 4px;
    font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;
    font-weight: 700; font-size: 24px;
    text-transform: uppercase; letter-spacing: .14em;
    transform: rotate(-3deg);
  }
  .stamp.pass { color: var(--gold); }
  .stamp.fail { color: var(--accent); }
  .scoreboard .msg { margin: 16px auto 0; max-width: 46ch; font-size: 15px; opacity: .85; }

  .review-h {
    font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;
    text-transform: uppercase; letter-spacing: .1em;
    font-size: 15px; font-weight: 700;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px; margin: 34px 0 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .review-h .key { font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }
  .r-card { border-left: 4px solid var(--line); }
  .r-card.good { border-left-color: var(--correct); }
  .r-card.bad { border-left-color: var(--wrong); }
  .verdict { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; }
  .verdict.good { color: var(--correct); }
  .verdict.bad { color: var(--wrong); }
  .r-choice { border-color: var(--line); cursor: default; }
  .r-choice.was-correct { background: var(--correct-bg); border-color: var(--correct); }
  .r-choice.was-correct .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .r-choice.was-wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .r-choice.was-wrong .letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .explain {
    margin: 14px 0 2px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
    font-size: 15px;
    color: var(--ink-soft);
  }
  .explain b { color: var(--ink); }
  .end-actions { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 480px) {
    .jersey { display: none; }
    .scout { flex-direction: column; align-items: flex-start; }
    .scout .tally { text-align: left; }
  }
</style>

const BOOK = {
  title: "Misunderstood",
  author: "Allen Iverson",
  passPct: 90,
  perQuiz: 10,
  chapters: [{"id": "prologue-practice", "num": "P", "part": "Prologue", "title": "Practice", "bank": [{"q": "What word did Iverson repeat over and over at the famous press conference?", "choices": ["Loyalty", "Practice", "Championship", "Trade"], "answer": 1, "explanation": "When a reporter asked about missed practices, Iverson said the word \"practice\" many times, and that clip got replayed everywhere."}, {"q": "Who was the best friend Iverson lost before that season?", "choices": ["Billy King", "Larry Brown", "Fiend", "Rahsaan Langford, called \"Ra\""], "answer": 3, "explanation": "Iverson's best friend Rahsaan Langford, known as Ra or Ra Boogie, was shot and killed in October 2001."}, {"q": "Besides Coach Larry Brown, who met with Iverson to settle the trade rumors?", "choices": ["Billy King, the general manager", "His teammates from the 76ers", "The Philadelphia reporters", "Ra's family from Virginia"], "answer": 0, "explanation": "Iverson, Coach Brown, and general manager Billy King met to get things straight, and the message was that nobody was leaving."}, {"q": "Why did Iverson agree to hold the press conference?", "choices": ["To announce he was retiring from basketball", "To complain about the referees in the playoffs", "To tell everyone he was staying with the 76ers", "To talk about the trial happening in Virginia"], "answer": 2, "explanation": "After the meeting, Iverson wanted to share the good news with the city and the world: he was staying in Philadelphia."}, {"q": "Why wasn't Iverson with Ra on the night Ra was killed?", "choices": ["He missed his plane from Philadelphia to Virginia", "He was playing in a game that night", "Ra told him not to come", "He was at the hospital with an injured elbow"], "answer": 0, "explanation": "Iverson was supposed to fly down and watch the Tyson fight with Ra, but he missed his plane and cannot even remember why."}, {"q": "What did the man do after Ra joked about his eye?", "choices": ["He laughed and forgot about it", "He stayed angry and stared at Ra all night", "He left the club right away", "He challenged Ra to a boxing match"], "answer": 1, "explanation": "The man went crazy at first, and even after Ra told him to calm down, he kept staring at Ra the whole night because he could not let the joke go."}, {"q": "What event were Ra and his friends watching at the club that night?", "choices": ["A 76ers playoff game", "The NBA Finals", "A Georgetown basketball game", "The Mike Tyson boxing match"], "answer": 3, "explanation": "The friends had planned to watch the Mike Tyson fight against Brian Nielsen, and Ra also followed the Yankees playoff game that night."}, {"q": "How did Iverson most likely feel when reporters kept asking about practice?", "choices": ["Proud that they cared about his work habits", "Bored, because he had heard the question before", "Hurt and frustrated, because he was grieving his friend", "Relieved that they did not ask about the games"], "answer": 2, "explanation": "Iverson told the press he had lost his best friend and felt like everything was going downhill, but they kept asking about practice, which irritated and hurt him."}, {"q": "What is the main idea of this chapter?", "choices": ["People remember one moment about practice but missed the pain behind it", "Practice is the most important part of becoming a great player", "Iverson wanted to leave Philadelphia but was forced to stay", "Reporters and players usually get along well in the NBA"], "answer": 0, "explanation": "Iverson explains that everyone knows the \"practice\" clip, but almost nobody paid attention to his grief over Ra and everything else he was going through."}, {"q": "How did Iverson help Ra's wife and three kids after Ra died?", "choices": ["He coached Ra's kids in basketball", "He paid for their home, their car, and their school", "He moved them into his house in Philadelphia", "He set up a charity in Ra's name"], "answer": 1, "explanation": "Iverson says he took care of Ra's family by paying for their home, their car, and their school, because Ra had once helped his family."}, {"q": "What does Iverson say you need to hear in order to understand him?", "choices": ["The story of his MVP season", "The full recording of the press conference", "The beginning: his family, friends, and life in Virginia", "The opinions of the Philadelphia reporters"], "answer": 2, "explanation": "At the end of the chapter, Iverson says that to understand him you need to hear the beginning, with his family and friends in Newport News and Hampton, Virginia."}, {"q": "In this chapter, the word \"rumors\" means", "choices": ["official team announcements", "questions asked at a press conference", "promises made by coaches", "stories people spread that may not be true"], "answer": 3, "explanation": "The rumors were unproven stories going around that Iverson would be traded and that he and Coach Brown were not getting along."}, {"q": "What happened in January, during the season?", "choices": ["The 76ers made it to the NBA Finals", "The police finally caught Ra's killer", "Iverson was traded to another team", "Iverson hurt his elbow at training camp"], "answer": 1, "explanation": "The chapter says that in January the police finally caught the man who killed Ra, and the trial approached as the season went on."}, {"q": "Iverson says the press conference changed his \"legacy.\" What does legacy mean?", "choices": ["How a person is remembered by others", "A player's salary and contract", "A team's win-loss record", "A speech given to reporters"], "answer": 0, "explanation": "Iverson means that \"practice\" became one of the main things people remember about him, as famous as his moves on the court."}, {"q": "Why did Iverson refuse to let go of his home and old friends?", "choices": ["His coaches ordered him to stay close to them", "He was afraid of living alone in Philadelphia", "They had supported him from the beginning and were his foundation", "He planned to move back to Virginia after one season"], "answer": 2, "explanation": "Even though many people told him to move on, Iverson would not turn his back on the people and place that had his back from the start."}]}, {"id": "ch1-nana-and-mom", "num": "1", "part": "Part I — Growing Up and Surviving", "title": "Nana and Mom", "bank": [{"q": "Who was Nana?", "choices": ["Allen's mother's best friend from Hartford", "Allen's great-grandmother, Ethel Mitchell", "Allen's grandmother, who died in the hospital", "Allen's aunt, called \"Lil Bit\""], "answer": 1, "explanation": "Nana was Allen's great-grandmother, Ethel Mitchell. She raised Allen's mom and her brothers and sister after their own mother died."}, {"q": "How old was Allen's mom, Ann, when Allen was born?", "choices": ["Twelve", "Eighteen", "Twenty-one", "Fifteen"], "answer": 3, "explanation": "The chapter starts by saying Allen was born on June 7, 1975, in Hampton, Virginia, when his mom was fifteen."}, {"q": "What nickname did Allen's family call him?", "choices": ["Bubbachuck", "House Mouse", "The Answer", "Ra Boogie"], "answer": 0, "explanation": "Two uncles named Bubba and Chuck argued over whose nickname Allen should get, so his mom put them together and called him Bubbachuck."}, {"q": "Why did Nana raise Allen's mom and her brothers and sister?", "choices": ["Their parents moved away for work", "Nana wanted company in her big house", "Their mother died from an infection after a surgery", "A judge ordered Nana to take them in"], "answer": 2, "explanation": "When Allen's mom was twelve, her mother went to the hospital and never came home. She died from an infection after surgery, so Nana took in the four kids."}, {"q": "Why did young Allen keep saying \"Let's do it again\" when the older kids tackled him?", "choices": ["He did not understand the rules of the game", "He wanted to keep going until he could beat them", "His uncles forced him to keep playing", "He was trying to make his mom laugh"], "answer": 1, "explanation": "Allen says he kept getting up because he always kept going until he could win. He wanted to play until the older kids could not stop him."}, {"q": "What happened right after Allen fell out of Nana's car onto the highway?", "choices": ["His cousin grabbed him and pulled him back into the car", "An ambulance took him to the hospital", "Nana drove away without noticing", "A police officer stopped the traffic"], "answer": 0, "explanation": "Traffic was barely moving, so when the door popped open and Allen fell out, his cousin grabbed him up quickly and got him back in the car."}, {"q": "Allen says Nana was \"the backbone of the family.\" What does that mean?", "choices": ["She was the oldest person in the family", "She had a bad back from working hard", "She was the strong person who held the family together", "She was the tallest person in the house"], "answer": 2, "explanation": "Everyone respected Nana and came to her to solve problems. Like a backbone holds up a body, she held up the whole family."}, {"q": "Why did Nana punish Allen the one time she ever laid hands on him?", "choices": ["He broke her burgundy car", "He got into a fight at school", "He played music too loud in the house", "He went to the creek after she told him to stay home"], "answer": 3, "explanation": "Before leaving for church, Nana told Allen not to go to the creek. He went anyway, and she came back and caught him there."}, {"q": "What happened to Allen at the bus stop in fourth grade?", "choices": ["The school bus ran over his foot and broke his ankle", "He missed the bus and had to walk to school", "He got into a fight over a seat", "He slipped on ice and hurt his arm"], "answer": 0, "explanation": "Someone jostled Allen in line, his foot slipped into the street, and the bus rolled over it. His ankle was badly broken."}, {"q": "How did Allen most likely feel when he looked up and saw Nana at the creek?", "choices": ["Excited to show her the crawfish", "Ashamed, because he had let her down", "Angry that she came home early", "Confused about why she was there"], "answer": 1, "explanation": "Allen says his heart sank when he saw her. He did not want to disappoint Nana, and letting her down was a feeling he never wanted again."}, {"q": "Which sentence best describes Allen's mom in this chapter?", "choices": ["She was strict and never let Allen play sports", "She was rich and bought Allen everything he wanted", "She stayed in Hartford while Allen lived in Virginia", "She was very young, worked many jobs, and always believed in Allen"], "answer": 3, "explanation": "Allen's mom was only fifteen when he was born. She worked jobs like forklift driver and typist, and she told Allen he would make it to the NBA or NFL."}, {"q": "Allen's mom said, \"Tight isn't the word for our money.\" What did she mean?", "choices": ["She kept the family's money locked up", "She did not trust banks", "The family had very little money", "The family saved money for a new house"], "answer": 2, "explanation": "She meant the family was so short on money that \"tight\" was not a strong enough word. Many bills did not get paid."}, {"q": "Who was \"House Mouse\"?", "choices": ["Allen's uncle Stevie, who played football", "Michael Freeman, the man Allen calls his dad", "Allen's biological father, Allen Broughton", "A neighbor from the Pine Chapel apartments"], "answer": 1, "explanation": "House Mouse was the nickname of Michael Freeman, who met Allen's mom when Allen was a baby and became the dad in his life."}, {"q": "What did the family do after the violent fight at the Pine Chapel apartment?", "choices": ["They moved to Stuart Gardens in Newport News", "They moved back in with Nana", "They returned to Hartford, Connecticut", "They stayed in Pine Chapel for many more years"], "answer": 0, "explanation": "After the fight in which a neighbor was badly hurt, the family was ready to move again, and Allen's mom found a new place in Stuart Gardens."}, {"q": "What is the main idea of this chapter?", "choices": ["Allen taught himself basketball with no help from anyone", "Allen's family had plenty of money but little love", "Even though times were hard, Nana and Allen's mom loved him and believed in him", "Allen spent most of his childhood in Connecticut"], "answer": 2, "explanation": "The chapter shows a family without much money, but Nana took care of Allen, and his mom told him he could make it to the NBA or NFL and believed in him totally."}]}, {"id": "ch2-stuart-gardens", "num": "2", "part": "Part I — Growing Up and Surviving", "title": "Stuart Gardens", "bank": [{"q": "What could Allen's family see from their window in Stuart Gardens?", "choices": ["The Bethel High School football field", "The mall parking lot", "The water where the Chesapeake Bay met the James River", "The mountains of Virginia"], "answer": 2, "explanation": "The house was right on the water, and from the window they could see where the Chesapeake Bay met the James River, with Norfolk on the other side."}, {"q": "Who was Allen's best friend in Stuart Gardens?", "choices": ["Snapper", "Tony Clark", "Ra", "Fiend"], "answer": 0, "explanation": "Snapper was Allen's best friend from the beginning. He was Allen's exact age and lived four or five buildings over."}, {"q": "What street did Allen's mom tell him and Brandy not to go past?", "choices": ["Roanoke Avenue", "Sixteenth Street", "Jordan Drive", "Anderson Street"], "answer": 1, "explanation": "Their mom's rule was \"Don't go past Sixteenth Street.\" Years later, part of that street was named Allen Iverson Way."}, {"q": "How did Allen's dad calm down the boys who came to fight Allen?", "choices": ["He called their parents", "He paid them to go away", "He chased them off the block", "He got everyone to play a football game"], "answer": 3, "explanation": "Allen's dad said, \"Let's just play a football game.\" He played so well that the game calmed everybody down."}, {"q": "What bait did Allen put in his trap to catch crabs?", "choices": ["Chicken wings", "Bloodworms", "Candy bars", "Nightcrawlers"], "answer": 0, "explanation": "The perfect crab bait was a little bit of chicken wings placed in the middle of the trap to lure the crabs in."}, {"q": "Why was Allen's mom angry when she saw the bucket of crabs?", "choices": ["The crabs had escaped in the kitchen", "Allen had skipped school to go crabbing", "Allen had used the chicken that was meant for dinner", "Allen had borrowed a trap without asking"], "answer": 2, "explanation": "The chicken was guaranteed dinner for the family. Allen used it as bait, so his mom slapped him upside the head."}, {"q": "Which sentence best describes Stuart Gardens?", "choices": ["It was a quiet town far from any city", "It looked nice by the water, but it was still the projects", "It was a rich neighborhood with big houses", "It was a farm area with fields and animals"], "answer": 1, "explanation": "Allen says the grass and the water looked nice, but it was still the projects, where he saw fights and worse."}, {"q": "What did Allen do to earn a few dollars in the neighborhood?", "choices": ["He sold crabs at the store", "He washed cars at the mall", "He delivered newspapers", "He cut people's hair with his clippers"], "answer": 3, "explanation": "Allen was good at cutting hair, like art to him. People would come over, sit in the chair, and pay him a few dollars."}, {"q": "Why did Allen and his friends steal change from cars in the parking lot?", "choices": ["They had no money of their own, and it seemed like fun", "Older kids forced them to do it", "They wanted to buy bikes", "They were collecting money for their families"], "answer": 0, "explanation": "Allen explains they were kids with nothing, no money for shoes or movies, and stealing quarters was one way to get a couple of dollars. He also admits it was fun to them."}, {"q": "Why did the police officer stop Allen on the street?", "choices": ["Allen was running through traffic", "Snapper pointed Allen out to the police", "Allen was wearing leather gloves on a very hot day", "A store owner had called about stolen candy"], "answer": 2, "explanation": "It was a hot, humid Virginia day, and Allen still had on his black leather gloves. The officer said, \"It's a little hot for some gloves.\""}, {"q": "How did Allen most likely feel when the store lady caught him with worms in his pants?", "choices": ["Proud of his clever plan", "Embarrassed at being caught in front of customers", "Happy that she gave him the worms for free", "Angry at Snapper for telling on him"], "answer": 1, "explanation": "Allen just stared at her when he was caught, and he had to pull the worms out and pay while other surprised customers watched."}, {"q": "What happened after the lady caught Allen with the bloodworms?", "choices": ["She gave him a lecture and made him pay for them", "She called his mom to the store", "She banned him from the store forever", "She called the police to arrest him"], "answer": 0, "explanation": "The lady gave a little lecture, walked Allen to the cashier, and watched as he paid for the bloodworms."}, {"q": "Tony Clark was called a \"swindler.\" What is a swindler?", "choices": ["A person who is good at sports", "A person who fixes bikes and radios", "A person who tells funny jokes", "A person who tricks others to get what they want"], "answer": 3, "explanation": "Tony Clark could talk kids into unfair trades, like giving up a bike for a radio. A swindler tricks people out of their things."}, {"q": "Allen says drugs \"terrified\" him. What does terrified mean?", "choices": ["A little curious", "Very scared", "Slightly bored", "Very excited"], "answer": 1, "explanation": "Terrified means extremely afraid. Allen had heard drugs could kill you, so he was very scared of them."}, {"q": "Why did Allen say no when other kids offered him drugs?", "choices": ["He knew his friends would tell his mom", "He did not want to spend his money on them", "He believed drugs could kill him and end his NBA or NFL dream", "He had promised Nana he would never touch them"], "answer": 2, "explanation": "Allen had always heard drugs were so bad you could die, and that if you did drugs you could not play in the NBA or NFL, so he refused even when kids teased him."}]}, {"id": "ch3-raiders-football", "num": "3", "part": "Part I — Growing Up and Surviving", "title": "Raiders Football", "bank": [{"q": "Where was Allen's mom working when she met Mo?", "choices": ["A shipyard in Newport News", "An Avon warehouse", "A TJ Maxx store", "Magruder Elementary School"], "answer": 1, "explanation": "Allen's mom packed orders and drove a forklift at a big Avon warehouse, and that is where she met Gary Moore, called Mo."}, {"q": "What game was Allen playing when Mo first came to watch him?", "choices": ["Basketball", "Baseball", "Kickball", "Hotball"], "answer": 3, "explanation": "Mo watched from his car while Allen played hotball, a game where kids tossed a football in the air and tackled whoever caught it."}, {"q": "Which teammate gave up his jersey number so Allen could wear it?", "choices": ["Jermaine Marshall", "Eric Jackson", "Michael Jackson", "Butch Harper"], "answer": 0, "explanation": "Jermaine Marshall wore number 33, but after seeing how much Allen cared, he pulled Allen aside and let him have the number."}, {"q": "What was the Raiders' final score in the game against Petersburg?", "choices": ["They lost 7-0", "They tied 0-0", "They won 7-0", "They won 33-10"], "answer": 2, "explanation": "Even though the Petersburg players were much bigger, the Raiders beat them by a score of about 7-0 on a cold, rainy, muddy day."}, {"q": "What was Michael Jackson's nickname on the team?", "choices": ["Bubbachuck", "Thrilla", "Mo", "E"], "answer": 1, "explanation": "Because the singer Michael Jackson was already famous, it was easy to pick the nickname 'Thrilla' for Allen's smart, disciplined friend."}, {"q": "What is this chapter mostly about?", "choices": ["How Allen joined the Raiders and learned toughness and confidence", "How Allen learned to play basketball at a rec league", "How Allen's family moved from Hampton to Newport News", "How Allen won the state championship at Bethel High"], "answer": 0, "explanation": "The chapter tells how Mo brought Allen to the Aberdeen Raiders, where he learned confidence and became part of a winning team."}, {"q": "What did Mo believe sports could do for kids in the community?", "choices": ["Make them famous on television", "Help them earn money right away", "Give them something to do and teach a positive work ethic", "Keep them from ever going to school"], "answer": 2, "explanation": "The chapter says Mo believed kids needed sports to burn off energy and that sports could teach them a positive work ethic."}, {"q": "Mo's lesson 'If it's between you and me, it's me' was mostly about", "choices": ["never trusting your teammates", "always letting the coach win", "being the biggest player on the field", "having confidence and believing in yourself"], "answer": 3, "explanation": "Allen explains the lesson meant asking 'Why can't it be me?' It was about confidence in sports and in life."}, {"q": "What happened after the Raiders lost in the playoffs during Allen's first year?", "choices": ["The team broke up and stopped playing", "They won the championship four years in a row", "Allen quit and joined the Trojans", "Mo was replaced as coach"], "answer": 1, "explanation": "After that first playoff loss, the Raiders won every championship after that, four straight."}, {"q": "Why did Allen cry in front of the whole team before his first season?", "choices": ["He was told he could not wear number 33", "He was cut from the team", "He lost a race to Thrilla", "His helmet was broken"], "answer": 0, "explanation": "Allen wanted number 33 like Tony Dorsett, but the team told him he could not have it because Jermaine wore it, and Allen cried so hard he got dizzy."}, {"q": "What number did Allen switch to when Mo made him quarterback?", "choices": ["Number 33", "Double zero", "Number 10", "Number 7"], "answer": 2, "explanation": "No quarterback wore 33, so Allen moved to number 10, and later he wore number 1 through high school."}, {"q": "How did the older Raiders players most likely feel when tiny eight-year-old Allen first showed up?", "choices": ["Jealous of his fame", "Scared he would take their spots", "Sure he would be the star", "Doubtful that he belonged on the team"], "answer": 3, "explanation": "The bigger guys looked down at Allen and then up at Mo, questioning what Mo was thinking by bringing such a little kid."}, {"q": "How did Allen most likely feel when Jermaine let him have number 33?", "choices": ["Grateful and happy", "Angry and confused", "Embarrassed and sad", "Bored and tired"], "answer": 0, "explanation": "Allen had cried over the number and cared about it deeply, so getting it from Jermaine meant a lot; he remembers it as proof of what good teammates he had."}, {"q": "Mo coached the 'intermediate' squad. In this chapter, 'intermediate' means", "choices": ["the youngest beginner level", "the professional level", "the middle level, for kids ten to twelve", "a team that only practices indoors"], "answer": 2, "explanation": "The chapter says the intermediate squad was for kids ten through twelve years old, in between the little kids' league and the older levels."}, {"q": "Mo used Jermaine as a 'decoy' on the last play of the playoffs. A decoy is", "choices": ["the fastest player on the field", "someone used to trick or distract the other team", "a player who kicks the ball", "a special kind of helmet"], "answer": 1, "explanation": "Mo pretended Jermaine would get the ball to fool the defense, then handed it to the fullback instead. A decoy is used to trick the other side."}]}, {"id": "ch4-no-not-basketball", "num": "4", "part": "Part I — Growing Up and Surviving", "title": "No, Not Basketball", "bank": [{"q": "Who took Allen to his first basketball tryout?", "choices": ["Coach Mo", "His dad", "His mom", "His uncle Stevie"], "answer": 2, "explanation": "Allen's mom would not take no for an answer. She put him in the car, drove him to the gym, and dragged him inside."}, {"q": "What did Allen do first when he walked onto the court at the tryout?", "choices": ["He sat and watched the other players for ten or fifteen minutes", "He asked to go home", "He challenged the best player to a race", "He started shooting free throws right away"], "answer": 0, "explanation": "Allen learned by watching. He studied the moves and shots for ten or fifteen minutes, then stepped on the court and copied what he saw."}, {"q": "Who was Allen's basketball coach until high school?", "choices": ["Coach Mike Bailey", "Gary Moore", "Butch Harper", "Bob Barefield"], "answer": 3, "explanation": "Bob Barefield, an older coach from Aberdeen in Hampton, coached Allen and picked him up in his little van."}, {"q": "What did the coaches offer Allen if he would make a regular layup?", "choices": ["A spot on the travel team", "A pack of Now and Laters candy", "A new pair of Jordans", "Five dollars"], "answer": 1, "explanation": "Allen always tried fancy moves like Michael Jordan and missed, so the coaches said they would buy him a pack of Now and Laters for one regular layup."}, {"q": "What shoes did Allen beg his mom for before the tournament in Kansas?", "choices": ["Nike Air Force Ones", "Reebok high-tops", "Converse All Stars", "Adidas Superstars"], "answer": 0, "explanation": "Allen felt he could not go to the tournament without Nike Air Force Ones. His mom bought them even though the family had no money."}, {"q": "What is this chapter mostly about?", "choices": ["How Allen won championships in youth basketball", "How Allen's football team beat Petersburg", "How Allen refused basketball at first but fell in love with it", "How Allen learned to draw and paint"], "answer": 2, "explanation": "The chapter tells how Allen thought basketball was soft, cried at tryouts, and then discovered it was his game within about a week."}, {"q": "Coach Barefield talked about 'the blueprint' during van rides. What was it about?", "choices": ["Learning new basketball plays", "Staying out of trouble and building a good life", "Getting a college scholarship", "How to build houses"], "answer": 1, "explanation": "The blueprint was Barefield's plan for the boys to stay out of trouble and keep from dying or going to jail."}, {"q": "What did Allen learn from the summer games at the Aberdeen playground?", "choices": ["How to shoot only jump shots", "How to play defense first", "How to dunk at a young age", "How to really play, get to the basket, and finish"], "answer": 3, "explanation": "Allen says the playground was his real basketball education, where he learned about getting to the hole and finishing, and winning to stay on the court."}, {"q": "Why was Allen crying when he arrived at the basketball tryout?", "choices": ["The older kids would not let him play", "He had just broken his thumb", "His mom made him go when he did not want to", "His team had just lost a football game"], "answer": 2, "explanation": "Allen wanted nothing to do with basketball, but his mom dragged him into the gym anyway, and he was crying and sobbing."}, {"q": "What happened after Allen watched the other players at the tryout?", "choices": ["He stepped on the court and copied the moves he had seen", "He left the gym and walked home", "He asked the coach to teach him the rules", "He sat out the rest of the day"], "answer": 0, "explanation": "After watching, Allen stepped out and repeated what he had just seen. It felt natural, and basketball became his game."}, {"q": "Why did Allen take his cast off at home before that big weekend?", "choices": ["The doctor said his thumb was healed", "He wanted to play in the packed night games at the playground", "The cast was itchy and too small", "His dad told him to remove it"], "answer": 1, "explanation": "Everyone was at the playground that night, and Allen wanted to play so badly that he soaked off the cast and wrapped his hand in bandages."}, {"q": "How did Allen feel toward his mom after basketball became his game?", "choices": ["Annoyed that she made him try out", "Embarrassed that she watched him play", "Worried she would make him quit football", "Thankful, because she knew better than he did"], "answer": 3, "explanation": "Allen kept telling her 'Thank you Mom' because she had been right about basketball even when he said no."}, {"q": "How did Allen most likely feel when he became the first player picked at the night games?", "choices": ["As happy as he had ever been", "Nervous about the older players", "Angry that the games were at night", "Sad that his uncles were watching"], "answer": 0, "explanation": "Allen says going from not being allowed on the court to being picked first was 'about as happy as I ever was.'"}, {"q": "Allen went to basketball 'tryouts.' A tryout is", "choices": ["a practice for players already on a team", "a chance to show your skills and earn a spot on a team", "a championship game", "a meeting for parents and coaches"], "answer": 1, "explanation": "At the rec league tryout, kids played in front of coaches to show they were good enough to be put on a team."}, {"q": "Allen said he thought basketball was 'soft.' He meant the game seemed", "choices": ["too expensive to play", "too confusing to learn", "not tough enough compared to football", "too quiet and slow"], "answer": 2, "explanation": "Allen loved football because it showed how tough he was, so at first he looked down on basketball as a game that was not tough."}]}, {"id": "ch5-surviving-middle-school", "num": "5", "part": "Part I — Growing Up and Surviving", "title": "Surviving Middle School", "bank": [{"q": "What did the principal promise Allen if he came to school ten days in a row?", "choices": ["A spot on the basketball team", "Free lunch for a month", "A new football helmet", "A shopping trip for clothes"], "answer": 3, "explanation": "The principal knew Allen did not have much, so he promised to take him shopping, and he kept his word after Allen came to school ten straight days."}, {"q": "How many days of school did Allen miss during his first try at eighth grade?", "choices": ["Ten days", "Sixty-nine days", "Twenty days", "Ninety days"], "answer": 1, "explanation": "Allen's family found out he had missed sixty-nine days of school. That is the number he says he remembers."}, {"q": "Where did Allen go to repeat the eighth grade?", "choices": ["Jefferson Davis Middle School", "Magruder Elementary", "Bethel High School", "A school in Petersburg"], "answer": 0, "explanation": "Mo and Allen's mom decided Allen would live with Mo in Hampton and do eighth grade over again at Jefferson Davis Middle School."}, {"q": "What did Allen buy for his sister Brandy near the end of that summer?", "choices": ["A bicycle and a radio", "Basketball tickets", "School clothes, books, and supplies", "A new phone"], "answer": 2, "explanation": "Allen took Brandy to the mall, where she picked out all her school clothes and got her schoolbooks and supplies. It felt good to him to help her."}, {"q": "What is this chapter mostly about?", "choices": ["Allen winning a middle school basketball championship", "Allen skipping school, getting into street trouble, and the people who helped him turn around", "Allen's first year playing for the Raiders", "Allen's family taking a trip to Kansas"], "answer": 1, "explanation": "The chapter tells how Allen missed school, had to repeat eighth grade, made money in a dangerous way, and how his mom, Mo, and others pushed him back on track."}, {"q": "Why did Mo keep driving to Glen Gardens over and over?", "choices": ["He worked in that neighborhood", "He was visiting Allen's dad", "He wanted to buy a new car there", "He believed in Allen and wanted to get him off the street"], "answer": 3, "explanation": "Mo knew exactly what Allen was doing and where he was. He kept coming back again and again because he saw Allen's talent and future."}, {"q": "What did living at Mo's house show Allen?", "choices": ["That things like heat, food, and a phone all the time were new to him", "That he liked following house rules", "That Hampton was worse than Newport News", "That he wanted to quit sports"], "answer": 0, "explanation": "At Mo's house, Allen had heat, food, and a working phone all the time for the first time. He said he felt like a prince in a movie."}, {"q": "Why wasn't Allen allowed on the school basketball team that fall?", "choices": ["His grades were too low", "He was too small for the team", "He missed the tryouts because he was skipping school", "The coach wanted older players only"], "answer": 2, "explanation": "Allen missed the November tryouts while skipping school, and the coach and principal were strict and said no when he showed up later."}, {"q": "What did Allen do right after his mom called the school from the girl's house?", "choices": ["He apologized and went straight to class", "He ran out of the house, but came back home that night", "He hid in the bathroom", "He called Mo for help"], "answer": 1, "explanation": "When his mom found out the other kids were still in school, she started yelling and swinging, and Allen ran. But just like she said he would, he was back home that night."}, {"q": "Why couldn't the school call Allen's house about his missed days?", "choices": ["The school did not have his address", "His mom told the school not to call", "Allen changed the phone number", "The family's phone was turned off because bills were not paid"], "answer": 3, "explanation": "The family never had money, so the phone was always off. That meant the school could not call, and Allen also grabbed the mail before his mom saw it."}, {"q": "What happened at the very end of the chapter?", "choices": ["Allen found his name on the Bethel High student list", "Allen won a summer league championship", "Allen moved back to Stuart Gardens", "Allen got his report card in the mail"], "answer": 0, "explanation": "Allen walked up to Bethel High on the first day, looked at the student list, and saw his name. He had been accepted to high school."}, {"q": "When a man with a gun robbed Allen in a dark hallway, what did Allen think about?", "choices": ["How to fight the man right there", "Where his friends had gone", "His family and the future he was about to lose", "The money he had spent at the mall"], "answer": 2, "explanation": "In that scary moment, Allen thought about what Nana, his mom, and Mo would think, and feared he would never even make it to high school."}, {"q": "How did Allen most likely feel on the day he took Brandy shopping?", "choices": ["Jealous of her new things", "Happy and proud that he could help her", "Angry that she needed so much", "Nervous about driving at night"], "answer": 1, "explanation": "Allen says it was one of those days he remembers because it felt so good to have something and to help his sister get what she needed."}, {"q": "Allen's family got 'evicted' from Stuart Gardens. Evicted means", "choices": ["forced to move out of their home", "given a bigger apartment", "invited to a neighborhood party", "asked to pay less rent"], "answer": 0, "explanation": "Being evicted means being made to leave your home. Around that time, Allen's family had to leave Stuart Gardens."}, {"q": "In this chapter, 'hustling' means", "choices": ["playing sports as hard as you can", "walking very fast", "making money illegally on the streets", "working two jobs at once"], "answer": 2, "explanation": "When Allen's mom and friends said his hustling days were over, they meant the illegal way he was making money on the street that summer."}]}, {"id": "ch6-high-school-football", "num": "6", "part": "Part II — My Trials On and Off the Court", "title": "High School Football", "bank": [{"q": "Who usually drove Allen to school in the mornings?", "choices": ["Mike Jackson", "Tony Rutland", "Coach Koz", "Paul London"], "answer": 0, "explanation": "Mike Jackson, also called Thrilla, picked Allen up most mornings in his little black 1981 Toyota Tercel."}, {"q": "Who was the head coach of Bethel's football team?", "choices": ["Mike Bailey", "Paul London", "Dennis Kozlowski, called \"Coach Koz\"", "Tim Johnson"], "answer": 2, "explanation": "The chapter says the football coach was Dennis Kozlowski, whom the players called Coach Koz. Mike Bailey was the basketball coach."}, {"q": "Which school was Bethel's biggest rival?", "choices": ["Ferguson", "Hampton High, home of the Crabbers", "Kecoughtan", "Norcom"], "answer": 1, "explanation": "The Hampton High Crabbers were Bethel's big rival, and the Hampton-Bethel game was the biggest game every year."}, {"q": "What was the score when Bethel played Hampton at the end of Allen's freshman season?", "choices": ["Hampton won 53-0", "Bethel won 9-3", "Hampton won 21-14", "Bethel won 34-0"], "answer": 0, "explanation": "In the last game of Allen's freshman year, Hampton beat Bethel 53-0. Bethel's 9-3 win over Hampton came the next season."}, {"q": "How did Allen and his teammates feel after the 53-0 loss to Hampton?", "choices": ["They wanted to quit football", "They blamed the referees", "They did not care about the loss", "They were determined never to let it happen again"], "answer": 3, "explanation": "Allen writes, \"We wouldn't forget it. It wasn't going to happen again,\" showing the team used the loss as motivation."}, {"q": "In the Lafayette game, what did Allen do after he threw an interception?", "choices": ["He sat on the bench for the rest of the game", "He came back and threw a 34-yard touchdown pass to win the game", "He switched to playing only defense", "He asked Coach Koz to put Paul London back in"], "answer": 1, "explanation": "After his interception let Lafayette tie the score, Allen returned the kick, led the team down the field, and threw a 34-yard touchdown pass with about a minute left."}, {"q": "Why did Allen quit track after just one day?", "choices": ["Coach Koz kicked him off the team", "He lost a race to Thrilla", "Running the 400 hurt, and he only liked sports with a ball", "Track practice was at the same time as basketball"], "answer": 2, "explanation": "Allen ran one painful 400 and never came back. He said running for no reason did not appeal to him; he wanted a ball and a place to put it."}, {"q": "What happened the week after Bethel beat Hampton in Allen's sophomore season?", "choices": ["Bethel won the state championship", "Bethel lost to Norcom in the playoffs", "Bethel played Hampton a second time", "Allen was moved back to wide receiver"], "answer": 1, "explanation": "The next week Bethel lost to Norcom, whose defense blitzed Allen all game, so Bethel did not advance in the state playoffs."}, {"q": "In the \"Jail\" section, why was Allen wearing a gray suit?", "choices": ["The jail gave it to him to wear", "He had worn it to court to look respectable for the judge", "It was his school uniform at Bethel", "He had worn it to a team banquet that morning"], "answer": 1, "explanation": "His lawyer told him to wear a suit for sentencing day, and his mom picked out the gray suit for him."}, {"q": "In the \"Jail\" section, why did Allen take off most of his clothes in the holding cell?", "choices": ["An officer told him to change clothes", "The suit was torn during the ride", "He was getting ready to sleep", "The cell was very hot with no air-conditioning"], "answer": 3, "explanation": "It was late summer in Virginia, the air-conditioning had stopped, and the cell had no windows, so Allen took off the hot suit piece by piece."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's basketball games at Bethel", "Allen's summer vacations in Hampton", "Allen becoming a football star at Bethel and finally beating Hampton", "Allen's art classes and drawings"], "answer": 2, "explanation": "The chapter follows Allen's football career at Bethel, from freshman receiver to star quarterback, ending with the big win over Hampton."}, {"q": "Why was beating Hampton such a big deal for Bethel?", "choices": ["Hampton had dominated the rivalry and won the district thirteen straight years", "It was the first time the two schools had ever played", "Hampton had beaten Bethel in the state finals the year before", "It was Coach Koz's last season as coach"], "answer": 0, "explanation": "Hampton had won the district title thirteen years in a row and most of the games against Bethel, so ending their streak was huge."}, {"q": "How did Allen most likely feel when fans rushed the field after the Hampton win?", "choices": ["Embarrassed by all the attention", "Nervous about the next game", "Happier than he had ever felt in a game", "Angry that the game was over"], "answer": 2, "explanation": "Allen calls it maybe the most exciting moment of his life and says being in the middle of that happy crowd felt wonderful."}, {"q": "After Allen's touchdown pass beat Lafayette, \"everyone was elated.\" What does \"elated\" mean?", "choices": ["Very tired", "Very happy", "Confused", "Worried"], "answer": 1, "explanation": "Elated means very happy or thrilled. The team had just won the game on Allen's late touchdown pass."}, {"q": "Hampton was Bethel's rival. What is a \"rival\"?", "choices": ["A team's home stadium", "A type of football play", "A team's good luck charm", "An opponent you most want to beat"], "answer": 3, "explanation": "A rival is the opponent a team competes with the hardest and most wants to beat, like Hampton was for Bethel every year."}]}, {"id": "ch7-high-school-life", "num": "7", "part": "Part II — My Trials On and Off the Court", "title": "High School Life", "bank": [{"q": "What happened to Allen's dad during Allen's freshman year?", "choices": ["He moved to the Bronx for a new job", "He got hurt in a car accident", "He was sent to prison for ten years", "He became a coach at Bethel"], "answer": 2, "explanation": "In February 1991, Allen's dad was convicted on a drug charge and given a ten-year prison sentence."}, {"q": "What was the name of Allen's baby sister born during his sophomore year?", "choices": ["Iiesha", "Brandy", "Janet", "Ann"], "answer": 0, "explanation": "Allen's mom gave birth to Iiesha in the fall of his sophomore year, right in the middle of the 10-0 football season."}, {"q": "Where was Allen living at the start of his freshman year?", "choices": ["With his dad in Stuart Gardens", "With Mo's family in Aberdeen", "With Coach Bailey and his wife", "With Ra in New York"], "answer": 1, "explanation": "Allen started freshman year living with Mo's family, who had a room for him in their house in Aberdeen with a phone, heat, and hot water."}, {"q": "What did Ra always wear as his signature look?", "choices": ["A gray suit", "A Bethel football jersey", "A New York baseball cap", "His wrestling shoes"], "answer": 3, "explanation": "Ra had been a champion wrestler in New York, and he always wore his wrestling shoes as his signature look."}, {"q": "What game did Thrilla's family love to play together?", "choices": ["Monopoly", "Chess", "Card games", "Basketball in the driveway"], "answer": 0, "explanation": "Thrilla's family had a tradition of playing Monopoly one-on-one, and Allen learned the game there and became obsessed with it."}, {"q": "What happened to baby Iiesha after she was born at the hospital in Norfolk?", "choices": ["She went home the next day with no problems", "She stayed in Norfolk for a whole year", "She was moved to Georgetown University Hospital", "She was sent to a hospital in Hampton"], "answer": 2, "explanation": "Doctors in Norfolk did not expect Iiesha to make it, so she was moved to Georgetown University Hospital, where she got better even though seizures continued for years."}, {"q": "Why did Allen sometimes miss school?", "choices": ["His school bus never came", "He stayed home to take care of his baby sister", "He was away at football camps", "He was visiting his dad in another state"], "answer": 1, "explanation": "Allen says he sometimes stayed home looking after his sister when his mom was not there, which meant missing school and getting criticized by Coach Koz."}, {"q": "How did Allen get arrested for the first time?", "choices": ["He was caught driving without a license", "He got in a fight at a football game", "He skipped school too many times", "He was caught spray-painting a wall"], "answer": 0, "explanation": "Allen drove rental cars around even though he had no license, like when he took Brandy shopping, and that is how he caught his first arrest."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's championship football games", "Allen's hard family life and his friendships during high school", "Allen's first year playing basketball", "Allen's time at Georgetown University"], "answer": 1, "explanation": "The chapter describes Allen's family struggles, like his dad going to prison and his sick baby sister, along with his friends and fun at school."}, {"q": "What did Allen's friends in the group called Cru Thik tell him to do?", "choices": ["Drop out of school to make music", "Move to New York with Ra", "Spend more time on the streets", "Focus on sports and stay off the streets"], "answer": 3, "explanation": "Allen says those guys pushed him off the streets as much as Mo or his mom, telling him not to worry about anything and to focus on sports."}, {"q": "How did Allen feel about his mom's house on Victoria Boulevard?", "choices": ["He thought it was fancy and liked showing it off", "He was ashamed and never went there", "It had problems, but it still felt like home", "He wanted the family to move back to Stuart Gardens"], "answer": 2, "explanation": "The house had a busted pipe and smelled bad, and the lights or gas were sometimes off, but Allen says it was a place the family could all be, and it was home."}, {"q": "How did Allen most likely feel when he watched Thrilla's family together?", "choices": ["He wished he had a family life like that", "He was bored by their traditions", "He thought they were pretending to be happy", "He felt they did not welcome him"], "answer": 0, "explanation": "Allen says a home with a mom and dad like Thrilla's was what he wanted just as much as fame and fortune."}, {"q": "Allen's family was evicted from Stuart Gardens. What does \"evicted\" mean?", "choices": ["Invited to stay longer", "Forced to move out", "Given a bigger apartment", "Locked inside"], "answer": 1, "explanation": "Evicted means forced to leave the place where you live. After the eviction, Allen's family members were scattered in different places."}, {"q": "Allen said he became \"obsessed\" with Monopoly. What does \"obsessed\" mean?", "choices": ["Bored with something", "Confused by something", "Unable to stop thinking about something", "Afraid of something"], "answer": 2, "explanation": "Obsessed means you think about something all the time. Allen kept playing Monopoly until he won and played it for years and years."}, {"q": "Who introduced Allen to Biggie's music?", "choices": ["Thrilla", "Quincy", "Tony Rutland", "Ra"], "answer": 3, "explanation": "Ra brought his love of hip-hop with him from New York, and he was the one who introduced Allen to Biggie's music."}]}, {"id": "ch8-basketball-high", "num": "8", "part": "Part II — My Trials On and Off the Court", "title": "Basketball High", "bank": [{"q": "Who coached Bethel's basketball team?", "choices": ["Coach Koz", "Mike Bailey", "Mo", "Bo Kimble"], "answer": 1, "explanation": "Mike Bailey was the basketball coach, and Allen says he was like a father to him. Coach Koz was the football coach."}, {"q": "How many games had Bethel's basketball team won the season before Allen joined?", "choices": ["One", "Sixteen", "Seven", "Twelve"], "answer": 0, "explanation": "The team was coming off a 1-18 season, so Bethel matched that whole win total by winning Allen's first game."}, {"q": "Who was the other star freshman guard on Bethel's team?", "choices": ["Damon Bacote", "Kelly Rodgers", "Tony Rutland", "Faisal Abraham"], "answer": 2, "explanation": "Tony Rutland was a freshman guard like Allen who could also score. Damon Bacote and Faisal Abraham played for other schools."}, {"q": "What did Coach Bailey call Allen and Tony early on?", "choices": ["His \"terrible twos\"", "His \"dynamic duo\"", "His \"twin towers\"", "His \"fast breakers\""], "answer": 0, "explanation": "Coach Bailey called them his \"terrible twos\" because both wanted the ball and both always thought they were open."}, {"q": "How many points did Allen score in the sophomore-year win over Hampton?", "choices": ["15", "21", "42", "39"], "answer": 3, "explanation": "Allen scored 39 points and grabbed 13 rebounds as Bethel beat Hampton 83-72."}, {"q": "Why did Coach Bailey sometimes drive around the neighborhood?", "choices": ["To scout other teams' games", "To look for Allen when he was not at school", "To sell tickets to Bethel's games", "To give the whole team rides to practice"], "answer": 1, "explanation": "Coach Bailey drove to places Allen should not have been, looking for him when he was not where he was supposed to be, which was school."}, {"q": "Why had Tony practiced with the basketball team before Allen each year?", "choices": ["Allen was suspended from school", "Allen had moved to another city", "Allen was still busy playing football", "Tony was the coach's son"], "answer": 2, "explanation": "Tony did not play football, so he started basketball practice while Allen was still finishing the football season."}, {"q": "In the district tournament sophomore year, what happened after Bethel beat Menchville?", "choices": ["Bethel lost to Hampton in the semifinals", "Bethel won the district championship", "Bethel played Kecoughtan in the finals", "Allen got hurt and missed the next game"], "answer": 0, "explanation": "After Allen scored 42 points to beat Menchville, Bethel lost to Hampton in the district semifinals, ending the season."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's football championship season", "Allen's first two basketball seasons at Bethel and how the team got better", "Allen's family life at home", "Allen's first season in the NBA"], "answer": 1, "explanation": "The chapter covers Allen's freshman and sophomore basketball seasons, when Bethel went from one win a year to a real contender."}, {"q": "What style of play did Coach Bailey want from his team?", "choices": ["Slow the game down and hold the ball", "Focus only on three-point shots", "Let one player take every shot", "Grab the rebound and run fast on offense"], "answer": 3, "explanation": "Coach Bailey told his players to get the rebound and sprint out, copying the fast transition style of Loyola Marymount."}, {"q": "How did Allen most likely feel when Hampton knocked Bethel out of the district semifinals?", "choices": ["Relieved that the season was over", "Happy with how far the team had come", "Frustrated and determined not to lose again", "Ready to quit basketball for good"], "answer": 2, "explanation": "Allen says he could not stand losing, hated it, and was determined not to let it happen again."}, {"q": "Why was Allen so excited about his 13 rebounds against Hampton?", "choices": ["Bethel was a small team, and he showed they could battle inside", "It set a state record for rebounds", "It was the first rebound of his career", "Coach Bailey gave a prize for rebounds"], "answer": 0, "explanation": "People wondered if small Bethel could hold up inside, so beating Hampton on the boards made Allen especially proud."}, {"q": "The Crabbers \"clobbered\" Bethel 128-89. What does \"clobbered\" mean?", "choices": ["Barely beat them", "Beat them badly", "Played them to a tie", "Lost to them"], "answer": 1, "explanation": "Clobbered means beaten badly. Hampton won that game by 39 points."}, {"q": "Allen said the team was more \"confident\" sophomore year. What does \"confident\" mean?", "choices": ["Afraid of losing", "Tired and weak", "Sure of themselves", "Angry at the coach"], "answer": 2, "explanation": "Confident means believing in yourself. After the 10-0 football season, the players felt sure they could win."}, {"q": "Allen scored 42 points, the most by anyone in the district all year, against which team?", "choices": ["Hampton", "Gloucester", "Phoebus", "Menchville"], "answer": 3, "explanation": "Allen scored 42 points against Menchville in the district tournament, the highest total in the district that season."}]}, {"id": "ch9-summer-of-1992", "num": "9", "part": "Part II — My Trials On and Off the Court", "title": "The Summer of 1992", "bank": [{"q": "Whose AAU team did Allen play for in the summer of 1992?", "choices": ["Coach Koz's team", "Boo Williams's team", "Mike Bailey's team", "Alonzo Mourning's team"], "answer": 1, "explanation": "Allen played for Boo Williams's team. Boo Williams had run the summer leagues in Virginia since the early 1980s."}, {"q": "Who was the coach of Allen's AAU travel team?", "choices": ["Coach Koz", "Boo Williams", "Mike Bailey", "Bill Tose"], "answer": 3, "explanation": "Bill Tose coached the team. He was a tough coach who often reminded the players about the team's 1988 national championship."}, {"q": "Which famous player had won the AAU national championship with the Hoyas in 1988?", "choices": ["Alonzo Mourning", "Joe Smith", "Jerry Stackhouse", "Shaquille O'Neal"], "answer": 0, "explanation": "Coach Tose kept reminding the team that the Hoyas had won the 1988 national championship with Alonzo Mourning."}, {"q": "How many points did Allen score in the final of the Boo Williams Summer League?", "choices": ["21", "25", "35", "46"], "answer": 2, "explanation": "Allen scored 35 points in the final of the Boo Williams Summer League and won the MVP trophy."}, {"q": "Which teammate later became the first pick in the NBA Draft?", "choices": ["Joe Smith", "Tony Rutland", "Faisal Abraham", "Damon Bacote"], "answer": 0, "explanation": "Joe Smith, from Maury High School in Norfolk, later starred at Maryland and was the first pick in the NBA Draft the year before Allen."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's first year of high school football", "How Allen met his girlfriend Tawanna", "A vacation Allen took with his family", "A painful summer of losing friends while Allen became a national AAU star"], "answer": 3, "explanation": "The chapter tells about the deaths of people Allen knew that summer and how he poured his energy into basketball, ending with the AAU national championship."}, {"q": "What did the basketball court mean to Allen during this hard time?", "choices": ["A place where college scouts could watch him", "A safe place where his troubles disappeared", "A place to hang out with kids from other schools", "A way to earn money for his family"], "answer": 1, "explanation": "Allen calls the court his 'sanctuary.' When he stepped onto the court, the drama and chaos in his life disappeared."}, {"q": "What lesson did Allen learn from losing the first tournament final to the Florida team?", "choices": ["He needed to practice free throws more.", "He should let older players take the big shots.", "He could not hold back — he had to be the main player.", "His team was not good enough to win a title."], "answer": 2, "explanation": "After the close loss, Allen realized he 'couldn't defer' — he had to be the guy who led the team."}, {"q": "Why did Allen keep working so hard at sports even with trouble all around him?", "choices": ["His mom had told him he could make it in sports and was worth more than street life.", "His coaches promised him a college scholarship.", "His friends dared him to become famous.", "He wanted to move to Philadelphia."], "answer": 0, "explanation": "Allen remembered what his mom told him when he was eight — that he could make it in basketball or football — and he believed her."}, {"q": "In the game against the Cleveland team, what happened after Allen passed the ball to Faisal at the end of regulation?", "choices": ["Faisal missed the shot and the team lost.", "Faisal passed it back to Allen for a three-pointer.", "Faisal dunked it to tie the game and force overtime.", "The referee called a foul on Faisal."], "answer": 2, "explanation": "With the team down two points at the end, Allen passed to Faisal, who dunked the ball to send the game to overtime."}, {"q": "What happened after Allen fouled out of the championship game?", "choices": ["The other team came back and won.", "Tarik Turner scored on a spin move and the team held on to win.", "The game was stopped because of the crowd.", "Coach Tose put Allen back in the game."], "answer": 1, "explanation": "After the score was tied at 78, Tarik Turner made a spin move to score, and the team made enough free throws to win."}, {"q": "How did Allen most likely feel when Nike invited him to their camp?", "choices": ["Worried that he was not ready", "Angry that Joe Smith was invited too", "Bored, because he expected it", "Proud, like he belonged with the best players"], "answer": 3, "explanation": "Allen says he thought, in his own words, that he was 'the real' deal when he got the invitation — he felt proud and confident."}, {"q": "How did Allen most likely feel watching the end of the final from the bench?", "choices": ["Relieved that he could finally rest", "Nervous, because he wanted to be out there helping his team", "Happy that his teammates got more playing time", "Angry at the referees for the whole game"], "answer": 1, "explanation": "Allen says, 'you know how hard that must have been for me to watch the end from the bench' — he hated not being able to play."}, {"q": "In this chapter, the word 'sanctuary' means", "choices": ["a safe, peaceful place", "a large sports arena", "a church choir", "a secret hideout for a team"], "answer": 0, "explanation": "Allen calls the court his sanctuary because it was the safe place where his problems went away."}, {"q": "Joe Smith went to Maryland and won 'all kinds of accolades.' The word 'accolades' means", "choices": ["basketball drills", "college classes", "awards and honors", "team uniforms"], "answer": 2, "explanation": "Accolades are awards and praise. Joe Smith won many honors at Maryland before becoming the first pick in the NBA Draft."}]}, {"id": "ch10-junior-year", "num": "10", "part": "Part II — My Trials On and Off the Court", "title": "Junior Year", "bank": [{"q": "What was the name of the girl Allen started dating?", "choices": ["Ann Turner", "Ethel Mitchell", "Tawanna Turner", "Tarik Turner"], "answer": 2, "explanation": "Allen met Tawanna Turner when he was sixteen. They bumped into each other in a hallway and were together almost every day after that."}, {"q": "Which school did Tawanna attend?", "choices": ["Kecoughtan", "Bethel", "Hampton", "Phoebus"], "answer": 0, "explanation": "Tawanna was a student at Kecoughtan, Bethel's rival, and kids at her school talked trash about Allen."}, {"q": "Who played quarterback at the start of the first game while Allen was hurt?", "choices": ["Mike Jackson", "Xavier Gunn", "Kelly Rodgers", "Chris Gaskell"], "answer": 1, "explanation": "Allen had injured his thumb, so Xavier Gunn took the snaps at quarterback against Lafayette. Allen still played safety."}, {"q": "Who kicked the winning 40-yard field goal against Norcom?", "choices": ["Aaron Brooks", "Michael Simmons", "Bobby Simms", "Wilton Evans"], "answer": 3, "explanation": "Wilton Evans kicked the 40-yard field goal in the fourth quarter. He had never made one that long in a game before."}, {"q": "What was the final score of the state championship game against EC Glass?", "choices": ["30-10", "27-0", "21-0", "75-15"], "answer": 1, "explanation": "Bethel beat EC Glass 27-0 in Lynchburg to win the state championship."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's junior football season, which ended with a state championship", "Allen's first summer playing AAU basketball", "Allen's decision to quit sports and focus on school", "Allen's move to a new city"], "answer": 0, "explanation": "The chapter follows the Bethel football team through Allen's junior year, ending with the state title win over EC Glass."}, {"q": "Why was the playoff game against Huguenot so special?", "choices": ["It was Allen's first game at quarterback.", "Bethel won by more than 50 points.", "Bethel came back from 16-0 down in the fourth quarter and won in overtime.", "It was played in front of the smallest crowd of the year."], "answer": 2, "explanation": "Bethel was losing 16-0 late in the game, tied it up, and won in overtime when Allen ran the ball into the end zone."}, {"q": "Why did the team vote before the championship mean so much to Allen?", "choices": ["It let him skip the last practice.", "It proved the coach liked him best.", "It meant he would get to play quarterback all game.", "His teammates stood up for him like family."], "answer": 3, "explanation": "The whole team voted that Allen should play. He said he would never forget that loyalty — 'Those dudes were family.'"}, {"q": "What happened after Coach Koz said Allen would not play in the championship?", "choices": ["Allen's mom called the coach to complain.", "Xavier and Mike, the senior leaders, went and talked to the coach.", "Allen decided to quit the team.", "The game was canceled because of snow."], "answer": 1, "explanation": "Xavier and Mike told the coach the team had come this far together and could not stop now. Coach Koz then let the whole team vote."}, {"q": "Why did Bethel have to beat Hampton to make the playoffs?", "choices": ["They had already lost two games that season.", "Hampton had challenged them to a special game.", "The other playoff teams had dropped out.", "Their coach had promised the school a win."], "answer": 0, "explanation": "After losses to Denbigh and Phoebus, Bethel did not win the district, so beating Hampton was their only way into the playoffs."}, {"q": "What did Allen do with the opening kickoff against Kecoughtan?", "choices": ["He fumbled it and Kecoughtan recovered.", "He handed it off to Thrilla.", "He ran it back for a touchdown.", "He called for a fair catch."], "answer": 2, "explanation": "Kecoughtan had talked about stopping Allen, but they kicked him the ball on the first play, and he returned it for a touchdown."}, {"q": "How did Allen most likely feel when the whole team voted for him to play?", "choices": ["Embarrassed in front of the seniors", "Angry that they had to vote at all", "Worried they would change their minds", "Thankful and moved by their support"], "answer": 3, "explanation": "Allen acted like he expected it, but he said he could not describe how it made him feel to have the guys stand up for him."}, {"q": "How did Allen most likely feel watching the offense struggle against Phoebus while he was held out?", "choices": ["Frustrated, because he wanted to be out there helping", "Relieved to rest his sore shoulder", "Happy that other players got a chance", "Calm, because he knew they would win anyway"], "answer": 0, "explanation": "Allen says he was 'going crazy' watching the offense fail to score, and he begged the coach to at least let him return punts."}, {"q": "After Bethel beat Hampton, the fans felt 'jubilation.' The word 'jubilation' means", "choices": ["confusion", "fear", "great joy", "anger"], "answer": 2, "explanation": "Jubilation means great happiness and celebration. The fans went crazy after Bethel beat their biggest rival."}, {"q": "Allen told the kicker to 'visualize' the ball going through the uprights. To visualize means to", "choices": ["practice over and over", "picture something in your mind", "shout encouragement", "watch a video of a game"], "answer": 1, "explanation": "To visualize is to see something in your mind before it happens. Allen always pictured what he wanted his body to do, then did it."}]}, {"id": "ch11-six-seconds", "num": "11", "part": "Part II — My Trials On and Off the Court", "title": "Six Seconds", "bank": [{"q": "How many days after the football championship did Allen play his first basketball game?", "choices": ["One day", "Three days", "One week", "One month"], "answer": 1, "explanation": "The football championship was Saturday, December 12, and the first basketball game was Tuesday, December 15 — three days later."}, {"q": "Who was Allen's high school basketball coach?", "choices": ["Coach Koz", "Bill Tose", "Boo Williams", "Mike Bailey"], "answer": 3, "explanation": "Mike Bailey was the basketball coach at Bethel. Allen joined his practice the Monday before the first game."}, {"q": "What did Allen do six seconds into the first game of the season?", "choices": ["He stole the ball and dunked it.", "He hit a three-pointer from half-court.", "He fouled the other team's best player.", "He passed to Tony Rutland for a layup."], "answer": 0, "explanation": "On the first play, Allen jumped the passing lane, stole the ball, and dunked it. Even the other team's crowd got excited."}, {"q": "How many points did Allen score against Huguenot in the Christmas tournament?", "choices": ["37", "42", "46", "51"], "answer": 2, "explanation": "Allen scored 46 points against Huguenot. The crowd chanted for five more so he could break the tournament record of 51."}, {"q": "What did Allen's friends promise him if he scored 40 points in a game?", "choices": ["His first real chain, a herringbone", "A new pair of shoes", "A ride to every game", "Tickets to a 76ers game"], "answer": 0, "explanation": "His friends said they would get him his first real chain, a herringbone, if he scored 40. He later wore it in his first Sports Illustrated photo shoot."}, {"q": "What is this chapter mostly about?", "choices": ["Allen's last football season at Bethel", "Allen's summer playing AAU basketball", "The start of Allen's junior basketball season and learning to lead his team", "Allen's first year at Georgetown"], "answer": 2, "explanation": "The chapter covers the beginning of the basketball season — the amazing first game, the tough losses, the fights with Coach Bailey, and Allen figuring out how to lead."}, {"q": "What lesson did Allen learn from the Menchville game?", "choices": ["He should always listen to the crowd.", "The team needed him to score and lead, not just pass.", "Passing was more important than shooting.", "He needed more practice time."], "answer": 1, "explanation": "When Allen only passed, the team fell way behind. When he started shooting in the second half, the team scored 37 points in the fourth quarter and won."}, {"q": "Why is the chapter called 'Six Seconds'?", "choices": ["That was how long the last play of the season took.", "Allen had six seconds left on the clock to win a game.", "The team had six seconds of practice before the first game.", "Six seconds into the first game, Allen showed everyone how great he would be."], "answer": 3, "explanation": "Allen's steal and dunk came just six seconds into the season, and it announced that he was going to be a basketball star."}, {"q": "Why did Coach Bailey make Allen sit out the Denbigh game?", "choices": ["Allen was hurt from football season.", "Allen had been rude to a referee.", "Allen had missed a practice.", "Allen's grades were too low."], "answer": 2, "explanation": "Allen missed a practice, so Coach Bailey sat him for the game. Bailey even got Mo and Allen's mom to agree with the decision."}, {"q": "What happened after Allen told Coach Bailey to stop telling him what to do?", "choices": ["Coach Bailey took him out of the game.", "Coach Bailey called a timeout to calm him down.", "The referee gave Allen a technical foul.", "The team came back and beat Hampton."], "answer": 0, "explanation": "Coach Bailey took Allen right out of the game, and after Allen said something else in the huddle, Bailey benched him for the rest of it."}, {"q": "Why did Allen only pass the ball in the first half against Menchville?", "choices": ["Coach Bailey ordered him not to shoot.", "He wanted to prove he was not selfish.", "His shooting hand was injured.", "He wanted Tony Rutland to break a record."], "answer": 1, "explanation": "After Xavier called him selfish, Allen decided to show everyone what it would look like if he never shot — and the team fell behind 41-25."}, {"q": "How did Allen's mom most likely feel when she was handed the ball after his 1,000th point?", "choices": ["Confused about why the game stopped", "Embarrassed to be in front of the crowd", "Upset that the game was delayed", "Proud and full of joy"], "answer": 3, "explanation": "The book says you should have seen her smiling. She had taken Allen to his first practice and told him he would make it."}, {"q": "How did Allen most likely feel when Rutland's last shot missed and Bethel lost to Hampton?", "choices": ["Glad the game was finally over", "Disappointed, but aware the season was still long", "Angry at Rutland for taking the shot", "Certain the team would never beat Hampton"], "answer": 1, "explanation": "It was the team's first loss, but Allen says he knew it was only a December game and the whole rest of the season was still ahead."}, {"q": "Hampton was Bethel's biggest 'rival.' A rival is", "choices": ["a team that plays in a different state", "a player who gets traded", "a team you compete against and really want to beat", "a coach from another sport"], "answer": 2, "explanation": "A rival is an opponent you battle with again and again. Hampton and Bethel were rivals in both football and basketball."}, {"q": "The first three basketball games were 'postponed.' Postponed means", "choices": ["moved to a later time", "canceled forever", "played in a bigger gym", "won by forfeit"], "answer": 0, "explanation": "Postponed means delayed until later. The games were pushed back because of all the excitement over the football championship."}]}, {"id": "ch12-the-bowling-alley", "num": "12", "par
