was not about him.", "Shaken, because painful memories of his own trial came flooding back."], "answer": 3, "explanation": "Iverson calls it the whiplash of his life, remembering the word guilty at his own trial and the fifteen-year sentence."}, {"q": "How did Iverson feel when he heard the jury found his dad guilty?", "choices": ["Hurt and disappointed, but not surprised.", "Shocked, because he was sure his dad would win.", "Relieved that the trial was finally over.", "Confident the sentence would be short."], "answer": 0, "explanation": "Iverson says he knew better than to be hopeful, so the guilty verdict did not surprise him, but it still hurt and disappointed him."}, {"q": "In this chapter, \"criticism\" means", "choices": ["advice from a coach about basketball skills.", "people saying negative things about someone.", "questions asked by lawyers in court.", "cheering from fans at a game."], "answer": 1, "explanation": "Iverson faced criticism when reporters and other players kept saying negative things about him, even while he was winning the award."}, {"q": "Iverson \"testified\" at his dad's trial. What does \"testified\" mean?", "choices": ["Argued with the judge", "Paid for the lawyers", "Spoke as a witness in court", "Watched quietly from the back row"], "answer": 2, "explanation": "Iverson planned to testify, which means he took the stand and told the courtroom what he knew about his dad and their family."}]}, {"id": "ch40-coach-larry-brown", "num": "40", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "Coach Larry Brown", "bank": [{"q": "Who did the Sixers hire as their new head coach?", "choices": ["John Thompson", "Larry Brown", "Billy King", "Pat Croce"], "answer": 1, "explanation": "The Sixers hired Larry Brown, who had just left his job coaching the Indiana Pacers, without asking Iverson first."}, {"q": "What part of practice did Coach Brown love that Iverson disliked?", "choices": ["Scrimmages at the end of practice", "Free-throw contests", "Watching game film", "Drills and fundamentals"], "answer": 3, "explanation": "Coach Brown was obsessed with drills and fundamentals and stopped practice constantly, while Iverson only looked forward to scrimmaging."}, {"q": "Who became Iverson's bodyguard and friend for years?", "choices": ["Terry Royster", "Eric Snow", "Bill Bonsiewicz", "Matt Geiger"], "answer": 0, "explanation": "After the summer arrest, Croce and Iverson's team convinced him to hire a bodyguard, and Terry Royster stayed at his side for years."}, {"q": "Which team beat the Sixers in the playoffs in both 1999 and 2000?", "choices": ["The Detroit Pistons", "The Miami Heat", "The Indiana Pacers", "The Chicago Bulls"], "answer": 2, "explanation": "The Indiana Pacers ended the Sixers' playoff runs both years, sweeping them in 1999 and winning four games to two in 2000."}, {"q": "The exhibition game at Temple started at 7:30. When did Iverson show up?", "choices": ["An hour early", "At halftime", "Right at 7:30", "At 7:27, three minutes before game time"], "answer": 3, "explanation": "Iverson arrived at 7:27, and by the time he got his uniform on, the game had already started."}, {"q": "What did Iverson tell reporters after Coach Brown benched him against Detroit?", "choices": ["That the team should trade him if they would disrespect him that way.", "That he planned to retire at the end of the season.", "That Coach Brown was the best coach he ever had.", "That he would never play in Detroit again."], "answer": 0, "explanation": "Iverson was humiliated after sitting the whole fourth quarter, so he told the press the team should trade him — the first time he ever said that."}, {"q": "Why was Iverson arrested in Virginia the summer after his rookie year?", "choices": ["He got into a fight at a bowling alley.", "He missed a court date from high school.", "Police stopped his speeding car and found marijuana and a gun without a Virginia permit.", "He was blamed for a crash on the highway."], "answer": 2, "explanation": "A police officer pulled the car over for speeding, said he smelled marijuana, and found marijuana and Iverson's gun, which was only registered in Pennsylvania."}, {"q": "Why did Iverson stop smoking marijuana after his arrest?", "choices": ["His mom asked him to stop.", "Probation drug tests made him afraid of losing his career.", "Coach Brown promised to make him captain if he quit.", "His doctor warned him about his health."], "answer": 1, "explanation": "On probation he was constantly tested, so he gave it up because he was scared it could end his career."}, {"q": "What happened right after the team suspended Iverson in Miami?", "choices": ["Iverson was traded to Detroit.", "The Sixers won the championship.", "Coach Brown quit the team.", "The Sixers lost that game, then won their next seven."], "answer": 3, "explanation": "The Sixers lost the game Iverson was forced to sit out, but the insult fueled him, and the team won the next seven games."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's rocky but growing relationship with Coach Larry Brown.", "Iverson's childhood in Virginia.", "Iverson's first season at Georgetown.", "How Iverson designed his own sneakers."], "answer": 0, "explanation": "The chapter shows Iverson and Coach Brown fighting over practice and playing time, while the coach's moves slowly made Iverson and the team better."}, {"q": "What is the short section \"An Invitation\" mostly about?", "choices": ["Iverson being drafted by the 76ers.", "Iverson being picked for the NBA's 75th Anniversary Team years after retiring.", "Iverson's first All-Star Game.", "Iverson signing with Reebok."], "answer": 1, "explanation": "In \"An Invitation,\" a retired Iverson gets a call saying he was selected as one of the seventy-five greatest players in NBA history."}, {"q": "How did Iverson most likely feel sitting on the bench for the whole fourth quarter in Detroit?", "choices": ["Relaxed, because he needed the rest.", "Proud of his teammates.", "Embarrassed and angry.", "Glad the season was almost over."], "answer": 2, "explanation": "Iverson says he was mad and humiliated, since nothing like that had ever happened to him in college or the NBA."}, {"q": "How did Iverson feel after losing game six to Indiana in 2000?", "choices": ["He was calm because the team had improved.", "He was heartbroken and could not hide his tears.", "He was angry at his mom for coming to the game.", "He was excited to start his summer vacation."], "answer": 1, "explanation": "In the locker room Iverson could not hide the tears, and his mom consoled him, just like after the Big East Championship loss at Georgetown."}, {"q": "Iverson was \"suspended\" for a game in Miami. What does \"suspended\" mean?", "choices": ["Given extra playing time", "Made team captain", "Fined a week's pay", "Not allowed to play for a time"], "answer": 3, "explanation": "Being suspended meant Iverson had to sit out and watch the game instead of playing, as punishment for missing the shootaround."}, {"q": "Coach Brown drilled the team on \"fundamentals.\" What are fundamentals?", "choices": ["The basic skills of the game", "The team's travel plans", "Trick plays used at the end of games", "The rules about uniforms"], "answer": 0, "explanation": "Fundamentals are basic skills, like setting screens the right way and making correct defensive rotations, which Coach Brown stopped practice to teach."}]}, {"id": "ch41-staying-in-philly", "num": "41", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "Staying in Philly", "bank": [{"q": "Who called Iverson with the news about the trade?", "choices": ["Coach Larry Brown", "Pat Croce", "Matt Geiger", "His mom"], "answer": 1, "explanation": "Pat Croce called Iverson in Virginia and said, \"Bubba, I'm sorry,\" before telling him he was about to be traded."}, {"q": "Which team was Iverson about to be traded to?", "choices": ["Indiana", "Seattle", "Miami", "Detroit"], "answer": 3, "explanation": "Croce told Iverson the trade would send him to Detroit."}, {"q": "Where was Iverson when he got the phone call?", "choices": ["In Virginia, taking time off", "At the Sixers' arena in Philadelphia", "On vacation in Miami", "At Georgetown visiting his coach"], "answer": 0, "explanation": "It was the summer of 2000, a few weeks after the playoffs ended, and Iverson was in Virginia taking some time off."}, {"q": "Which teammate's decision stopped the trade?", "choices": ["Eric Snow", "Aaron McKie", "Matt Geiger", "Theo Ratliff"], "answer": 2, "explanation": "Matt Geiger refused to give up the special bonus in his contract, and that caused the whole trade to fall apart."}, {"q": "What was in Geiger's contract that mattered so much?", "choices": ["A trade kicker paying him an extra 15 percent of his salary if traded", "A rule that he could never be traded", "A promise that he would start every game", "A bonus for making the All-Star team"], "answer": 0, "explanation": "Geiger's contract had a trade kicker: if he was traded, he would get an extra 15 percent of his salary."}, {"q": "What happened after Geiger said no to giving up his bonus?", "choices": ["The Pistons paid the bonus anyway.", "Iverson was traded by himself instead.", "Geiger was released by the Sixers.", "The whole trade was canceled."], "answer": 3, "explanation": "Because the Pistons would not pay the bonus and Geiger would not give it up, the entire trade was terminated and Iverson stayed in Philadelphia."}, {"q": "Why did the Pistons want Geiger to give up his trade kicker?", "choices": ["They thought it was against league rules.", "They did not want to pay him the extra money.", "They wanted to give the money to Iverson.", "They planned to cut him from the team."], "answer": 1, "explanation": "The Pistons did not want to pay the extra 15 percent of Geiger's salary, so they asked him to waive it."}, {"q": "What did Iverson do after the trade fell through?", "choices": ["He asked the Sixers to trade him somewhere warmer.", "He took the rest of the year off from basketball.", "He told Coach Brown he wanted to be team captain for the first time.", "He decided to sign with Detroit as a free agent."], "answer": 2, "explanation": "The scare made Iverson more committed; he spoke to Coach Brown and asked to be team captain, and Brown agreed."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson almost getting traded and deciding to change after staying.", "Iverson's first playoff win with the Sixers.", "Iverson's friendship with Pat Croce.", "How the Sixers picked their new coach."], "answer": 0, "explanation": "The chapter tells how the trade to Detroit almost happened, how it collapsed, and how it pushed Iverson to commit more to his team."}, {"q": "What lesson did the near-trade teach Iverson?", "choices": ["That he should stop trusting his teammates.", "That the fans in Philadelphia had turned on him.", "That he needed to commit more to what Coach Brown wanted.", "That he should hire a new agent."], "answer": 2, "explanation": "Iverson says the near-trade stuck with him and made him determined to be more committed to what Coach Brown wanted."}, {"q": "How did Iverson feel when he heard he was about to be traded?", "choices": ["Excited to play for a new team", "Calm, because he expected it", "Happy to move closer to home", "Shocked and deeply hurt"], "answer": 3, "explanation": "Raw emotion came pouring out; Iverson says he was shocked and disappointed, and it felt almost as bad as hearing his fifteen-year sentence."}, {"q": "How did Iverson most likely feel toward Matt Geiger after learning the truth?", "choices": ["Thankful", "Jealous", "Suspicious", "Annoyed"], "answer": 0, "explanation": "Iverson says Geiger's choice saved him, and he even writes, \"Thank you, Matt Geiger.\""}, {"q": "Iverson \"pleaded\" with Pat Croce on the phone. What does \"pleaded\" mean?", "choices": ["Joked", "Argued angrily", "Begged", "Agreed"], "answer": 2, "explanation": "Iverson begged Croce for one more chance, promising he would change."}, {"q": "The Sixers were \"eliminated\" from the playoffs. What does \"eliminated\" mean?", "choices": ["Rewarded with a trophy", "Knocked out of the competition", "Moved to a new city", "Given extra games to play"], "answer": 1, "explanation": "Being eliminated means the Sixers lost their playoff series and were out of the competition for that season."}, {"q": "Whose wise words did Iverson remember when he heard the news?", "choices": ["Coach Bailey's", "Nana's: \"Never question God.\"", "His sister's", "Coach Thompson's"], "answer": 1, "explanation": "Iverson thought of Nana's words, \"Never question God,\" even though he admits he was questioning in that moment."}]}, {"id": "ch42-the-2000-2001-regular-season", "num": "42", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "The 2000–2001 Regular Season", "bank": [{"q": "How many games in a row did the Sixers win to start the season?", "choices": ["Five", "Ten", "Fifteen", "Twenty"], "answer": 1, "explanation": "The chapter says the season's beginning was perfect: 'We won our first ten games.'"}, {"q": "Who moved into the starting lineup when Eric Snow got hurt?", "choices": ["Aaron McKie", "George Lynch", "Tyrone Hill", "Theo Ratliff"], "answer": 0, "explanation": "When Snow went out with an injury, Aaron McKie moved from sixth man to starter."}, {"q": "Why did Iverson call a team meeting with Coach Brown?", "choices": ["To ask for more playing time", "To talk about trade rumors", "To ask Coach Brown to stop being so negative", "To plan for the playoffs"], "answer": 2, "explanation": "After Coach Brown spent a half hour criticizing the team, Iverson stood up in a meeting and told him to lighten up and stop being so negative."}, {"q": "What did Coach Brown do after the team meeting?", "choices": ["He benched Iverson for a week", "He apologized to the whole team right away", "He quit as coach of the Sixers", "He left and missed a couple of practices"], "answer": 3, "explanation": "Coach Brown left the practice facility and disappeared for a few days, missing practices, before coming back on the third day."}, {"q": "Which team blew out the Sixers in December?", "choices": ["The Indiana Pacers", "The Dallas Mavericks", "The Utah Jazz", "The Atlanta Hawks"], "answer": 1, "explanation": "The chapter says that in December, 'we got blown out by the Dallas Mavericks,' which led to Coach Brown's long negative talk."}, {"q": "Where was the All-Star Game held that February?", "choices": ["Philadelphia", "Cleveland", "Washington, DC", "Los Angeles"], "answer": 2, "explanation": "The All-Star Game was held in DC, which Iverson calls his 'home away from home.'"}, {"q": "Which Sixers player was traded to the Atlanta Hawks for Dikembe Mutombo?", "choices": ["Theo Ratliff", "Eric Snow", "Aaron McKie", "George Lynch"], "answer": 0, "explanation": "A couple of weeks after the All-Star Game, the team traded Theo Ratliff, who had a wrist injury, to Atlanta for Dikembe Mutombo."}, {"q": "How did Iverson most likely feel when he heard Coach Brown might quit?", "choices": ["Happy, because they always argued", "Bored, because he did not care", "Confused, because he wanted a new coach", "Worried, because he did not want to lose him"], "answer": 3, "explanation": "Iverson says you sometimes do not realize what you have until you almost lose it — and he writes plainly that he did not want to lose Coach Brown."}, {"q": "What is this chapter mostly about?", "choices": ["Iverson's childhood in Newport News", "The Sixers' great season and Iverson's changing relationship with Coach Brown", "How Iverson chose his sneaker company", "The history of the All-Star Game"], "answer": 1, "explanation": "The chapter covers the team's hot start, the fight and make-up with Coach Brown, the All-Star Game, and the big trade before the playoffs."}, {"q": "Why did Coach Brown pu /* ============ STATE ============ */
const LS_KEY = "sotc-exam-misunderstood-ms-v1";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveRecords(r) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(r)); } catch (e) {}
}
let records = loadRecords();
let view = { name: "home" };
let quiz = null; // {chIdx, questions:[{q,choices,answer,explanation}], picked:[null,...]}

/* ============ HELPERS ============ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
const LETTERS = ["A", "B", "C", "D"];

function buildQuiz(chIdx) {
  const bank = BOOK.chapters[chIdx].bank;
  const n = Math.min(BOOK.perQuiz, bank.length);
  const qs = shuffle(bank).slice(0, n).map(src => {
    const order = shuffle([0, 1, 2, 3]);
    return {
      q: src.q,
      choices: order.map(i => src.choices[i]),
      answer: order.indexOf(src.answer),
      explanation: src.explanation
    };
  });
  return { chIdx, questions: qs, picked: qs.map(() => null) };
}
function needToPass(n) { return Math.ceil(n * BOOK.passPct / 100); }

/* ============ RENDER: HOME ============ */
function renderHome() {
  const passedCount = BOOK.chapters.filter(c => (records[c.id] || {}).passed).length;
  let rows = "";
  let lastPart = null;
  BOOK.chapters.forEach((c, i) => {
    if (c.part !== lastPart) {
      if (lastPart !== null) rows += "</ul>";
      rows += `<div class="part-label">${esc(c.part)}</div><ul class="roster">`;
      lastPart = c.part;
    }
    const rec = records[c.id] || {};
    const passed = !!rec.passed;
    let chip, stats;
    if (passed) {
      chip = `<span class="chip passed">Passed ✓</span>`;
      stats = `Best score ${rec.best}% · ${rec.attempts} attempt${rec.attempts === 1 ? "" : "s"}`;
    } else if (rec.attempts) {
      chip = `<span class="chip attempted">Best ${rec.best}%</span>`;
      stats = `${rec.attempts} attempt${rec.attempts === 1 ? "" : "s"} · need ${BOOK.passPct}% to pass`;
    } else {
      chip = `<span class="chip">Not started</span>`;
      stats = `${c.bank.length} questions in the bank · ${Math.min(BOOK.perQuiz, c.bank.length)} per exam`;
    }
    rows += `
      <li><button class="ch-row ${passed ? "is-passed" : ""}" data-ch="${i}">
        <span class="qnum">${esc(c.num)}</span>
        <span class="meta">
          <p class="title">${esc(c.title)}</p>
          <p class="stats">${stats}</p>
        </span>
        ${chip}
      </button></li>`;
  });
  rows += "</ul>";

  document.getElementById("app").innerHTML = `
    <header class="masthead">
      <div>
        <p class="eyebrow">Science on the Court · Middle School Reading Exam</p>
        <h1>${esc(BOOK.title)}</h1>
        <p class="byline">A memoir by ${esc(BOOK.author)}</p>
      </div>
      <div class="jersey" aria-hidden="true"><span class="num">3</span><span class="lbl">Iverson</span></div>
    </header>
    <div class="scout">
      <p>Read the chapter first, then take its exam. <br>Score <strong>${BOOK.passPct}% or better</strong> to pass — retakes get a fresh set of questions.</p>
      <div class="tally"><span class="big mono">${passedCount}/${BOOK.chapters.length}</span><span class="sub">chapters passed</span></div>
    </div>
    ${rows}
    <p class="rules">Answers are checked only when you submit, just like the real SAT — you can change any answer before then. Your progress saves on this device.</p>
  `;
  document.querySelectorAll(".ch-row").forEach(btn => {
    btn.addEventListener("click", () => {
      quiz = buildQuiz(Number(btn.dataset.ch));
      view = { name: "exam" };
      render();
      window.scrollTo(0, 0);
    });
  });
}

/* ============ RENDER: EXAM ============ */
function renderExam() {
  const ch = BOOK.chapters[quiz.chIdx];
  const total = quiz.questions.length;
  const qsHtml = quiz.questions.map((q, qi) => `
    <fieldset class="q-card" style="border:1px solid var(--line);margin:18px 0;padding:20px;">
      <legend class="q-head" style="padding:0;">
        <span class="qnum">Question ${qi + 1} of ${total}</span>
      </legend>
      <p class="q-text">${esc(q.q)}</p>
      <div class="choices" role="radiogroup" aria-label="Question ${qi + 1} choices">
        ${q.choices.map((c, ci) => `
          <label class="choice ${quiz.picked[qi] === ci ? "selected" : ""}" data-q="${qi}" data-c="${ci}">
            <input type="radio" name="q${qi}" value="${ci}" ${quiz.picked[qi] === ci ? "checked" : ""}>
            <span class="letter">${LETTERS[ci]}</span>
            <span class="ctext">${esc(c)}</span>
          </label>`).join("")}
      </div>
    </fieldset>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="exam-bar">
      <span class="ch">${esc(ch.num)} · ${esc(ch.title)}</span>
      <span class="count mono"><b id="answeredCount">0</b>/${total} answered</span>
      <button class="btn quiet" id="quitBtn">Exit</button>
    </div>
    ${qsHtml}
    <div class="submit-zone">
      <p class="warn" id="submitWarn" hidden>Answer every question before submitting.</p>
      <button class="btn" id="submitBtn">Submit exam</button>
    </div>
  `;

  const updateCount = () => {
    const done = quiz.picked.filter(p => p !== null).length;
    document.getElementById("answeredCount").textContent = done;
  };
  document.querySelectorAll(".choice").forEach(lab => {
    lab.querySelector("input").addEventListener("change", () => {
      const qi = Number(lab.dataset.q), ci = Number(lab.dataset.c);
      quiz.picked[qi] = ci;
      document.querySelectorAll(`.choice[data-q="${qi}"]`).forEach(l => l.classList.remove("selected"));
      lab.classList.add("selected");
      updateCount();
      document.getElementById("submitWarn").hidden = true;
    });
  });
  updateCount();
  document.getElementById("quitBtn").addEventListener("click", () => {
    if (confirm("Exit this exam? Your answers won't be saved.")) {
      quiz = null; view = { name: "home" }; render(); window.scrollTo(0, 0);
    }
  });
  document.getElementById("submitBtn").addEventListener("click", () => {
    if (quiz.picked.some(p => p === null)) {
      document.getElementById("submitWarn").hidden = false;
      const firstBlank = quiz.picked.findIndex(p => p === null);
      const el = document.querySelectorAll(".q-card")[firstBlank];
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    gradeQuiz();
  });
}

/* ============ GRADE ============ */
function gradeQuiz() {
  const total = quiz.questions.length;
  const correct = quiz.questions.reduce((n, q, i) => n + (quiz.picked[i] === q.answer ? 1 : 0), 0);
  const pct = Math.round(correct / total * 100);
  const passed = pct >= BOOK.passPct;
  const ch = BOOK.chapters[quiz.chIdx];
  const rec = records[ch.id] || { attempts: 0, best: 0, passed: false };
  rec.attempts += 1;
  rec.best = Math.max(rec.best, pct);
  rec.passed = rec.passed || passed;
  records[ch.id] = rec;
  saveRecords(records);
  view = { name: "results", correct, total, pct, passed };
  render();
  window.scrollTo(0, 0);
}

/* ============ RENDER: RESULTS ============ */
function renderResults() {
  const { correct, total, pct, passed } = view;
  const ch = BOOK.chapters[quiz.chIdx];
  const need = needToPass(total);
  const review = quiz.questions.map((q, qi) => {
    const yours = quiz.picked[qi];
    const good = yours === q.answer;
    return `
      <div class="q-card r-card ${good ? "good" : "bad"}">
        <div class="q-head">
          <span class="qnum">Q${qi + 1}</span>
          <span class="verdict ${good ? "good" : "bad"}">${good ? "Correct" : "Incorrect"}</span>
        </div>
        <p class="q-text">${esc(q.q)}</p>
        <div class="choices">
          ${q.choices.map((c, ci) => {
            let cls = "choice r-choice";
            if (ci === q.answer) cls += " was-correct";
            else if (ci === yours) cls += " was-wrong";
            return `<div class="${cls}"><span class="letter">${LETTERS[ci]}</span><span class="ctext">${esc(c)}</span></div>`;
          }).join("")}
        </div>
        <p class="explain"><b>Why:</b> ${esc(q.explanation)}</p>
      </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="exam-bar">
      <span class="ch">${esc(ch.num)} · ${esc(ch.title)} — Results</span>
    </div>
    <div class="scoreboard">
      <div class="label">Final score</div>
      <div class="digits">${correct}<span style="opacity:.45">/${total}</span></div>
      <div class="pct">${pct}%</div>
      <div><span class="stamp ${passed ? "pass" : "fail"}">${passed ? "Passed" : "Retake"}</span></div>
      <p class="msg">${passed
        ? "That's a passing score. This chapter is in the books — on to the next one."
        : `You need ${need} of ${total} (${BOOK.passPct}%) to pass. Reread the chapter, check the explanations below, and run it back — the retake draws different questions.`}</p>
    </div>
    <div class="review-h"><span>Answer review</span><span class="key">Green = correct answer · Red = your pick</span></div>
    ${review}
    <div class="end-actions">
      <button class="btn" id="retakeBtn">${passed ? "Take it again" : "Retake — new questions"}</button>
      <button class="btn ghost" id="homeBtn">Back to chapters</button>
    </div>
  `;
  document.getElementById("retakeBtn").addEventListener("click", () => {
    quiz = buildQuiz(quiz.chIdx);
    view = { name: "exam" };
    render();
    window.scrollTo(0, 0);
  });
  document.getElementById("homeBtn").addEventListener("click", () => {
    quiz = null; view = { name: "home" }; render(); window.scrollTo(0, 0);
  });
}

/* ============ ROUTER ============ */
function render() {
  if (view.name === "home") renderHome();
  else if (view.name === "exam") renderExam();
  else renderResults();
}
render();
</script>
