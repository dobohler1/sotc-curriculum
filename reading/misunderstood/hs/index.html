  chapters: [{"id": "prologue-practice", "num": "P", "part": "Prologue", "title": "Practice", "bank": [{"q": "Iverson's primary purpose in opening the memoir with the famous \"practice\" press conference is to", "choices": ["prove that reporters deliberately invented the trade rumors that surrounded him all season", "argue that practice is unimportant for professional athletes at every level", "show how the public fixated on one moment while missing the grief and pressures behind it", "explain the strategy the 76ers used in their playoff series against the Celtics"], "answer": 2, "explanation": "Iverson stresses that while everyone remembers the word \"practice,\" the press ignored his statement that he had lost his best friend and was struggling; the chapter frames the moment as a symbol of being misunderstood."}, {"q": "According to the passage, the press conference took place on", "choices": ["May 7, 2002, after his sixth NBA season ended in disappointment", "October 14, 2001, during the 76ers' training camp", "the day the 76ers reached the NBA Finals", "the day the jury reached a verdict in the trial in Virginia"], "answer": 0, "explanation": "The opening paragraph states the press conference was on May 7, 2002, just after his sixth NBA season had finished in disappointment."}, {"q": "What was the outcome of the meeting between Iverson, Coach Larry Brown, and general manager Billy King?", "choices": ["Iverson agreed to be traded to a team closer to Virginia", "Both Iverson and Coach Brown would stay with the 76ers", "Coach Brown announced his retirement from coaching", "The team decided to keep the meeting's result secret from the press"], "answer": 1, "explanation": "The message of the meeting was \"You're not going anywhere. Coach Brown's not going anywhere,\" and afterward they agreed to call a press conference to share the good news."}, {"q": "It can most reasonably be inferred that Iverson entered the press room feeling", "choices": ["nervous that the reporters had already learned about the trial in Virginia", "eager to criticize his teammates for the early playoff exit", "indifferent, since he no longer cared what Philadelphia thought of him", "upbeat, because he believed he was there to deliver good news"], "answer": 3, "explanation": "He repeats that he \"was good\" and had good news—he was staying—so the city, his teammates, and his family had nothing to worry about."}, {"q": "As used in the passage, \"rumors were circulating\" most nearly means the rumors were", "choices": ["being officially confirmed", "spreading from person to person", "being traced back to their source", "moving in a circle back to the team"], "answer": 1, "explanation": "The rumors about a trade and about conflict with Coach Brown were passing among fans, reporters, teachers, and family—that is, spreading widely."}, {"q": "According to the passage, Rahsaan Langford was killed", "choices": ["in Philadelphia while Iverson was in Virginia for a boxing match", "several years before Iverson entered the NBA", "in the early morning of October 14, 2001, during Sixers training camp", "the same week as the May 2002 press conference"], "answer": 2, "explanation": "The passage states that Ra was killed about seven months before the press conference, \"in the early morning of October 14, 2001,\" during Sixers training camp."}, {"q": "Based on the account of the night at the club, the killer's motive is best described as", "choices": ["a lingering grudge over a joke Ra made about him", "a planned robbery of Ra and Fiend", "revenge for a fight that had happened years earlier", "a case of mistaking Ra for someone else"], "answer": 0, "explanation": "After Ra joked about the man's lazy eye, the man \"went crazy,\" stared at Ra all night, and \"couldn't let it go,\" then followed him out and shot him."}, {"q": "The sentence \"But then the devil entered the room with a microphone\" primarily serves to", "choices": ["suggest that Iverson believed the press conference was cursed from the start", "introduce the prosecutor who spoke at the trial in Virginia", "show that Iverson regretted agreeing to stay in Philadelphia", "mark the turning point when the questioning shifted to practice"], "answer": 3, "explanation": "The line comes right before the first question about practice, dramatically signaling the moment the press conference turned away from his good news."}, {"q": "Which statement about the 2002 playoff series against the Celtics is supported by the passage?", "choices": ["Iverson missed the series because of an injured elbow", "The 76ers lost in five games while Iverson averaged 30 points a game", "The 76ers had home-court advantage but wasted it", "Iverson shot well but refused to take free throws"], "answer": 1, "explanation": "The passage says the Celtics had home court, the 76ers lost the series in five games, and Iverson averaged 30 points a game while taking more than 12 free throws a game."}, {"q": "The passage suggests that Iverson paid for the home, car, and schooling of Ra's family primarily because", "choices": ["a court ordered him to support them after the trial", "he wanted to prove the reporters wrong about his spending", "he felt bound by loyalty to a friend who had once helped him and his family", "Ra had left written instructions asking him to do so"], "answer": 2, "explanation": "Iverson recalls that Ra pushed him off the streets toward sports and helped his family survive while he was in jail, so taking care of Ra's wife and three kids felt like an obligation of loyalty: \"How could I not?\""}, {"q": "As used in the passage, \"focal point\" most nearly means", "choices": ["the center of attention", "a source of disagreement", "an official announcement", "a moment of celebration"], "answer": 0, "explanation": "Iverson argues that practice \"shouldn't have been the focal point\"—that is, it should not have been the main thing everyone concentrated on."}, {"q": "Which choice best states the central idea of the passage about \"home\" and basketball?", "choices": ["Iverson eventually realized his friends from home were holding back his career", "Basketball allowed Iverson to forget the difficulties of his childhood", "Iverson's advisers convinced him to keep his two worlds completely separate", "Though the two worlds pulled against each other, Iverson refused to abandon where he came from"], "answer": 3, "explanation": "Iverson describes home on one side and basketball on the other—\"One pulls, the other pushes\"—and says the one thing he refused to do was let go of the people and place that were his foundation."}, {"q": "Iverson's tone when describing the reporters at the press conference is best characterized as", "choices": ["resentful and exasperated", "amused and forgiving", "detached and clinical", "admiring but cautious"], "answer": 0, "explanation": "He says the press had been \"telling the world what a terrible guy I am\" since he was a kid and that they were \"good at irritating me,\" showing lasting resentment and frustration."}, {"q": "According to the passage, why was Iverson not with Ra on the night of the shooting?", "choices": ["He was recovering from surgery in a Philadelphia hospital", "Ra had asked to go out alone that night", "He missed his plane from Philadelphia to Virginia", "Coach Brown required him to stay for a team practice"], "answer": 2, "explanation": "Iverson says he was supposed to be there to watch the Tyson fight, \"But I missed my plane from Philly to Virginia. I can't even remember why.\""}, {"q": "When Iverson told reporters \"You bleed just like I bleed,\" he was most likely trying to", "choices": ["warn the press that he would stop giving interviews", "remind them that he was a grieving human being, not just a franchise player", "boast that he played through injuries no one else could handle", "announce that he planned to testify at the trial in Virginia"], "answer": 1, "explanation": "He says these words while explaining that he had lost his best friend and felt everything going downhill—\"I'm human. I am just like you\"—asking the press to see his pain rather than focus on practice."}]}, {"id": "ch1-nana-and-mom", "num": "1", "part": "Part I — Growing Up and Surviving", "title": "Nana and Mom", "bank": [{"q": "According to the passage, \"Nana\" was", "choices": ["Iverson's great-grandmother, Ethel Mitchell, who raised his mother and her siblings", "Iverson's maternal grandmother, who died after a surgery in Hartford", "an aunt from Virginia who took the family in after they moved", "a neighbor in Aberdeen who watched Iverson while his mother worked"], "answer": 0, "explanation": "The passage identifies Nana as his great-grandmother, Ethel Mitchell, who agreed to raise her four grandchildren after her daughter—Iverson's maternal grandmother—died."}, {"q": "Which statement about Iverson's birth is supported by the passage?", "choices": ["He was born in Hartford shortly before the family moved south", "He was born in Newport News while his mother was in college", "He was born on June 7, 1975, in Hampton, Virginia, when his mother was fifteen", "He was born after his mother graduated from Bethel High School"], "answer": 2, "explanation": "The chapter opens: \"I was born on June 7, 1975, in Hampton, Virginia. My mom, Ann Iverson, was fifteen.\""}, {"q": "The detail that Iverson's mother could recite the hospital's compensation \"to the penny\"—$3,818.18—chiefly suggests that", "choices": ["the family used the money to pay for the move to Virginia", "the loss of her mother left a permanent mark on her memory", "she believed the hospital had actually been generous", "she was already skilled at managing the family's finances"], "answer": 1, "explanation": "Remembering the exact figure decades later—\"Don't forget the eighteen cents\"—shows how deeply her mother's death and its small compensation stayed with her."}, {"q": "Iverson most likely begins the chapter with events in Hartford in 1971 in order to", "choices": ["explain why he considers Connecticut his true home", "contrast his mother's childhood with his own comfortable one", "show that his biological father came from a wealthy family", "trace the family hardships that shaped his upbringing before he was born"], "answer": 3, "explanation": "The Hartford story—his grandmother's death, Nana taking in four grandchildren, his mother's troubles—establishes the struggles that led the family to Virginia and shaped the world he was born into."}, {"q": "According to the passage, which of the following contributed to Nana's decision to move the family to Virginia?", "choices": ["His mother's fighting, including a final fight after thirty-eight that Nana counted as the last straw", "A job offer Nana had received at the Newport News shipyard", "Advice from Allen Broughton's family, who lived in Hampton", "A doctor's recommendation that Nana live in a warmer climate"], "answer": 0, "explanation": "The passage says his teenage mom was finding trouble—thirty-eight fights—and \"After the last one, Nana was done\"; Nana was also originally from Virginia and disliked her Hartford neighborhood."}, {"q": "As used in the passage, \"compensation\" most nearly means", "choices": ["an apology", "an inheritance", "a payment", "a punishment"], "answer": 2, "explanation": "The $3,818.18 was money the hospital gave the family after their mother died from an infection following surgery."}, {"q": "When Iverson adds \"Sounds familiar\" after describing his mother being told to \"slow down and pass the ball,\" he implies that", "choices": ["his mother later became his first basketball coach", "he heard the same kind of comment about his own style of play", "coaches in Virginia were stricter than coaches in Connecticut", "his mother ignored her coaches and quit the team"], "answer": 1, "explanation": "The aside signals that Iverson recognizes himself in his mother's game—he, too, was known for playing fast and attacking, and drew similar comments."}, {"q": "According to the passage, how did Iverson get the nickname \"Bubbachuck\"?", "choices": ["Announcers at his childhood games invented it", "His great-grandmother combined the names of her two sons", "His father chose it to honor a favorite basketball player", "His mother combined the nicknames of two arguing uncles, Bubba and Chuck"], "answer": 3, "explanation": "Two uncles in Connecticut argued over whose nickname the baby should get, and his mother settled it: \"You know what, you both can be right. Bubbachuck.\""}, {"q": "The anecdote about Iverson falling out of Nana's burgundy car primarily serves to", "choices": ["illustrate, with humor, the closeness and care that defined his early years with Nana", "criticize Nana for failing to supervise the children in her care", "explain why Iverson developed a lifelong fear of highways", "show that the family could not afford a safe, working vehicle"], "answer": 0, "explanation": "The story—Nana's warnings, the cousin snatching him up, his tears of fright—is told fondly to capture how Nana watched over him and how lucky and loved he was."}, {"q": "The passage suggests that the one whipping Nana gave Iverson stayed with him mainly because", "choices": ["it was far harsher than any punishment his mother gave", "it convinced him that the creek was truly dangerous", "disappointing Nana hurt him more than the punishment itself", "Nana never spoke to him about the creek again"], "answer": 2, "explanation": "Iverson says his \"heart just sank\" when he saw her, that letting her down was a feeling he never wanted again, and that she was the person he most wanted to make proud."}, {"q": "Nana's response to Iverson's broken ankle—\"It could have been your chest or your head\"—primarily functioned to", "choices": ["blame the bus driver for the accident", "push him past self-pity by putting the injury in perspective", "warn him to stop playing sports until he was older", "convince him that the doctors were exaggerating the damage"], "answer": 1, "explanation": "Iverson says Nana \"wasn't going to let me have a sympathy party,\" and her words led him to decide the injury would not stop him."}, {"q": "It can be inferred that the doctor gave Iverson a Snickers and questioned his story because the doctor", "choices": ["suspected Iverson had broken the ankle playing football instead", "wanted to distract him before delivering bad news", "believed the injury was too minor to keep him out of school", "doubted a bus could run over so small an ankle without crushing it"], "answer": 3, "explanation": "The doctor said, \"There is no way your ankle could have gotten ran over by a bus. It would be crushed,\" showing disbelief that the small ankle had survived the accident."}, {"q": "As used in the passage, criticism that is \"constructive\" is criticism intended to", "choices": ["embarrass the person receiving it", "settle an argument between family members", "help the person improve", "avoid hurting anyone's feelings"], "answer": 2, "explanation": "Iverson notes his mother \"never liked taking criticism, even if it was constructive\"—that is, even when the feedback was meant to be useful to her."}, {"q": "Which statement about Michael Freeman is supported by the passage?", "choices": ["He worked at the shipyard, went by \"House Mouse,\" and became the father in Iverson's life", "He was a star player at Bethel High who later met Iverson's mother in Hartford", "He met Iverson's mother after the family moved to Stuart Gardens", "He disciplined Iverson with harsh punishments rather than words"], "answer": 0, "explanation": "The passage says Freeman had a real job in the shipyard, was called \"House Mouse,\" and became Iverson's dad; he never laid hands on Allen, disciplining him with just a look."}, {"q": "Which choice best expresses the central idea of the chapter?", "choices": ["Iverson's talent developed only after his family left the crowded house in Aberdeen", "Despite poverty and instability, Iverson was carried by Nana's care and his mother's unshakable belief in him", "Iverson's childhood proves that strict discipline is the key to athletic success", "Iverson resented growing up without knowing his biological father"], "answer": 1, "explanation": "The chapter centers on the two women of the title: Nana, the backbone who raised the family, and his young mother, who declared at his birth that he would be a basketball player and believed in him every day after."}]}, {"id": "ch2-stuart-gardens", "num": "2", "part": "Part I — Growing Up and Surviving", "title": "Stuart Gardens", "bank": [{"q": "Which choice best expresses the central idea of the chapter?", "choices": ["Moving to Stuart Gardens finally gave Iverson's family the safety they had been seeking", "Iverson's early crimes made him a feared figure in Newport News", "Iverson's friendships in the projects taught him to avoid every kind of trouble", "In Stuart Gardens, ordinary childhood fun mixed with mischief, toughness, and early brushes with danger"], "answer": 3, "explanation": "The chapter blends crabbing, haircuts, and games with fights, petty theft, and the shadow of drugs, showing a childhood that was both normal and shaped by the projects."}, {"q": "According to the passage, from their window the family could see", "choices": ["Anderson Park and the fields where Iverson played football", "the place where the Chesapeake Bay met the James River, with Norfolk beyond", "the single-family homes in the next neighborhood over", "the bridge where Iverson dropped his crab trap into deep water"], "answer": 1, "explanation": "The passage says they could see where the Chesapeake Bay met the James River—called Hampton Roads—with Norfolk, Virginia, on the other side of the water."}, {"q": "The sentence \"A nice view of the water can't change the way blood looks soaking into the concrete\" primarily serves to", "choices": ["contrast the neighborhood's pleasant appearance with its harsh reality", "explain why the family soon moved away from Stuart Gardens", "describe the specific fight Iverson had as the new kid", "suggest that Iverson exaggerated the dangers of his childhood"], "answer": 0, "explanation": "Right after describing how nice the grass and water looked, Iverson notes the fights, drug dealing, and killings—the sentence sharpens that contrast between appearance and reality."}, {"q": "According to the passage, which of the following formed one of the borders of Stuart Gardens?", "choices": ["Jordan Drive", "Aberdeen Road", "Sixteenth Street", "Pine Chapel Road"], "answer": 2, "explanation": "The neighborhood was bounded by the water, Sixteenth Street, Anderson Park, and Roanoke Avenue; his mom's rule was \"Don't go past Sixteenth Street.\""}, {"q": "The passage about the whistle suggests that Iverson's mother", "choices": ["rarely knew where her son was during the day", "found clever ways to keep track of a fast-moving son", "forbade Iverson from leaving the apartment after dark", "relied on neighbors to discipline her children"], "answer": 1, "explanation": "Her whistle set the real boundary, his friends relayed it, and she could even judge how far he had gone by how long it took him to get home—she \"had my speed down to a science.\""}, {"q": "How did Iverson's father respond when a group of boys came to the house to fight Allen?", "choices": ["He called the police to clear them away from the building", "He told Allen to go outside and fight them one at a time", "He convinced their parents to keep them away", "He proposed a football game and then starred in it himself"], "answer": 3, "explanation": "His dad said, \"Let's just play a football game,\" then played like Tony Dorsett, blocking for Allen—and somehow that calmed everybody down."}, {"q": "Iverson's later realization about the people in the single-family homes was that they", "choices": ["were poor people too, living in houses that were still in the hood", "had once lived in Stuart Gardens themselves", "were wealthy families who feared the project kids", "had never actually called the police on him and his friends"], "answer": 0, "explanation": "As a kid he walked over there to feel like he lived among regular houses, but he \"figured this all out later\": those residents \"were just poor people who lived in houses in the hood.\""}, {"q": "According to the passage, Tony Clark was known for", "choices": ["being the biggest kid in Stuart Gardens", "teaching Iverson how to catch crabs off the bridge", "talking other kids into one-sided trades, ending the day ahead", "keeping Iverson away from fights with older kids"], "answer": 2, "explanation": "Tony Clark was a swindler who \"could talk another kid out of anything,\" turning candy into a radio into a bike over the course of a day."}, {"q": "As used in the passage, saying Snapper \"perfected the art\" of stealing candy most nearly means he", "choices": ["invented it", "mastered it", "abandoned it", "confessed to it"], "answer": 1, "explanation": "The passage describes Snapper's smooth, practiced routine—choosing bars, checking both ways, tucking them away—showing he had become highly skilled at it."}, {"q": "Iverson's mother was angry about the bucket of crabs primarily because", "choices": ["he had used the family's guaranteed dinner as bait for an uncertain one", "he had gone to the deep water at the bridge without permission", "she had planned to sell the chicken to neighbors", "he had skipped a haircut appointment to go crabbing"], "answer": 0, "explanation": "She pointed out that the chicken \"was guaranteed dinner\"—in a household with little to spare, trading it for a chance at crabs was the offense."}, {"q": "Iverson's remark \"were they really dusting for prints?\" conveys a tone of", "choices": ["bitterness toward the police who stopped him", "pride in having outsmarted the detectives", "amused self-mockery at his childhood logic", "regret that he was never caught"], "answer": 2, "explanation": "Looking back, Iverson laughs at his kid reasoning that leather gloves would protect him from detectives—gloves that instead made him stand out on a scorching day."}, {"q": "After stopping Iverson near Stuart Gardens, the police officer", "choices": ["brought him to the precinct to call his mother", "arrested Snapper and the other boys across the street", "let him keep the change if he promised to stop", "searched him, took back the stolen items, and lectured him about his future"], "answer": 3, "explanation": "The officer noted it was \"a little hot for some gloves,\" found the stolen change, lectured him about ruining his future, and let him go without taking him in."}, {"q": "Iverson's reaction after the officer left—anger over the confiscated items but relief about his mother—suggests that", "choices": ["he planned to stop stealing from cars after the warning", "he feared his mother's punishment more than the police", "he believed the officer had treated him unfairly under the law", "he was worried Snapper would tell the other kids"], "answer": 1, "explanation": "He admits he was mad the cop took the stolen goods, \"But I was glad he didn't take me to the precinct—or worse, go find my mom. That would have been real trouble.\""}, {"q": "As used in the passage, \"mischief\" most nearly means", "choices": ["minor troublemaking", "violent crime", "playful teasing between friends", "organized theft for profit"], "answer": 0, "explanation": "Iverson calls the candy stealing and similar antics \"mischief,\" contrasting this small-scale kid trouble with the serious crime, guns, and dying that came to the neighborhood later."}, {"q": "The closing paragraphs about drugs primarily serve to show that Iverson", "choices": ["was never exposed to drugs while growing up in Stuart Gardens", "eventually gave in to the older kids' pressure", "drew a firm line at drugs, fearing they would end his life or his sports dreams", "believed drugs were less dangerous than stealing from cars"], "answer": 2, "explanation": "Though kids around him were using and called him names for refusing, Iverson was terrified of drugs, believing you could die from them and that they would keep him out of the NBA or NFL."}]}, {"id": "ch3-raiders-football", "num": "3", "part": "Part I — Growing Up and Surviving", "title": "Raiders Football", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson's natural speed made him an instant star who never struggled in youth football.", "Winning championships mattered more to the Aberdeen Raiders than developing players' character.", "Joining the Raiders under Coach Mo gave Iverson discipline, confidence, and a glimpse of a better future.", "Iverson's mother forced him to play football even though he preferred other sports."], "answer": 2, "explanation": "The chapter centers on how Mo and Raiders football changed Iverson's life, teaching him confidence and showing project kids 'a glimpse of something better.'"}, {"q": "The author most likely describes his earlier teams — where he caught no passes as a receiver and played center for the Trojans — in order to", "choices": ["contrast his unpromising start in organized football with what he became after joining the Raiders.", "prove that his first coaches deliberately sabotaged his career.", "show that he was better suited to playing on the offensive line.", "explain why he permanently quit football before meeting Mo."], "answer": 0, "explanation": "Iverson recounts losing every game and playing out of position ('Obviously, that wasn't meant to be') to set up how different things became once Mo recruited him."}, {"q": "When Iverson writes that 'Raiders football gave us that glimpse,' the 'glimpse' refers to", "choices": ["a chance to watch professional players practice up close.", "a view of a better future that did not always seem natural to kids from the projects.", "the first time he saw the Dallas Cowboys play on television.", "an early preview of the plays Mo planned to run that season."], "answer": 1, "explanation": "In the preceding sentences Iverson explains that 'What didn't always seem natural to us was a better future,' and that catching a glimpse of something better changed you."}, {"q": "How did Mo first evaluate Iverson's ability?", "choices": ["He timed Iverson running sprints at an Aberdeen practice.", "He held a formal tryout at the Avon warehouse softball field.", "He asked Butch Harper to scout Iverson at Magruder Elementary.", "He watched from his car as Iverson played hotball in Stuart Gardens."], "answer": 3, "explanation": "Mo showed up in his Chevy, talked to Iverson's mom from the driver's seat, and watched Iverson play hotball through the windshield for only a couple of minutes before he was convinced."}, {"q": "According to the chapter, Mo's intermediate football squad was intended for players who were", "choices": ["ten through twelve years old.", "eight years old and under.", "residents of Newport News only.", "in high school."], "answer": 0, "explanation": "The text states that Mo coached the intermediate squad, 'for kids ten through twelve years old,' which is why eight-year-old Iverson needed an exception to play."}, {"q": "Why did Iverson insist on wearing number 33?", "choices": ["It was the number his uncle Stevie had worn.", "Mo assigned it to him on his first day of practice.", "It was the number of Tony Dorsett, the Dallas Cowboys star he admired.", "It was the only jersey small enough to fit him."], "answer": 2, "explanation": "Iverson was a massive Dallas Cowboys fan, and Tony Dorsett, the best player of the early 1980s in his view, wore number 33."}, {"q": "According to the passage, the Raiders lost in the playoffs during Iverson's first year because", "choices": ["Iverson fumbled the ball on the final drive.", "Mo used Jermaine as a decoy and the fullback was stopped on fourth-and-one.", "the team was penalized for using an ineligible eight-year-old player.", "Jermaine Marshall was injured and could not play."], "answer": 1, "explanation": "On fourth-and-one, down by six, Mo tried to outsmart the defense by using star running back Jermaine as a decoy and handing off to the fullback, who 'got stuffed.'"}, {"q": "Jermaine Marshall's decision to give up number 33 most strongly suggests that", "choices": ["he had already decided to quit the team.", "Mo ordered him to hand over the jersey.", "he no longer admired Tony Dorsett.", "the older Raiders players were generous toward a passionate younger teammate."], "answer": 3, "explanation": "Jermaine, a young star with every right to keep his number, told Iverson that since he cared about it so much he could have it — which Iverson cites as proof of the kind of guys that team had."}, {"q": "Based on the passage, Mo's lesson 'If it's between you and me, it's me' was primarily meant to teach", "choices": ["self-belief — asking why success can't be yours, in sports and in life.", "that players should never pass the ball to teammates.", "that winning required physically intimidating opponents.", "that coaches deserve credit for their players' achievements."], "answer": 0, "explanation": "Iverson explains the lesson was about confidence — countering the fear and low self-esteem common in the hood by asking 'Why can't it be me?'"}, {"q": "Iverson's account of his first Raiders practice — 'Inside, I was actually thinking the same thing. But I kept it inside' — suggests that he", "choices": ["was certain from the start that he belonged on the team.", "planned to quit if the older players teased him.", "privately shared the older players' doubts but deliberately projected confidence.", "resented Mo for putting him in an embarrassing situation."], "answer": 2, "explanation": "Iverson admits he wondered the same thing the big players did about whether he belonged, but he 'showed no doubt whatsoever,' revealing a conscious choice to hide his uncertainty."}, {"q": "It can most reasonably be inferred that Iverson's Newport News background affected his play with the Hampton-based Raiders by", "choices": ["making his teammates refuse to accept him.", "giving him a fearless edge and lending the team credibility from his street mentality.", "causing league officials to ban him from games.", "making him too cautious to tackle bigger players."], "answer": 1, "explanation": "Iverson says he believed the Hampton kids were soft, which fueled his aggressive play, and that his Newport News identity 'gave everyone on my team a little bit of confidence and credibility.'"}, {"q": "As used in the passage, 'adamant' — in 'Mo was adamant that I play intermediate' — most nearly means", "choices": ["uncertain.", "curious.", "regretful.", "firmly insistent."], "answer": 3, "explanation": "Mo refused to budge on having eight-year-old Iverson play with ten- to twelve-year-olds, convincing everyone to make an exception, so 'adamant' means unshakably insistent."}, {"q": "As used in the passage, 'resurrected' — in 'Butch Harper had resurrected it' — most nearly means", "choices": ["brought back to life.", "shut down permanently.", "renamed after himself.", "investigated thoroughly."], "answer": 0, "explanation": "Harper revived the Aberdeen Sports Association, restoring it into the serious program that Mo then coached in, so 'resurrected' means brought back or revived."}, {"q": "The description of the Petersburg game — the rain, the mud, the huge opponents, and the brawl afterward — mainly serves to", "choices": ["prove that the Raiders were the dirtiest team in the region.", "explain why Iverson decided to switch to basketball.", "show the extreme level of competition Mo sought out and why the team refused a rematch.", "demonstrate that Mo cared more about money than about his players."], "answer": 2, "explanation": "Mo scheduled Petersburg to test his champions against top regional competition; the Raiders won 7-0, but the violent aftermath explains why the team said no to playing them again."}, {"q": "Iverson's remark that at eight he doubted he weighed '65 pounds soaking wet carrying two ten-pound dumbbells' primarily functions to", "choices": ["explain why he was placed on the offensive line.", "emphasize humorously how undersized he was for intermediate football.", "criticize the league for lacking proper safety rules.", "show that he needed to gain weight before the NBA."], "answer": 1, "explanation": "The exaggerated image stresses how remarkably small he was for a league of ten- to twelve-year-olds, making Mo's insistence that he play up seem even bolder."}]}, {"id": "ch4-no-not-basketball", "num": "4", "part": "Part I — Growing Up and Surviving", "title": "No, Not Basketball", "bank": [{"q": "Which statement best captures the central idea of this chapter?", "choices": ["Basketball went from a sport Iverson rejected as soft to a game he loved and quickly mastered.", "Iverson abandoned football entirely once he discovered basketball.", "Iverson's early basketball teams dominated their leagues and won several championships.", "Coach Barefield forced Iverson to choose between basketball and school."], "answer": 0, "explanation": "The chapter traces Iverson's arc from crying at the tryout he was dragged to, to mastering the game within weeks and dreaming of the NBA."}, {"q": "The author most likely includes the story of soaking off his cast before the weekend playground games in order to", "choices": ["criticize the hospital for putting the cast on incorrectly.", "explain why his father refused to pay medical bills.", "illustrate how much playing in the big night games meant to him, whatever the cost.", "show that his injuries were never actually serious."], "answer": 2, "explanation": "Iverson removed his cast, wrapped his broken thumb in bandages, and played through pain all night rather than miss a packed playground showcase, showing his obsession with the games."}, {"q": "Iverson describes having been an artist who 'could see something and draw it' primarily to", "choices": ["suggest he considered a career in art before sports.", "explain his visual learning style: watch a move, imagine it, then perform it.", "contrast his artistic talent with his lack of athletic skill.", "show why his coaches let him skip practices."], "answer": 1, "explanation": "He connects drawing to how he learned basketball — watching the players for ten or fifteen minutes, then stepping on the court and repeating what he had seen."}, {"q": "According to the passage, why did Iverson initially want nothing to do with basketball?", "choices": ["His mother told him he was too small for the sport.", "He had already committed to playing baseball year-round.", "Coach Barefield had cut him from a previous team.", "He thought the game was soft and wanted his freedom after football season."], "answer": 3, "explanation": "Iverson says he 'always thought it was soft,' that football proved toughness, and that he wanted to chill out and enjoy his freedom after football ended."}, {"q": "What did Coach Barefield require of Iverson and Snapper before they could get out of his van?", "choices": ["Combing their hair.", "Finishing their homework.", "Reciting the team rules.", "Paying their league fees."], "answer": 0, "explanation": "Barefield knew the two project kids arrived without the grooming other kids' parents provided, so 'lesson number one' was making them comb their hair before leaving the van."}, {"q": "According to the chapter, what happened the month Iverson's mother bought him Nike Air Force Ones for the Kansas tournament?", "choices": ["She lost her job at the warehouse.", "The family went without electricity and hot water.", "Iverson was cut from the travel squad.", "The family moved out of Stuart Gardens."], "answer": 1, "explanation": "The family had no money, but his mother got him the shoes anyway — and that month they had no electricity or hot water."}, {"q": "According to the passage, Iverson began playing in the Aberdeen playground night games", "choices": ["the summer he turned eight.", "only after he started high school.", "around eighth grade, when he was thirteen or fourteen.", "after breaking his thumb ended his football season."], "answer": 2, "explanation": "Iverson says it was 'about when I was in eighth grade, around thirteen or fourteen' that he started playing in the night games and almost overnight became the best player there."}, {"q": "Iverson's behavior at the tryout — sitting and watching for ten or fifteen minutes before playing — most strongly suggests that he", "choices": ["was too frightened to step onto the court.", "hoped his mother would give up and take him home.", "did not understand the rules of basketball.", "was deliberately studying the moves so he could copy them."], "answer": 3, "explanation": "He explains he 'had to see the moves they made, the way they shot the ball' — watching first was his way of learning, and once ready, he repeated what he had seen."}, {"q": "The coaches' offer to buy Iverson 'a pack of Now and Laters' if he made a regular layup implies that they", "choices": ["were amused but frustrated by his insistence on imitating Michael Jordan's flashy style.", "believed he lacked the talent to make any layup.", "wanted him to leave the team.", "rewarded every player with candy for scoring."], "answer": 0, "explanation": "Iverson kept rocking the cradle and leaning into layups like Jordan and missing; the candy bribe shows the coaches' half-joking exasperation with his refusal to do anything 'regular.'"}, {"q": "Based on the passage, Coach Barefield never followed through on his threats to bench Iverson because he", "choices": ["feared losing games without his best player.", "was too kind-hearted and hated to see Iverson upset.", "was ordered by Mo to keep Iverson playing.", "forgot about the problems Iverson's mother reported."], "answer": 1, "explanation": "Iverson says Barefield 'was too nice. He hated to see me get upset,' which is why the threats about school never turned into real punishment."}, {"q": "Iverson's repeated 'Thank you Mom' after basketball clicked most strongly suggests that he", "choices": ["was apologizing for skipping the tryout entirely.", "wanted her to buy him new shoes as a reward.", "recognized that his mother had known better than he did.", "felt guilty about quitting football."], "answer": 2, "explanation": "He compares it to a mom saying 'Eat this, it's good!' and being right — he admits 'She knew better than me' about the sport he tried to refuse."}, {"q": "As used in the passage, 'relinquish' — in 'I refused to relinquish the court that night' — most nearly means", "choices": ["repair.", "describe.", "share.", "give up."], "answer": 3, "explanation": "Playing on a broken thumb, Iverson kept winning game after game so he would not have to leave the court; 'relinquish' means to give up or surrender."}, {"q": "In the final paragraph, Iverson says the NBA 'seemed like a distant hope.' As used here, 'distant' most nearly means", "choices": ["recent.", "far-off and unlikely.", "physically many miles away.", "unfriendly."], "answer": 1, "explanation": "He contrasts football, where the plan was already Notre Dame, with basketball, where he 'dreamed' of the NBA but it felt remote and improbable at the time."}, {"q": "The description of Coach Barefield's 'Southern accent and a high-pitched scratchy voice, a country kind of way' conveys a tone that is best described as", "choices": ["affectionate.", "resentful.", "fearful.", "indifferent."], "answer": 0, "explanation": "The details appear amid praise for Barefield as 'another person who believed in me,' so the vivid description of his voice reads as fond remembrance, not mockery."}, {"q": "The detail that Barefield's tough love came 'more for messing up in school than for messing up on the court' mainly serves to show that", "choices": ["Barefield knew little about coaching basketball.", "Iverson never had academic problems in those years.", "Barefield cared about the boys' lives and futures, not just winning games.", "Iverson's mother refused to talk to his coaches."], "answer": 2, "explanation": "Barefield talked about 'the blueprint' — staying out of trouble, avoiding jail or death — and his discipline targeted school failures, showing his priority was the kids' futures."}]}, {"id": "ch5-surviving-middle-school", "num": "5", "part": "Part I — Growing Up and Surviving", "title": "Surviving Middle School", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson's teachers disliked him, which drove him out of school and into trouble.", "Skipping school and street hustling nearly cost Iverson his future before the people who believed in him pulled him back.", "Iverson's athletic fame allowed him to skip school without any consequences.", "Moving in with Mo immediately solved all of Iverson's problems with school."], "answer": 1, "explanation": "The chapter follows Iverson's truancy, repeated eighth grade, and summer of hustling, and shows Mo, his mother, his crew, and his sister all steering him back toward school."}, {"q": "The author most likely includes the story of the principal's shopping deal in order to", "choices": ["prove that the school never tried to help him.", "show that his family could afford new clothes when needed.", "explain why he transferred to Jefferson Davis Middle School.", "admit, with some regret, that even a generous incentive could not change his attendance."], "answer": 3, "explanation": "Iverson attended ten straight days, got the clothes, then skipped the very next day — and he concedes the principal's anger was fair: 'That doesn't feel good to be played like that.'"}, {"q": "Iverson's comparison of himself to 'Prince Akeem from Coming to America' at Mo's house chiefly conveys that", "choices": ["everyday comforts like constant heat, food, and a phone felt foreign and luxurious to him.", "Mo's family was wealthy enough to live like royalty.", "he felt like a stranger who was unwelcome in the household.", "he planned to move to a different country after middle school."], "answer": 0, "explanation": "Living with Mo was 'the first time having a phone, having heat all the time, having food all the time' — things that should be normal but that he 'had to get used to.'"}, {"q": "According to the passage, which two things made Iverson's first eighth-grade year go wrong?", "choices": ["A fight with his father and a failed math class.", "An eviction and a football injury.", "Being barred from the basketball team after missing tryouts, and a girl he fell for.", "Mo moving away and his sister running off."], "answer": 2, "explanation": "Iverson names the two things directly: he missed the school basketball tryouts and was refused a spot, so he quit going to school, and he fell in love with an older girl."}, {"q": "How many days of school did Iverson miss during his first eighth-grade year?", "choices": ["Ten", "Sixty-nine", "Thirty-three", "One hundred"], "answer": 1, "explanation": "Iverson says they found out he had missed sixty-nine days of school — 'That's the number I remember.'"}, {"q": "What did Mo and Iverson's mother decide after learning how much school he had missed?", "choices": ["He would live with Mo in Hampton and repeat eighth grade at Jefferson Davis Middle School.", "He would drop out and work at the shipyard with his father.", "He would move in with Nana and attend school in Newport News.", "He would be sent to a boarding school outside Virginia."], "answer": 0, "explanation": "Mo and his mom decided together that Iverson would move in with Mo's family in Hampton and redo eighth grade at Jefferson Davis Middle School."}, {"q": "According to the passage, how did the money work when Iverson was given $100 worth of product to sell?", "choices": ["He kept all $100 and owed nothing back.", "He paid back $100 and earned only tips.", "He split the money evenly with the older guys.", "He paid back $70 and kept the rest."], "answer": 3, "explanation": "Iverson explains that for each $100 of work — about twenty $5 bags — 'you paid $70 back and kept the rest,' a small margin that left no room for losses."}, {"q": "Iverson attended school more reliably in the fall and winter of his second eighth-grade year, then faltered in the spring. The passage suggests this happened because", "choices": ["the school changed its attendance rules in the spring.", "his mother moved away during the spring semester.", "football and basketball gave him structure and adults watching him, and spring left him with neither.", "he was injured and unable to attend classes in the spring."], "answer": 2, "explanation": "In fall the JV football coach kept an eye on him, and in winter Coach Bailey did; come spring, 'I had no sports teams and the weather was getting nice,' and he stopped going."}, {"q": "Mo's repeated visits to Glen Gardens, despite being avoided for days at a time, most strongly suggest that Mo", "choices": ["refused to give up on Iverson no matter how long it took.", "was trying to catch Iverson breaking the law and report him.", "wanted Iverson to move back in with his mother.", "was unaware of what Iverson was doing there."], "answer": 0, "explanation": "Unlike Coach Bailey, Mo 'knew what I was doing and exactly where I was,' yet he came back 'Again and again and again,' showing his persistence in pulling Iverson off the street."}, {"q": "When Iverson writes 'the only person that needed convincing was me,' he means that", "choices": ["his crew was pressuring him to stay and keep working.", "everyone around him already believed hustling was not his path — he just had to believe it himself.", "no one had ever warned him about the dangers of the street.", "he had convinced everyone else that he should keep hustling."], "answer": 1, "explanation": "Mo, his mom, his homeboys, and even the older Newport News guys all told him he had a different future; 'No one else was trying to keep me there.'"}, {"q": "During the robbery in the dark hallway, Iverson's racing thoughts — 'What was my Nana going to think? My mom? Mo?' — reveal that he", "choices": ["was mainly worried about the money he would owe.", "blamed his family for the situation he was in.", "believed the robber would let him go unharmed.", "measured the cost of that moment against the people who believed in him and the future at stake."], "answer": 3, "explanation": "Facing what he thought was the end, his mind went to the people counting on him and the fear that he had ruined everything before even reaching high school."}, {"q": "As used in the passage, 'autonomy' — in 'I had a lot of autonomy, I guess you could say' — most nearly means", "choices": ["loneliness.", "responsibility for chores.", "freedom from supervision.", "musical talent."], "answer": 2, "explanation": "With his dad in the streets and his mom often out, no adult was watching him, so he could leave and skip school as he pleased — independence, or freedom from oversight."}, {"q": "As used in the passage, 'epicenter' — in 'The epicenter was in Glen Gardens' — most nearly means", "choices": ["a safe place to hide.", "the central hub of the activity.", "the outer edge of a neighborhood.", "a government office."], "answer": 1, "explanation": "Glen Gardens was the hot spot where the Newport News guys gravitated to hustle — the concentrated center of the drug activity hitting the Peninsula."}, {"q": "Iverson's comment about the principal — 'Who wouldn't be? That doesn't feel good to be played like that' — is best described as", "choices": ["a defensive excuse for his own behavior.", "sarcastic mockery of the principal's generosity.", "an accusation that the principal broke the deal first.", "an honest, rueful admission that he treated a kind adult unfairly."], "answer": 3, "explanation": "Looking back, Iverson sides with the principal's anger rather than defending himself, acknowledging that skipping the day after the shopping trip was a betrayal."}, {"q": "The chapter's final scene — Iverson finding his name on the Bethel High student list — primarily functions to", "choices": ["end a dark chapter on a note of hope and a fresh start.", "prove that his grades had dramatically improved.", "show that the school made an error in admitting him.", "introduce his high school football coach."], "answer": 0, "explanation": "After a summer he calls terrible, and not even knowing whether he had passed eighth grade, seeing 'Allen Iverson' on the list marks the promised turning point toward a new start."}]}, {"id": "ch6-high-school-football", "num": "6", "part": "Part II — My Trials On and Off the Court", "title": "High School Football", "bank": [{"q": "The \"Jail\" section that appears just before this chapter primarily serves to", "choices": ["provide a detailed legal account of the charges that led to Iverson's conviction", "argue that Iverson's sentence was unjust and should have been overturned", "foreshadow the events of his senior year and frame the high school chapters that follow", "describe the long-term living conditions Iverson faced while serving his sentence"], "answer": 2, "explanation": "The section ends by asking how he landed in jail and noting that his senior year he was a \"jailbird,\" setting up the high school story the following chapters will tell."}, {"q": "In the \"Jail\" section, Iverson's reflection on his gray suit most strongly suggests that", "choices": ["the respectability the suit seemed to promise proved useless when it mattered", "he blamed his mother for choosing a suit that was too heavy for summer", "the jail required him to exchange the suit for a uniform immediately", "he regretted not dressing more formally throughout his trial"], "answer": 0, "explanation": "He recalls looking respectable and grown-up in the mirror, then asks what good the suit did him that day, since it ended up bunched in a corner of a jail cell."}, {"q": "According to the \"Jail\" section, why does Iverson remove most of his clothing in the holding cell?", "choices": ["An officer ordered him to change out of his court clothes", "His suit had been badly torn during the van ride from court", "He wanted to protest the sentence he had just received", "The cell was extremely hot, with no moving air, windows, or open doors"], "answer": 3, "explanation": "He describes the late-summer Virginia heat in a cell with no air movement, and says he took off pieces of the suit one by one until he was cooler."}, {"q": "According to the passage, Mike Jackson was often late to school because", "choices": ["his 1981 Toyota Tercel frequently broke down on the way", "he stayed up late studying to keep his straight-A average", "he had early morning track practice with Coach Koz", "he had to pick up Iverson, who was often still asleep when he arrived"], "answer": 3, "explanation": "Iverson says Mike, a straight-A student, hated being late, but because he came to collect Iverson, who was frequently not even dressed, \"he often was.\""}, {"q": "Which choice best states the main idea of the chapter?", "choices": ["Iverson's natural speed made varsity football effortless for him from his first game", "Iverson rose from freshman role player to star quarterback as Bethel finally toppled its dominant rival", "Coach Koz's strict discipline was the primary reason Bethel's football program improved", "Iverson cared far less about football than he did about basketball"], "answer": 1, "explanation": "The chapter traces his path from wide receiver and safety as a freshman to the quarterback of an unbeaten team that ended Hampton's long dominance."}, {"q": "During his freshman season, Iverson primarily played which positions?", "choices": ["Wide receiver and safety", "Quarterback and running back", "Running back and linebacker", "Kick returner and offensive lineman"], "answer": 0, "explanation": "Because the coach did not see the undersized freshman as a quarterback, Iverson played wide receiver on offense and safety on defense, where he loved to hit."}, {"q": "In the mid-September 1990 game against Ferguson, Iverson sealed the win by", "choices": ["throwing a 34-yard touchdown pass in the final minute", "returning the opening kickoff for a touchdown", "intercepting a pass with fourteen seconds remaining", "catching a fifty-yard touchdown pass from Paul London"], "answer": 2, "explanation": "With Bethel up 21-14 and Ferguson driving to tie the game, Iverson's interception with fourteen seconds left ended it; the touchdown pass and fifty-yard catch came in other games."}, {"q": "The passage suggests that Iverson's school attendance improved when", "choices": ["Coach Koz threatened to remove him from the football team", "his success on the field brought him recognition and praise at school", "Mike Jackson began driving him to school every morning", "his teachers started reporting his absences immediately"], "answer": 1, "explanation": "He says he got out of bed and came to school after the Ferguson game because everyone was congratulating him, and that school became fun once people saw what he could do."}, {"q": "As used in the passage, \"pivotal\" (\"Sophomore year was pivotal\") most nearly means", "choices": ["unexpectedly difficult", "briefly successful", "emotionally draining", "crucially important"], "answer": 3, "explanation": "The sophomore season marked the turning point when Iverson became the starting quarterback and Bethel finally beat Hampton, so \"pivotal\" means decisive or crucially important."}, {"q": "The passage states that \"Coach Koz finally unleashed me\" in the Kecoughtan game. As used here, \"unleashed\" most nearly means", "choices": ["removed him from the starting lineup", "criticized him in front of the team", "gave him the freedom to use his full abilities", "moved him permanently to defense"], "answer": 2, "explanation": "In that game Iverson ran for 88 yards and two scores, threw for 174 yards and a touchdown, and intercepted two passes, showing the coach had let him play without restraint."}, {"q": "During the sophomore-year game against Hampton, Tim Johnson's third-down tackle was significant because it", "choices": ["forced Hampton to settle for a field goal, which became their only points", "caused a fumble that Bethel returned for the winning touchdown", "knocked Hampton's dual-threat quarterback out of the game", "stopped Hampton's final drive as time expired"], "answer": 0, "explanation": "On third-and-one from near the goal line, Johnson read the misdirection and tackled the running back for a loss, so Hampton kicked a field goal and never scored again."}, {"q": "Iverson's account of his single day running track chiefly illustrates that", "choices": ["he lacked the raw speed to compete with sprinters like Thrilla", "Coach Koz did not understand how to train young runners", "his competitive drive depended on games with a ball and a goal, not running for its own sake", "he was willing to try any sport that might keep him eligible"], "answer": 2, "explanation": "He says running for no particular reason never appealed to him, and after one painful 400 he quit, wanting \"a ball and a place to put it.\""}, {"q": "The short paragraph \"53-0. We wouldn't forget it. It wasn't going to happen again.\" mainly functions to", "choices": ["blame Paul London's collarbone injury for the lopsided loss", "emphasize the sting of the defeat and set up the team's motivation for the next season", "suggest that Iverson considered quitting football afterward", "show that the rivalry with Hampton had lost its meaning for Bethel"], "answer": 1, "explanation": "The clipped, blunt sentences drive home the humiliation of the shutout and announce the resolve that fuels the unbeaten sophomore season that follows."}, {"q": "When Iverson repeats the theory that his jailing was really about powerful people disliking Bethel's rise, then adds \"I don't know about all that,\" he is", "choices": ["endorsing the theory as the true cause of his conviction", "presenting the theory without fully embracing it himself", "mocking the people who spread the theory", "disproving the theory with specific evidence"], "answer": 1, "explanation": "He reports what some people say about old money and the flipped rivalry, but his closing remark shows he passes the idea along without committing to it."}, {"q": "What conclusion does Iverson draw from the playoff loss to Norcom?", "choices": ["He had to become unstoppable, because teams could beat Bethel by shutting him down", "Beating Hampton would always be enough to define a successful season", "The team needed to rely more heavily on its defense in big games", "He should return to wide receiver, where he had first succeeded"], "answer": 0, "explanation": "Norcom blitzed him constantly and won, so he resolves two things: Bethel has to win it all, and nobody is going to stop him anymore."}]}, {"id": "ch7-high-school-life", "num": "7", "part": "Part II — My Trials On and Off the Court", "title": "High School Life", "bank": [{"q": "Which choice best describes the central purpose of the chapter?", "choices": ["To argue that sports shielded Iverson from every hardship in his life", "To reveal the family turmoil and street life that ran alongside Iverson's athletic success", "To recount Iverson's football achievements in greater statistical detail", "To explain why Iverson permanently moved out of Mo's house"], "answer": 1, "explanation": "The chapter sets the eviction, his father's imprisonment, his sister's illness, and his friendships against the same period as the 10-0 football season, showing the chaos behind the success."}, {"q": "According to the passage, Iverson's father received a ten-year prison sentence for", "choices": ["distribution of cocaine", "driving without a license", "a robbery committed in Glen Gardens", "a charge connected to a hotel party"], "answer": 0, "explanation": "In February of Iverson's freshman year, 1991, his dad was convicted of a drug charge, distribution of cocaine, and sentenced to ten years."}, {"q": "Iverson's remark that there \"really wasn't a 'fort' to hold down\" chiefly conveys", "choices": ["his refusal to take on any responsibility for his family", "his confidence that the family would soon find a better home", "the irony of being handed responsibility for a family that lacked even a stable home", "his belief that his father never intended to return"], "answer": 2, "explanation": "His father told him to hold down the fort before prison, but the family had been evicted and scattered, so there was no household left to protect."}, {"q": "Which statement about Iverson's sister Iiesha is supported by the passage?", "choices": ["She was born nine days late after a difficult pregnancy and was later moved to Georgetown University Hospital", "She was born at Georgetown University Hospital and then transferred to Norfolk", "She was born during Iverson's freshman year, just before his father's conviction", "She recovered completely within weeks and never had health problems again"], "answer": 0, "explanation": "Iiesha was born in a Norfolk hospital in the fall of his sophomore year, nine days late with serious complications, and was then moved to Georgetown University Hospital."}, {"q": "The statement that having a phone \"longer than a couple of months\" made the family feel rich primarily serves to", "choices": ["show that the family preferred visiting people in person", "criticize the phone company for poor service in Aberdeen", "suggest the family wasted money on luxuries", "convey the depth of the family's poverty through an everyday detail"], "answer": 3, "explanation": "The line uses a small, concrete fact of daily life, how rarely the phone worked, to make the family's poverty vivid without stating it directly."}, {"q": "As used in the first sentence of the chapter, \"tumultuous\" most nearly means", "choices": ["boring and slow", "full of chaos and upheaval", "carefully planned", "quietly sad"], "answer": 1, "explanation": "Iverson calls life tumultuous and then describes eviction, his father's imprisonment, and his sister's illness, all events of constant disorder and upheaval."}, {"q": "According to the passage, the house on Victoria Boulevard", "choices": ["was a comfortable house in a wealthy part of Hampton", "was a place Iverson refused to live in", "had a busted pipe underneath and smelled terrible, yet still felt like home", "was located in Newport News near Stuart Gardens"], "answer": 2, "explanation": "Iverson says the house smelled terrible because of a busted pipe, especially in summer, but that it was a place the family could all be together, and it was home."}, {"q": "The paragraph about lunchtime \"showtime\" mainly functions to", "choices": ["show that despite the chaos in his life, Iverson still enjoyed being a regular kid at school", "explain why Iverson was frequently in trouble with his teachers", "prove that art was Iverson's strongest academic subject", "show that Iverson used humor to intimidate his teachers"], "answer": 0, "explanation": "He describes joking with Thrilla, talking to girls, and drawing funny pictures, then sums it up as \"regular-kid\" fun with no problems at all."}, {"q": "According to the passage, Iverson became a \"full-on cartoonist\" after", "choices": ["taking a formal art class at Bethel High School", "Ra showed him caricatures from New York", "his teammates asked him to draw them in the locker room", "a student named Quincy taught him about caricatures"], "answer": 3, "explanation": "He says he met a dude named Quincy in high school who taught him about caricatures, and he switched from regular drawing to full-on cartooning."}, {"q": "The passage suggests that Iverson's drawing gave him power among his classmates because", "choices": ["his caricatures were sold for money around school", "classmates feared being hilariously exaggerated in one of his quick drawings", "teachers gave him special privileges for his talent", "he only drew people he considered close friends"], "answer": 1, "explanation": "He says he \"put fear in people\": anyone who joked on him knew a ten-second caricature exaggerating their flaws was coming, with everyone laughing at it."}, {"q": "Which statement about Ra is supported by the passage?", "choices": ["He grew up in Newport News alongside Iverson's other friends", "He was a few years younger than Iverson", "He was a champion wrestler from the Bronx who never went back home after visiting Virginia", "He gave up music to focus on wrestling"], "answer": 2, "explanation": "Ra was a couple of years older, from the Bronx, a champion wrestler who always wore his wrestling shoes, and after meeting Iverson's crew he never went back home."}, {"q": "Iverson's description of Cru Thik most directly challenges the assumption that", "choices": ["his friends from the streets only pulled him toward trouble", "he was serious about pursuing a music career", "he needed adult mentors like Mo to stay in sports", "hip-hop had little influence on his generation"], "answer": 0, "explanation": "He says those guys pushed him off the streets as much as Mo or his mom did, telling him not to worry and to focus on sports, the opposite of a bad influence."}, {"q": "Iverson calls Thrilla \"my better angel.\" This phrase most nearly refers to", "choices": ["a religious figure who protected him from harm", "a friend whose influence guided him toward good choices", "a teammate who regularly outperformed him", "someone who pitied him for his family situation"], "answer": 1, "explanation": "The phrase is figurative: Thrilla represented the steady, positive side of Iverson's life, with his stable home and good habits, pulling him in a good direction."}, {"q": "The passage suggests Iverson valued his evenings at Thrilla's house partly because", "choices": ["he had no other place to sleep at night", "Thrilla's parents helped him with schoolwork", "the stable family life there was something he wanted as much as fame and fortune", "he earned money from winning Monopoly games"], "answer": 2, "explanation": "Watching Thrilla's family, with a mom and dad and their Monopoly tradition, Iverson says that kind of home was what he wanted just as much as fame and fortune."}, {"q": "The chapter's final mention of playing Monopoly at the Fridays on City Line Avenue mainly serves to", "choices": ["show that Iverson preferred Philadelphia to Virginia", "explain how board games improved his basketball strategy", "prove that his Sixers teammates shared his childhood interests", "show that a habit formed in those high school years stayed with him into his NBA life"], "answer": 3, "explanation": "He says he played Monopoly obsessively for years and years, even until two in the morning after reaching the Sixers, linking his teenage life to his future."}]}, {"id": "ch8-basketball-high", "num": "8", "part": "Part II — My Trials On and Off the Court", "title": "Basketball High", "bank": [{"q": "Which choice best states the central idea of the chapter?", "choices": ["Coach Bailey's defensive philosophy was responsible for Bethel's turnaround", "Iverson dominated high school basketball more easily than he had football", "Tony Rutland's scoring carried Bethel through Iverson's first two seasons", "In two seasons Iverson helped transform a losing program, but season-ending defeats left him hungry for more"], "answer": 3, "explanation": "The chapter follows Bethel's rise from a 1-18 team to a district contender led by Iverson, yet both seasons end with losses that fuel his determination."}, {"q": "Which statement about Coach Bailey is supported by the passage?", "choices": ["He coached both the football and basketball teams at Bethel", "He welcomed Iverson into his home life and drove around looking for him when he skipped school", "He refused to let players meet his family", "He benched Iverson whenever he missed a day of school"], "answer": 1, "explanation": "Iverson says Bailey was like a father, introduced him to his wife Janet, sometimes housed him, and drove to places Iverson should not have been to find him."}, {"q": "According to the passage, Coach Bailey modeled his up-tempo system on the style of", "choices": ["Loyola Marymount University", "Georgetown University", "the Hampton Crabbers", "a professional team Iverson admired"], "answer": 0, "explanation": "Bailey studied the transition offense associated with Loyola Marymount, where Bo Kimble and Hank Gathers scored around a hundred points a game."}, {"q": "According to the passage, before Iverson arrived, Bethel's basketball program", "choices": ["had won two state titles during the 1970s", "had recently reached the district finals", "had never won more than sixteen games in a season and was coming off a 1-18 year", "had a winning record but lacked a championship"], "answer": 2, "explanation": "The passage says Bethel basketball had no state titles, had never won more than sixteen games in a season, and was coming off a 1-18 record; the 1970s state titles belonged to the football program."}, {"q": "Iverson's observation that the team matched \"the previous season's total in a day\" chiefly serves to", "choices": ["prove that he was already the team's leading scorer", "underscore how dismal the program had been and how quickly things changed", "show that the schedule was easier than the year before", "credit Tony Rutland for the team's first victory"], "answer": 1, "explanation": "Because Bethel had won only one game the entire previous season, winning the opener equaled that total instantly, dramatizing both the past futility and the sudden change."}, {"q": "Coach Bailey called Iverson and Tony Rutland his \"terrible twos\" because", "choices": ["both freshmen wanted the ball and always believed they were open", "both players refused to play defense in his new system", "they constantly skipped practice together", "they were the two youngest players in the district"], "answer": 0, "explanation": "The two freshman guards battled over shots and touches; Bailey's big early challenge was finding a way for them to coexist."}, {"q": "The passage suggests that as a freshman, Iverson was viewed by observers as", "choices": ["the clear best basketball player in the district", "a football player with no basketball skills", "someone known locally but not yet seen as a rising basketball star", "a player who succeeded only because of Coach Bailey's system"], "answer": 2, "explanation": "He notes he had not dominated in summer league or middle school, so while people knew him, they did not necessarily see him as the up-and-coming basketball star."}, {"q": "In the final regular-season game of Iverson's freshman year, Bethel", "choices": ["beat Hampton 83-72 behind Iverson's 39 points", "lost to Kecoughtan on a last-second shot", "beat Hampton by 27 points", "lost 128-89 to a Hampton team ranked number one in the state"], "answer": 3, "explanation": "The Crabbers, ranked first in the state by the press, clobbered Bethel 128-89; the 83-72 win over Hampton came in Iverson's sophomore season."}, {"q": "The passage says Coach Bailey's \"big thing early on was finding a way for us to coexist.\" As used here, \"coexist\" most nearly means", "choices": ["succeed together without conflict", "compete against each other for the starting job", "alternate games as the leading scorer", "practice at separate times"], "answer": 0, "explanation": "Bailey needed his two ball-dominant guards to share the floor and thrive together rather than battle over shots, so coexist means getting along and working as one."}, {"q": "The passage describes a shift in which Iverson became the \"focal point\" of the team. As used here, \"focal point\" most nearly means", "choices": ["the fastest player on the roster", "the team's only reliable defender", "the center of the offense and of opponents' attention", "the most experienced player on the court"], "answer": 2, "explanation": "By the end of January he led the district in scoring at nearly 25 points a game, and the offense ran through him instead of Tony, making him the main target of defenses."}, {"q": "In the sophomore-year home win over Hampton, Iverson finished with", "choices": ["42 points and the district scoring title", "39 points and 13 rebounds in an 83-72 victory", "35 points in a narrow loss", "21 points as the team's leading scorer"], "answer": 1, "explanation": "Iverson scored 39 points in every way imaginable and grabbed 13 rebounds as Bethel won 83-72; the 42-point game came later against Menchville."}, {"q": "The passage suggests Iverson was especially thrilled by his 13 rebounds against Hampton because", "choices": ["rebounds were the statistic Coach Bailey valued most", "he had never grabbed a rebound in a game before", "it broke a long-standing school record", "Bethel was a small team, and the rebounds answered doubts about whether they could hold up inside"], "answer": 3, "explanation": "People questioned whether the small backcourt-led team could survive inside, so out-rebounding Hampton that day proved they could beat bigger teams on the glass."}, {"q": "The detail that fourteen hundred people packed the gym for the Kecoughtan game mainly functions to", "choices": ["explain why Bethel lost a close game", "show that Kecoughtan's fans traveled well", "illustrate the growing excitement building around Bethel basketball", "prove the gym was too dangerous for big crowds"], "answer": 2, "explanation": "It was the first sellout ever, and the team moved to a much bigger venue the following year, showing how fast community excitement was building."}, {"q": "The special defenses opponents used, such as box-and-ones and blitzing Iverson up the court, most strongly suggest that", "choices": ["opposing coaches believed stopping Iverson and Rutland was the key to beating Bethel", "Bethel's offense had become too predictable to succeed", "Iverson struggled against zone defenses all season", "the district had changed its rules to limit scoring"], "answer": 0, "explanation": "Teams designed entire game plans to slow the two guards, and Iverson notes that when opponents managed to stop him, they won, as Hampton did in the district semis."}, {"q": "The final paragraph, beginning \"It was like football all over again,\" primarily conveys", "choices": ["Iverson's decision to concentrate on football instead", "his dissatisfaction that improvement was not enough, and his hatred of losing", "his belief that Bethel could never beat Hampton in a playoff game", "his gratitude for two successful seasons"], "answer": 1, "explanation": "Just as in football, the team achieved a lot but fell short in the end, and Iverson says he could not stand losing and was determined not to let it happen again."}]}, {"id": "ch9-summer-of-1992", "num": "9", "part": "Part II — My Trials On and Off the Court", "title": "The Summer of 1992", "bank": [{"q": "Which choice best states the central idea of the chapter?", "choices": ["Iverson quit street life entirely once he realized how dangerous his neighborhood had become.", "Summer basketball mattered less to Iverson than the football season that followed it.", "During a summer marked by the deaths of people around him, Iverson channeled his pain into basketball and rose to national prominence.", "The AAU system in 1992 made it easy for any talented player to gain national attention."], "answer": 2, "explanation": "The chapter moves from the deaths that surrounded Iverson that summer to his decision to pour his anger into basketball, ending with the AAU national title and his new status as the top rising junior."}, {"q": "The chapter's opening description of the court as a 'sanctuary' primarily serves to", "choices": ["contrast the peace Iverson found in basketball with the chaos and violence that awaited him off the court.", "suggest that Iverson only felt safe playing indoors in air-conditioned gyms.", "show that Iverson preferred practicing alone rather than with teammates.", "explain why Iverson eventually gave up football for basketball."], "answer": 0, "explanation": "Iverson says the drama and chaos disappeared when he stepped onto the court, but 'the moment I stepped off the court, life smacked me in the face,' setting up the contrast the chapter explores."}, {"q": "According to the passage, how did Tony Clark die?", "choices": ["He was shot during a drug war in Stuart Gardens.", "His girlfriend stabbed him in the throat and said it was self-defense.", "He was shot in the arm and the bullet reached his chest.", "He was shot once in the heart by a man he had been beating."], "answer": 1, "explanation": "Iverson stresses that it was not a drug war: Tony's girlfriend stabbed him in the throat and claimed self-defense, saying he had been beating her. The other choices describe different deaths in the chapter."}, {"q": "According to the passage, Iverson's invitation to the Nike camp was notable in part because he was", "choices": ["the only player from Virginia to receive an invitation that year.", "already ranked as the top guard in the country before the camp.", "a senior competing against much younger players.", "one of only 25 rising high school juniors among the 120 invited players."], "answer": 3, "explanation": "The passage says Nike invited 120 players nationally and only 25 of them were rising juniors; from his squad, just Iverson and Joe Smith got invitations."}, {"q": "Where and when were the AAU Nationals held?", "choices": ["Winston-Salem, North Carolina, at the end of July 1992", "Washington, DC, in May 1992", "Norfolk, Virginia, in April 1992", "Richmond, Virginia, at the end of August 1992"], "answer": 0, "explanation": "The passage states that the AAU Nationals were held in Winston-Salem, North Carolina, at the end of July 1992."}, {"q": "In the triple-overtime game against the team from Cleveland, Iverson responded to the pressure by", "choices": ["asking Coach Tose to draw up a final play for Faisal.", "fouling out and watching the finish from the bench.", "scoring all seven of his team's points in the third overtime.", "hitting a shot from near half-court to force another overtime."], "answer": 2, "explanation": "After telling himself he had to take over the game, Iverson scored all seven of the team's points in the third overtime to win it; the half-court shot was made by a Cleveland player."}, {"q": "Based on the passage, Iverson's reaction to Coach Tose's repeated mentions of the 1988 national championship suggests that Iverson", "choices": ["doubted the 1988 team had really been as good as the coach claimed.", "was focused on making his own history rather than hearing about past teams.", "resented Alonzo Mourning for getting more attention than he did.", "believed the coach was too soft on the current players."], "answer": 1, "explanation": "Iverson says he did not want to hear talk about what came before — a sign he cared about what his own team would accomplish, not what an earlier team had done in 1988."}, {"q": "It can be inferred that the loss in the Boo Williams Invitational final taught Iverson that he", "choices": ["needed to spend more time practicing his three-point shot.", "could not trust his new teammates in close games.", "was not yet good enough to compete with older players.", "could not defer to others and had to be the main player for his team."], "answer": 3, "explanation": "After the close 79-76 loss to the Florida team, Iverson came away with the 'familiar feeling' that he couldn't defer and 'had to be the guy.'"}, {"q": "Which statement best explains why Iverson believed the street violence would not touch him?", "choices": ["He knew everyone in the neighborhood, understood who was dangerous, and avoided making enemies.", "He carried protection with him whenever he left the basketball court.", "The police kept a close watch on athletes with college potential.", "His friends Ra, Arnie, and E promised to keep him out of trouble."], "answer": 0, "explanation": "Iverson explains that he knew 'who the killers were and weren't,' who was robbing and selling, and that he had no interest in making enemies, so he believed he knew how to avoid trouble."}, {"q": "For Iverson, Alonzo Mourning's visit to the team was most significant because Mourning", "choices": ["promised to help Iverson get recruited by Georgetown.", "warned the team that they were unlikely to win the national title.", "was living proof of the exact path Iverson planned to follow.", "criticized the team for losing the invitational final."], "answer": 2, "explanation": "Iverson says Mourning 'was doing everything I planned to do' — Georgetown, the NBA draft — and that in moments like this, 'I was seeing my future.'"}, {"q": "As used in the passage, 'heralded' (describing Joe Smith, who 'wasn't heralded like that') most nearly means", "choices": ["criticized", "publicly celebrated", "recruited", "experienced"], "answer": 1, "explanation": "Iverson means that Joe Smith had not yet received major public acclaim; Smith later 'shocked the world' at Maryland, so 'heralded' means celebrated or acclaimed."}, {"q": "As used in the description of the final, 'hounding' ('they were hounding me') most nearly means", "choices": ["insulting", "ignoring", "imitating", "relentlessly pressuring"], "answer": 3, "explanation": "The North Carolina team was 'trying to keep the ball out of my hands,' so 'hounding' describes constant, aggressive defensive pressure on Iverson."}, {"q": "The tone of the paragraphs describing the deaths of Iverson's friends and neighbors is best described as", "choices": ["matter-of-fact yet pained", "detached and indifferent", "sensational and exaggerated", "hopeful and forgiving"], "answer": 0, "explanation": "Iverson recounts the killings plainly — 'You couldn't stop and dwell' — but also admits 'That one, it
