to sign a new shoe contract with Reebok.", "The team had learned Iverson would be named Rookie of the Year and needed him at a press conference."], "answer": 3, "explanation": "Bill Bonsiewicz, the team's PR man, was looking for Iverson because the Sixers had gotten word he would be named Rookie of the Year, with a press conference planned for the next day."}, {"q": "Based on the passage, Iverson understood Charles Barkley's remark that he was the \"playground Rookie of the Year\" to imply that Iverson", "choices": ["did not belong in the NBA and was playing the wrong kind of game.", "had earned the award only because of weak competition.", "was too young to handle the pressures of professional basketball.", "should have spent more time practicing fundamentals."], "answer": 0, "explanation": "Iverson writes that Barkley's comment made it sound as if he was playing the wrong game on the wrong court, leaving him with the haunting feeling of \"You shouldn't be here.\""}, {"q": "It can most reasonably be inferred that people in Iverson's neighborhoods refused to help the man looking for him because they", "choices": ["knew Iverson was preparing for his father's trial.", "assumed the stranger was an FBI agent and were protecting Iverson.", "had been paid by the Sixers to keep his location secret.", "did not actually know where Iverson was staying."], "answer": 1, "explanation": "Iverson says everyone probably thought the white stranger asking around was an FBI agent, so nobody was telling him anything — the community instinctively shielded him."}, {"q": "Which of the following accurately states Iverson's rookie-season statistics as given in the chapter?", "choices": ["He led all rookies in assists and finished second in scoring.", "He averaged 23.5 points per game, the most of any rookie, and finished just behind Marbury in assists.", "He averaged 23.5 points per game but trailed Marbury in both scoring and steals.", "He led the entire league in points, steals, and assists."], "answer": 1, "explanation": "Iverson scored more points than any other rookie at 23.5 per game, led rookies in steals, and was a close second to Marbury in assists, 7.5 to 7.8."}, {"q": "As used in the passage, \"vindication\" most nearly means", "choices": ["proof that he had been right all along without changing himself.", "revenge against the reporters who had criticized him.", "an official apology from the league.", "permission to keep playing his style of basketball."], "answer": 0, "explanation": "Iverson calls the award vindication because it showed that the same person he had always been — unchanged in dress, friends, and style — was now recognized as the best rookie."}, {"q": "Iverson's decision to wear a white skullcap and warm-up suit to the press conference is best understood as", "choices": ["a protest against the NBA's dress code for players.", "an attempt to promote Reebok's newest product line.", "an insistence that the \"authentic Allen Iverson\" accept the award, not a polished version of him.", "a way to hide the fact that his hair was not yet long enough for cornrows."], "answer": 2, "explanation": "Iverson says he wanted the authentic Allen Iverson to be there, which meant bringing his mom and his friends and choosing his own look instead of a suit."}, {"q": "When Iverson responds to the NBA official's comment about prison clothing by noting that \"you couldn't wear that\" in the prison he was in, his remark functions primarily to", "choices": ["express regret about his time behind bars.", "warn the league not to criticize him publicly.", "show that he agreed the outfit was a poor choice.", "expose the official's ignorance with pointed irony, since Iverson had actually been incarcerated."], "answer": 3, "explanation": "The official was speaking in stereotypes, but Iverson, who had really been in prison, uses dry irony to show the comparison was made by someone who knew nothing about it."}, {"q": "According to the chapter, what was the core of his father's defense at trial?", "choices": ["He was paroled to that address, had begged his parole officer to let him move away from the drugs, and was refused.", "He was never inside the house where the drugs were found.", "The drugs belonged to a relative who had already confessed.", "The police had searched the house without a warrant."], "answer": 0, "explanation": "The defense argued he lived there only because parole required it; his parole officer even testified that he had asked to move because he worried about drugs in the house."}, {"q": "The main logic of Iverson's own testimony at his father's trial was that his father", "choices": ["had a solid alibi for the night of the arrest.", "had no reason to worry about his future because Iverson promised him support.", "had no financial motive to sell drugs, since Iverson had repeatedly promised to take care of him once the NBA money came.", "was a changed man who had left his past behind."], "answer": 2, "explanation": "Iverson told the court he had said \"I got you\" many times; since everyone knew millions were coming and his father would be cared for, there was no reason for him to be dealing."}, {"q": "How did Iverson react to the guilty verdict in his father's trial?", "choices": ["He was stunned, having been confident of an acquittal.", "He was not surprised, but he was hurt and disappointed.", "He immediately hired new lawyers to file an appeal.", "He publicly criticized the judge and jury to reporters."], "answer": 1, "explanation": "Iverson writes that he knew better than to be hopeful, so the verdict did not surprise him, but it left him hurt and disappointed that the family's accomplishments did not matter."}, {"q": "When Iverson calls walking into the Hampton courthouse \"the whiplash of my life,\" he most nearly means that the moment", "choices": ["caused him physical pain from old injuries.", "convinced him to avoid Virginia in the future.", "reminded him of how quickly his career could end.", "was a jarring, sudden swing from triumph back into painful memories."], "answer": 3, "explanation": "One day after accepting the Rookie of the Year award, he was back in the same courthouse where he had heard \"guilty\" and \"fifteen years,\" a violent emotional reversal."}, {"q": "The tone of the closing passage, in which Iverson vows to sag his pants further and hold his friends closer the more he is criticized, is best described as", "choices": ["defiant and unapologetic.", "regretful and ashamed.", "detached and analytical.", "lighthearted and joking."], "answer": 0, "explanation": "Iverson answers every criticism by promising to do the criticized thing even more; though he admits the stubbornness caused trouble, he refuses to apologize for who he was."}, {"q": "Iverson's account of handing the trophy to his mother primarily serves to", "choices": ["show that he considered the award unimportant.", "illustrate that he had proven he belonged in the NBA while declaring his loyalty to home and family.", "suggest that his mother had sacrificed more than anyone realized.", "explain why the press conference received little coverage."], "answer": 1, "explanation": "He calls the gesture both thanks and a statement: he belonged in the NBA, but his loyalty still belonged to his home, friends, and family."}, {"q": "Why, according to the chapter, did winning Rookie of the Year come as such a relief to Iverson?", "choices": ["He had promised his mother he would win it during his rookie season.", "The award came with a bonus he needed to pay his father's lawyers.", "As criticism grew louder despite his scoring, he had felt the award slipping away.", "He feared Marbury's team would lobby the voters against him."], "answer": 2, "explanation": "Iverson explains that the more points he scored, the more the talk against him grew and the more he felt the award slipping away, so finally winning it brought relief and vindication."}]}, {"id": "ch40-coach-larry-brown", "num": "40", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "Coach Larry Brown", "bank": [{"q": "Which statement best captures the central idea of this chapter?", "choices": ["Iverson's relationship with Coach Brown was marked by constant conflict yet grew into one of the great coaching relationships of his life.", "Coach Brown's arrival immediately transformed the Sixers into a championship contender.", "Iverson's legal troubles ended his chances of ever earning the league's respect.", "The Sixers' front office made a series of trades that Iverson opposed."], "answer": 0, "explanation": "Iverson calls Brown the other great coaching relationship of his life while admitting it took years to appreciate the man who pushed him to his limits, and the chapter traces both their fights and their progress."}, {"q": "In the interlude, why did Iverson arrive in Cleveland \"half-expecting boos\" at the 75th Anniversary celebration?", "choices": ["He had publicly criticized the league after retiring.", "Negative stories had followed him and he remembered the fifty-year celebration during his rookie season.", "Cleveland fans had never forgiven him for beating their team.", "He had refused to wear the blue blazer the NBA provided."], "answer": 1, "explanation": "Iverson says negative stories about him were circulating and he had not forgotten the fifty-year celebration during his rookie year, so he braced for boos again."}, {"q": "The interlude contrasts the 2022 celebration with the Hoop magazine cover and the 2005 dress code primarily to show that", "choices": ["the league still refused to accept Iverson's style.", "tattoos had become less popular among players over time.", "Iverson had finally decided to dress the way the NBA wanted.", "the self-expression the league once punished Iverson for had become normal for players."], "answer": 3, "explanation": "In 2022 nobody looked twice at his jeans, sneakers, and chains, while years earlier the league airbrushed his tattoos and wrote a dress code; the contrast shows how the league changed."}, {"q": "According to the chapter, what were the legal consequences of Iverson's August arrest in Virginia?", "choices": ["He was convicted of a felony and briefly jailed.", "He pleaded no contest to a misdemeanor weapon charge and received two years of probation.", "All charges were dropped after his lawyers appealed.", "He was suspended by the NBA for the first month of the season."], "answer": 1, "explanation": "After the traffic stop where police found marijuana and a gun without a Virginia permit, Iverson pleaded no contest to a misdemeanor weapon charge and got two years of probation."}, {"q": "It can most reasonably be inferred that Iverson gave up marijuana for the rest of his career because", "choices": ["constant drug testing on probation made him fear losing his career.", "Coach Brown made quitting a condition of staying on the team.", "his bodyguard Terry Royster convinced him to stop.", "the league threatened him with a lifetime ban."], "answer": 0, "explanation": "Iverson says probation meant constant testing for weed, so he gave it up, scared half to death that it could end his career."}, {"q": "Which of the following is true of the Sixers' hiring of Larry Brown?", "choices": ["Iverson personally lobbied the front office to hire him.", "Brown had just been fired by the Detroit Pistons.", "Brown was Pat Croce's second choice after another coach declined.", "The team chose Brown, who had just left the Indiana Pacers, without consulting Iverson."], "answer": 3, "explanation": "The chapter says the team landed on Larry Brown, who had just left his position coaching the Indiana Pacers, without consulting Iverson."}, {"q": "In the chapter, the story of the exhibition game at Temple functions primarily to", "choices": ["prove that Iverson was the most popular athlete in Philadelphia.", "explain why the Sixers traded for new guards.", "illustrate how the dynamic between Iverson and Coach Brown was set from the start.", "show that Iverson had stopped taking basketball seriously."], "answer": 2, "explanation": "Iverson arrived at 7:27 for a 7:30 game, never spoke to the newly hired Brown, and was accused of disrespect; he says that was the dynamic between them that would build and build."}, {"q": "When the Temple crowd \"went crazy\" as Iverson walked onto the court, he took it as a sign that", "choices": ["the fans expected the Sixers to win a championship that year.", "Philadelphia fans still embraced him despite the press complaints and his summer arrest.", "the fans preferred exhibitions to regular-season games.", "his popularity depended on scoring 40 points a night."], "answer": 1, "explanation": "Iverson says the crowd's reaction let him know that all the complaining from the press and TV after his rookie year and summer arrest had not changed how Philly fans felt about him."}, {"q": "Which of the following correctly describes the roster moves discussed in the chapter?", "choices": ["The Sixers traded Eric Snow to Seattle for a second-round pick.", "The Sixers signed Aaron McKie and Theo Ratliff as free agents.", "The Sixers traded Stackhouse for Billy King and a draft pick.", "The Sixers traded Stackhouse for Aaron McKie and Theo Ratliff, and sent a second-round pick to Seattle for Eric Snow."], "answer": 3, "explanation": "Stackhouse was traded for McKie and Ratliff, and a second-round pick went to Seattle for Eric Snow, a benchwarmer from Michigan State — moves that later let Iverson play off the ball."}, {"q": "According to the chapter, what changed for Iverson by the 1998-99 season?", "choices": ["He moved off the ball, came off screens, won his first scoring title, and the team made the playoffs.", "He became the full-time point guard and led the league in assists.", "He was named team captain and stopped missing practices.", "He sat out most of the season because of the lockout."], "answer": 0, "explanation": "With McKie and Snow able to initiate the offense, Iverson came off screens and got the ball on the wing; the team won more than it lost, he won his first scoring title, and they reached the playoffs."}, {"q": "Why was Iverson suspended for a game in Miami in March 2000?", "choices": ["He argued with a referee during the previous game.", "He arrived at the arena after tip-off.", "He skipped the morning shootaround after a long night out, saying he did not feel well.", "He refused to practice with the second unit."], "answer": 2, "explanation": "Iverson called the team to say he was not feeling well and would miss the shootaround; when he arrived at the arena in time for the game, Pat Croce told him he was suspended."}, {"q": "Which of the following happened during the 2000 playoff series against Indiana?", "choices": ["The Sixers were swept in four straight games.", "The Sixers fell behind three games to none, won the next two, then lost game six at home while facing death threats that named Iverson and his kids.", "The Sixers won the series after trailing three games to none.", "Iverson missed game six because the FBI advised him not to play."], "answer": 1, "explanation": "Down 3-0, the team won two straight before losing game six on their home floor; before that game the team received death threats naming Iverson and his kids, and the FBI investigated."}, {"q": "The aftermath of the December 1999 benching against Detroit suggests that open confrontation between Iverson and Coach Brown", "choices": ["convinced the front office to fire Brown at season's end.", "permanently destroyed their working relationship.", "led Iverson to demand a trade that the team nearly accepted that week.", "could clear the air temporarily and even fuel Iverson's play, without erasing the underlying tension."], "answer": 3, "explanation": "After the shouting session Croce arranged, the two found a place of peace and Iverson scored 32 in an overtime win, but the chapter notes the confrontation still lingered."}, {"q": "As used in the chapter, \"seething\" most nearly means", "choices": ["filled with barely contained anger.", "confused about what to do next.", "physically exhausted.", "quietly satisfied."], "answer": 0, "explanation": "Forced to sit and watch the Miami game he was suspended from, Iverson was seething — boiling with anger he could not act on."}, {"q": "Coach Brown joked that he had to \"endure\" Iverson's insults twice every game. As used here, \"endure\" most nearly means", "choices": ["encourage", "punish", "put up with", "ignore completely"], "answer": 2, "explanation": "Brown meant he had to tolerate Iverson's angry reaction each time he took him out of a game, once in each half."}]}, {"id": "ch41-staying-in-philly", "num": "41", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "Staying in Philly", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson demanded a trade after losing to Indiana in the playoffs.", "Pat Croce protected Iverson from the front office's plans.", "A trade to Detroit collapsed at the last moment, and the shock pushed Iverson to recommit to his coach and team.", "Matt Geiger and Iverson became close friends during the summer of 2000."], "answer": 2, "explanation": "The chapter recounts the near-trade to Detroit, its collapse over Geiger's contract, and Iverson's resulting determination to be more committed and to become team captain."}, {"q": "What news did Pat Croce deliver when he called Iverson in Virginia?", "choices": ["That Iverson was about to be traded to Detroit.", "That Coach Brown had resigned.", "That the team wanted Iverson to take a pay cut.", "That Iverson had been named team captain."], "answer": 0, "explanation": "Croce opened with \"Bubba, I'm sorry\" and told Iverson it looked like he was about to be traded to Detroit."}, {"q": "Iverson's \"little knot\" in his stomach when answering the phone suggests that he", "choices": ["was still upset about the playoff loss to Indiana.", "sensed something serious was coming, since Croce rarely called him.", "expected Croce to scold him for missing practices.", "already knew the details of the proposed trade."], "answer": 1, "explanation": "Iverson explains the knot came because Croce's calls were not regular, so an unexpected call from him signaled that something important, and likely bad, was happening."}, {"q": "Iverson compares his reaction to the trade news with getting out of jail and with shaking David Stern's hand on draft night primarily to", "choices": ["show that being traded is a normal part of NBA life.", "suggest that he had learned to control his feelings over the years.", "remind readers of the happiest moments of his career.", "convey that this was one of the rare moments when raw, unfiltered emotion poured out of him."], "answer": 3, "explanation": "Both earlier moments were times when his game face fell away completely; here the same raw emotion came out, except this time it was shock and disappointment rather than joy."}, {"q": "According to the chapter, how did Iverson respond to Croce on the phone?", "choices": ["He hung up and called Coach Brown directly.", "He calmly asked which players were included in the deal.", "He pleaded for another chance, promising to change and pointing out he was only twenty-five.", "He thanked Croce for his honesty and accepted the decision."], "answer": 2, "explanation": "Shocked and disappointed, Iverson pleaded with Croce, saying he would change and asking for one more chance at age twenty-five, but Croce said it was done."}, {"q": "When Iverson says hearing \"traded\" felt almost as bad as hearing \"fifteen years,\" he most nearly means that", "choices": ["his future was again being decided for him, no matter how he felt or whether it made sense.", "he believed playing in Detroit would feel like a prison sentence.", "he expected the trade to end his basketball career entirely.", "he feared the press would compare the trade to his conviction."], "answer": 0, "explanation": "He explains the feeling: that was it, it did not matter if there was a reason or how he felt about it — the same powerlessness he felt at his sentencing."}, {"q": "Whose words did Iverson think of after hearing the trade news, and what were they?", "choices": ["His mother's words: \"Believe in yourself.\"", "Coach Brown's words: \"Trust the process.\"", "Pat Croce's words: \"Bubba, I'm sorry.\"", "Nana's words: \"Never question God.\""], "answer": 3, "explanation": "Iverson thought of Nana's saying \"Never question God,\" though he admits that in that moment he was questioning God's wisdom."}, {"q": "According to the chapter, the proposed trade involved", "choices": ["only Iverson and Matt Geiger.", "twenty-some players and three or four teams.", "two first-round draft picks and five players.", "every member of the Sixers' starting lineup."], "answer": 1, "explanation": "Iverson describes the proposed deal as enormous, involving twenty-some players and three or four teams, which is why one player's contract could sink it."}, {"q": "What was the \"trade kicker\" in Matt Geiger's contract?", "choices": ["A clause entitling him to an extra 15 percent of his salary if he was traded.", "A no-trade clause that let him block any deal.", "A bonus paid if the team reached the playoffs.", "A penalty he owed the team if he demanded a trade."], "answer": 0, "explanation": "Once traded, Geiger was entitled to an additional 15 percent of his salary; the Pistons did not want to pay it and asked him to waive it."}, {"q": "Based on Geiger's own explanation, why did he refuse to waive his trade kicker?", "choices": ["He wanted to force the Pistons to pay him more money.", "His agent advised him the deal was illegal.", "He judged that he and Iverson would not have been better off in Detroit.", "He hoped to retire in Philadelphia."], "answer": 2, "explanation": "A year later Geiger said he looked at Detroit and did not think he and Allen would have been better off there — a choice Iverson calls beautiful and credits with saving him."}, {"q": "As used in the chapter, \"waive\" most nearly means", "choices": ["renegotiate", "postpone", "conceal", "voluntarily give up"], "answer": 3, "explanation": "The Pistons asked Geiger to waive his kicker, meaning to give up his contractual right to the extra 15 percent of his salary."}, {"q": "As used in the chapter, \"terminated\" most nearly means", "choices": ["renegotiated by the league office", "canceled completely", "delayed until the following season", "reduced to fewer teams"], "answer": 1, "explanation": "When Geiger said no, the whole trade got terminated — the entire deal was called off, and Iverson stayed in Philadelphia."}, {"q": "The tone of the line \"Thank you, Matt Geiger\" is best described as", "choices": ["sincerely grateful", "bitterly sarcastic", "coolly indifferent", "mildly amused"], "answer": 0, "explanation": "Iverson credits Geiger's refusal with saving him from the trade and, decades later, offers him genuine public thanks."}, {"q": "What did Iverson do as a result of the near-trade?", "choices": ["He demanded a contract extension from the front office.", "He asked the team to fire Pat Croce.", "He refused to speak to Coach Brown all summer.", "He resolved to commit to Coach Brown's wishes and asked to be team captain for the first time."], "answer": 3, "explanation": "The scare stuck with him; he determined to be more committed to what Coach Brown wanted, and he asked Brown to make him team captain, which Brown agreed to."}, {"q": "Why does Iverson suggest that \"God did have a hand\" in what happened?", "choices": ["The trade was announced on a religious holiday.", "The massive deal collapsed before it was ever made public, through one unlikely contract detail.", "Nana had predicted years earlier that he would never leave Philadelphia.", "Croce told him a prayer meeting changed the owners' minds."], "answer": 1, "explanation": "Before the trade reached the newspapers or SportsCenter, it fell apart because one player's kicker went unpaid; Iverson reads that improbable rescue as providence."}]}, {"id": "ch42-the-2000-2001-regular-season", "num": "42", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "The 2000–2001 Regular Season", "bank": [{"q": "Which choice best describes the primary purpose of this chapter?", "choices": ["To argue that the Sixers' front office made a mistake by pursuing trades during the season", "To prove that defense matters more than scoring in professional basketball", "To trace how a remarkable regular season, including a conflict and reconciliation with Coach Brown, set the stage for a playoff run", "To explain why All-Star Games should be taken more seriously by players"], "answer": 2, "explanation": "The chapter follows the 2000–2001 season from the 10-0 start through the team meeting, Coach Brown's brief disappearance, the All-Star Game, and the Mutombo trade, ending on the eve of the playoffs with the relationship with Brown repaired."}, {"q": "According to the passage, the Sixers' ten-game winning streak to open the season was built primarily on", "choices": ["aggressive, determined team defense", "Iverson's exceptional shooting touch", "Eric Snow's scoring off the bench", "a series of favorable trades made before training camp"], "answer": 0, "explanation": "Iverson says the streak 'started with defense' and that his own shooting was well under 40 percent, yet the team's defensive pressure was 'aggressive, determined, and infectious.'"}, {"q": "It can most reasonably be inferred that when Iverson told the press the trade rumors did not bother him, he was", "choices": ["being completely honest about his indifference to the rumors", "masking his relief at staying in Philadelphia behind a defiant public front", "secretly hoping the team would trade him after all", "trying to convince Coach Brown to resign"], "answer": 1, "explanation": "Iverson admits he had 'put on my game face' and was defiant with reporters, but confesses to the reader that he was 'so relieved to still be with this team, in this city, and yes, with this coach.'"}, {"q": "According to the passage, when Aaron McKie moved into the starting lineup, the team lost", "choices": ["its best defensive rebounder", "its starting shooting guard", "the coach's trust in the bench players", "McKie's contributions as the sixth man leading the bench units"], "answer": 3, "explanation": "Iverson explains that with Snow injured, McKie became a starter, and the team 'missed his contributions as the sixth man leading our bench units.'"}, {"q": "As used in the passage to describe Coach Brown after the Utah loss, \"measured\" most nearly means", "choices": ["silent and withdrawn", "balanced and restrained", "precise about statistics", "harsh and calculating"], "answer": 1, "explanation": "After the Utah game, Brown 'gave us the good with the bad—even after a terrible loss,' praising the team's play while noting what needed tightening, which shows a balanced, restrained response."}, {"q": "According to the passage, at the time of the blowout loss to the Dallas Mavericks, the Sixers", "choices": ["had fallen out of first place in the East", "had just lost Eric Snow to injury that same night", "still held the NBA's best record at 17-6", "were on a six-game losing streak"], "answer": 2, "explanation": "Iverson notes that despite the loss, 'we still had the NBA's best record at 17-6, so it wasn't panic time.'"}, {"q": "Based on the passage, Coach Brown's reaction to the team meeting Iverson called can best be described as feeling", "choices": ["blindsided and attacked by the entire team", "grateful that the players were finally being honest", "amused by Iverson's boldness as a captain", "confident that the criticism would blow over quickly"], "answer": 0, "explanation": "Iverson writes that although Brown 'just sat there and took it,' he later learned Brown 'felt blindsided. Attacked. And by all of us because the rest of the team listened while I expressed the frustration.'"}, {"q": "The account of the Utah game and its aftermath primarily serves to", "choices": ["prove that the Sixers could not protect large leads all season", "show that Stockton and Malone were still elite players", "explain why Iverson began scoring 45 points regularly", "mark a turning point in which Brown softened his approach and Iverson committed to working with him"], "answer": 3, "explanation": "After that loss, Brown gave 'the good with the bad,' which Iverson reads as Brown having listened to his plea; Iverson then decides 'right then that me and him were going to do it together.'"}, {"q": "According to the passage, the Western Conference All-Star team's starting front line consisted of", "choices": ["Shaquille O'Neal, Kobe Bryant, and Tim Duncan", "Tim Duncan, Kevin Garnett, and Chris Webber", "Karl Malone, John Stockton, and Kevin Garnett", "Dikembe Mutombo, Chris Webber, and Tim Duncan"], "answer": 1, "explanation": "Iverson says the West's 'starting front line was Tim Duncan, Kevin Garnett, and Chris Webber—all three in their prime,' and notes that Shaq sat out with an injury."}, {"q": "When Iverson says the All-Star Game \"might as well have been Anderson Park,\" he most nearly means that", "choices": ["the game was played on an outdoor court in poor condition", "the crowd was smaller than expected for a national broadcast", "he competed at full intensity even though the game officially did not count", "he wished he were back home instead of playing"], "answer": 2, "explanation": "He explains that even though the All-Star Game 'doesn't matter, supposedly' and doesn't count in official stats, 'it is a competition. And like every game I came to win,' just like the park games."}, {"q": "According to the passage, Iverson earned All-Star MVP honors after scoring", "choices": ["15 of his game-high 25 points in the fourth quarter", "45 points, including the game-winning three-pointer", "25 of the East's final 30 points", "35 points, the most in All-Star Game history"], "answer": 0, "explanation": "The passage states, 'I had scored 15 of my game-high 25 points in the fourth quarter, as we mounted that furious comeback,' after which David Stern presented the MVP trophy."}, {"q": "Iverson's first words after receiving the MVP trophy—asking \"Where's my coach?\" and calling the award \"a tribute to Coach Brown\"—primarily convey", "choices": ["his frustration that Brown had left the arena early", "his belief that coaches deserve trophies more than players", "his discomfort with being interviewed on national television", "his sense that his relationship with Brown had been repaired"], "answer": 3, "explanation": "Iverson immediately credits Brown on national television and then reflects, 'It seemed like our relationship was repaired, secure.'"}, {"q": "As used in the passage, calling the All-Star Game \"an audition\" most nearly suggests that the game", "choices": ["convinced Iverson he deserved a larger contract", "was staged by the league to test new rules", "served as a preview showing how well Iverson and Mutombo could work together", "was Mutombo's final chance to prove he could still play defense"], "answer": 2, "explanation": "Iverson says that once Coach Brown saw how he and Mutombo played together in that fourth-quarter comeback, 'he had to go for it' and trade for Mutombo weeks later."}, {"q": "Based on the passage, Iverson's reaction to the trade that brought Dikembe Mutombo to Philadelphia is best described as", "choices": ["excitement about the new arrival mixed with grief over losing Theo Ratliff", "pure joy, since the team clearly improved", "anger at management for breaking up the roster", "indifference, since injuries had already ended Ratliff's season"], "answer": 0, "explanation": "Iverson says he was excited to play with Dikembe, but Theo 'had become a brother, so losing him that year was crushing.'"}, {"q": "The story about Derrick Coleman and Dikembe Mutombo taking Iverson out after Ra's death primarily functions to", "choices": ["criticize Iverson's habit of missing practices during hard times", "illustrate Mutombo's character and show how teammates lifted Iverson out of his grief", "explain why Mutombo stopped socializing with teammates", "demonstrate that Iverson had lost interest in basketball"], "answer": 1, "explanation": "Iverson tells the story 'just to give a sense of the dude' Mutombo was; the champagne-spraying prank 'made no sense' but gave Iverson 'the first laugh I had in a minute' during his grief over Ra."}]}, {"id": "ch43-from-the-playoffs-to-the-finals", "num": "43", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "From the Playoffs to the Finals", "bank": [{"q": "Which choice best states the main idea of this chapter?", "choices": ["A single injury to George Lynch cost the Sixers a championship they should have won", "Through injuries, doubt, and three straight seven-game battles' worth of pressure, the Sixers fought their way to the NBA Finals", "Iverson's individual scoring mattered more to the Sixers than any team effort", "The 2001 playoffs proved that Coach Brown's defensive system no longer worked"], "answer": 1, "explanation": "The chapter follows the full playoff run—Indiana, Toronto, Milwaukee, and the Finals—emphasizing how the hobbled team kept advancing under enormous pressure until game one against the Lakers."}, {"q": "According to the passage, game one against the Indiana Pacers ended when", "choices": ["Iverson missed a potential game-winning shot at the buzzer", "the Sixers held on to win despite blowing a sixteen-point lead", "Jalen Rose scored on a drive in the final seconds", "Reggie Miller got free behind the three-point line and hit the game winner"], "answer": 3, "explanation": "With the Pacers down two in the final seconds, Miller 'got free behind the three-point line with less than three seconds left, and he knocked down the game winner.'"}, {"q": "The author quotes the Inquirer headline \"Gloom and Doomed\" primarily to", "choices": ["capture the panic in Philadelphia that the team was repeating its past playoff failures", "show that the local press had always disliked Iverson", "prove that newspapers exaggerated the Pacers' talent", "explain why Coach Brown decided to study the game tape"], "answer": 0, "explanation": "Right after the headline, Iverson writes, 'It was as if we were on repeat. This again? Panic set in throughout the Philadelphia area,' since the Pacers had eliminated them two straight years."}, {"q": "According to the passage, after watching the tape of game one, Coach Brown adjusted by", "choices": ["benching the starters who had struggled in the fourth quarter", "asking Mutombo to guard Reggie Miller on the perimeter", "designing ways to get Iverson the ball in position to attack before the defense swarmed him", "slowing the offense down to shorten the game"], "answer": 2, "explanation": "Brown saw the Pacers were swarming Iverson once he had the ball—'just like back when I was at Bethel'—so he sketched out ways to get him the ball ready to attack, with instructions to pass out quickly if trapped."}, {"q": "Iverson's statement, \"I'm not acting like I won a championship,\" most strongly suggests that beating Indiana", "choices": ["meant little to him compared with the series that followed", "carried emotional weight beyond an ordinary first-round victory", "embarrassed him because he celebrated too much", "convinced him the Sixers were guaranteed to win the title"], "answer": 1, "explanation": "He completes the thought by saying that beating 'a team that has beaten you two years in a row, shattered your dreams' feels good—showing the win answered two years of playoff heartbreak."}, {"q": "According to the passage, in game two against Toronto, Iverson scored", "choices": ["54 of his team's 97 points, including the last 19", "45 points in an eighteen-point win", "52 points to take a three-games-to-two lead", "26 points in the fourth quarter alone"], "answer": 0, "explanation": "Iverson put the ball up thirty-nine times and 'scored 54 of our 97 points, including the last 19, in a game we won by just five points.' The other totals come from different games."}, {"q": "As used in the passage—\"In game five, I harnessed that heart\"—the word \"harnessed\" most nearly means", "choices": ["restrained", "protected", "channeled into use", "concealed"], "answer": 2, "explanation": "Fresh off saying his heart 'couldn't be measured,' Iverson describes putting that heart to work by scoring 52 points in game five, so 'harnessed' means he directed it into his play."}, {"q": "When asked where his game-two performance came from, Iverson answered, \"Life... Poverty.\" This response most strongly implies that", "choices": ["he believed poverty forced him to practice harder than other players", "he wanted reporters to stop asking about his past", "he credited his coaches for preparing him for big games", "surviving hardship gave him a resilience that made basketball pressure feel small"], "answer": 3, "explanation": "He explains that his hardships 'had become part of my superpower,' asking, 'After surviving all that, what could possibly stop me now?'—game pressure could not compare to what he had lived through."}, {"q": "According to the passage, when Iverson won the league MVP award, he led the NBA in", "choices": ["points, rebounds, and assists", "points, steals, and minutes per game", "steals, blocks, and free-throw percentage", "scoring average and games played"], "answer": 1, "explanation": "Iverson writes, 'I led the league in points, in steals, in minutes per game,' and notes he was the smallest MVP in league history."}, {"q": "Coach Brown's comment—\"If he sits, he's going to get stiff—or get mad at me, which is worse\"—chiefly reveals", "choices": ["his wry understanding of how fiercely Iverson insisted on playing", "his fear that the team doctors would overrule him", "his belief that the tailbone injury was not real", "his frustration with Iverson's declining shooting"], "answer": 0, "explanation": "The joke shows Brown knew Iverson too well to bench him despite the bruised tailbone—Iverson's anger at sitting would be a bigger problem than stiffness."}, {"q": "According to the passage, game five against Milwaukee was decided when", "choices": ["Iverson hit a dagger three-pointer over Ray Allen", "Raja Bell scored on a putback at the buzzer", "Eric Snow hit a jumper to win by one", "Dikembe Mutombo blocked a final shot"], "answer": 2, "explanation": "The passage says that 'after aggravating his injured ankle in game four, Eric Snow hit the jumper to win by one in game five.' Iverson's dagger over Ray Allen came in game one."}, {"q": "The paragraph naming Iverson's mother, sisters, aunt, uncles, Tawanna, his children, Mo, and Coach Thompson primarily serves to", "choices": ["list the people who pressured Iverson to keep playing while injured", "explain how Iverson afforded tickets for so many guests", "contrast his supportive family with his critical teammates", "emphasize that the playoff run was shared with his family and community, not achieved alone"], "answer": 3, "explanation": "The passage builds directly to Iverson's declaration that 'it wasn't just Allen Iverson. It was all of Newport News... All my family. All my friends. Philly.'"}, {"q": "As used in the passage—the Lakers \"having dispatched their conference finals foe days before\"—\"dispatched\" most nearly means", "choices": ["defeated", "sent a message to", "scheduled", "scouted"], "answer": 0, "explanation": "The Lakers were waiting for the East winner because they had already beaten their conference finals opponent; 'dispatched' here means finished off or defeated."}, {"q": "Based on the passage, Iverson calls the game-one victory over the Lakers \"the greatest moment of my career\" most likely because", "choices": ["it was the only Finals game in which he scored 46 points", "it earned him a second MVP trophy", "his exhausted, injured team beat a rested, previously undefeated Lakers squad that no one gave them a chance against", "it guaranteed the Sixers home-court advantage for the rest of the series"], "answer": 2, "explanation": "Iverson stresses that the Lakers had won every playoff game and dreamed of a historic undefeated run, while the Sixers arrived hobbled off back-to-back seven-game series and 'nobody thought we had a chance.'"}, {"q": "The chapter's final paragraph—moving from Iverson's wedding to Ra's death to the practice press conference—creates a tone best described as", "choices": ["triumphant and celebratory", "abrupt and foreboding, shadowing joy with coming grief", "detached and clinical", "bitter and vengeful toward the press"], "answer": 1, "explanation": "In a few clipped sentences, the joy of the wedding gives way to Ra's murder two months later, new trade rumors, and the looming 'practice' press conference, casting a dark shadow over the chapter's high point."}]}, {"id": "ch44-among-giants", "num": "44", "part": "Part VI — The 75th Anniversary Team and a Run to the Finals", "title": "Among Giants", "bank": [{"q": "Which choice best describes the primary purpose of this chapter?", "choices": ["To reflect on Iverson's legacy at the 75th Anniversary celebration and finally explain what the famous press conference was really about", "To rank the greatest players in the history of the NBA", "To argue that modern players should be criticized for load management", "To describe the rules changes that have transformed today's NBA"], "answer": 0, "explanation": "The chapter frames Iverson's walk to center court in Cleveland as the culmination of his journey, then closes the book by explaining that the 'practice' press conference was never really about practice."}, {"q": "According to the passage, what had changed about some of the older legends since 1997?", "choices": ["They had stopped attending league celebrations altogether", "They now coached the young players they once criticized", "The same men who once said the younger generation was ruining the game now told Iverson it was an honor to meet him", "They publicly apologized for the way the press treated Iverson"], "answer": 2, "explanation": "Iverson notes that some of the older guys were 'the same dudes who talked about the younger generation ruining the game back in 1997,' yet now they wanted to meet him and echoed his own words of respect."}, {"q": "Iverson's observation that hearing \"practice\" is now \"almost like saying, 'What's up'\" most strongly suggests that", "choices": ["he remains deeply wounded whenever the moment is mentioned", "the phrase has been transformed from a criticism into an affectionate greeting", "the other legends were secretly mocking him at the celebration", "he regrets ever holding the press conference"], "answer": 1, "explanation": "He explains that the references were 'just a positive thing'—he has even used the moment in TV ads—so the once-damaging soundbite has become a friendly shorthand."}, {"q": "According to the passage, the old-timers described \"load management\" as players", "choices": ["practicing less than older generations did", "retiring earlier than they should", "demanding trades when they were unhappy", "missing fifteen or twenty games a year without any official injury"], "answer": 3, "explanation": "The old-timers marveled at the games modern players miss, and Iverson defines the term: 'Guys might miss fifteen or twenty games a year without any official injury.'"}, {"q": "Iverson's comparison of NBA players to surgeons primarily serves to suggest that", "choices": ["basketball requires the same precision as medicine", "athletes should be paid as much as doctors", "he does not feel entitled to publicly tear down fellow professionals at the top of their /* ============ STATE ============ */
const LS_KEY = "sotc-exam-misunderstood-v1";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveRecords(r) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(r)); } catch (e) {}
}
let records = loadRecords();
let view = { name: "home" };
let quiz = null; // {chIdx, questions:[{q,choices,answer,explanation}], picked:[null,...]}

/* ============ HELPERS ============ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
const LETTERS = ["A", "B", "C", "D"];

function buildQuiz(chIdx) {
  const bank = BOOK.chapters[chIdx].bank;
  const n = Math.min(BOOK.perQuiz, bank.length);
  const qs = shuffle(bank).slice(0, n).map(src => {
    const order = shuffle([0, 1, 2, 3]);
    return {
      q: src.q,
      choices: order.map(i => src.choices[i]),
      answer: order.indexOf(src.answer),
      explanation: src.explanation
    };
  });
  return { chIdx, questions: qs, picked: qs.map(() => null) };
}
function needToPass(n) { return Math.ceil(n * BOOK.passPct / 100); }

/* ============ RENDER: HOME ============ */
function renderHome() {
  const passedCount = BOOK.chapters.filter(c => (records[c.id] || {}).passed).length;
  let rows = "";
  let lastPart = null;
  BOOK.chapters.forEach((c, i) => {
    if (c.part !== lastPart) {
      if (lastPart !== null) rows += "</ul>";
      rows += `<div class="part-label">${esc(c.part)}</div><ul class="roster">`;
      lastPart = c.part;
    }
    const rec = records[c.id] || {};
    const passed = !!rec.passed;
    let chip, stats;
    if (passed) {
      chip = `<span class="chip passed">Passed ✓</span>`;
      stats = `Best score ${rec.best}% · ${rec.attempts} attempt${rec.attempts === 1 ? "" : "s"}`;
    } else if (rec.attempts) {
      chip = `<span class="chip attempted">Best ${rec.best}%</span>`;
      stats = `${rec.attempts} attempt${rec.attempts === 1 ? "" : "s"} · need ${BOOK.passPct}% to pass`;
    } else {
      chip = `<span class="chip">Not started</span>`;
      stats = `${c.bank.length} questions in the bank · ${Math.min(BOOK.perQuiz, c.bank.length)} per exam`;
    }
    rows += `
      <li><button class="ch-row ${passed ? "is-passed" : ""}" data-ch="${i}">
        <span class="qnum">${esc(c.num)}</span>
        <span class="meta">
          <p class="title">${esc(c.title)}</p>
          <p class="stats">${stats}</p>
        </span>
        ${chip}
      </button></li>`;
  });
  rows += "</ul>";

  document.getElementById("app").innerHTML = `
    <header class="masthead">
      <div>
        <p class="eyebrow">Science on the Court · High School Reading Exam</p>
        <h1>${esc(BOOK.title)}</h1>
        <p class="byline">A memoir by ${esc(BOOK.author)}</p>
      </div>
      <div class="jersey" aria-hidden="true"><span class="num">3</span><span class="lbl">Iverson</span></div>
    </header>
    <div class="scout">
      <p>Read the chapter first, then take its exam. <br>Score <strong>${BOOK.passPct}% or better</strong> to pass — retakes get a fresh set of questions.</p>
      <div class="tally"><span class="big mono">${passedCount}/${BOOK.chapters.length}</span><span class="sub">chapters passed</span></div>
    </div>
    ${rows}
    <p class="rules">Answers are checked only when you submit, just like the real SAT — you can change any answer before then. Your progress saves on this device.</p>
  `;
  document.querySelectorAll(".ch-row").forEach(btn => {
    btn.addEventListener("click", () => {
      quiz = buildQuiz(Number(btn.dataset.ch));
      view = { name: "exam" };
      render();
      window.scrollTo(0, 0);
    });
  });
}

/* ============ RENDER: EXAM ============ */
function renderExam() {
  const ch = BOOK.chapters[quiz.chIdx];
  const total = quiz.questions.length;
  const qsHtml = quiz.questions.map((q, qi) => `
    <fieldset class="q-card" style="border:1px solid var(--line);margin:18px 0;padding:20px;">
      <legend class="q-head" style="padding:0;">
        <span class="qnum">Question ${qi + 1} of ${total}</span>
      </legend>
      <p class="q-text">${esc(q.q)}</p>
      <div class="choices" role="radiogroup" aria-label="Question ${qi + 1} choices">
        ${q.choices.map((c, ci) => `
          <label class="choice ${quiz.picked[qi] === ci ? "selected" : ""}" data-q="${qi}" data-c="${ci}">
            <input type="radio" name="q${qi}" value="${ci}" ${quiz.picked[qi] === ci ? "checked" : ""}>
            <span class="letter">${LETTERS[ci]}</span>
            <span class="ctext">${esc(c)}</span>
          </label>`).join("")}
      </div>
    </fieldset>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="exam-bar">
      <span class="ch">${esc(ch.num)} · ${esc(ch.title)}</span>
      <span class="count mono"><b id="answeredCount">0</b>/${total} answered</span>
      <button class="btn quiet" id="quitBtn">Exit</button>
    </div>
    ${qsHtml}
    <div class="submit-zone">
      <p class="warn" id="submitWarn" hidden>Answer every question before submitting.</p>
      <button class="btn" id="submitBtn">Submit exam</button>
    </div>
  `;

  const updateCount = () => {
    const done = quiz.picked.filter(p => p !== null).length;
    document.getElementById("answeredCount").textContent = done;
  };
  document.querySelectorAll(".choice").forEach(lab => {
    lab.querySelector("input").addEventListener("change", () => {
      const qi = Number(lab.dataset.q), ci = Number(lab.dataset.c);
      quiz.picked[qi] = ci;
      document.querySelectorAll(`.choice[data-q="${qi}"]`).forEach(l => l.classList.remove("selected"));
      lab.classList.add("selected");
      updateCount();
      document.getElementById("submitWarn").hidden = true;
    });
  });
  updateCount();
  document.getElementById("quitBtn").addEventListener("click", () => {
    if (confirm("Exit this exam? Your answers won't be saved.")) {
      quiz = null; view = { name: "home" }; render(); window.scrollTo(0, 0);
    }
  });
  document.getElementById("submitBtn").addEventListener("click", () => {
    if (quiz.picked.some(p => p === null)) {
      document.getElementById("submitWarn").hidden = false;
      const firstBlank = quiz.picked.findIndex(p => p === null);
      const el = document.querySelectorAll(".q-card")[firstBlank];
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    gradeQuiz();
  });
}

/* ============ GRADE ============ */
function gradeQuiz() {
  const total = quiz.questions.length;
  const correct = quiz.questions.reduce((n, q, i) => n + (quiz.picked[i] === q.answer ? 1 : 0), 0);
  const pct = Math.round(correct / total * 100);
  const passed = pct >= BOOK.passPct;
  const ch = BOOK.chapters[quiz.chIdx];
  const rec = records[ch.id] || { attempts: 0, best: 0, passed: false };
  rec.attempts += 1;
  rec.best = Math.max(rec.best, pct);
  rec.passed = rec.passed || passed;
  records[ch.id] = rec;
  saveRecords(records);
  view = { name: "results", correct, total, pct, passed };
  render();
  window.scrollTo(0, 0);
}

/* ============ RENDER: RESULTS ============ */
function renderResults() {
  const { correct, total, pct, passed } = view;
  const ch = BOOK.chapters[quiz.chIdx];
  const need = needToPass(total);
  const review = quiz.questions.map((q, qi) => {
    const yours = quiz.picked[qi];
    const good = yours === q.answer;
    return `
      <div class="q-card r-card ${good ? "good" : "bad"}">
        <div class="q-head">
          <span class="qnum">Q${qi + 1}</span>
          <span class="verdict ${good ? "good" : "bad"}">${good ? "Correct" : "Incorrect"}</span>
        </div>
        <p class="q-text">${esc(q.q)}</p>
        <div class="choices">
          ${q.choices.map((c, ci) => {
            let cls = "choice r-choice";
            if (ci === q.answer) cls += " was-correct";
            else if (ci === yours) cls += " was-wrong";
            return `<div class="${cls}"><span class="letter">${LETTERS[ci]}</span><span class="ctext">${esc(c)}</span></div>`;
          }).join("")}
        </div>
        <p class="explain"><b>Why:</b> ${esc(q.explanation)}</p>
      </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="exam-bar">
      <span class="ch">${esc(ch.num)} · ${esc(ch.title)} — Results</span>
    </div>
    <div class="scoreboard">
      <div class="label">Final score</div>
      <div class="digits">${correct}<span style="opacity:.45">/${total}</span></div>
      <div class="pct">${pct}%</div>
      <div><span class="stamp ${passed ? "pass" : "fail"}">${passed ? "Passed" : "Retake"}</span></div>
      <p class="msg">${passed
        ? "That's a passing score. This chapter is in the books — on to the next one."
        : `You need ${need} of ${total} (${BOOK.passPct}%) to pass. Reread the chapter, check the explanations below, and run it back — the retake draws different questions.`}</p>
    </div>
    <div class="review-h"><span>Answer review</span><span class="key">Green = correct answer · Red = your pick</span></div>
    ${review}
    <div class="end-actions">
      <button class="btn" id="retakeBtn">${passed ? "Take it again" : "Retake — new questions"}</button>
      <button class="btn ghost" id="homeBtn">Back to chapters</button>
    </div>
  `;
  document.getElementById("retakeBtn").addEventListener("click", () => {
    quiz = buildQuiz(quiz.chIdx);
    view = { name: "exam" };
    render();
    window.scrollTo(0, 0);
  });
  document.getElementById("homeBtn").addEventListener("click", () => {
    quiz = null; view = { name: "home" }; render(); window.scrollTo(0, 0);
  });
}

/* ============ ROUTER ============ */
function render() {
  if (view.name === "home") renderHome();
  else if (view.name === "exam") renderExam();
  else renderResults();
}
render();
</script>
