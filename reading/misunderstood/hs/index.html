 Iverson learned?", "choices": ["She broke material into small segments and incorporated art and debate", "She required long periods of silent reading each day", "She sent him to attend classes at the Milburn School's campus", "She reduced his homework load every week"], "answer": 0, "explanation": "Because sitting still and passively learning was hard for him, she developed material in small segments so he could concentrate, brought in art, and let him debate topics he liked."}, {"q": "Mary Fenlon's judgment that Iverson was \"a diamond in the rough\" most nearly conveys that he", "choices": ["was already fully prepared for college coursework", "had real potential even though his schooling was unpolished", "was unlikely ever to qualify academically for Georgetown", "was a stronger artist than student"], "answer": 1, "explanation": "After reviewing the work he had done with Ms. Lambiotte, Coach Thompson's academic counselor saw genuine promise beneath the rough edges — her approval moved him closer to Georgetown."}, {"q": "The anecdote in which Ra pulls Iverson's shirt over his head and forces him out of the club primarily serves to", "choices": ["prove that Iverson constantly violated his curfew", "explain why Iverson stopped going out with his friends", "show that his friends actively protected his future even while living risky lives themselves", "suggest that Ra was jealous of Iverson's growing fame"], "answer": 2, "explanation": "When a fight broke out, Ra physically removed Iverson so he would not violate his release conditions — Iverson cites it as proof of the bond his crew had."}, {"q": "According to the passage, why did people believe the Bethel principal fired Coach Bailey?", "choices": ["Because of Bailey's support of Allen Iverson", "Because the team had collapsed without Iverson", "Because Bailey had accepted a job at Wake Forest", "Because Bailey had broken recruiting rules"], "answer": 0, "explanation": "The school never gave a reason, but everyone figured the firing came down to Bailey's support of Iverson — especially since the team had done okay and Tony Rutland was state player of the year."}, {"q": "By quoting the principal's remark, \"We won't have people who can average twenty points per game,\" and adding \"Imagine wanting that,\" Iverson conveys", "choices": ["agreement that the team needed more balanced scoring", "hope that Bethel would eventually rehire Coach Bailey", "respect for the principal's honesty with the press", "disbelief that a school would treat exceptional talent as a problem"], "answer": 3, "explanation": "His sarcastic aside ridicules the principal's stated goal, underscoring how senseless he found both the comment and the firing."}, {"q": "How did Coach Thompson treat Iverson in the months before the letter of intent became official?", "choices": ["He visited Virginia repeatedly to encourage him", "He promised him a starting position as a freshman", "He kept his distance and waited to see whether Iverson met the conditions he had set", "He pressured the family to sign immediately"], "answer": 2, "explanation": "Thompson did not come to Virginia a single time; he said the last thing Iverson needed was to be coddled and simply waited to see if Iverson lived up to his end of the bargain."}, {"q": "As used in the passage, \"coddled\" most nearly means", "choices": ["punished harshly", "treated in an overly protective, indulgent way", "ignored completely", "trained with rigorous drills"], "answer": 1, "explanation": "Thompson believed Iverson should not be babied or shielded, which is why he stayed away and held him to firm conditions instead."}, {"q": "According to the passage, the nickname \"The Answer\" grew out of the idea that", "choices": ["with stars like Jordan, Bird, and Magic gone, the league had questions, and Iverson would be the answer", "Iverson always answered reporters' questions honestly", "Ms. Lambiotte praised the answers on his practice tests", "the nickname Bubbachuck was already being used by another player"], "answer": 0, "explanation": "Talking with Jamil Blackmon about the NBA losing its biggest stars, they decided that for a league with a lot of questions, Iverson would be the answer."}, {"q": "The discussion of Wu-Tang, Biggie, and Tupac primarily serves to", "choices": ["argue that Iverson should have pursued a rap career instead of basketball", "list the most important albums released while he was in jail", "criticize the authority figures at Iverson's school", "show how the music voiced the life he and his friends lived and the paths out they imagined"], "answer": 3, "explanation": "Iverson says Biggie was telling their story — success could come through hustling, music, or basketball — and explains that his friends pursued music while he focused on his jump shot."}, {"q": "Iverson's statement that getting out of jail made part of him feel \"invincible\" is best understood to mean that", "choices": ["he believed he could no longer be arrested under the law", "he thought his conviction had been permanently erased", "having endured jail and dominated high school sports, he felt nothing could stop him", "he felt physically stronger than he had before jail"], "answer": 2, "explanation": "He reasons that if he had conquered jail and already dominated all of high school sports, there was nothing he could not do — a boost in how he and his friends saw themselves."}]}, {"id": "ch20-back-to-basketball", "num": "20", "part": "Part III — From the Jungle to Georgetown", "title": "Back to Basketball", "bank": [{"q": "Which choice best describes the main purpose of the chapter?", "choices": ["To describe the founding and history of the Kenner Summer League", "To explain Georgetown's rules for players speaking to the press", "To recount Iverson's electrifying return to real competition while he finished the last requirements for his diploma", "To argue that summer leagues matter more than college basketball"], "answer": 2, "explanation": "The chapter follows two intertwined threads: Iverson's three Kenner League playoff games in August 1994 and his final push — SAT, last credits, graduation — to become eligible for Georgetown."}, {"q": "After Iverson earned a high enough SAT score that summer, what did he still need?", "choices": ["His last school credits and the diploma", "A letter of intent from Georgetown", "A scholarship offer from Coach Thompson", "A ruling on his court appeal"], "answer": 0, "explanation": "The passage says that once his SAT score made him eligible, only one thing remained: earning his final credits so the Milburn School could grant the diploma."}, {"q": "According to the passage, how was Iverson permitted to play in the Kenner League despite the governor's ban on organized sports?", "choices": ["Governor Wilder lifted all of his release conditions early", "Coach Thompson filed a petition with the league", "His furlough had officially ended in June", "His lawyers spoke to the parole office, which made an exception because he was doing well"], "answer": 3, "explanation": "Iverson talked to his lawyers, who talked to the parole office; because his conduct had been good, they allowed him to join the league's end-of-summer playoff."}, {"q": "The description of Iverson's arrival at the first game — no announcement, barely time for warm-ups, a jersey found just before tip-off — mainly emphasizes", "choices": ["how poorly organized the Kenner League was", "how quiet and unheralded his return was before his play revealed him", "that he was physically unprepared to compete", "that Georgetown wanted to hide him from the press permanently"], "answer": 1, "explanation": "He says it was like he snuck into the gym — nobody knew he was coming, and the crowd was oblivious until the announcer said his name after his first basket."}, {"q": "According to the passage, what did Iverson do in his first Kenner League playoff game?", "choices": ["He scored 30 points in the first half and 40 in the game as his team won", "He scored 34 points while Jerome Williams added 37", "He scored 26 points but struggled with his three-point shot", "He sat out most of the game waiting for a jersey"], "answer": 0, "explanation": "In that first game, everything flowed — 30 points in the first half, 40 in the game, and a win that put the team in the semifinal."}, {"q": "The moment when the public address announcer says \"Allen Iverson\" functions in the passage to", "choices": ["show that Eddie Saah had broken the league's rules", "explain why the start of the game was delayed", "mark the turning point when the unsuspecting crowd realizes who is on the court", "criticize announcers for distracting the players"], "answer": 2, "explanation": "The crowd had no idea he was playing until the announcement after his first three-pointer; his very next play — a steal and dunk — confirmed what they thought they had heard."}, {"q": "The growth of the crowds — a few hundred, then over 3,000, then about 4,000 with hundreds turned away — most strongly suggests that", "choices": ["the Kenner League playoffs always drew capacity crowds", "Georgetown had advertised the games heavily that week", "most fans came primarily to watch Jerome Williams", "word of Iverson's return spread rapidly and his presence alone drew people in"], "answer": 3, "explanation": "After his surprise first game made the papers and radio, lines wrapped around the block; the passage attributes the crush of fans directly to people learning Iverson was playing."}, {"q": "According to the passage, what happened in the semifinal game?", "choices": ["Iverson scored 37 while Jerome Williams scored 34 in a narrow loss", "Iverson scored 34, Jerome Williams scored 37, and the team won 104-90", "Iverson scored 40 points for the second straight game", "The game was canceled when too many fans arrived"], "answer": 1, "explanation": "Before a standing-room crowd of well over 3,000, Iverson scored 34, shared the limelight with junior college transfer Jerome Williams, who scored 37, and the team won 104-90."}, {"q": "The detail that Dikembe Mutombo, a fourth overall NBA draft pick, had to stand behind the baskets at the final primarily serves to", "choices": ["underscore how extraordinary the demand to see Iverson had become", "show that Mutombo disliked watching summer basketball", "suggest that Georgetown mistreated its former players", "explain why the championship game started late"], "answer": 0, "explanation": "With 4,000 people packed in — 1,500 over the maximum — even a three-year NBA veteran could not get a seat, dramatizing the frenzy around Iverson's return."}, {"q": "As used in the passage, \"excruciating\" most nearly means", "choices": ["mildly annoying", "extremely careful", "surprisingly brief", "almost unbearably difficult"], "answer": 3, "explanation": "Iverson asks readers to imagine how hard it was to return to the classroom after proving he could dominate the college game — the word conveys near-torturous difficulty."}, {"q": "As used in the passage, the statement that \"The crowd was oblivious\" most nearly means the crowd was", "choices": ["hostile toward the visiting team", "too loud to hear the announcer", "unaware of who was on the court", "bored by summer league basketball"], "answer": 2, "explanation": "Because there had been no announcement of his arrival, the fans did not know Iverson was playing until the PA announcement after his first shot."}, {"q": "The opening paragraph about his dad's new charge and E's arrest primarily serves to", "choices": ["show that Iverson had cut off his old friends from home", "remind readers of the dangers pulling at him from home, which fueled his urgency to succeed", "prove that the governor's release conditions had failed", "introduce a new court case that his lawyers would handle"], "answer": 1, "explanation": "Iverson calls the arrests regular but more dangerous, saying they gave him all the more reason to figure it out and get himself and everyone else out of that life."}, {"q": "Based on the passage, why did Iverson consider Coach Thompson's rules limiting press access \"exactly what I needed\"?", "choices": ["They kept his criminal case permanently sealed", "They prevented other colleges from recruiting him", "They excused him from ever giving interviews in his career", "They let him focus on sports, family, and education instead of reporters"], "answer": 3, "explanation": "He says the protective cone of silence allowed him to keep the press away and concentrate on exactly the things he needed to rebuild — sports, family, and school."}, {"q": "According to the passage, what happened in the championship game?", "choices": ["Iverson scored 26, shot poorly from three-point range, but won the title and left before collecting the trophy", "Iverson scored 40 points and stayed afterward to accept the trophy", "Iverson's team lost a close game despite his strong shooting", "Iverson sat out to protect his college eligibility"], "answer": 0, "explanation": "He scored only 26 and made just three of fourteen three-pointers, but the team won the championship, and he was moved out of the gym so fast he never collected the trophy."}, {"q": "The \"graduation of one\" that Ms. Lambiotte organized best illustrates that", "choices": ["Ms. Lambiotte broke school rules to help Iverson graduate", "Iverson regretted skipping a traditional senior year", "his achievement, though unconventional, was real and shared with the people who helped him", "the Milburn School had refused to recognize his credits"], "answer": 2, "explanation": "With a cap and gown, his family, and the Milburn coordinator present, Iverson gave a speech thanking everyone, saying he could not have achieved his dreams without the people in the room."}]}, {"id": "ch21-adjusting-to-georgetown", "num": "21", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Adjusting to Georgetown", "bank": [{"q": "Which statement best captures the central idea of this chapter?", "choices": ["Iverson regretted choosing Georgetown over other schools that would have let him play football.", "Iverson's college success came mainly from the luxurious living conditions on campus.", "Iverson's transition to college life was shaped by Coach Thompson's strict but deeply caring guidance.", "Iverson spent his freshman fall focused entirely on improving his jump shot."], "answer": 2, "explanation": "Throughout the chapter, Thompson controls nearly everything, from roommates to jersey rules to closed practices, yet each episode ends by revealing how much he cared about Iverson's wellbeing and future."}, {"q": "In \"The Benz,\" why did the story Jerry Nichols told solidify Iverson's trust in Coach Thompson?", "choices": ["It revealed what Thompson said about Iverson privately, when he believed no player could hear him.", "It confirmed that Thompson would allow players to keep their cars on campus.", "It proved that Thompson had promised Nichols more playing time.", "It showed that Thompson praised Iverson publicly after every victory."], "answer": 0, "explanation": "Iverson explains that he judged people by what they said behind his back, not to his face; Nichols overheard Thompson praising him in the coaches' private postgame bathroom meeting, and \"that was it.\""}, {"q": "In \"The Benz,\" Coach Thompson suspected Iverson might enter the NBA Draft because", "choices": ["Iverson had told his teammates he was leaving.", "an agent had contacted the Georgetown athletic office.", "Iverson had stopped showing up to team workouts.", "he had heard that Iverson was driving a 600 Benz."], "answer": 3, "explanation": "Thompson tells Iverson, \"I know what you been driving,\" referring to the loaner 600 Benz, which prompted his direct question about going pro."}, {"q": "Why was Iverson briefly suspended before official practices began in October?", "choices": ["His grades fell below the university's academic standards.", "Nike had paid for a second round-trip flight during his trial, an impermissible benefit that had to be repaid.", "He had accepted payment for signing autographs for fans.", "He refused to follow the team's dress code at an early event."], "answer": 1, "explanation": "NCAA rules allowed only one round-trip flight to the Nike camp, so the added second flight was an improper benefit; Georgetown suspended him, proved Nike was repaid, and the NCAA reinstated him in time to practice."}, {"q": "It can be reasonably inferred that Coach Thompson paired Iverson with Don Reid as a roommate primarily because", "choices": ["Reid's seriousness and steady example would keep Iverson focused despite all the attention he received.", "both players competed for the same position and needed to build chemistry.", "Reid had specifically requested to room with the famous freshman.", "the two had been close friends growing up in Virginia."], "answer": 0, "explanation": "Iverson says Thompson \"really thought of everything\" and placed him with Don Reid, a quiet, lead-by-example senior captain, to keep him \"on the right track.\""}, {"q": "Why did Iverson start walking the long way to McDonough Hall?", "choices": ["Coach Thompson ordered players to avoid the athletic fields before the season.", "He wanted to avoid the crowds of students who recognized him.", "Passing the football field stirred up painful longing for the sport he had been forced to give up.", "The direct route was closed for construction that fall."], "answer": 2, "explanation": "Watching the football team practice brought Iverson to tears, and after Thompson shut down his request to play, he changed his route so he would not have to see the players anymore."}, {"q": "According to the chapter, the hardest part of Iverson's early time at Georgetown was", "choices": ["adjusting to dining hall food that was worse than what he ate at home.", "enjoying campus comforts while his family and friends still struggled back home and he could not yet help them.", "learning to get along with teammates who resented his fame.", "keeping up with a demanding load of college coursework."], "answer": 1, "explanation": "Iverson describes feeling like he had \"made it, but alone,\" while his mother's house still had failing plumbing and utilities and NCAA rules prevented him from earning money to help."}, {"q": "As used in the passage, \"touted\" (Othella Harrington \"came to Georgetown touted as the next great Hoya big man\") most nearly means", "choices": ["publicly promoted and praised", "secretly doubted by coaches", "quietly recruited from overseas", "harshly criticized by the press"], "answer": 0, "explanation": "The sentence describes Harrington's reputation on arrival: he was widely presented and praised as Georgetown's next star big man, having led the team in scoring the two prior seasons."}, {"q": "As used in the passage, \"harnessed\" (\"the way he harnessed my game\") most nearly means", "choices": ["restrained completely", "ignored on purpose", "imitated closely", "channeled and directed"], "answer": 3, "explanation": "Iverson describes Thompson correcting his mistakes while still granting him unusual freedom on the floor, meaning the coach guided and directed his talent rather than shutting it down."}, {"q": "Which best describes Iverson's tone when recounting the repayment to Nike?", "choices": ["grateful that the NCAA gave him a second chance", "indifferent about a minor paperwork issue", "exasperated at the irony of a broke college kid reimbursing a billion-dollar corporation", "ashamed that he had knowingly broken the rules"], "answer": 2, "explanation": "He stresses the absurdity that he had to reimburse the giant company whose shoes he wore on television, summing it up with frustration that this was required just to practice."}, {"q": "The anecdote about the number 3 jersey primarily serves to show that Coach Thompson", "choices": ["strictly enforced NCAA uniform regulations at Georgetown.", "asserted total authority while quietly caring about what mattered to his players.", "could be won over by any politely worded request.", "disliked Iverson during his first weeks on campus."], "answer": 1, "explanation": "Thompson angrily refused the request to his face, yet the number 3 jersey was hanging in Iverson's locker at the next practice; Iverson concludes he showed who was in charge \"but he cared so much for us.\""}, {"q": "Based on the chapter, Thompson's remark that Iverson \"needs to be free as a bird\" reflected a coaching approach that", "choices": ["required Iverson to follow set plays exactly as designed.", "kept Iverson on the bench until he earned the coach's trust.", "focused on turning Iverson into a traditional low-post player.", "granted Iverson a level of on-court freedom no previous Georgetown player had received."], "answer": 3, "explanation": "Iverson says Thompson gave him \"freedom he never gave any player before,\" even telling him to abandon the standard press-break method and simply take the ball up the floor himself."}, {"q": "Iverson explains that Coach Thompson's strict pregame and postgame dress code was chiefly meant to", "choices": ["keep the team from feeding into stereotypes about how Georgetown players were perceived.", "satisfy a formal rule imposed by the Big East conference.", "imitate the professional dress codes used in the NBA.", "punish players who had broken team rules earlier in the season."], "answer": 0, "explanation": "Thompson told the team that Georgetown was \"perceived in a certain way\" and that they could not feed into stereotypes, so he demanded suits and ties and a professional appearance."}, {"q": "Which best explains, according to Iverson, why Thompson kept practices closed to outsiders?", "choices": ["The NCAA required closed practices for teams on probation.", "He wanted a protected space where he could shield his players and speak to them with total honesty.", "He was hiding a new offensive system from Big East rivals.", "He wanted to keep reporters from photographing Iverson."], "answer": 1, "explanation": "Iverson says the secrecy was \"for protection, for focus,\" and to create a \"sanctuary\" where Thompson could talk to players straight, teaching life as much as basketball."}, {"q": "Which returning player had led Georgetown in scoring during each of the two previous seasons?", "choices": ["Don Reid", "George Butler", "Othella Harrington", "Jerome Williams"], "answer": 2, "explanation": "The chapter states that Othella Harrington led the team in scoring during the two seasons before Iverson arrived, which made adjusting to Iverson running the offense a change for him."}]}, {"id": "ch22-hoya-season-begins", "num": "22", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Hoya Season Begins", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson's early struggles proved that he was not yet ready for college basketball.", "Coach Thompson's defensive system was the only reason Georgetown won games that fall.", "Iverson's fame made it impossible for him to focus on basketball during his freshman season.", "Iverson burst onto the college scene, absorbed a humbling defeat without losing confidence, and took on new family responsibilities."], "answer": 3, "explanation": "The chapter moves from his sensational exhibition debut through the Arkansas blowout, which left his confidence intact, to the birth of his daughter, which deepened his motivation to succeed."}, {"q": "The author includes Thomas Boswell's Washington Post column primarily to", "choices": ["criticize the media for putting too much pressure on freshmen.", "convey the extraordinary impression Iverson's debut made on even the most seasoned observers.", "show that local reporters doubted Iverson could succeed at Georgetown.", "explain why Coach Thompson banned interviews during the first semester."], "answer": 1, "explanation": "Boswell, a columnist since before Iverson was born, placed Iverson alongside Kareem Abdul-Jabbar on his \"first-impression top shelf,\" ahead of Ewing, showing how remarkable the debut was."}, {"q": "In the first exhibition game against Fort Hood, Iverson", "choices": ["came off the bench and finished with 36 points.", "started at point guard and scored 28 points total.", "ran the offense for the entire game at Coach Thompson's request.", "sat out the whole first half to keep his ego in check."], "answer": 0, "explanation": "Thompson kept Iverson's ego in check by starting him on the bench for two minutes and seventeen seconds; he then scored 28 by halftime and 36 for the game."}, {"q": "Which detail about the game against Arkansas is accurate?", "choices": ["Georgetown lost narrowly on a last-second shot by Corliss Williamson.", "The game was played at the Capital Centre in front of Georgetown's home fans.", "Georgetown lost 97-79, and Iverson made only five of his eighteen shots.", "Iverson recorded ten assists while holding Scotty Thurman scoreless."], "answer": 2, "explanation": "The defending champion Razorbacks won 97-79 at the Pyramid in Memphis; Iverson shot five for eighteen and committed eight turnovers."}, {"q": "Iverson's account of the Arkansas loss chiefly reveals that", "choices": ["he blamed his teammates for failing to get open against the zone.", "seeing the defending champions change their defense just for him reinforced his belief in himself.", "the pressure of national television made him too nervous to perform.", "he privately doubted whether he belonged at the college level."], "answer": 1, "explanation": "Even after shooting poorly in a blowout, Iverson noticed Arkansas had to adjust their whole scheme to deal with him and concluded he was still the best player on the floor."}, {"q": "How did Iverson respond to criticism that he shot and turned the ball over too much against Arkansas?", "choices": ["He asked Coach Thompson to move him off the ball.", "He refused to change anything about his game.", "He demanded that reporters be kept away from the team.", "Against Morgan State, he focused on involving teammates, finishing with 18 points and 10 assists."], "answer": 3, "explanation": "Three days after Arkansas, he deliberately got others involved; he had ten assists while Don Reid led the team with 21 points in an easy win."}, {"q": "Coach Thompson's reaction to the hard foul in the Fort Hood game most strongly suggests that", "choices": ["his feelings for Iverson went beyond the official reason he gave for recruiting him.", "he believed exhibition games were too dangerous for freshmen.", "he wanted to intimidate future opponents into playing less physically.", "he was frustrated that Iverson could not handle physical defense."], "answer": 0, "explanation": "Thompson always claimed he took Iverson on to support his mother, but running onto the floor shouting \"Don't hurt my boy!\" showed Iverson the coach's genuine personal attachment."}, {"q": "As used in the passage, \"relented\" (\"That's when Coach Thompson relented\") most nearly means", "choices": ["gave in", "apologized", "grew angry", "stood firm"], "answer": 0, "explanation": "After making Iverson wait on the bench, Thompson yielded and sent him to the scorer's table to enter the game."}, {"q": "As used in the passage, \"notoriety\" (press conferences would become \"a source of notoriety later in life\") most nearly means", "choices": ["financial success", "complete privacy", "being widely known in an unfavorable way", "respect from other athletes"], "answer": 2, "explanation": "Iverson is foreshadowing that press conferences would later make him famous for the wrong reasons, so the word points to unfavorable public attention."}, {"q": "The tone of Nolan Richardson's postgame comments about Iverson is best described as", "choices": ["bitter complaint about how the game was officiated", "colorful astonishment at Iverson's unique ability", "sarcastic dismissal of an overhyped freshman", "cautious concern about his own team's defense"], "answer": 1, "explanation": "Richardson's folksy list of spectacles, ending with \"never seen anyone do what Iverson does,\" expresses amazed admiration even though his team had just won by eighteen."}, {"q": "At the second-semester press conference, Coach Thompson", "choices": ["let reporters ask Iverson about any subject they chose.", "announced that Iverson would enter the NBA Draft.", "permitted only basketball-related questions and stressed his role as an educator.", "refused to allow Iverson to appear at all."], "answer": 2, "explanation": "Thompson barred questions about the bowling alley case and told reporters he was there to mold players and prepare them for life, calling himself an \"educator\" first."}, {"q": "Iverson suggests that the first-semester ban on interviews helped him because it", "choices": ["shielded him from the constant public chatter about his time in jail.", "gave him more time to study for his classes.", "kept opposing teams from learning about his injuries.", "prevented him from criticizing his teammates in the press."], "answer": 0, "explanation": "He says every broadcast mentioned his jailing, and it was \"so much easier to keep my head on straight\" under Coach Thompson's protective umbrella of no interviews."}, {"q": "Which statement about the birth of Iverson's daughter is accurate?", "choices": ["She was born in Washington, DC, where Tawanna had moved to be near him.", "She was born after Iverson's freshman season ended.", "Iverson left school for a semester to be with her.", "Tiaura was born on December 16, 1994, while Tawanna was living in Hampton with her mother."], "answer": 3, "explanation": "The chapter states Tiaura was born December 16, 1994, when Iverson was nineteen and in DC while Tawanna and the baby remained in Hampton at her mother's home."}, {"q": "The passage about Michael Freeman near the end of the chapter primarily serves to", "choices": ["show that Iverson had decided to cut his father out of his life.", "argue that his father had been wrongly convicted.", "explain Iverson's determination to succeed so that the people he loved would never again break the law to get by.", "compare prison conditions in Fairfax County with those Iverson experienced."], "answer": 2, "explanation": "Iverson says his dad's crimes were done \"for us,\" that they still were not right, and that by making it big he aimed to end the need for anyone he loved to live that way."}, {"q": "How did Georgetown close out the calendar year after the Arkansas loss?", "choices": ["They lost twice more before finding their rhythm in January.", "They won the rest of their games, capped by the Holiday Classic in Sacramento for a seventh straight victory.", "They avenged the loss by beating Arkansas in a December rematch.", "They finished the exhibition schedule undefeated but struggled in real games."], "answer": 1, "explanation": "After Morgan State, the Hoyas won every remaining game through the new year, including 30-point Iverson performances against DePaul and Providence, and took the Holiday Classic in Sacramento."}]}, {"id": "ch23-the-big-east", "num": "23", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Big East", "bank": [{"q": "Which statement best captures the central idea of this chapter?", "choices": ["Iverson's first Big East season tested him with hostile crowds, injury, and losses, but ended in a turnaround and major honors.", "Georgetown's season collapsed because Iverson and Othella Harrington could never learn to play together.", "Iverson proved that freshman players should not face ranked opponents.", "Coach Thompson's refusal to speak to the press cost Georgetown several conference games."], "answer": 0, "explanation": "The chapter moves through taunting crowds, a sprained ankle, and a four-game skid before the team rallies behind wins over Villanova and Syracuse and Iverson collects Rookie and Defensive Player of the Year awards."}, {"q": "During the game at Pitt, the home crowd", "choices": ["stormed the court after Georgetown's narrow win.", "stayed silent whenever Iverson touched the ball.", "chanted \"Jailbird\" when Iverson went to the free-throw line, and he responded by smiling at them.", "held up signs comparing Iverson to O.J. Simpson."], "answer": 2, "explanation": "Pitt fans sang out \"Jailbird\" at the line; after his first free throw Iverson simply turned to them and smiled. The O.J. signs came later at Villanova."}, {"q": "Iverson's explanation for why the taunts did not bother him is that", "choices": ["the arenas were too loud for him to hear individual fans.", "after actually being in jail, being called names had no power over him.", "Coach Thompson had trained the team to block out all crowd noise.", "he was too focused on his sprained ankle to notice anything else."], "answer": 1, "explanation": "He says that once you have been in jail, some fans calling you a \"jailbird\" is not the thing that is going to bother you."}, {"q": "According to the chapter, George Butler was dismissed from the team because", "choices": ["he accepted improper benefits from a shoe company.", "he asked to transfer to a rival Big East school.", "he suffered a season-ending injury in practice.", "he failed to meet the university's academic standards."], "answer": 3, "explanation": "The team announced Butler was dismissed for failing to meet academic standards; losing his friend and the team's second-leading scorer showed Iverson that Thompson allowed no excuses."}, {"q": "Before the first Villanova game at the Spectrum, Coach Thompson made it clear that", "choices": ["Georgetown would not play unless the students put down their insulting signs.", "Iverson would be benched for the entire game to rest his ankle.", "the team would leave Philadelphia and forfeit the game immediately.", "he would file a formal complaint with the Big East after the game."], "answer": 0, "explanation": "Thompson told Villanova's sideline the team would not play under that atmosphere, saying he could not condone a Christian university watching it happen; the students then put the signs down."}, {"q": "Iverson recalls the earlier article \"O.J. Has Some Advice for Allen Iverson\" primarily to", "choices": ["show that he had followed O.J.'s advice about being selfish.", "prove that reporters had always defended him from critics.", "highlight the strange reversal from O.J. being offered as his role model to O.J. being used as an insult against him.", "explain why he refused to read newspapers in college."], "answer": 2, "explanation": "Before his own trial, a reporter presented O.J. as a mentor figure for Iverson; less than a year later, fans crossed out \"Jordan\" and wrote \"O.J.\" to mock him, an irony he never forgot."}, {"q": "Thompson's forceful protest of the signs, even as Iverson shrugged them off, most clearly shows that", "choices": ["Thompson believed Iverson was too fragile to handle criticism.", "Thompson was looking for an excuse to cancel a game his team might lose.", "Iverson had privately asked his coach to intervene with Villanova.", "Thompson defended his players fiercely even when the player himself claimed to be unbothered."], "answer": 3, "explanation": "Iverson says he smiled at the signs and worried more about his ankle, but Thompson still confronted Villanova's coach and refused to play until the signs came down."}, {"q": "Which statement about Georgetown's season series with Connecticut is accurate?", "choices": ["Georgetown finally beat UConn in the Big East Tournament.", "UConn won all three meetings, becoming the first team ever to beat Georgetown three times in one season.", "The teams split their two regular-season games.", "Iverson missed every UConn game because of his ankle."], "answer": 1, "explanation": "UConn won in Hartford, won the rematch in DC, and won again in the Big East Tournament; until that day, no team had ever beaten Georgetown three times in the same season."}, {"q": "As used in the passage, \"coalescing\" (\"me and Othella weren't coalescing\") most nearly means", "choices": ["blending into an effective unit", "arguing constantly off the court", "competing for the team captaincy", "practicing at separate times"], "answer": 0, "explanation": "Iverson explains they got along as friends but struggled to mesh on the court, since the offense now flowed through him instead of the big man."}, {"q": "As used in the passage, \"perilous\" (\"our whole defense made every pass perilous\") most nearly means", "choices": ["effortless", "full of risk", "predictable", "pointless"], "answer": 1, "explanation": "In the blowout of Villanova, Georgetown's defensive intensity made every pass dangerous for the opponent and every shot contested."}, {"q": "The quotation from the Daily Press columnist (\"I fear that he will develop thicker skin\") chiefly serves to", "choices": ["prove that Iverson read and responded to every article about him.", "show that his hometown newspaper had finally come to his defense.", "offer a balanced assessment of Iverson's freshman season.", "show that hostility from his hometown press continued even as he starred at Georgetown."], "answer": 3, "explanation": "Even after the taunting at Villanova, the Peninsula columnist framed Iverson's toughness as a character flaw; Iverson notes he was \"blissfully ignorant\" thanks to Thompson's press limits."}, {"q": "In the home rematch against ninth-ranked Villanova, Georgetown", "choices": ["trailed at halftime before rallying in the second half.", "won a close game on a late three-pointer by Iverson.", "scored the game's first eleven points and led 41-24 at halftime with President Clinton watching.", "lost despite Iverson's behind-the-back passing and reverse layups."], "answer": 2, "explanation": "With Bill Clinton, a Georgetown alumnus, in the stands, the Hoyas opened on an 11-0 run, led 41-24 at the half, and never looked back against a Villanova team that had won eleven straight."}, {"q": "Iverson's reflection that he had been shooting baskets in a prison yard a little over a year before playing in front of the president emphasizes", "choices": ["the dizzying speed with which his life had changed.", "his regret about how he had spent his time in jail.", "his fear that his success could be taken away again.", "his belief that he owed his career to politicians."], "answer": 0, "explanation": "He describes the \"whiplash\" of being shackled one moment and then grabbing his future by the throat with the president watching, a contrast he says he can hardly believe in hindsight."}, {"q": "At the end of the regular season, Iverson", "choices": ["won the Big East scoring title over Ray Allen.", "won both Big East Rookie of the Year and Defensive Player of the Year, setting the conference record for steals in a season.", "was named Big East Most Valuable Player as a freshman.", "was left off the all-conference teams because of the team's losses."], "answer": 1, "explanation": "He received Rookie of the Year and, the honor he valued more, Defensive Player of the Year, after averaging over three steals a game and setting the Big East single-season steals record."}, {"q": "Thompson's remark, \"If I wasn't talking to you, that's when you know I got a problem with you,\" suggests that", "choices": ["he planned to bench Iverson if the losing streak continued.", "he preferred to communicate with players through his assistants.", "his constant correction was a sign of investment, and silence would have meant he had given up on Iverson.", "he only criticized players in front of the whole team."], "answer": 2, "explanation": "When a frustrated Iverson asked if the coach had a problem with him, Thompson explained that his ongoing attention proved he cared; Iverson notes he \"never stopped talking to me.\""}]}, {"id": "ch24-the-big-dance", "num": "24", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "The Big Dance", "bank": [{"q": "Which statement best captures the central focus of the chapter?", "choices": ["It argues that Georgetown lost to North Carolina mainly because of poor coaching decisions.", "It recounts Iverson's decision to leave Georgetown for the NBA after his freshman season.", "It traces Georgetown's NCAA Tournament run, which deepens Iverson's bond with Coach Thompson and fuels his drive to improve.", "It celebrates Iverson's flawless play throughout the tournament, from the opening round to the final."], "answer": 2, "explanation": "The chapter follows the tournament from the bracket release through the Sweet Sixteen loss, highlighting Thompson's faith in Iverson and the motivation Iverson carries away from the run."}, {"q": "According to the passage, when the bracket was released, Georgetown was", "choices": ["seeded sixth in the Southeast region, where Kentucky held the No. 1 seed.", "seeded sixth in the Southeast region, where North Carolina held the No. 1 seed.", "seeded second in the Southeast region, behind Kentucky.", "seeded first in the Southeast region, ahead of North Carolina."], "answer": 0, "explanation": "The passage states Georgetown was seeded sixth in the Southeast region, with Kentucky as the No. 1 seed and North Carolina No. 2."}, {"q": "Georgetown's first tournament game was played", "choices": ["against Weber State in Birmingham, Alabama.", "against Xavier in Tallahassee.", "against Michigan State in Tallahassee.", "against North Carolina in Birmingham, Alabama."], "answer": 1, "explanation": "The passage says the first game was against Xavier the following Friday in Tallahassee; Weber State and North Carolina came in later rounds."}, {"q": "Iverson's reaction to Coach Thompson's praise in the hotel room, thinking \"Okay, and…?\", suggests that", "choices": ["he suspected Thompson was about to bench him for the tournament.", "he doubted that Thompson's praise was sincere.", "he was angry Thompson had waited all season to compliment him.", "he was so used to Thompson's harsh style that plain praise left him unsure how to respond."], "answer": 3, "explanation": "Iverson did not know what to do and simply shook Thompson's hand, and Thompson later explained his players were more comfortable when he was fussing at them, so kindness felt unfamiliar."}, {"q": "The reference to the Fab Five early in the chapter primarily serves to", "choices": ["explain why Iverson, as a freshman, believed a deep tournament run was possible.", "show that Georgetown modeled its offense on Michigan's style of play.", "suggest that freshmen rarely succeeded in the NCAA Tournament.", "criticize the media's obsession with young players."], "answer": 0, "explanation": "Iverson notes the Fab Five had shown freshmen could lead a team to the championship game, and as a freshman himself, that idea was on his mind."}, {"q": "Georgetown defeated Weber State when", "choices": ["Iverson made two free throws with forty seconds left.", "Iverson hit a running three-pointer as time expired.", "Don Reid caught Iverson's short shot in midair and scored just before time ran out.", "Boubacar blocked Nembhard's layup at the buzzer."], "answer": 2, "explanation": "Iverson's running shot was well short, but Don Reid caught it like an alley-oop under the basket and released it over his shoulder as the final tenth of a second expired."}, {"q": "Iverson attributes Don Reid's game-winning play partly to", "choices": ["hours the two spent practicing alley-oops after team workouts.", "the familiarity Reid gained with Iverson's game from their time as roommates.", "Coach Thompson's instruction to Reid to wait under the basket.", "Reid's reputation as the team's most talkative and energetic player."], "answer": 1, "explanation": "Iverson says the time he and Don spent living together helped Reid understand where his shot was going and what to do with it; Reid was actually stoic, not talkative."}, {"q": "As used in the passage to describe the Weber State game, \"slugfest\" most nearly means", "choices": ["a game decided by a lopsided score", "a contest marred by fighting between the teams", "a fast-paced game with many three-pointers", "a grinding, hard-fought struggle in which neither side found a rhythm"], "answer": 3, "explanation": "The passage describes a game with no Georgetown three-pointers, long scoring droughts, and back-and-forth play where neither team could get into an offensive flow."}, {"q": "When Iverson says it had been too long to just \"pencil us in\" to the Sweet Sixteen, the phrase most nearly means", "choices": ["assume in advance that Georgetown would win", "record Georgetown's roster on the official bracket", "schedule Georgetown's next practice", "write critically about Georgetown in the newspapers"], "answer": 0, "explanation": "People were treating the Weber State game as an automatic win, but Coach Thompson insisted the team could not assume its opponent would simply roll over."}, {"q": "At halftime of the North Carolina game, Iverson had", "choices": ["scored 21 points on strong shooting.", "made three field goals but missed his free throws.", "missed all six of his field-goal attempts, scoring only on a free throw.", "not yet scored a single point."], "answer": 2, "explanation": "Iverson was 0-6 from the field going into halftime, with his only points coming on a free throw a couple of minutes before the break."}, {"q": "Coach Thompson's halftime advice against North Carolina surprised Iverson because", "choices": ["Thompson blamed him for the team's defensive breakdowns.", "Thompson, who usually told him to slow down and distribute, now urged him to push the tempo and look to score.", "Thompson benched him in favor of the team's seniors.", "Thompson admitted the game was already out of reach."], "answer": 1, "explanation": "Iverson says Thompson told him something he did not expect: to stop trying so hard to be a point guard and to push the tempo and get himself involved, the opposite of his usual message."}, {"q": "For Iverson, the standing ovation he received after fouling out was meaningful primarily because", "choices": ["it proved Georgetown's fans outnumbered North Carolina's.", "it convinced him the referees had made the wrong call.", "it showed the crowd believed Georgetown would win the championship the next season.", "it came from strangers who respected his effort, a sharp contrast to hostile crowds he had faced before."], "answer": 3, "explanation": "The crowd included fans from all over the country who had probably never seen him play, and there were no hostile signs this time; their respect gave him fuel he says he will never forget."}, {"q": "Which of the following best explains why Iverson stayed at Georgetown rather than entering the NBA Draft?", "choices": ["He felt his game still needed work and that he owed another year to Coach Thompson.", "The press had not yet begun speculating about his professional future.", "His family and friends urged him not to consider leaving college.", "NCAA rules at the time barred freshmen from entering the draft."], "answer": 0, "explanation": "Iverson notes he shot under 40 percent and lost in the Sweet Sixteen, felt there was more left to do, and owed it to Coach Thompson, for whom leaving early was not done."}, {"q": "Coach Thompson's speech contrasting Iverson's dorm comforts with his family's living conditions functions mainly to", "choices": ["shame Iverson into sending money home to his mother.", "warn Iverson that his scholarship was about to be revoked.", "remind Iverson that his opportunity could change his family's life, pushing him back to his classes.", "persuade Iverson to move his mother and sisters onto campus."], "answer": 2, "explanation": "Thompson pointed out that Iverson had heat and hot water while his mother did not, and that he had an opportunity to change all that; the speech never failed to put Iverson back on the right path."}, {"q": "The paragraph about watching Michael Jordan's 55-point game primarily conveys", "choices": ["Iverson's regret at missing Jordan's entire comeback.", "how Jordan's return made Iverson's NBA future feel suddenly real and within reach.", "Iverson's belief that he was already a better scorer than Jordan.", "the boredom of campus life during the offseason."], "answer": 1, "explanation": "Watching Jordan's return, Iverson gets more and more hyped and thinks he is going to get to play on the same court as Mike, showing the NBA now feels within reach."}]}, {"id": "ch25-summertime", "num": "25", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Summertime", "bank": [{"q": "Which statement best expresses the central idea of the chapter?", "choices": ["During one summer, Iverson experienced both a painful loss, the death of Nana, and a sweeping legal vindication.", "Iverson's summer was consumed entirely by preparation for the World University Games.", "Iverson decided that summer to leave Georgetown and enter the NBA Draft.", "The court's ruling finally earned Iverson public apologies from his critics."], "answer": 0, "explanation": "The chapter pairs Nana's decline and death with the Virginia Court of Appeals reversing Iverson's conviction, a summer of grief and vindication at once; no apologies ever came."}, {"q": "Along with Iverson, which Georgetown teammates were selected for the World University Games team?", "choices": ["Don Reid and Victor Page", "Tony Rutland and Joe Smith", "Othella and Jerome", "Irvin Church and John Jacques"], "answer": 2, "explanation": "The passage says Iverson, Othella, and Jerome had all been selected to represent the United States, alongside players like Tim Duncan, Ray Allen, and Kerry Kittles."}, {"q": "According to the passage, Nana was living", "choices": ["in Hampton with Iverson's mother.", "in Aberdeen with Iverson's uncle Stevie.", "in Connecticut near her doctors.", "on Georgetown's campus near Allen."], "answer": 1, "explanation": "Nana was still in Aberdeen, living with Uncle Stevie, who was very close to her and had become her caretaker."}, {"q": "Why had Uncle Stevie left the Marines early?", "choices": ["He was injured during training.", "He wanted to attend Iverson's games.", "He was needed to run the family business.", "He returned to take care of Nana."], "answer": 3, "explanation": "The passage states Stevie had enlisted in the Marines but left early so that he could take care of Nana, who had been in and out of the hospital."}, {"q": "The description of the articles taped to Nana's walls primarily serves to", "choices": ["show that Nana had little else to decorate her room with.", "suggest that the family exaggerated Iverson's fame.", "convey how much pride Nana took in Iverson's success, and how much that meant to him.", "demonstrate that the press had finally started covering Iverson fairly."], "answer": 2, "explanation": "Seeing pictures of himself with Coach Thompson and even the president on her wall meant everything to Iverson, because he knew he was bringing her joy and pride."}, {"q": "After Nana's death, Iverson coped with his grief mainly by", "choices": ["telling himself that she had lived to see him freed and starting his basketball journey.", "throwing himself immediately into training for the coming season.", "avoiding Aberdeen and his family for the rest of the summer.", "focusing on the money he would someday earn in the NBA."], "answer": 0, "explanation": "Iverson says he tried to juggle the guilt and the joy in his mind, telling himself that she saw part of his dream and, with the pictures on her wall, was proud."}, {"q": "On what grounds did the Virginia Court of Appeals reverse Iverson's conviction?", "choices": ["The trial judge had improperly barred key defense witnesses.", "There was insufficient evidence of a mob, or that Iverson had been part of one.", "The prosecutor had withheld video evidence from the defense.", "Iverson's sentence exceeded the maximum allowed by law."], "answer": 1, "explanation": "The court reversed on the point the defense had argued from the beginning: insufficient evidence of a mob, and no evidence that Iverson was part of one if there had been."}, {"q": "When Iverson first heard his mother shouting on June 20, 1995, he assumed that", "choices": ["the DA had decided to retry his case.", "Georgetown had won a championship.", "Governor Wilder had issued a full pardon.", "she had won the lottery."], "answer": 3, "explanation": "Hearing her hollering from the other side of the house, Iverson thought it was the lottery; instead it was the news of the appeals court's complete reversal."}, {"q": "The detail that the three appellate judges would not give Iverson the time of day at oral argument suggests that", "choices": ["Iverson had little reason to expect those judges to rule in his favor.", "the judges had already decided to reverse the conviction.", "Iverson's lawyers failed to present the case effectively.", "the judges were personally sympathetic to Iverson but hid it."], "answer": 0, "explanation": "Iverson says he knew he was railroaded but did not expect any court to agree with him; the judges' cold manner made their favorable ruling all the more surprising."}, {"q": "What ultimately happened to the charges after the appeals court's decision?", "choices": ["Iverson was retried and acquitted of misdemeanors.", "The felony convictions were reinstated by a higher court.", "The DA's office quietly dismissed the entire case a few months later.", "Iverson pleaded guilty to reduced charges to end the case."], "answer": 2, "explanation": "The case went back to the trial court, where the DA could retry only misdemeanors; instead, the office quietly gave up and dismissed the whole case a few months later."}, {"q": "The tone of the passage in which Iverson imagines apologies from the prosecutor, the judge, and the editorial board is best described as", "choices": ["hopeful and forgiving", "detached and objective", "nostalgic and wistful", "bitter and sarcastic"], "answer": 3, "explanation": "Iverson invents mock apologies he knew would never come, then notes that no one said any of that and that his win was dismissed as a technicality, underscoring his bitterness."}, {"q": "As used in the passage, \"vindicated\" most nearly means", "choices": ["punished for a past mistake", "shown to have been right all along", "rewarded with public office", "forgiven for a wrongdoing"], "answer": 1, "explanation": "Iverson says the whole community that had supported him was completely vindicated: the court's ruling proved their belief in his innocence had been correct."}, {"q": "As used in the passage to describe Governor Wilder, \"pilloried\" most nearly means", "choices": ["harshly and publicly criticized", "voted out of office", "quietly ignored", "praised for courage"], "answer": 0, "explanation": "Wilder was the only person in power who listened and acted, and instead of receiving apologies he was attacked publicly for helping Iverson."}, {"q": "The contrast between Coach Thompson's advice that it was \"not a time to gloat\" and Iverson's remark that, writing his book, he can now gloat chiefly shows that", "choices": ["Iverson came to reject everything Thompson taught him.", "Thompson secretly believed Iverson was guilty.", "decades later, Iverson allows himself a satisfaction he held back at the time.", "Iverson gloated publicly in 1995 despite Thompson's warning."], "answer": 2, "explanation": "In 1995 Iverson followed Thompson's counsel and kept his composure; thirty years later he permits himself to answer his critics, showing how long he suppressed that feeling."}, {"q": "According to the final paragraph, Iverson's strongest feeling when the case ended was", "choices": ["a desire for revenge against the prosecutor.", "relief that the ordeal was finally and completely over.", "triumph over the newspapers that had criticized him.", "regret that the appeal had taken so long."], "answer": 1, "explanation": "Iverson says more than anything the whole thing was done: he was glad to win, glad his family was happy, glad it was over, and he was not looking back."}]}, {"id": "ch26-season-two", "num": "26", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Season Two", "bank": [{"q": "Which statement best captures the central focus of the chapter?", "choices": ["It describes Iverson's decision to skip the preseason NIT to protect himself from injury.", "It shows Georgetown declining sharply after losing its senior leaders.", "It presents Iverson's rivalry with Stephon Marbury as the defining story of the entire season.", "It portrays Iverson beginning his second season with new confidence, a changing role, and an early setback his coach turned into motivation."], "answer": 3, "explanation": "The chapter moves from Iverson's confident summer through new teammates, a new off-ball role, and the NIT run, ending with Thompson using the Arizona loss as fuel for the season."}, {"q": "According to the passage, in Summer League play in Virginia, Iverson", "choices": ["led his team to the league title alongside Ray Allen.", "scored more than 80 points in one game and more than 70 in another.", "focused on passing, rarely looking for his own shot.", "played sparingly to rest for the World University Games."], "answer": 1, "explanation": "Iverson says he lit the place up, scoring over 80 in one game and over 70 in another, joined by Tony Rutland and Joe Smith before capacity crowds."}, {"q": "At the World University Games, Iverson", "choices": ["led the U.S. team in scoring in both the semifinal and the gold medal game.", "lost to a team led by Tim Duncan in the final.", "sat out the medal round with a shoulder injury.", "served mainly as a defensive specialist off the bench."], "answer": 0, "explanation": "Iverson became more of a focal point as the schedule went on, leading the team in scoring in the semifinal and the gold medal game as the U.S. won easily."}, {"q": "The passage suggests Coach Thompson recruited Victor Page in part because", "choices": ["Page was the only guard available to replace Don Reid.", "Page's academic record was among the strongest in his class.", "as with Iverson, Thompson wanted to help a talented kid from a tough background.", "Page had already committed to another Big East school."], "answer": 2, "explanation": "Iverson says not everyone wanted to recruit Victor, but Thompson felt like he did with Iverson himself: he wanted to help him out."}, {"q": "Coach Thompson's explanation for rooming Boubacar with Iverson is best understood as", "choices": ["a strict punishment for Boubacar's poor grades.", "a joke with a practical side: Iverson's constant talking would give Boubacar English practice.", "an attempt to keep Iverson from wandering the dorm at night.", "a request that came directly from Boubacar's family in Senegal."], "answer": 1, "explanation": "Thompson said Boubacar could work on his English with Iverson since Allen talks all the time, a wisecrack that still reflected his deliberate methods."}, {"q": "The passage notes that Don Reid, after graduating,", "choices": ["was passed over entirely in the NBA Draft.", "became an assistant coach at Georgetown.", "was drafted in the first round by the Pistons.", "was taken with the very last pick of the draft and went on to a long NBA career."], "answer": 3, "explanation": "Iverson points out that Reid, who could not get on the court his first two years, was selected by the Pistons with the very last pick and had a long, successful career."}, {"q": "Thompson's line that players had \"one night to act like a fool\" primarily reveals", "choices": ["his willingness to allow some fun while keeping firm limits on his team.", "his belief that Midnight Madness was the most important night of the season.", "his fear that the administration would cancel the event.", "his plan to retire at the end of the season."], "answer": 0, "explanation": "After years of refusing Midnight Madness, Thompson relented and even enjoyed it, but his warning made clear the fun ended after that one night."}, {"q": "By mentioning Larry Brown when describing the plan to move Iverson off the ball, the author mainly intends to", "choices": ["criticize Larry Brown for stealing Coach Thompson's idea.", "show that the strategy failed at Georgetown.", "point out that Thompson had the idea before it later became famous under Brown.", "suggest Thompson copied the plan from professional teams."], "answer": 2, "explanation": "Iverson says people give Larry Brown all the credit for the idea and Brown deserves it, but Coach Thompson was on it too, back at Georgetown."}, {"q": "Iverson's choice to keep scrimmaging before getting roughly ten stitches suggests that", "choices": ["the team lacked a doctor at practice.", "competing in scrimmages mattered more to him than his own comfort.", "he did not realize how badly he had been cut.", "Coach Thompson refused to let players leave practice early."], "answer": 1, "explanation": "Iverson explains that scrimmaging was always the best part of practice for him and he did not want to miss that time to compete, even with a bleeding face."}, {"q": "As used in the passage, \"relented\" most nearly means", "choices": ["gave in after long resistance", "grew angrier", "repeated a warning", "resigned from a position"], "answer": 0, "explanation": "Thompson had always refused to allow Midnight Madness, but after the players kept begging he finally agreed, shaking his head as if he were getting soft."}, {"q": "When Iverson says he became \"more and more of a focal point\" in Japan, the phrase most nearly means", "choices": ["a source of disagreement", "the fastest player on the floor", "the center of the team's attention and offense", "an example used to teach younger players"], "answer": 2, "explanation": "As the tournament went on, the offense increasingly ran through Iverson, and he led the team in scoring in its biggest games."}, {"q": "The NIT semifinal against Georgia Tech drew special attention because", "choices": ["it was Coach Thompson's final game at Madison Square Garden.", "Patrick Ewing was making his return to Georgetown.", "it was the first meeting ever between the two schools.", "it matched Iverson against Stephon Marbury, the most hyped freshman of the season, in New York."], "answer": 3, "explanation": "The game at Madison Square Garden featured Marbury, the most hyped freshman of the new season, returning to New York, which was exactly the spotlight Iverson wanted."}, {"q": "The author includes the two plays he remembers from the Georgia Tech game, the post feed to Othella and the long bounce pass to Jerome, mainly to show", "choices": ["that his favorite highlights were ones where he set up his teammates.", "that Georgia Tech's defense forced him to give up the ball.", "that Coach Thompson had banned him from shooting.", "that the crowd preferred passing to scoring."], "answer": 0, "explanation": "Iverson calls them highlights where he got other dudes involved, reflecting his goal that season of becoming more of a distributor."}, {"q": "In the NIT final against Arizona, Iverson", "choices": ["scored 40 points in a ten-point victory.", "sat out most of the game with an elbow injury.", "scored 40 points, while no teammate scored more than seven, in a ten-point loss.", "was held to seven points but won the MVP trophy."], "answer": 2, "explanation": "Despite an elbow injury, Iverson played thirty-seven minutes and scored 40, but no one else scored more than seven and Arizona won by ten; he still received the MVP trophy."}, {"q": "Coach Thompson was smiling after the loss to Arizona because", "choices": ["he was satisfied simply to have reached the final.", "the defeat gave him a powerful motivational tool to demand better defense all season.", "he knew Iverson would win the MVP trophy.", "he had already scheduled a rematch with Arizona."], "answer": 1, "explanation": "Thompson called the loss the slap in the face the team needed and planned to harp on it all year, using it as the upper hand to push defensive work in practice."}]}, {"id": "ch27-crossover", "num": "27", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Crossover", "bank": [{"q": "Which choice best describes the main purpose of the chapter?", "choices": ["To argue that walk-on players deserve scholarships at major basketball programs", "To trace how Iverson learned the crossover from a teammate and turned it into his signature move", "To recap every game of Georgetown's nine-game winning streak in detail", "To criticize Coach Thompson's habit of scheduling weak opponents"], "answer": 1, "explanation": "The chapter centers on Dean Berry teaching Iverson the crossover after practice and on how the move became part of Iverson's show, culminating in the famous play against Seton Hall."}, {"q": "According to the passage, which of the following was true of Dean Berry?", "choices": ["He was a heavily recruited scholarship guard from Brooklyn", "He started alongside Iverson in the Georgetown backcourt", "He made the team as a walk-on and wore number 12 without his name on the back of his jersey", "He transferred to Georgetown after facing Iverson in the NIT"], "answer": 2, "explanation": "Iverson describes Berry as a walk-on without a scholarship, then unheard-of at Georgetown, who wore number 12 with no name on his jersey and was the twelfth man on the bench."}, {"q": "Iverson suggests that Berry 'probably made' the team because", "choices": ["the way he played against Iverson in practice proved his value", "Coach Thompson needed a twelfth man to fill out the roster", "Georgetown had a tradition of keeping walk-ons every season", "Berry had been named Big East Defensive Player of the Year"], "answer": 0, "explanation": "Iverson writes that Berry 'probably made it because of how he played against me,' beating him daily with the crossover even though Iverson had to guard him every practice."}, {"q": "Before working with Berry, Iverson's primary method of getting to the rim was", "choices": ["a low, through-the-legs crossover he copied from Stephon Marbury", "posting up smaller defenders near the basket", "waiting for screens set by Othella at the top of the key", "his sudden, explosive first step and raw speed"], "answer": 3, "explanation": "Iverson says the crossover was not yet a focal point; he relied on raw speed, hesitations, and blow-bys, with a first step so sudden and explosive it was unguardable."}, {"q": "As used in the first paragraph, 'elemental' most nearly means", "choices": ["primitive and crude", "fundamental and essential", "related to the natural elements", "small and unimportant"], "answer": 1, "explanation": "Iverson calls Berry 'elemental to the dude I would become,' meaning Berry was essential or fundamental to shaping the player Iverson turned into."}, {"q": "Why was Iverson hesitant to ask Berry to teach him the crossover?", "choices": ["His ego resisted, since asking would add to Berry's bragging rights", "Coach Thompson had forbidden extra sessions after practice", "He believed the move would be called a carrying violation", "He thought his own Hardaway crossover was already superior"], "answer": 0, "explanation": "Iverson admits his ego wouldn't let him ask for the longest time because it would give Berry bragging rights about crossing him up, but the move was so good he finally asked."}, {"q": "What did Iverson add to the crossover that became his signature?", "choices": ["Dribbling the ball through his legs twice before making the move", "A step-back jumper immediately after crossing over", "Bringing the ball high and away from his body with a little cradle, almost pausing it", "A behind-the-back dribble he learned from Tim Hardaway"], "answer": 2, "explanation": "Iverson says his signature addition was bringing the ball high and away from his body with a little cradle, where he could almost pause it and watch the defender before deciding."}, {"q": "The reference to Iverson being 'Big East Defensive Player of Year' primarily serves to", "choices": ["prove that Georgetown had the conference's best team defense", "explain why Berry never earned a scholarship", "show that Iverson cared more about defense than offense", "underscore how remarkable it was that a walk-on kept blowing by him"], "answer": 3, "explanation": "The detail sharpens the irony: even the conference's top defensive player could not stop a nameless walk-on, which is what convinced Iverson he had to learn the move."}, {"q": "According to Iverson, what makes the crossover so effective?", "choices": ["The defender's fear of the ball handler's first step", "The height advantage of the player making the move", "The element of surprise from a behind-the-back pass", "The screens teammates set to free the ball handler"], "answer": 0, "explanation": "Iverson explains that 'the crossover is a person being scared of your first step,' so he would read the defender's eyes and feet before deciding to cross over or blow by."}, {"q": "In the Seton Hall game, Iverson", "choices": ["scored 40 points, breaking his Georgetown scoring record", "scored 40 points, tying the Georgetown record he had set against Arizona", "made 13 three-pointers in front of the home crowd", "sat out most of the second half after the score was tied"], "answer": 1, "explanation": "Iverson scored forty, tying his Georgetown record from the Arizona game, and took over at the end after Seton Hall tied the score; he made seven of thirteen three-pointers, not thirteen."}, {"q": "The crowd's reaction to the big-screen replays of the Hurley crossover suggests that", "choices": ["fans generally preferred replays to live action", "the game's outcome no longer mattered to anyone in the arena", "the move had a showmanship value that went beyond its effect on the score", "Seton Hall's fans had switched their allegiance to Georgetown"], "answer": 2, "explanation": "The crowd got louder with each replay, louder even than when the game was sealed, showing the crossover's power as spectacle, part of what Iverson calls 'the show.'"}, {"q": "As used in the passage, 'cupcakes' most nearly refers to", "choices": ["home games scheduled on weekends", "teams that had just joined the Big East", "celebratory treats shared after victories", "easy opponents scheduled to produce comfortable wins"], "answer": 3, "explanation": "After the NIT, Coach Thompson 'scheduled some cupcakes,' and Georgetown 'ran over teams like Sacramento State and St. Leo,' making clear the word means easy opponents."}, {"q": "The final remark about Danny Hurley ('He's recovered, of course...') is best described as", "choices": ["wry and good-humored", "bitter and resentful", "solemn and mournful", "anxious and uncertain"], "answer": 0, "explanation": "The joke that Hurley 'recovered' from the crossover by coaching UConn to back-to-back championships is a playful, tongue-in-cheek aside, not a serious claim of harm."}, {"q": "How did Coach Thompson respond when Victor needed to adjust to the college game?", "choices": ["He moved Victor from guard to forward for several games", "He benched him at one point to get a lesson across", "He assigned Dean Berry to tutor him after practice", "He criticized him publicly to a Washington Post reporter"], "answer": 1, "explanation": "The passage says Victor had to defer to Iverson and learn the college game, and that Coach Thompson benched him at one point to get a lesson across."}, {"q": "Which statement best captures what the crossover ultimately became for Iverson?", "choices": ["A defensive tactic he used to force opponents into turnovers", "A move he saved for when his first step failed him", "A private drill he practiced but rarely used in games", "A crowd-thrilling weapon that became part of his show"], "answer": 3, "explanation": "Once Iverson added the move to scrimmages and games, it was effective and 'generated this energy,' making crowds erupt; he says it 'became a part of the show.'"}]}, {"id": "ch28-mastering-the-college-game", "num": "28", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Mastering the College Game", "bank": [{"q": "Which choice best states the central tension Iverson describes during the season?", "choices": ["When he scored heavily the team tended to lose, yet he was still held responsible for getting his teammates involved", "Coach Thompson wanted him to shoot more while the commentators wanted him to pass", "He wanted to leave immediately for the NBA, but Coach Thompson refused to release him", "His teammates resented the attention his scoring received from the press"], "answer": 0, "explanation": "Iverson notes that his three highest-scoring games went badly for the team, while wins came when others contributed, yet as point guard he was told his teammates' success was his responsibility."}, {"q": "The passage notes that Iverson's three highest-scoring games that season", "choices": ["all came against unranked opponents", "each set a new Georgetown scoring record", "were all victories decided in the final seconds", "included two losses and one game the team almost lost"], "answer": 3, "explanation": "He scored 40 in the NIT loss to Arizona, 40 against Seton Hall in a game Georgetown almost lost, and 39 in the loss to St. John's at the Garden."}, {"q": "Teams increasingly used a 'box and one' defense against Georgetown most likely because", "choices": ["Georgetown's big men were the primary scoring threat", "they believed stopping Iverson was the key to beating Georgetown", "zone defenses were about to be outlawed in college basketball", "Coach Thompson's full-court press left them no other option"], "answer": 1, "explanation": "The box and one put four players in a zone and dedicated one man to following Iverson everywhere, showing opponents built their whole plan around containing him."}, {"q": "In the February game against Villanova, the player mostly assigned to follow Iverson wherever he went was", "choices": ["Kerry Kittles", "Ray Allen", "Alvin Williams", "Danny Hurley"], "answer": 2, "explanation": "Iverson says Villanova played the box and one with one dedicated individual, 'mostly Alvin Williams that night,' following him wherever he went."}, {"q": "Georgetown ended its skid against ranked opponents with a 66-63 win at", "choices": ["Boston College", "Memphis", "Syracuse", "St. John's"], "answer": 0, "explanation": "Georgetown went up to Boston College, where Iverson scored 24 points, including a clutch three, in the 66-63 win that ended the skid."}, {"q": "Iverson suggests the Memphis game brought out his best because", "choices": ["it was played at Madison Square Garden in front of a huge crowd", "Memphis used a box-and-one defense that challenged him", "his biological father had finally come to watch him play", "its rough, trash-talking style reminded him of the courts where he grew up"], "answer": 3, "explanation": "He compares the dunk-filled, physical first half to games on the Anderson Park courts and says it was the kind of game that brought out his best, 30 points and a big win."}, {"q": "Which of the following was true of UConn entering its game at Georgetown?", "choices": ["They had lost their three previous games", "They had already clinched the Big East regular-season title", "They had won twenty-three straight games and were trying to go undefeated in the Big East", "They were unranked but considered dangerous"], "answer": 2, "explanation": "The passage says UConn came in ranked third, had won twenty-three straight, and was trying to become the first team ever to go undefeated in the Big East."}, {"q": "Coach Thompson smiled at the players' proposal before the UConn game because", "choices": ["he had already planned the exact same strategy himself", "players rarely came to him asking to play more defense", "he doubted the plan would work but wanted to humor them", "it meant he could finally stop planning the offense"], "answer": 1, "explanation": "Iverson says Thompson smiled 'because when dudes came to talk it wasn't usually asking to play more defense'; his line about not knowing offense was a joke, not the reason."}, {"q": "In the UConn game, Iverson recorded", "choices": ["eight steals, breaking the record he had set earlier that season", "forty points and eight assists in front of a sellout crowd", "a triple-double while guarding Ray Allen the entire game", "eight steals, just two off a record he had established a couple weeks before"], "answer": 3, "explanation": "Iverson had eight steals himself, two shy of the record he had set a couple of weeks earlier; it was Boubacar, not Iverson, who locked up Ray Allen most of the game."}, {"q": "Why does Iverson say the dunk over Rudy Johnson remained his favorite dunk ever?", "choices": ["At his NBA peak he played heavy minutes and stopped dunking to conserve energy, so nothing later topped it", "It won the UConn game at the final buzzer", "It was the only dunk of his entire college career", "It was replayed in every NBA arena he later visited"], "answer": 0, "explanation": "He explains that over the years in the NBA he had to conserve energy and stopped dunking, 'so that there, that was my best.'"}, {"q": "Compared with his freshman year, Iverson's sophomore statistics showed", "choices": ["fewer points per game but far better shooting percentages", "a rise from about 20 to 25 points per game and a jump to 48 percent shooting", "a decline in three-point accuracy as defenses focused on him", "identical scoring numbers but many more steals"], "answer": 1, "explanation": "Iverson's scoring rose from 20 to 25 a game, his shooting from below 40 percent to 48 percent, and his three-point shooting from 23 to 37 percent."}, {"q": "As used in the passage, a 'marquee' matchup most nearly means one that is", "choices": ["played outdoors under lights", "unexpected and hastily scheduled", "high-profile and heavily promoted", "overrated and disappointing"], "answer": 2, "explanation": "The Villanova game is called a marquee matchup because both teams were ranked in the top ten, making it a headline, high-profile event."}, {"q": "The phrase 'on the cusp of' breaking his steals record most nearly means", "choices": ["on the verge of", "incapable of", "uninterested in", "celebrated for"], "answer": 0, "explanation": "Being 'on the cusp of' breaking the record means he was right at the edge of doing it, about to accomplish it."}, {"q": "The description of Iverson's visits home primarily conveys", "choices": ["his relief that his family's problems had finally been solved", "his regret at ever leaving Hampton to attend Georgetown", "his growing anger at Coach Thompson's strict rules", "the painful contrast between the riches he could almost touch and his family's ongoing hardships"], "answer": 3, "explanation": "He describes the sewage smell, unpaid bills, his sister's seizures, and being apart from his daughter while dreaming of 'all the things I had coming, but didn't yet have.'"}, {"q": "The anecdote about the recording studio and the Biggie tapes serves mainly to", "choices": ["show that Iverson planned a rap career instead of the NBA", "illustrate the kinds of distractions Coach Thompson pushed him to set aside", "prove that his teammates disliked spending time with him", "explain why Boubacar asked to change dorm rooms"], "answer": 1, "explanation": "The rapping and late nights are presented among the distractions of the season; Coach Thompson heard about the 'rapping nonsense' and told Iverson to focus."}]}, {"id": "ch29-another-villanova-controversy", "num": "29", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Another Villanova Controversy", "bank": [{"q": "Which choice best describes the main purpose of the chapter?", "choices": ["To
