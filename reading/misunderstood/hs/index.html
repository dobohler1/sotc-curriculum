 still hurts,' blending blunt reporting with lasting grief."}, {"q": "In the AAU championship game against the North Carolina team, Iverson", "choices": ["scored the winning basket on a spin move in the final minute.", "guarded Jerry Stackhouse for most of the second half.", "fouled out with about two minutes left while his team led by three.", "sat out the first half because of foul trouble."], "answer": 2, "explanation": "Iverson picked up his fifth foul with a three-point lead and about two minutes left; it was Tarik Turner, not Iverson, whose spin move put the team ahead after the score was tied at 78."}, {"q": "The final paragraph of the chapter primarily emphasizes that the national title", "choices": ["proved that size matters less in AAU basketball than in high school basketball.", "transformed Iverson's reputation from little-known player to the nation's top rising junior.", "convinced Iverson to give up football immediately.", "was less meaningful because most opponents were older."], "answer": 1, "explanation": "Iverson notes that despite being smaller and less hyped than most players in the 56-team field, he won MVP, and 'everything changed' — he became the No. 1 rising junior in the country."}]}, {"id": "ch10-junior-year", "num": "10", "part": "Part II — My Trials On and Off the Court", "title": "Junior Year", "bank": [{"q": "Which choice best describes the overall purpose of this chapter?", "choices": ["To explain why Iverson decided to give up football before his junior season", "To argue that high school sports receive too much media attention", "To describe Iverson's recruitment by college basketball programs", "To recount the junior football season — from rumors he would quit to a state championship — that Iverson says changed his life"], "answer": 3, "explanation": "The chapter follows the season from the rumors that Iverson would play basketball exclusively through the state title over EC Glass, a run Iverson says 'changed my life' and made the team legends."}, {"q": "The author most likely includes the anecdote about Boo Williams retrieving his birth certificate in order to", "choices": ["illustrate how his success made people suspicious enough to question whether he was really a teenager.", "show that Boo Williams handled all of Iverson's paperwork for college recruiting.", "prove that Iverson was actually older than his opponents.", "explain why the state required documentation for playoff eligibility."], "answer": 0, "explanation": "After critics claimed he was too old to be in high school, Boo Williams had to produce the birth certificate; Iverson asks pointedly why beating teams you are not supposed to beat makes people demand proof."}, {"q": "By including Mo's observation that in the moment of victory Iverson 'arrived at the beginning of the end,' the author primarily", "choices": ["suggests that Iverson's athletic skills had already peaked as a junior.", "reveals that Mo was jealous of Iverson's fame.", "foreshadows that trouble would soon follow this moment of triumph.", "implies that winning the championship mattered little to Iverson's friends."], "answer": 2, "explanation": "Placed right at the celebration of the state title, the remark signals to the reader that this high point directly precedes a downfall, creating ominous foreshadowing."}, {"q": "According to the passage, why did Xavier Gunn take the snaps at quarterback at the start of the Lafayette game?", "choices": ["Coach Koz was punishing Iverson for missing an August practice.", "Iverson had injured his thumb in practice and was being kept out at quarterback.", "Iverson was still recovering from the AAU basketball season.", "Xavier had beaten Iverson for the starting job during the preseason."], "answer": 1, "explanation": "Iverson had hurt his thumb a couple of weeks earlier, so Xavier Gunn played quarterback while Iverson still played safety — until Iverson asked to go in at halftime."}, {"q": "What happened on the first play of the game against Kecoughtan?", "choices": ["Kecoughtan scored on a long touchdown pass.", "Iverson threw an interception that was returned for a touchdown.", "Iverson caught the opening kickoff and returned it for a touchdown.", "Bethel fumbled the opening kickoff."], "answer": 2, "explanation": "Although Kecoughtan had talked all week about stopping Iverson, they kicked him the ball to open the game, and he ran it back for a touchdown in a 27-0 win."}, {"q": "The playoff win over Norcom was sealed when Wilton Evans", "choices": ["made a 40-yard field goal, a distance he had never made in a game before.", "recovered a fumble at midfield in the fourth quarter.", "kicked a game-winning extra point in overtime.", "returned a blocked kick for a touchdown."], "answer": 0, "explanation": "With the drive stalled in the fourth quarter, Coach Koz sent out Evans for a 40-yarder — longer than any field goal he had made in a game — and he cleared the crossbar for the winning points."}, {"q": "Which choice accurately describes the semifinal game against Huguenot?", "choices": ["Bethel led the entire game and won comfortably on their home field.", "The game was called off because of snow on the field.", "Bethel lost after giving up a fourth-quarter lead.", "Bethel trailed 16-0 in the second half and won in overtime on Iverson's touchdown run."], "answer": 3, "explanation": "Playing in Richmond on artificial turf, Bethel fell behind 16-0, tied the game late with touchdowns and two-point conversions, and won in overtime when Iverson kept the ball and squeezed into the end zone."}, {"q": "The press coverage of Iverson's missed August practice most strongly suggests that", "choices": ["Coach Koz had complained to reporters about Iverson's attendance.", "his new fame brought intense public scrutiny to even minor events in his life.", "the team was struggling and needed him at every practice.", "local reporters believed he had already quit the football team."], "answer": 1, "explanation": "Iverson notes it was 'the first time (but not the last)' that people fixated on him and practice, and that the media had begun discussing his grades and attendance — signs of a much brighter, harsher spotlight."}, {"q": "Iverson compares begging his way back into the Phoebus game to removing his cast as a child. This comparison mainly reveals that he", "choices": ["frequently played through injuries without telling his coaches.", "believed his coaches were too cautious with all their players.", "could not bear standing by when he was able to help his team compete.", "regretted having played so many positions in high school."], "answer": 2, "explanation": "Iverson says 'it killed me not to be doing everything I could' in games — the same drive that once made him take off a cast to play at Anderson Park."}, {"q": "Based on the passage, the team vote before the state championship was meaningful to Iverson mainly because it", "choices": ["showed his teammates would stand up for him as if they were family.", "forced Coach Koz to apologize for the punishment.", "proved that he was more talented than the seniors on the roster.", "guaranteed that he would start at quarterback in the final."], "answer": 0, "explanation": "After Xavier and Mike went to Coach Koz and the whole team voted for him to play, Iverson says he acted unsurprised but was deeply moved: 'Those dudes were family.'"}, {"q": "Iverson's account of Tawanna spending time at his house most strongly suggests that she", "choices": ["wanted to escape problems in her own home.", "hoped his fame would make her popular at Kecoughtan.", "did not realize how difficult his living conditions were.", "cared about him rather than about his circumstances."], "answer": 3, "explanation": "Though Tawanna came from a family with a nice house with running water, electricity, and a phone, she chose to spend her time at his house anyway — the conditions 'didn't matter to her.'"}, {"q": "As used in the passage, 'relented' ('To his credit, Coach relented') most nearly means", "choices": ["apologized", "gave in", "retaliated", "resigned"], "answer": 1, "explanation": "After insisting Iverson would not play, Coach Koz yielded to the seniors' appeal and let the team vote — he gave in."}, {"q": "As used in the passage, 'hysteria' (describing the reaction after the Norcom win) most nearly means", "choices": ["frenzied excitement", "widespread confusion", "bitter disappointment", "quiet satisfaction"], "answer": 0, "explanation": "People were 'going crazy' after Bethel beat three straight unbeaten teams; the excitement was so intense that the start of basketball season had to be postponed."}, {"q": "The detail that basketball season had to be postponed primarily serves to", "choices": ["criticize the school for poor scheduling.", "explain why Iverson fell behind his basketball teammates in conditioning.", "convey the sheer scale of the frenzy surrounding Bethel football.", "suggest that basketball was less important to the community than football."], "answer": 2, "explanation": "The postponement is offered as evidence of how consumed the community was: 'The football team was all anyone could talk about.'"}, {"q": "The chapter's final lines — 'Sad part is, I would never play football again. Not one game.' — primarily serve to", "choices": ["explain why Iverson chose basketball over football scholarships.", "show that Iverson's shoulder injury ended his football career.", "criticize reporters for asking about his future plans.", "strike a bittersweet note that undercuts the triumph of the championship."], "answer": 3, "explanation": "Right after describing the celebration and his bold answer about basketball, Iverson reveals he would never play his first love again — a sorrowful twist that darkens the victorious ending."}]}, {"id": "ch11-six-seconds", "num": "11", "part": "Part II — My Trials On and Off the Court", "title": "Six Seconds", "bank": [{"q": "The chapter's title, 'Six Seconds,' refers to", "choices": ["the steal and dunk six seconds into the season's first game that announced Iverson's basketball dominance.", "the time left on the clock when Rutland missed against Hampton.", "the amount of practice time Iverson had before the first game.", "the final seconds of the state football championship."], "answer": 0, "explanation": "On the first play of the first game, Iverson jumped the passing lane, stole the ball, and dunked — six seconds into the season — which he calls his 'real announcement.'"}, {"q": "Which choice best describes a central conflict of the chapter?", "choices": ["Iverson's rivalry with Damon Bacote for the district scoring title", "Iverson's fear that football fame would overshadow his basketball career", "Iverson's struggle to balance taking over games himself with relying on his teammates", "Iverson's disagreement with Coach Koz over the gym where games were played"], "answer": 2, "explanation": "From being benched for talking back, to being called selfish, to hearing 'two games, two different messages,' the chapter centers on Iverson's tension between controlling games and trusting his team — a struggle he says lasted his whole career."}, {"q": "According to Iverson, the turning point that made it feel like 'my team' came when", "choices": ["Coach Bailey apologized for benching him against Hampton.", "he scored 21 fourth-quarter points to complete the comeback against Menchville.", "he passed 1,000 career points and the game was stopped.", "the team moved into the state rankings at ninth place."], "answer": 1, "explanation": "After Iverson stopped 'muting' himself and led a 37-10 fourth quarter against Menchville, he says something changed — 'Like it was my team, and I was cleared to run it' — and the team went on a rampage."}, {"q": "Which choice accurately describes Iverson's performance in the season's first basketball game?", "choices": ["He came off the bench to ease back in after football.", "He scored 51 points to set a tournament record.", "He sat out because he had missed a practice.", "He scored 37 points with 8 rebounds, 9 assists, 7 steals, and 2 blocks in a win at Kecoughtan."], "answer": 3, "explanation": "Three days after the football championship, and with only one practice, Iverson put up 37 points, 8 rebounds, 9 assists, 7 steals, and 2 blocks as Bethel won 73-68 in Kecoughtan's gym."}, {"q": "During the Christmas tournament game against Huguenot, the crowd chanted for Iverson to", "choices": ["sit out the fourth quarter to rest for the final.", "score five more points and break Damon Bacote's tournament record of 51.", "attempt a shot from half-court.", "let Tony Rutland take the final shots."], "answer": 1, "explanation": "Iverson was sitting on 46 points with a big lead, and the crowd wanted five more so he could pass the record of 51 that Hampton's Damon Bacote had set earlier in the tournament; he finished with 46."}, {"q": "What happened after Iverson said something he regretted in the huddle during the Hampton rematch?", "choices": ["Coach Bailey benched him for the rest of the game, and Bethel lost 101-67.", "Coach Bailey put him back in, and Bethel nearly came back.", "The referees ejected him from the game.", "Xavier took over at point guard and led a comeback."], "answer": 0, "explanation": "Bailey sat Iverson for the rest of the game; the score was 65-51 when he was benched, and the final was 101-67 — proof, Iverson felt, that the team could not do it without him."}, {"q": "When Iverson passed 1,000 career points, the moment was marked by", "choices": ["a postgame ceremony where Coach Bailey gave a speech.", "an announcement over the radio on 1310 AM.", "a stoppage in the game during which his mother was handed the basketball.", "a banner being raised in Bethel's gym."], "answer": 2, "explanation": "Coach Bailey had invited the families, and when Iverson passed 1,000 points in the third quarter, the game was stopped and his mom was pulled from the crowd and given the ball."}, {"q": "It can be inferred that Xavier's criticism of Iverson after the Hampton loss hurt especially because Xavier", "choices": ["was about to graduate and leave the team.", "had never criticized a teammate before.", "was the team's leading scorer at the time.", "had stood up for Iverson during the football season."], "answer": 3, "explanation": "Iverson points out that Xavier 'was the one who had stood behind me in the football season' — the same teammate who saved his championship game — which made the word 'selfish' sting."}, {"q": "Iverson's decision to only pass during the first half against Menchville was primarily motivated by", "choices": ["a desire to prove a point after being called selfish.", "Coach Bailey's new game plan for the matchup.", "an injury that limited his shooting.", "a plan to help Tony Rutland reach 1,000 points."], "answer": 0, "explanation": "Stung by the selfish label, Iverson 'wanted to show them what it would mean for me not to be selfish' — so he passed all half, and Bethel fell behind 41-25."}, {"q": "The phrase 'Two games, two different messages' expresses Iverson's frustration that he was told", "choices": ["to play defense in one game and offense in the next.", "to practice harder while also being told to rest.", "not to be selfish in one game, then essentially to be selfish in the next.", "to respect Coach Bailey while Coach Bailey criticized him publicly."], "answer": 2, "explanation": "After being benched and called selfish for shooting, Iverson passed all game — and then Bailey asked whether they could win with him just passing. The whiplash between the two messages left him 'seething.'"}, {"q": "Based on the passage, Iverson accepted his benching for the Denbigh game mainly because", "choices": ["Coach Bailey had won over Mo and Iverson's mom.", "he agreed that missing practice deserved punishment.", "the team was likely to win without him.", "he wanted to rest before the Hampton rematch."], "answer": 0, "explanation": "Iverson was 'mad as hell,' but Bailey talked to Mo and his mom and 'got them on his side,' so Iverson 'just had to take it.'"}, {"q": "As used in the passage, 'relinquished' ('never relinquished the lead') most nearly means", "choices": ["extended", "defended", "earned", "gave up"], "answer": 3, "explanation": "Bethel ran out ahead of Denbigh early and never surrendered the lead; 'relinquished' means gave up or let go of."}, {"q": "As used in the passage, 'invincible' ('I had been starting to feel invincible') most nearly means", "choices": ["impossible to defeat", "impossible to see", "extremely famous", "dangerously careless"], "answer": 0, "explanation": "After his explosive start to the season, Iverson felt unbeatable — though the first loss to Hampton reminded him the season was long."}, {"q": "The description of Coach Bailey in the Menchville locker room — disheveled, 'the quietest guy in the world' who 'wasn't acting mad' — primarily serves to", "choices": ["suggest that Bailey had lost control of the team.", "explain why players often ignored Bailey's instructions.", "show that his calm, sincere challenge to Iverson carried real weight.", "contrast Bailey's coaching style with Coach Koz's."], "answer": 2, "explanation": "Because Bailey did not react in anger, his question — was the team going to win with Iverson just passing? — landed as a genuine challenge, and Iverson admits 'Coach Bailey was right.'"}, {"q": "The chapter's final paragraph ('everything would change before we played that game') primarily functions to", "choices": ["reveal that Iverson was injured before the Hampton game.", "summarize the team's record heading into the playoffs.", "celebrate how perfectly the season had gone so far.", "create ominous foreshadowing that cuts against how perfect life seemed."], "answer": 3, "explanation": "Just as Iverson describes life as 'so perfect' — with the district title game and state tournament ahead — the final line warns the reader that everything was about to change, building dread."}]}, {"id": "ch12-the-bowling-alley", "num": "12", "part": "Part II — My Trials On and Off the Court", "title": "The Bowling Alley", "bank": [{"q": "Which statement best captures the central irony Iverson emphasizes about the night of February 13, 1993?", "choices": ["He was attacked by his own street friends from Newport News.", "Trouble found him while he was doing regular kid activities with friends who were not from the streets.", "He had planned to skip the bowling trip but changed his mind at the last minute.", "The bowling alley had a reputation as the most dangerous spot in Hampton."], "answer": 1, "explanation": "Iverson stresses that he was with friends who were not his street crew, in Hampton, where he assumed nothing bad ever happened — and that is exactly where his biggest trouble began. He calls this 'the ironic part.'"}, {"q": "According to the chapter, why was Mike Jackson not at Circle Lanes that night?", "choices": ["Coach Bailey had ordered him to stay home.", "He was in Newport News with Iverson's other friends.", "He had left town to visit colleges.", "He never liked bowling."], "answer": 3, "explanation": "Iverson explains that Mike Jackson was almost always with him but never liked bowling, and that Jackson still blames himself for not being there that night."}, {"q": "How does the chapter describe Steve Forrest, the man at the snack bar?", "choices": ["A grown man of twenty-two, 6'2\" and over 200 pounds, drinking beer with his friends.", "A teenage bowler from Bethel High whom Iverson knew from school.", "An employee of the bowling alley who had asked the group to quiet down.", "An off-duty police officer visiting from Poquoson."], "answer": 0, "explanation": "The chapter describes Forrest as a twenty-two-year-old man, 6'2\" and over 200 pounds, who was drinking beer with his friends when Iverson came to the snack bar."}, {"q": "Why does Iverson highlight that his friend Michael Simmons was filming with a camcorder that night?", "choices": ["Because the footage proved that Steve Forrest threw the first punch.", "Because the film was later broadcast on the local news.", "Because he argues a group planning violence would never record itself, and the footage never shows him doing anything.", "Because Simmons sold the tape to the newspapers."], "answer": 2, "explanation": "Iverson uses the camcorder to attack the 'mob' label — he asks who would videotape themselves if they planned to attack people — and insists the video never shows him doing a thing."}, {"q": "What does the chapter reveal about the charge of maiming by mob?", "choices": ["It was a misdemeanor that carried only a small fine.", "It came from a century-old law written to protect Black people from lynch mobs, yet was applied only to the four Black teenagers.", "It was brought against everyone involved in the fight, regardless of race.", "It was dropped once the prosecutor reviewed the videotape."], "answer": 1, "explanation": "Iverson notes the statute was created about a century earlier to protect Black people from white lynch mobs, yet all four people charged were Black and not one white man was charged."}, {"q": "The story about the shooting at the Hampton hotel a couple of weekends earlier mainly serves to", "choices": ["show how normal violence had become to Iverson and why Coach Bailey worried enough to urge him to have some regular kid fun.", "prove that Iverson's friends were responsible for the trouble at the hotel.", "explain why the bowling alley increased its security that night.", "suggest that Iverson should have been charged in the hotel incident too."], "answer": 0, "explanation": "Iverson says the hotel shooting seemed 'all regular' to him, while Coach Bailey insisted it was not — the anecdote shows the pressure Iverson lived under and sets up Bailey's advice to go do 'regular kid stuff.'"}, {"q": "Based on the chapter, why does Iverson believe the photo lineup was stacked against him?", "choices": ["The police photographed him without any legal paperwork.", "The other men in the lineup were his own teammates.", "The lineup was shown only to witnesses from Poquoson.", "He was a famous seventeen-year-old placed among grown men, so witnesses would naturally pick his familiar face."], "answer": 3, "explanation": "Iverson points out that he was seventeen while the other five photos were of grown men, and that his was the face everyone in the area already knew — so of course he would be the one picked out."}, {"q": "Iverson includes the prosecutor's statement that a less famous person 'may not have been identified by anyone' in order to", "choices": ["show that the prosecutor believed he was innocent all along.", "prove that the prosecutor later apologized to him.", "support his claim that his fame, not evidence, is why he was singled out from roughly twenty other uncharged participants.", "explain why the trial had to be moved to a larger courtroom."], "answer": 2, "explanation": "The quote — from the very prosecutor who put him in jail — concedes that without his fame he might have been like the twenty other people involved who were never charged, which supports Iverson's argument that he was targeted for being a star."}, {"q": "What does Iverson mean when he calls the basketball court 'the quietest place I knew'?", "choices": ["The game was the one part of his life he could focus on and control while everything else spiraled.", "The Coliseum crowd was unusually silent during the Hampton game.", "He wore earplugs during games to block out the fans.", "He preferred practicing alone in empty gyms after hours."], "answer": 0, "explanation": "Iverson explains that while the rest of his life might be spiraling, the court, the baskets, his teammates, and opponents were something he could control — so even a roaring arena felt quiet to him."}, {"q": "As used in the passage, 'unprecedented' (describing the excitement for the Hampton game) most nearly means", "choices": ["disappointing", "never seen before", "carefully planned", "short-lived"], "answer": 1, "explanation": "The excitement was so far beyond anything prior that the game was moved from Holland Hall to the Coliseum, an arena where no one had thought to hold a high school game — a level of interest never seen before."}, {"q": "As used in the passage, 'mounted' (in 'they mounted a rally that fell short') most nearly means", "choices": ["climbed on top of", "counted up", "put together", "abandoned"], "answer": 2, "explanation": "Hampton put together a comeback attempt in the second half, but Bethel held on — 'mounted' here means organized or launched, not physically climbed."}, {"q": "How did Bethel come back after falling behind by eleven in the first quarter against Hampton?", "choices": ["Iverson got hot and scored more than 40 points.", "Hampton's best player fouled out early in the game.", "Coach Bailey switched to a full-court press for the rest of the game.", "Iverson passed out of the double-teams and Tony Rutland scored 18 first-half points."], "answer": 3, "explanation": "With two defenders trapping Iverson, Coach Bailey told the team the other players had to make their open looks; Iverson passed to Tony Rutland, who scored 18 in the first half while Iverson shot just 3 of 13."}, {"q": "Which statement best describes Iverson's relationship with Coach Bailey as presented in this chapter?", "choices": ["They clashed at times, but Bailey's fatherly concern made him the person Iverson trusted most.", "Iverson resented Bailey and ignored his advice all season.", "Bailey cared only about winning games, not about Iverson's life.", "They never argued because Bailey let Iverson do whatever he wanted."], "answer": 0, "explanation": "Iverson admits they had fights and sometimes did not speak, but says Bailey was 'like a father too' — it was Bailey's caring that frustrated him, and there was no one he trusted more."}, {"q": "Iverson's remark that he went 'from one court to another court' on the day of the Ferguson game functions primarily to", "choices": ["complain that the courthouse and the arena were far apart.", "show that his lawyer scheduled the hearing around basketball.", "underline the jarring contrast between facing felony charges and finding refuge in basketball on the same day.", "suggest that he treated the legal case as a joke."], "answer": 2, "explanation": "The wordplay marks the collision of his two worlds: he pleaded not guilty to felony charges in a courtroom, then hours later sought his only 'quiet' on a basketball court."}, {"q": "What does Iverson's performance against Ferguson — 42 points and seven three-pointers just hours after pleading not guilty — most strongly suggest?", "choices": ["The charges had badly shaken his confidence on the court.", "Ferguson chose not to double-team him that night.", "His teammates carried him because he was too distracted to score.", "He was determined not to let the arrest stop him from building his legacy."], "answer": 3, "explanation": "Iverson says directly that as long as he was out on bond, no arrest was going to keep him from building his legacy — and he backed it up by hitting seven threes and scoring 9 of the last 13 points to seal the win."}]}, {"id": "ch13-bethel-continues", "num": "13", "part": "Part II — My Trials On and Off the Court", "title": "Bethel Continues", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson led Bethel to a second state championship by doing whatever winning required, even as legal trouble loomed.", "Bethel's season collapsed under the pressure of Iverson's court case.", "Coach Bailey benched Iverson during the playoffs to protect him from the press.", "Bethel won the title mainly because its opponents underestimated the team."], "answer": 0, "explanation": "The chapter follows Bethel's playoff run to a second state title, with Iverson guarding centers, crashing the boards, and refusing to lose — all while the bowling alley case hangs in the background."}, {"q": "In the game against Maury, Joe Smith", "choices": ["fouled out while guarding Iverson in the fourth quarter.", "missed the game with an injury, like Hampton's Bacote.", "scored 37 of Maury's 50 points.", "held Iverson without a single point."], "answer": 2, "explanation": "Bethel had no answer for Joe Smith, who scored 37 of Maury's 50 points, until Iverson asked to guard him in the fourth quarter of the 52-50 win."}, {"q": "Entering the Woodbridge semifinal, Iverson's 896 points had tied a Virginia single-season scoring record held by", "choices": ["Joe Smith.", "Moses Malone.", "Damion Keyes.", "Tony Rutland."], "answer": 1, "explanation": "The chapter says the man who held the Virginia single-season points record at the time was Moses Malone, and Iverson needed only one basket or free throw to claim it."}, {"q": "How did Bethel survive overtime against Woodbridge after Iverson fouled out?", "choices": ["Tony Rutland hit seven three-pointers in the extra period.", "Woodbridge's center Damion Keyes also fouled out.", "Coach Bailey called for a stall to run out the clock.", "Young big man Lovett Gaither scored 9 of the team's 13 overtime points."], "answer": 3, "explanation": "With Iverson fouled out and cheering from the bench, Lovett Gaither came out of nowhere to score 9 of Bethel's 13 overtime points in the 72-65 win."}, {"q": "With the score tied at 69 late in the final against John Marshall, Iverson", "choices": ["stole the ball from the opposing guard and scored a layup with two defenders chasing him.", "hit a three-pointer from four feet behind the arc.", "missed a free throw that Tony Rutland put back in.", "fouled out and watched the finish from the bench."], "answer": 0, "explanation": "Iverson read that the opposing guard was uncomfortable, swiped the ball clean off the bounce, and finished a layup with two players chasing him to take a two-point lead. The deep three came earlier, against Woodbridge."}, {"q": "Coach Bailey looked at Iverson 'like I was crazy' when Iverson asked to guard Joe Smith most likely because", "choices": ["Bailey had already assigned Tony Rutland to Smith.", "Smith and Iverson had been AAU teammates.", "a six-foot guard defending one of the nation's top centers seemed like a hopeless mismatch.", "Iverson was already in foul trouble in that game."], "answer": 2, "explanation": "Iverson stood six feet even, while Smith was one of the top centers in the country — an absurd matchup on paper. Bailey allowed it anyway because the team had to try something different."}, {"q": "Iverson's admission that he 'paid no mind' to Woodbridge's defensive reputation, 'but I should have,' suggests that", "choices": ["he blamed his teammates for the slow start.", "Coach Bailey failed to prepare a game plan.", "Woodbridge's defense was actually overrated.", "his confidence had crossed into overconfidence, and the team nearly paid for it."], "answer": 3, "explanation": "Woodbridge had not allowed more than 59 points all year, and Bethel fell behind by 17 — Iverson concedes his supreme confidence kept him from taking that defense seriously enough."}, {"q": "What did Iverson take away from watching the overtime from the bench beside Coach Bailey?", "choices": ["Frustration that the referees had targeted him all night.", "A feeling of pride and kinship, and a new appreciation for how stressful Coach's view was.", "Certainty that the team could not win without him on the floor.", "A plan to avoid foul trouble in the championship game."], "answer": 1, "explanation": "Standing powerless beside Coach Bailey, Iverson felt pride and kinship with his teammates and his coach — and realized how stressful the game looked from Bailey's vantage point."}, {"q": "Iverson compares the Woodbridge game to the Huguenot football game mainly to", "choices": ["show that his teams had been in deep holes before and knew how to climb out.", "argue that football mattered more to him than basketball.", "criticize Woodbridge for playing at too slow a pace.", "explain why he wanted to play both sports in college."], "answer": 0, "explanation": "Trailing 59-50 late reminded him of being down 16-0 to Huguenot in the fourth quarter — a comparison that frames the comeback as something his teams had done before and could do again."}, {"q": "As used in the chapter, 'assault' in the phrase 'our assault on the state title' most nearly means", "choices": ["violent attack on opponents", "illegal maneuver", "formal complaint", "determined campaign"], "answer": 3, "explanation": "The phrase describes Bethel's aggressive, determined push through the playoff bracket toward the championship, not any literal attack."}, {"q": "As used in the passage, 'relented' (in 'we relented a little bit') most nearly means", "choices": ["fought harder", "eased up", "celebrated early", "surrendered completely"], "answer": 1, "explanation": "Feeling the championship in their grasp, Bethel let up slightly on their pressure, which allowed John Marshall to come all the way back and tie the game at 69."}, {"q": "The chapter's final lines — that his senior-year hoops would come 'in the prison yard' — serve primarily to", "choices": ["reveal that Iverson had already been sentenced before the final.", "show that he expected to lose his upcoming appeal.", "create a foreshadowing contrast between the triumph of the title and what was coming next.", "suggest he planned to skip his senior season to turn professional."], "answer": 2, "explanation": "The closing sets the joy of a second state championship against the shock the reader knows is coming — that this was his last high school game, though he could not imagine it at the time."}, {"q": "What does the chapter say about Bethel's fourth meeting with Hampton?", "choices": ["Bethel jumped ahead 12-2 against a Hampton team missing Bacote, and Iverson scored 42.", "Hampton won behind a big game from Bacote.", "The game went to overtime before Bethel pulled it out.", "It was moved to the Coliseum in front of more than 8,000 fans."], "answer": 0, "explanation": "Three days after the Ferguson win, Bethel beat a Hampton team playing without Bacote, getting ahead 12-2 and never looking back while Iverson scored another 42. The Coliseum game was the earlier regular-season meeting."}, {"q": "Iverson lists his full stat line against Hopewell — 38 points, 8 assists, 7 rebounds, 6 steals, 4 blocks — primarily to show that", "choices": ["his teammates contributed little during the playoffs.", "Richmond's Ashe Center favored his style of play.", "he was on a mission to do everything necessary, refusing to let the team lose.", "scoring mattered more to him than playing defense."], "answer": 2, "explanation": "Right after the stat line, Iverson says he was 'on this mission now' to do it all — block shots, rebound, whatever was needed — because the one thing he would not do was let his team lose."}, {"q": "How does Iverson describe the moment the buzzer sounded in the state final?", "choices": ["He immediately began worrying about the upcoming trial.", "He felt numb and left the floor quickly.", "He broke down in tears with Coach Bailey at midcourt.", "Pure exhilaration — no thoughts of the bowling alley or the trial, just the joy of winning."], "answer": 3, "explanation": "As everyone erupted from the bench, Iverson stood tall and smiling; he says there was no thought of a bowling alley or a trial in that moment — 'just the exhilaration.'"}]}, {"id": "ch14-the-trial", "num": "14", "part": "Part II — My Trials On and Off the Court", "title": "The Trial", "bank": [{"q": "Which statement best captures Iverson's overall portrayal of his trial?", "choices": ["A fair proceeding that simply reached the wrong verdict.", "A case decided mainly by the videotape evidence.", "A process stacked against him, from the bench-trial decision to testimony that no one could back up.", "A trial he sabotaged by attending the Nike camp during the same week."], "answer": 2, "explanation": "Iverson presents the trial as unfair at every turn: a questionable choice of bench trial before a judge from old-money Hampton, witnesses who never saw him do anything except one, and the exonerating video kept out of evidence."}, {"q": "According to the chapter, what was at stake in the decision to try Iverson as an adult?", "choices": ["Adult court meant five to twenty years in prison per count, while juvenile court meant at most about six months and a sealed record.", "Adult court allowed a jury trial, while juvenile court did not.", "Adult court guaranteed probation for a first offense.", "Juvenile court would have required him to transfer away from Bethel High."], "answer": 0, "explanation": "The chapter spells out the stakes: as an adult he faced five to twenty years on each count in adult prison, while as a juvenile he was looking at roughly six months at most in a detention center with his record sealed."}, {"q": "Who was the only witness who claimed to have actually seen Iverson commit a violent act?", "choices": ["Steve Forrest, who said Iverson punched him at the snack bar.", "The young woman, who said she watched him swing a chair before she was knocked out.", "Dwayne Campbell, who saw him near the exit.", "The bowling alley worker, a Bethel student, who said Iverson hit the young woman with a chair and then hit him."], "answer": 3, "explanation": "Iverson stresses that neither Forrest nor the young woman claimed to see him do anything physical; only the bowling alley worker testified that he saw Iverson hit the young woman with a chair and then hit him too."}, {"q": "What happened to the videotape of the fight at trial?", "choices": ["It was played for the judge and showed Iverson fighting.", "Mr. Kelly argued it was not relevant, so it was kept out of evidence, even though it never showed Iverson doing anything.", "The prosecutor introduced it to prove the mob charge.", "It was lost before the trial began."], "answer": 1, "explanation": "Mr. Kelly argued the video was not relevant, so it never became evidence — a choice questioned on appeal, since the footage did not show Iverson doing anything and could have helped him."}, {"q": "What did Judge Overton order immediately after finding Iverson guilty?", "choices": ["That Iverson be taken straight to jail.", "That sentencing take place that same afternoon.", "That Iverson remain free until sentencing, but under an 8 p.m. curfew.", "That a new trial be held with a jury."], "answer": 2, "explanation": "The judge scheduled sentencing for late summer and let Iverson remain out, but imposed an 8 p.m. curfew — which kept him from traveling to defend his AAU national title."}, {"q": "When the police officer denied telling Iverson the station visit was just to take pictures, Iverson concluded that", "choices": ["the system was not going to treat him honestly.", "his lawyer had misunderstood the officer.", "the officer had confused him with Michael Simmons.", "the photo lineup would be thrown out of court."], "answer": 0, "explanation": "Iverson knew the officer had said exactly that to him, so hearing the denial under oath, he says, 'I started to see how things were going to be' — an early sign the process would not be fair to him."}, {"q": "Looking back, how does Iverson explain Mr. Kelly's choice of a bench trial instead of a jury?", "choices": ["Kelly feared local jurors would recognize Iverson from the news.", "Perhaps Kelly's long absence from criminal cases, or his misplaced confidence that he was on the judge's level.", "Virginia law required bench trials for defendants under eighteen.", "Iverson himself insisted on facing the judge alone."], "answer": 1, "explanation": "Iverson says he is still not sure why they skipped a jury, guessing it was either that Kelly had not tried a criminal case in a long time or that Kelly thought he was on the level with Judge Overton. Whatever it was, 'it did not work.'"}, {"q": "Which detail was notably missing from Steve Forrest's testimony?", "choices": ["Any mention that he had been drinking beer.", "Any admission that he threw chairs and punches.", "Any claim that he went to the hospital.", "Any claim that Iverson actually hit him or that he saw Iverson do anything physical."], "answer": 3, "explanation": "Forrest admitted drinking, admitted throwing chairs and punches in claimed self-defense, and did go to the hospital with a broken bone — but he never claimed Iverson hit him or that he saw Iverson do anything physical."}, {"q": "How did Iverson view his decision to play in the Nike Tournament the same week as his trial?", "choices": ["As continuing to do something positive with his life, even as critics said he did not know his place.", "As a way to impress Judge Overton with his discipline.", "As a mistake he regretted the moment he arrived in Indianapolis.", "As a protest against the NCAA's investigation."], "answer": 0, "explanation": "Iverson asks why he would not want to do something positive with his life; he felt people who had warned he was throwing away his future got angry the moment he kept striving — as if he did not know his place."}, {"q": "As used in the passage, 'stoic' (describing Tawanna after the verdict) most nearly means", "choices": ["tearful and shaken", "confused", "calm and showing little emotion", "angry and loud"], "answer": 2, "explanation": "While his mother was broken and Mo was furious, Tawanna was 'calm, stoic' — composed and holding her feelings in rather than showing them."}, {"q": "As used in the passage, 'advocated' (in 'leaders in the community advocated for me') most nearly means", "choices": ["voted", "raised bail money", "testified in court", "spoke out in support"], "answer": 3, "explanation": "Community leaders, like the mayor and local ministers, publicly supported Iverson and pressed his case — 'advocated' means they spoke out on his behalf."}, {"q": "The prosecutor's closing line, 'Now it's our turn to Just Do It,' functions in the chapter to", "choices": ["show that she wanted the judge to delay his ruling.", "suggest, in Iverson's telling, that she resented his playing in the Nike Tournament and turned the slogan into a call for conviction.", "reveal that she secretly admired his basketball talent.", "explain why the NCAA opened an investigation into his flights."], "answer": 1, "explanation": "Iverson reads the line as a kind of victory dance: she knew part of the public was furious he had played at the Nike camp, so she twisted Nike's slogan into an appeal for the judge to find him guilty."}, {"q": "Iverson tells the story about refusing to fight for his sister Brandy in order to", "choices": ["show that the accusation of hitting a young woman with a chair contradicted who he was.", "prove that Brandy was a witness at the trial.", "admit that he had a history of fights at school.", "explain why his family did not attend the hearings."], "answer": 0, "explanation": "Iverson recalls that even when Brandy asked for his help against another girl, he refused to fight a girl and instead taught her to handle herself — evidence, in his telling, that the chair accusation was beyond imagination."}, {"q": "What was the core of Mr. Kelly's legal argument against the maiming-by-mob charges?", "choices": ["That Iverson had an alibi for the entire evening.", "That the statute had expired a century earlier.", "That the videotape proved someone else struck the victims.", "That no mob ever formed, because the fight erupted suddenly rather than from a group assembling with intent to attack."], "answer": 3, "explanation": "Kelly argued that even if the testimony were believed, the law required a 'collection of people' assembled with the intention of committing assault — and a fight that broke out all of a sudden meant no mob ever formed."}, {"q": "Which best describes the tone of the section on the aftermath — colleges withdrawing, the NCAA investigating, and Iverson barred from sports?", "choices": ["Hopeful that an appeal would succeed quickly.", "Indifferent, since he preferred spending time at home.", "Bitter and disbelieving, as he realizes his dreams could be blocked even without prison.", "Grateful for a break from public attention."], "answer": 2, "explanation": "Iverson's reaction — 'Maybe they didn't have to put me in jail to keep me from reaching my dreams' — captures the bitterness of watching schools stop recruiting him and being kept off every field and court."}]}, {"id": "ch15-sentencing-day", "num": "15", "part": "Part II — My Trials On and Off the Court", "title": "Sentencing Day", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["A judge's harsh sentence abruptly replaced Iverson's expected senior year with imprisonment, despite pleas on his behalf.", "Iverson's lawyers proved that the charges against him were false, but the judge ignored the evidence.", "Iverson's teachers and coaches convinced the court to reduce his sentence to probation.", "The community's protests outside the courthouse forced the judge to delay the sentencing."], "answer": 0, "explanation": "The chapter centers on September 8, 1993, when, despite testimony from teachers and a proposal to attend a prep school, Judge Overton sentenced Iverson to fifteen years and denied him bond."}, {"q": "The author opens the chapter by noting that September 8, 1993, \"was supposed to be my second day of senior year of high school\" primarily in order to", "choices": ["explain why he had fallen behind in his coursework at Bethel", "criticize the school system for scheduling classes during his trial", "highlight the contrast between the ordinary teenage life he expected and the sentencing he faced instead", "show that he no longer cared about finishing high school"], "answer": 2, "explanation": "By pairing the start of senior year with sentencing day, Iverson emphasizes how far his situation had strayed from a normal student's life."}, {"q": "According to the passage, what alternative to jail did Mr. Kelly present to the judge?", "choices": ["A supervised work program at a local halfway house", "A prep school in Maine with strict rules that would ensure his education continued", "House arrest at his mother's home while he finished at Bethel", "A transfer to a military academy in Virginia"], "answer": 1, "explanation": "At the hearing, Mr. Kelly explained that Iverson could attend a prep school in Maine that had rules and requirements and would tend to his education."}, {"q": "The passage indicates that the \"criminal past\" the prosecutor described consisted of", "choices": ["several previous fights at school", "an earlier arrest at a shopping mall", "a record of skipping court dates", "one prior case of driving without a license"], "answer": 3, "explanation": "Iverson notes that the prosecutor brought up the one prior driving-without-a-license case and labeled it his criminal past."}, {"q": "What sentence did Judge Overton impose?", "choices": ["Fifteen years total, five years for each count", "Five years total, with most of it suspended", "Ten years total, two for each count", "Probation, plus mandatory enrollment at a prep school"], "answer": 0, "explanation": "The judge gave five years for each count, for a total of fifteen years, and the whole courtroom gasped."}, {"q": "Why did Mr. Kelly believe he had grounds to request a bond pending appeal?", "choices": ["The prosecutor had already agreed to support any bond request", "Judge Overton had promised leniency earlier in the trial", "Stephens, one of the other defendants, had requested and received the same arrangement", "Virginia law required bond for all first-time offenders"], "answer": 2, "explanation": "Kelly pointed out that Stephens, who had a jury trial and was convicted only of misdemeanors, had been allowed out on bond while awaiting appeal, and asked for the same."}, {"q": "The author most likely includes the later revelation that Judge Overton belonged to two all-white clubs in order to", "choices": ["explain why the judge was eventually promoted to a higher court", "suggest that racial bias may have influenced how the judge viewed him", "prove that the judge had never sentenced a white defendant to jail", "show that the judge was well connected in the community"], "answer": 1, "explanation": "Right after describing the judge considering him from the bench, Iverson mentions the all-white clubs, implying the judge's view of him may not have been impartial."}, {"q": "Based on the passage, it can most reasonably be inferred that the prosecutor's claim that Iverson \"wouldn't be any worse off\" in jail was one that the author", "choices": ["accepted at the time but questioned years later", "agreed with because jail offered a GED program", "never actually heard because he had left the courtroom", "regarded as a serious understatement of what jail would cost him"], "answer": 3, "explanation": "Iverson presents the prosecutor's remarks skeptically; the chapter's events, from the gasping courtroom to his lost senior year, show how much the sentence actually took from him."}, {"q": "Iverson's statement to the court is best described as", "choices": ["an angry denial of every charge against him", "a detailed account of what happened at the bowling alley", "an apology to his family and community and an expression of sympathy for those hurt that night", "a plea for the judge to consider his athletic future"], "answer": 2, "explanation": "He apologized to family, friends, and the community for any embarrassment and said he felt bad for the people at the bowling alley that night."}, {"q": "As used in the passage, the statement that the prep school would ensure Iverson's education \"was being tended to\" most nearly means his education would be", "choices": ["looked after and cared for", "shortened and simplified", "postponed until his release", "tested and graded frequently"], "answer": 0, "explanation": "Mr. Kelly's point was that the school's rules and requirements would make sure Iverson's schooling was properly cared for."}, {"q": "As used in the passage, the word \"detailed\" in the description of the prosecutor's argument most nearly means", "choices": ["assigned", "described point by point", "exaggerated wildly", "recorded in writing"], "answer": 1, "explanation": "The prosecutor \"detailed again all the things she said I'd done,\" meaning she went through her accusations thoroughly for the judge."}, {"q": "The description of Iverson's reaction as the handcuffs went on, having neither a smile nor tears, primarily serves to", "choices": ["show that he did not understand the seriousness of the sentence", "suggest that he expected to be released within days", "prove that he felt no connection to the family members watching him", "reveal his habit of keeping his emotions guarded even in devastating moments"], "answer": 3, "explanation": "He sums it up with \"That was me,\" presenting his controlled expression as part of his character while everyone around him, like his sobbing mother, broke down."}, {"q": "Coach Bailey's remark on the courthouse steps that \"We lost a friend\" primarily functions to", "choices": ["emphasize that the loss was personal and human, not merely athletic", "announce that Iverson had been removed from the team roster", "criticize the student body for failing to support Iverson", "predict that Iverson would never return to Bethel"], "answer": 0, "explanation": "Bailey deliberately set aside Iverson's status as an athlete and student to stress that the school community had lost a friend, framing the sentence as a personal loss."}, {"q": "The tone of the chapter's final paragraphs, describing the van ride and the people running after it, is best described as", "choices": ["hopeful and triumphant", "detached and clinical", "sorrowful and haunting", "bitter and vengeful"], "answer": 2, "explanation": "The image of supporters running after the van, waving until it drove too fast for them, closes the chapter on a note of grief and helplessness."}, {"q": "The paragraph containing Coach Koz's and Coach Bailey's public statements primarily serves to", "choices": ["show that the coaches blamed each other for what happened", "demonstrate that the adults who knew Iverson best stood by him after the sentence", "explain why the coaches were later fired from Bethel", "prove that the press supported the judge's decision"], "answer": 1, "explanation": "Iverson introduces the quotes by saying he will never forget how his coaches had his back, and both men publicly mourned the sentence."}]}, {"id": "ch16-city-farm", "num": "16", "part": "Part III — From the Jungle to Georgetown", "title": "City Farm", "bank": [{"q": "Which statement best captures the central idea of this chapter?", "choices": ["Iverson's time at the City Farm was so dangerous that he abandoned basketball entirely.", "Iverson endured jail by settling into a routine, leaning on supporters, and holding onto his dream of college and the NBA.", "Iverson's lawyers quickly won his release on an appeal bond after a national television interview.", "Iverson spent his time in jail planning revenge on the prosecutor who put him there."], "answer": 1, "explanation": "The chapter follows Iverson through bakery shifts, visits, letters, court setbacks, and evening jump shots, showing how routine, support, and his dream carried him through the City Farm."}, {"q": "In the \"Freedom\" section that precedes the chapter, Iverson defines freedom primarily as", "choices": ["the legal victory that erased his conviction from the record", "the wealth and fame that came with reaching the NBA", "escaping Virginia and starting over in a new city", "everyday joys like basketball, family, friends, and music"], "answer": 3, "explanation": "In the interlude, freedom is shooting threes, waking up next to Tawanna, rapping with friends, and hugging his family, ordinary pleasures that jail took away."}, {"q": "According to the passage, what job was Iverson assigned at the City Farm?", "choices": ["Working in the kitchen bakery, starting at four in the morning", "Doing farm work in the fields with most of the other inmates", "Leaving during the day to work at a halfway house", "Cleaning the recreation yard in the evenings"], "answer": 0, "explanation": "While many inmates worked outside on the farm, Iverson's job was inside, in the kitchen bakery, which required him to get up at four in the morning."}, {"q": "The passage indicates that \"the jungle\" was", "choices": ["the nickname for the farm fields surrounding the jail", "the neighborhood in Newport News where Iverson grew up", "an area beyond the dining hall where the younger inmates gathered and trouble started", "the dorm where the halfway-house workers slept"], "answer": 2, "explanation": "The young inmates doing their first sentences hung out in a part of the jail just past the dining area called the jungle, and that is where the trouble was."}, {"q": "What can be inferred about the older inmate who knocked the cigarette out of Iverson's mouth?", "choices": ["He resented Iverson's fame and wanted to provoke a fight", "He believed Iverson still had a future and refused to let him give up on it", "He was trying to enforce the jail's official no-smoking rule", "He wanted the cigarette for himself"], "answer": 1, "explanation": "The older man told Iverson he was not going to give up, that he would get out and get right instead of falling into the same traps as everyone else."}, {"q": "According to the passage, why was the prosecutor's claim that a jail GED program meant Iverson would be no worse off misleading?", "choices": ["The City Farm had canceled its GED program years earlier", "Iverson had already graduated from high school before sentencing", "The GED program was only open to inmates over twenty-one", "The NCAA would not accept a GED, so it could not open the door to college basketball"], "answer": 3, "explanation": "Iverson explains that although the jail did have a GED program, the NCAA would not accept a GED from him, and NCAA eligibility was his only path to college and basketball."}, {"q": "Why did his friend's blunt message, that he was doing the time, actually make things easier for Iverson?", "choices": ["It freed him from the daily cycle of false hope that release was always one day away", "It convinced him to stop reading the Bible and focus on basketball", "It proved that his lawyers had stopped working on his case", "It meant his friend had inside information about the parole board"], "answer": 0, "explanation": "People kept promising that tomorrow was the day, and it never was; once his friend told him to accept the sentence, Iverson says he could finally relax."}, {"q": "Based on the passage, Iverson was housed with the halfway-house inmates because", "choices": ["the bakery workers were all assigned to that dorm", "he requested to live away from people his own age", "they were calmer, and nobody wanted his fame to make him a target", "the warden wanted him close to the visiting area"], "answer": 2, "explanation": "Everyone at the Farm already knew who he was, so he was placed with the more chill halfway-house guys because no one wanted him to become a target."}, {"q": "When Iverson concludes that the press is not the same as the people, he most nearly means that", "choices": ["reporters were forbidden from writing to inmates at the City Farm", "the harsh newspaper coverage did not match the supportive letters ordinary people sent him", "most people never read the newspaper articles about his case", "the jail staff removed every negative letter before he saw his mail"], "answer": 1, "explanation": "Though the papers made him sound like the worst person in the world, letters arrived from around the globe saying people believed in him and saw injustice in his case."}, {"q": "It can most reasonably be inferred that Iverson thanks Tom Brokaw because the interview", "choices": ["brought national attention that made his situation harder to ignore", "directly persuaded the appeals court to grant him bond", "proved to the public that the judge was corrupt", "led to his immediate transfer to a better facility"], "answer": 0, "explanation": "Iverson says the interview elevated the profile of his situation, noting it is easier to blot out a Black kid's future when the whole country is not watching."}, {"q": "According to the passage, the local newspaper poll found that", "choices": ["81 percent of all readers wanted Iverson released immediately", "most white and Black residents agreed the sentence was unfair", "81 percent of white people thought Iverson should be in jail, but only 17 percent of Black people did", "17 percent of white people and 81 percent of Black people thought he should be in jail"], "answer": 2, "explanation": "The poll showed a stark racial split: 81 percent of white respondents thought he belonged in jail, compared with just 17 percent of Black respondents."}, {"q": "As used in the passage, saying the Brokaw interview \"elevated the profile\" of his situation most nearly means the interview", "choices": ["shortened the length of his sentence", "improved his reputation with the prosecutor", "raised his standing among the other inmates", "made his case far more widely known"], "answer": 3, "explanation": "Elevating the profile means increasing public visibility; a national NBC broadcast put his case in front of the whole country."}, {"q": "As used in the passage, the word \"predicament\" most nearly means", "choices": ["prediction", "difficult situation", "court ruling", "punishment schedule"], "answer": 1, "explanation": "When Iverson says people really cared about his predicament, he means they cared about the difficult situation he was trapped in."}, {"q": "The description of Iverson shooting alone in the evenings, imagining Bethel crowds and wondering if he could face Michael Jordan, primarily serves to", "choices": ["show that his dream of the NBA survived even inside the prison yard", "prove that the City Farm had excellent athletic facilities", "explain why the other inmates refused to play basketball with him", "suggest that he had lost touch with reality during his sentence"], "answer": 0, "explanation": "Even on cracked concrete at a leaning hoop, he pictured crowds and the NBA, and he says he knew he could compete even while in jail with no way out."}, {"q": "The passage about Sue Lambiotte primarily serves to show that", "choices": ["the warden was reluctant to allow any tutoring at the City Farm", "Iverson planned to skip college and enter the NBA directly", "a concrete plan for Iverson's education took shape while he was still in jail", "Iverson's mother hired the most expensive tutor in Virginia"], "answer": 2, "explanation": "Lambiotte, who believed in Iverson as a student, arranged with the warden for daily SAT and ACT prep so he could take the tests in April and later finish high school."}]}, {"id": "ch17-finding-georgetown", "num": "17", "part": "Part III — From the Jungle to Georgetown", "title": "Finding Georgetown", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Georgetown recruited Iverson aggressively while he was still in jail.", "Iverson chose Georgetown because it was the only school that had ever produced NBA guards.", "Coach Thompson traveled to Virginia to meet Iverson and offer him a scholarship on the spot.", "Iverson's mother's determination and emotional appeal persuaded Coach Thompson to consider taking a chance on her son."], "answer": 3, "explanation": "The chapter turns on the meeting Iverson's mother arranged and her private, tearful plea, which moved Coach Thompson to agree to help with strict conditions."}, {"q": "According to the passage, who first suggested Georgetown to Iverson?", "choices": ["His mother", "Boo Williams", "Jamil Blackmon", "Butch Harper"], "answer": 0, "explanation": "During a jail visit, his mom simply said it: what about Georgetown, where John Thompson could be his coach."}, {"q": "Iverson initially dismissed the idea of Georgetown because he believed", "choices": ["the school was too far from Virginia for his family to visit", "it was a big man's school with a slow style that had never sent a six-foot guard to the NBA", "Coach Thompson had publicly criticized him during the trial", "the school's academic requirements were impossible for him to meet"], "answer": 1, "explanation": "He pictured Georgetown as the school of centers like Mourning, Mutombo, and Ewing, playing slow and feeding the post, and thought no six-foot guard had come out of it to the NBA."}, {"q": "According to the passage, why was Boo Williams the one to call Coach Thompson?", "choices": ["He was Iverson's legal guardian while Iverson was in jail", "He had played for Thompson at Georgetown years earlier", "He already knew Thompson from coaching Alonzo Mourning in AAU ball and being involved in his recruitment", "He was the athletic director at Bethel High School"], "answer": 2, "explanation": "Williams had a prior relationship with Thompson because he had coached Mourning in AAU and been part of Mourning's recruitment, so he made the call."}, {"q": "Who traveled to Washington, DC, for the meeting with Coach Thompson?", "choices": ["Iverson's mom, Boo Williams, Jamil Blackmon, and Butch Harper", "Iverson's mom, Coach Bailey, and Sue Lambiotte", "Iverson, his mom, and his lawyer James Ellenson", "Boo Williams and Butch Harper, without Iverson's mom"], "answer": 0, "explanation": "His mom, Boo Williams, Jamil Blackmon, and Butch Harper all got in a car and drove up to DC; Iverson himself was still in jail."}, {"q": "Where did the meeting with Coach Thompson take place?", "choices": ["At a hotel near the Georgetown campus", "In the athletic director's office at Bethel", "At the City Farm visiting area", "At McDonough Gymnasium, where Thompson's office and the practice facility were"], "answer": 3, "explanation": "The group arrived on campus at McDonough Gymnasium, which housed Coach Thompson's office and the practice facility."}, {"q": "According to the passage, the meeting got off to a terrible start because", "choices": ["Coach Thompson refused to discuss Iverson's legal situation", "someone in the room questioned whether Thompson could coach a guard", "Iverson's mom arrived late after getting lost in DC", "Boo Williams demanded a scholarship before any discussion"], "answer": 1, "explanation": "Somebody questioned whether Thompson could coach a guard, and he was about ready to kick them out before Iverson's mom stepped in."}, {"q": "Iverson's mother's request to speak with Coach Thompson alone most strongly suggests that she", "choices": ["wanted to negotiate scholarship money in private", "did not trust Boo Williams to keep the conversation secret", "sensed the meeting was collapsing and believed a personal appeal was her best chance", "planned to tell Thompson things Iverson had asked her to keep hidden"], "answer": 2, "explanation": "With the meeting going badly, she stopped it and cleared the room; once alone with Thompson, she made the emotional plea that changed his mind."}, {"q": "Based on the passage, Coach Thompson's response to the mother's plea is best characterized as", "choices": ["willing to help, but only under strict conditions and without promises", "enthusiastic and unconditional acceptance", "polite refusal softened by a referral to another school", "indifference until he saw Iverson play in person"], "answer": 0, "explanation": "Thompson agreed to help the child only if the child concentrated on his studies with no excuses for misbehavior, and he offered no promises."}, {"q": "Iverson notes that \"the next part is just the story I heard\" primarily to", "choices": ["suggest that his mother exaggerated what happened in the meeting", "acknowledge that he was in jail and is retelling events he did not witness", "warn readers that Coach Thompson often changed his version of events", "explain why he cannot remember the details of his own recruitment"], "answer": 1, "explanation": "Because he was locked up, Iverson could not attend the meeting; he heard the story from his mom about a million times, and Thompson liked to tell it too."}, {"q": "As used in the passage, saying Georgetown was \"worth a shot\" most nearly means the idea was", "choices": ["certain to succeed", "dangerous to attempt", "worth trying despite uncertainty", "too expensive to pursue"], "answer": 2, "explanation": "His mom and Boo Williams agreed Georgetown was worth a shot, meaning they believed the attempt was worthwhile even though success was not guaranteed."}, {"q": "When Iverson writes, \"It was my life in the balance,\" he most nearly means that his life", "choices": ["was perfectly stable at that moment", "depended on keeping his emotions balanced", "was being weighed by a jury", "hung uncertainly between being saved and being lost"], "answer": 3, "explanation": "His mom told Thompson that if he did not save Allen, Allen could die; the phrase captures how his future teetered on the outcome of that conversation."}, {"q": "The quotation in which Thompson recalls seeing \"the love of a mother\" afraid for her child primarily serves to", "choices": ["show that Thompson doubted Iverson's talent as a player", "explain that Thompson's decision to help was driven by the mother, not by basketball", "prove that Thompson had met Iverson's mother before the meeting", "suggest that Thompson regretted his decision years later"], "answer": 1, "explanation": "Thompson said that seeing the mother's love and fear was why he chose to help; the passage stresses that he focused on her rather than on Iverson the athlete."}, {"q": "The final paragraph primarily contrasts", "choices": ["the negative stories people told about Iverson's mother with the belief and effort Thompson actually saw in her", "Georgetown's slow style of play with Iverson's speed", "Thompson's strictness with the leniency of Iverson's high school coaches", "Iverson's doubts about college with his certainty about the NBA"], "answer": 0, "explanation": "People usually focused on claims that his mother was not there for him, but Thompson saw what Iverson learned early on: she believed in him and was trying her hardest."}, {"q": "According to the passage, what step did Coach Thompson say he would take next?", "choices": ["Visit Iverson at the City Farm himself", "Offer Iverson a full scholarship immediately", "Send his athletic department academic advisor to Virginia to check Iverson's work", "Call the judge to request Iverson's early release"], "answer": 2, "explanation": "Thompson said he would send his athletic department academic advisor down to Virginia to check out Iverson's work, but he made no promises."}]}, {"id": "ch18-out-of-jail", "num": "18", "part": "Part III — From the Jungle to Georgetown", "title": "Out of Jail", "bank": [{"q": "Which choice best describes the main purpose of the chapter?", "choices": ["To explain the legal strategy behind Iverson's appeal in technical detail", "To narrate Iverson's release from jail and express gratitude to the many people who made it possible", "To argue that the criminal justice system treated Iverson fairly", "To describe the daily work routines at the City Farm"], "answer": 1, "explanation": "The chapter moves from the effort to win his release to the release itself, and Iverson repeatedly stresses that he 'didn't make it by myself,' thanking the community, lawyers, and Governor Wilder."}, {"q": "According to the passage, why did Iverson's legal team turn to the governor of Virginia?", "choices": ["The appeal had already been formally denied by the courts", "The governor was a personal friend of the new lawyers", "The NAACP told the family it was their only remaining option", "The appeal might take years, and only the governor could grant a pardon or clemency"], "answer": 3, "explanation": "The passage states that the appeal was still in the works but might take years, so the next step was the governor, since only he could grant a pardon or clemency."}, {"q": "According to the passage, Governor Douglas Wilder was", "choices": ["the first Black man ever elected governor of any state in the country", "a former lawyer who had once represented Iverson's family", "a senator who was running for reelection that winter", "the head of the state chapter of the NAACP"], "answer": 0, "explanation": "Iverson notes that Wilder, the grandson of slaves, was the first Black man ever elected governor of any state in the whole country."}, {"q": "The passage suggests that Iverson told himself he would have to serve his full sentence because", "choices": ["his lawyers had privately told him the appeal had failed", "he trusted the newspaper polls showing the public was against him", "believing that was the only way he could get through his time in jail", "he did not want to get his hopes up before Christmas visits"], "answer": 2, "explanation": "When the warden delivers the news, Iverson explains that the only way he could really get through jail was by believing he would have to serve the time, which is why the release left him in shock."}, {"q": "As used in the passage, \"clemency\" most nearly means", "choices": ["a public apology issued by the state", "an official act of mercy that reduces a punishment", "a retrial ordered by a higher court", "a payment made to cover legal costs"], "answer": 1, "explanation": "The passage pairs clemency with a pardon as something only the governor could grant to get Iverson out of jail, meaning an official act of mercy toward a prisoner."}, {"q": "According to the passage, which organization offered to coordinate Iverson's legal fight after its state leader visited him?", "choices": ["ESPN", "The Daily Press", "Georgetown University", "The NAACP"], "answer": 3, "explanation": "The passage says the state head of the NAACP visited Iverson at the Farm, and the organization offered to coordinate his legal fight."}, {"q": "Iverson's decision to put on green and gold sweats rather than the suit returned to him most strongly suggests that he", "choices": ["wanted to shed a reminder of his ordeal and step out as a Bethel athlete again", "was following prison rules that required athletic clothing at release", "found that the suit no longer fit after months of physical labor", "was advised by his lawyers to dress casually for the cameras"], "answer": 0, "explanation": "He refuses the suit taken from him when he was first jailed and chooses sweats in Bethel's colors, saying 'That was me' — a reclaiming of his identity."}, {"q": "The paragraph recalling Iverson's childhood Christmases mainly serves to", "choices": ["show that his family celebrated Christmas lavishly every year", "criticize the guards for how they treated the men on the holiday", "explain why spending Christmas in jail did not crush him, since his past Christmases were often disappointing", "argue that Christmas was always his favorite time of year"], "answer": 2, "explanation": "He says he was okay on Christmas at the City Farm 'because it wasn't like all my Christmases had been perfect,' and the memory of empty stockings explains that attitude."}, {"q": "The contrast between Iverson's serious face outside his house and his emotional reaction inside most strongly suggests that he", "choices": ["was not actually happy about being released", "was angry that news crews had gathered on his block", "wanted reporters to believe the release was a mistake", "felt he should appear composed in public and saved his real emotions for family in private"], "answer": 3, "explanation": "He says he 'played it serious' for the cameras because that is how he felt he should act, but behind closed doors with his mom, aunt, and sisters he let it all go."}, {"q": "In the Daily Press poll described near the end of the chapter, how did readers respond?", "choices": ["A large majority said the governor was right to free Iverson", "762 people said he should have stayed in jail, while 288 supported freeing him", "The results were split almost exactly evenly", "288 people said he should have stayed in jail, while 762 supported freeing him"], "answer": 1, "explanation": "The passage gives the numbers directly: 288 readers supported the governor freeing Iverson, and 762 said he should have stayed in jail."}, {"q": "Iverson asks whether the first Black governor in the nation's history would need help winning the Black vote primarily in order to", "choices": ["reject as illogical the newspaper's claim that Wilder freed him for political gain", "admit that Wilder's true motives were never made clear", "suggest that Wilder was planning a run for the Senate", "praise the Daily Press for its careful reporting"], "answer": 0, "explanation": "The Daily Press implied Wilder acted to win Black votes for a Senate run; Iverson's rhetorical question dismisses that motive as making no sense."}, {"q": "Iverson's tone when discussing the community members, donors, and lawyers who supported him is best described as", "choices": ["bitter and resentful", "detached and indifferent", "grateful and reflective", "boastful and dismissive"], "answer": 2, "explanation": "Looking back as an older man, he says he owes thanks to a lot of people, calls them all part of his legacy, and regrets not showing enough appreciation at the time."}, {"q": "As used in the passage, the statement that the media attention was \"dying down\" most nearly means the attention was", "choices": ["becoming more negative in tone", "gradually decreasing", "shifting to other athletes in Virginia", "ending all at once"], "answer": 1, "explanation": "After the Brokaw interview, the ESPN segment, and the Sports Illustrated story, the coverage slowly faded as December went on — it lessened over time rather than stopping abruptly."}, {"q": "According to the passage, who drove to the City Farm to pick Iverson up on the day of his release?", "choices": ["His lawyers, Tom Shuttleworth and Larry Woodward", "His mother and his aunt", "Mr. Payne, the warden", "His friend Mike Jackson"], "answer": 0, "explanation": "The passage says Tom Shuttleworth and Larry Woodward drove to the City Farm personally to pick him up, bringing clothes the family had provided."}, {"q": "The chapter closes with Mike Jackson's reminder that Wilder was the first and, to this day, the last Black governor of Virginia primarily to", "choices": ["suggest that Wilder lost his next election because of the release", "show that Jackson followed state politics more closely than Iverson did", "explain why Iverson's appeal took years to resolve", "underscore how rare Wilder's position was and how significant his brave decision remains"], "answer": 3, "explanation": "The closing detail — 'Imagine that' — emphasizes the singularity of Wilder's place in history, reinforcing Iverson's point that the governor's act took real courage."}]}, {"id": "ch19-back-home", "num": "19", "part": "Part III — From the Jungle to Georgetown", "title": "Back Home", "bank": [{"q": "Which choice best states the central idea of the chapter?", "choices": ["The governor's clemency erased every consequence of Iverson's conviction", "The chapter is mainly a history of hip-hop's rise in the early 1990s", "Coach Bailey's firing ended Iverson's hopes of a basketball career", "Though free, Iverson lived under strict conditions while rebuilding his education, relationships, and path to Georgetown"], "answer": 3, "explanation": "The chapter opens by correcting the idea that he was fully exonerated — he faced furlough, a curfew, and other conditions — and then follows his studies with Ms. Lambiotte, his friendships, and the road to Georgetown."}, {"q": "Which of the following was NOT among the conditions of Iverson's release?", "choices": ["Performing community service at Bethel High School", "Following a curfew", "Attending counseling", "Using his best efforts to obtain his high school diploma"], "answer": 0, "explanation": "The governor's conditions included no organized sports, parole check-ins, counseling, a curfew, the diploma requirement, and no criminal activity — community service is never mentioned."}, {"q": "According to the passage, what happened to Michael Simmons and Samuel Wynn after Iverson's release?", "choices": ["They remained in jail until their appeals succeeded", "They were transferred to the City Farm to finish their sentences", "They were released a couple of weeks later under basically the same conditions", "They were pardoned several months before Iverson was"], "answer": 2, "explanation": "Iverson urged his lawyers not to forget the two men, and the governor released them under basically the same conditions a couple of weeks after Iverson got out."}, {"q": "Michael Simmons's public comments after the release most strongly suggest that", "choices": ["he resented Iverson for getting out of jail first", "the press's effort to divide the friends did not succeed", "he had decided to give up football permanently", "he blamed Iverson for the time they served"], "answer": 1, "explanation": "Though reporters tried to stir up resentment about special treatment, Michael said he loved Allen and hoped he would get his education — showing the loyalty between them held."}, {"q": "As used in the passage, \"furlough\" most nearly means", "choices": ["a full pardon that erases a conviction", "a paid leave from a job", "a transfer to a less strict jail", "a conditional release requiring check-ins with parole"], "answer": 3, "explanation": "Iverson explains that being on furlough meant he was not quite free — he had to check in with parole until the following August."}, {"q": "According to the passage, how did Ms. Lambiotte adapt her teaching to fit the way
