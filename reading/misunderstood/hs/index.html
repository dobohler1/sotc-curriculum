 argue that Billy Packer should have lost his broadcasting job", "To celebrate Georgetown's victory in the Big East Championship game", "To recount a broadcasting controversy, how Coach Thompson managed it, and a painful loss in the Big East final", "To compare Kerry Kittles and Ray Allen as the conference's best players"], "answer": 2, "explanation": "The chapter moves from the Packer 'monkey' remark and Coach Thompson's handling of it to the Big East Tournament, ending with the heartbreaking one-point loss to UConn in the final."}, {"q": "Kerry Kittles missed the first Villanova game described in the chapter because", "choices": ["he was serving a suspension for making unauthorized phone calls on a calling card", "he had been injured in Villanova's previous game", "he had been ejected from the teams' earlier meeting", "he was away preparing for the NBA draft"], "answer": 0, "explanation": "Kittles was sitting out the third game of a three-game NCAA suspension for unauthorized calling-card phone calls, which Iverson cites as an example of the NCAA's strictness."}, {"q": "Coach Thompson scowled at the students chanting 'Two more years!' most likely because", "choices": ["the chant was distracting the referees during play", "he wanted Iverson to leave for the NBA right away", "he felt the chant mocked the seniors during their last home game", "he did not want the team consumed by speculation about whether Iverson would enter the draft"], "answer": 3, "explanation": "Iverson explains that Thompson 'didn't want everybody obsessing over would I or wouldn't I with the draft,' and someone even said he threw a towel toward the students."}, {"q": "Billy Packer made his controversial remark while", "choices": ["interviewing Iverson on camera after the game", "analyzing an and-one play in which Iverson faked out Alvin Williams", "discussing Iverson's past legal troubles on the air", "calling the Big East Tournament final against UConn"], "answer": 1, "explanation": "Packer said it while analyzing the and-one where Iverson showed Alvin Williams the ball, brought it around the other way, was hit on the head, and still scored."}, {"q": "Iverson writes that Packer's comment was 'not that big a deal' to him. This reaction most strongly suggests that", "choices": ["his sense of scale was shaped by having faced far worse, like being locked up", "he had never experienced racism before that moment", "he privately agreed with Packer's later statements", "he had not actually heard what Packer said on the broadcast"], "answer": 0, "explanation": "Iverson measures the insult against his past, noting the comment was not going to get him locked up, so compared with what he had survived it stayed small."}, {"q": "Coach Thompson's statement to the press about Packer served primarily to", "choices": ["demand a further public apology from CBS", "shift blame onto the Villanova coaching staff", "shut down the controversy so it would not disrupt the team's focus", "express his own personal outrage at the remark"], "answer": 2, "explanation": "Thompson declared Packer was not a racist, said neither he nor Allen was offended, and told everyone to leave it alone, because a debate would not help the team focus."}, {"q": "The detail that the Hoyas' conversation 'behind closed doors... might have been a little different' implies that", "choices": ["the team planned to boycott future CBS broadcasts", "the players' private feelings were not fully captured by their public statements", "Coach Thompson secretly believed Packer was a racist", "Iverson later apologized to his teammates for defending Packer"], "answer": 1, "explanation": "The line signals a gap between the calm public message and what the team said privately, while Thompson steered them away from a debate that would hurt their focus."}, {"q": "According to the passage, Packer 'made it worse' after apologizing by", "choices": ["refusing to broadcast any more Georgetown games", "repeating the original remark during another broadcast", "blaming Iverson for stirring up the controversy", "saying he apologized only to people 'who have those sensibilities' and that he did not see black and white"], "answer": 3, "explanation": "Heading into the Big East Tournament, Packer said he did not think of Iverson as a Black player and that he only apologized to people with 'those sensibilities,' reigniting the controversy."}, {"q": "In the Big East Tournament win over Villanova,", "choices": ["Victor scored 34 points and Iverson added 28", "Kittles was still serving his suspension", "Georgetown won by 38 points", "Othella led all scorers in his final college game"], "answer": 0, "explanation": "This time Kittles played, and Georgetown handled Villanova with Iverson scoring 28 and Vic finding his rhythm for 34 points from all over."}, {"q": "Iverson was 'so proud' of Victor in that tournament game because Victor", "choices": ["had never before scored in double figures", "played the whole game with an injury", "had asked Coach Thompson for extra practice time", "had struggled during the season, even being benched on and off, before finding his rhythm"], "answer": 3, "explanation": "Iverson says Vic had started the season hot but struggled at times, with Coach Thompson benching him on and off, which made his 34-point game special."}, {"q": "With sixteen seconds left in the Big East final, the decisive play was", "choices": ["Iverson's steal and breakaway dunk to seal the win", "Ray Allen's awkward shot that bounced around the rim several times before going in", "Jerome's putback basket off an offensive rebound", "a technical foul called on Coach Thompson"], "answer": 1, "explanation": "Georgetown was up one when Iverson switched onto Ray Allen, who threw up an awkward shot that bounced around the rim three or four times and dropped in."}, {"q": "As used near the end of the chapter, 'downcast' most nearly means", "choices": ["physically exhausted", "quietly relieved", "dejected and low in spirits", "openly furious"], "answer": 2, "explanation": "Iverson describes himself as defeated and downcast, head in his hands and eyes on the ground while holding back tears, which fits 'dejected.'"}, {"q": "His mother's remark, 'if you lift up John's arm, you'll see Allen underneath,' chiefly conveys", "choices": ["how protective and close Coach Thompson's relationship with Iverson was", "her jealousy of Coach Thompson's influence over her son", "her belief that Iverson depended too much on other people", "her criticism of Coach Thompson's coaching decisions"], "answer": 0, "explanation": "The image of Allen sheltered under Thompson's arm, spoken right after Thompson comforts him following the loss, captures the protective bond between coach and player."}, {"q": "By comparing the locker room to losing at football 'as a kid in Aberdeen,' Iverson emphasizes", "choices": ["that football had always been his best sport", "that college basketball meant less to him than childhood games", "his secret wish to return to playing football", "how raw and childlike the hurt of the loss felt"], "answer": 3, "explanation": "The comparison shows the defeat stripped away his college-star toughness and left him fighting tears like a kid; he calls it his toughest loss at Georgetown."}, {"q": "What does Iverson reveal about Coach Thompson's death?", "choices": ["He was at Thompson's bedside when he passed away", "Thompson's son Ronny called to warn him, but Thompson died the next morning before Iverson could say goodbye", "He learned about it from a television news broadcast", "It happened during Iverson's rookie season with the 76ers"], "answer": 1, "explanation": "Ronny Thompson called to say his father might have a week left, but Thompson died the next morning, and Iverson never got the chance to say goodbye."}]}, {"id": "ch30-a-second-dance", "num": "30", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "A Second Dance", "bank": [{"q": "Which statement best captures the central focus of this chapter?", "choices": ["Iverson's individual scoring records during his final college season", "Georgetown's NCAA Tournament run, which ends one win short of the Final Four", "Coach Thompson's decision to retire after the tournament", "Iverson's lifelong rivalry with Marcus Camby"], "answer": 1, "explanation": "The chapter follows the team from the opening rounds in Richmond through wins over Mississippi Valley State, New Mexico, and Texas Tech to the Elite Eight loss to UMass, one win from the Final Four."}, {"q": "According to the passage, what happened in Georgetown's first tournament game?", "choices": ["They lost narrowly to Mississippi Valley State", "They trailed at halftime before rallying to win", "Iverson fouled out in the first half", "They won by close to forty points, with Iverson scoring 31"], "answer": 3, "explanation": "Iverson says of the Mississippi Valley State game, \"We won by close to forty (31 points for me).\""}, {"q": "Iverson says the person in the crowd who really got his attention at the first game was", "choices": ["Governor Douglas Wilder, the man who had set him free", "his mother, wearing her MS. IVERSON jersey", "President Bill Clinton", "a scout sent by an NBA team"], "answer": 0, "explanation": "Although his mother and friends were there, Iverson writes that what really got his attention was Governor Douglas Wilder, \"the man who set me free,\" who meant even more to him than Bill Clinton."}, {"q": "Governor Wilder's remark about catching \"a kid who could have easily slipped off the slope\" suggests that he", "choices": ["regretted his decision to release Iverson", "believed Iverson would have succeeded without any help", "found it deeply rewarding to have helped a young person avoid ruin", "wanted public credit for Georgetown's tournament win"], "answer": 2, "explanation": "Wilder says, \"You can't imagine how good it makes you feel,\" showing genuine satisfaction at having intervened in the life of a young man who could have been lost."}, {"q": "The episode in which Boubacar urges a switch to man-to-man defense chiefly reveals that Coach Thompson", "choices": ["insisted his game plans be followed exactly as drawn", "genuinely listened to his players despite his authoritarian reputation", "had lost control of the team late in the season", "preferred zone defense in every situation"], "answer": 1, "explanation": "Iverson notes that Thompson \"was known as an authoritarian... But he wasn't like that at all,\" and proves it by showing Thompson taking the suggestion of a quiet player from Senegal who was new to basketball."}, {"q": "Coach Thompson's postgame remark, \"So much for my knowledge,\" primarily serves to", "choices": ["express his frustration with reporters", "admit that his coaching career was ending", "humorously give Boubacar credit for the defensive turnaround", "criticize New Mexico's coaching staff"], "answer": 2, "explanation": "Thompson jokes that he would like to take credit for the turnaround, then explains it was Boubacar's idea, laughing at himself while praising his player."}, {"q": "According to Iverson, what really impressed the team most about Texas Tech before the Sweet Sixteen?", "choices": ["Darvin Ham shattering a backboard against North Carolina", "Texas Tech's 33-1 season record", "Texas Tech's veteran coaching staff", "Texas Tech's fast-paced offensive style"], "answer": 0, "explanation": "Iverson mentions the 33-1 record and the win over North Carolina, but says what really impressed them was Darvin Ham shattering the backboard, which the team ran out of the locker room to see."}, {"q": "In the passage, \"New Mexico had been picking apart our zone\" most nearly means New Mexico had been", "choices": ["complimenting Georgetown's defensive scheme", "ignoring Georgetown's defensive pressure", "copying Georgetown's defensive strategy", "systematically exploiting the weaknesses of the defense"], "answer": 3, "explanation": "The zone defense was being broken down piece by piece by New Mexico's offense, which is why Boubacar proposed switching to man-to-man."}, {"q": "According to the passage, why did Iverson shoot just ten for twenty-nine against Texas Tech?", "choices": ["He was distracted by news of the broken backboard", "Partly because he missed shots and partly because Texas Tech sent a second defender at him", "Coach Thompson benched him for long stretches", "The referees called constant fouls on him"], "answer": 1, "explanation": "Iverson explains that \"some of that was me missing shots, but some of it was them running two defenders at me,\" especially in the \"four down\" set."}, {"q": "The line \"Feeling like we survived more than played great\" suggests the team left the Texas Tech game feeling", "choices": ["relieved to escape with an ugly win rather than proud of their performance", "confident they would win the national championship", "angry with Coach Thompson's game plan", "cheated by the officials"], "answer": 0, "explanation": "Iverson calls the game \"an ugly victory\" and says the team headed to the locker room relieved, emphasizing survival rather than dominance."}, {"q": "Which statement accurately describes Georgetown's Elite Eight game against UMass?", "choices": ["Georgetown led at halftime before collapsing", "Vic carried the scoring load for Georgetown", "Iverson scored 17 first-half points but went 1-for-10 in the second half", "Marcus Camby fouled out early in the game"], "answer": 2, "explanation": "Iverson says Georgetown kept it close in the first half, when he scored 17, but he went 1-10 in the second half and Vic did not make a shot all game."}, {"q": "As used in \"I made a couple foul shots down the stretch, sealing an ugly victory,\" the word \"sealing\" most nearly means", "choices": ["hiding", "delaying", "celebrating", "securing"], "answer": 3, "explanation": "His late free throws locked up, or secured, the win over Texas Tech, closing out the game."}, {"q": "When Iverson writes that Coach Thompson \"saw the end,\" he most likely means Thompson sensed that", "choices": ["his program's best chance at a deep tournament run was slipping away", "Iverson would be cut from the team the next season", "the university planned to fire him that summer", "UMass would go on to lose the championship game"], "answer": 0, "explanation": "Iverson immediately adds that Thompson's \"Hoya teams never made it that far in the Tournament again,\" suggesting Thompson sensed this had been his last great chance."}, {"q": "The chapter's final line, \"I had some decisions to make about my future,\" functions mainly to", "choices": ["summarize the awards Iverson won that season", "create a transition that foreshadows his coming choice about the NBA", "express regret over the loss to UMass", "criticize the format of the NCAA Tournament"], "answer": 1, "explanation": "After the season ends, this closing line points the reader ahead to the decision about turning pro that drives the next chapter."}, {"q": "The author lists his awards alongside what he did not win primarily to", "choices": ["boast about his dominance of college basketball", "prove that award voters were biased against him", "emphasize that individual honors could not make up for the team goals he fell short of", "explain why he chose to return to Georgetown for another year"], "answer": 2, "explanation": "Right after naming his honors, Iverson stresses that he \"didn't win the Big East, didn't win Player of the Year, and didn't make it to the Final Four,\" putting the missed team goals above the trophies."}]}, {"id": "ch31-leaving-georgetown", "num": "31", "part": "Part IV — He Saved My Life: Coach John Thompson", "title": "Leaving Georgetown", "bank": [{"q": "Which statement best captures the central focus of this chapter?", "choices": ["How mounting family crises turned Iverson's NBA decision into what he calls not really a choice at all", "Iverson's academic struggles during his final semester at Georgetown", "A dispute between Iverson and Coach Thompson over playing time", "Iverson's negotiation of his rookie contract with an NBA team"], "answer": 0, "explanation": "The chapter builds from the Benz and public speculation to his family's needs — his dad's arrest, his sister's seizures, his daughter — until he concludes, \"It wasn't a choice.\""}, {"q": "Which statement about the Mercedes is accurate according to the passage?", "choices": ["Iverson bought it outright with money from a sneaker deal", "Coach Thompson co-signed a loan so he could afford it", "A salesman let him drive it away with no papers, no contract, and no money", "It was a gift from agent David Falk"], "answer": 2, "explanation": "The salesman, who knew who Iverson was, told him to just take it for a while and settle up after his future was decided — no papers, no contract, no money."}, {"q": "The memories that surface as Iverson drives off the lot — Coach Barefield's van, trapping crabs, the jail bakery — primarily serve to", "choices": ["show that he missed his high school friends", "suggest that he regretted taking the car", "list the people to whom he owed money", "contrast his hard past with the success and freedom the car represented"], "answer": 3, "explanation": "As the dealership fades in the rearview, the memories show \"how far I'd come\"; he concludes that the car and the freedom were \"what we dreamed of.\""}, {"q": "How did news that Iverson would enter the NBA Draft first become public?", "choices": ["Iverson announced it himself at a press conference", "The Daily Press reported it, citing anonymous local sources", "Coach Thompson confirmed it to national reporters", "David Falk released a statement from his agency"], "answer": 1, "explanation": "At the end of Easter weekend, his local paper, the Daily Press, announced he would enter the draft based on anonymous sources — before he had even talked to Coach Thompson."}, {"q": "Based on the passage, why did people in both Virginia and DC assume Iverson's decision was already made?", "choices": ["Seeing him in the luxury Mercedes convinced them, even though he had not paid for it", "He had stopped attending his classes at Georgetown", "He had already signed a contract with an agent", "Coach Thompson had publicly announced the decision"], "answer": 0, "explanation": "Iverson says people \"looked at that car and figured my decision was made,\" and he repeats that he was only using it and could not have paid for it."}, {"q": "According to the passage, what happened to Iverson's fathers that April?", "choices": ["Both were released from prison", "His biological father attended his final Georgetown game", "His dad was cleared of all pending charges", "His dad was arrested on a drug charge, and his biological father was arrested on a domestic violence charge"], "answer": 3, "explanation": "The same weekend, his dad was hit with another drug charge, and that same April his biological father was arrested for domestic violence and later served years in prison."}, {"q": "When Coach Thompson said, \"Allen's not going anywhere unless I tell him it's time to go,\" the passage suggests he was really trying to", "choices": ["control Iverson's career for his own benefit", "convince NBA teams not to draft Iverson", "shield Iverson from outside pressure while he made his decision", "force Iverson to stay in school for four years"], "answer": 2, "explanation": "Iverson explains that although some people called Thompson controlling, \"what he was really trying to do was get the pressure off of me,\" and Thompson noted he had no four-year rule."}, {"q": "What advice did David Falk initially give Iverson?", "choices": ["Enter the draft immediately to provide for his family", "Stay in school to refine his game, claiming he would not even be a lottery pick", "Transfer to a program with more national exposure", "Sign a sneaker deal before making any decision"], "answer": 1, "explanation": "Falk was direct: stay in school, refine his game, and improve his draft status — he even said Iverson was not going in the lottery, which Iverson thought was crazy."}, {"q": "According to the passage, what helped Coach Thompson feel fine about Iverson going pro?", "choices": ["Isiah Thomas silently raising one finger when asked where Iverson might be drafted", "A written scouting report from the Milwaukee Bucks", "Iverson's promise to finish his degree later", "A vote taken by the Georgetown coaching staff"], "answer": 0, "explanation": "Thompson said he was fine with the decision after Isiah Thomas of the Raptors answered his question by raising one finger, signaling Iverson could be the number one pick."}, {"q": "Iverson's response to Wilbon's claim that his family could wait another year is best understood as", "choices": ["agreement that his family was exaggerating its needs", "an admission that Wilbon knew his situation well", "a rejection rooted in losing Nana — the lesson that time is not guaranteed", "anger that a writer would mention his family at all"], "answer": 2, "explanation": "Iverson answers that \"losing Nana taught me there are only so many days in a person's life\" and that waiting is not always an option."}, {"q": "As used in the passage, performing \"due diligence\" most nearly means", "choices": ["completing the physical training required before the draft", "carefully investigating a situation before making a decision", "paying fees owed to the university", "publicly apologizing for past mistakes"], "answer": 1, "explanation": "Thompson's due diligence meant researching the decision properly — including having Iverson sit down with agent David Falk and asking talent evaluators about his draft position."}, {"q": "Falk urged Iverson to stay in school and \"refine\" his game. As used here, \"refine\" most nearly means", "choices": ["abandon", "showcase", "simplify", "polish and improve"], "answer": 3, "explanation": "Falk wanted Iverson to spend another year improving his game so his draft status would rise."}, {"q": "Iverson says he \"stuck to that script\" about escaping poverty. This admission reveals that he", "choices": ["felt he could not publicly admit that enjoying wealth was also part of his motivation", "memorized his press statement word for word", "was lying about his family's financial needs", "let David Falk write all of his answers for him"], "answer": 0, "explanation": "He confesses that wanting to live the good life \"was a big part of my decision,\" but says a kid from poverty was only allowed to talk about escaping it, so he stuck to that script."}, {"q": "Which of the following occurred at the press conference in McDonough Gym?", "choices": ["Iverson refused to take any questions", "Coach Thompson criticized Iverson's choice to leave", "Iverson stood with his mom on his left and Coach Thompson on his right", "Iverson announced that he had signed a sneaker deal"], "answer": 2, "explanation": "Iverson describes the scene exactly: his mom on his left, Coach Thompson on his right, and David Falk beyond Thompson, in the gym where his Georgetown journey began."}, {"q": "Coach Thompson's point that Georgetown Hospital could not help Iverson's sister primarily serves to", "choices": ["blame the hospital's administrators for her condition", "criticize a system whose rules pushed players to leave school to meet basic needs", "prove that Iverson's sister was not seriously ill", "announce a new university health program for athletes"], "answer": 1, "explanation": "Thompson calls out the rules that made such help an \"improper benefit,\" asking how anyone could expect a young man to stay in school when the NBA was the only way to provide for necessities."}]}, {"id": "ch32-the-76ers", "num": "32", "part": "Part V — From the Draft to Rookie of the Year", "title": "The 76ers", "bank": [{"q": "Taken as a whole, this chapter primarily traces", "choices": ["Iverson's statistics during his rookie NBA season", "the 76ers' rebuilding of their roster through trades", "Iverson's journey from lottery night to being chosen first overall, alongside the deal that let him be himself", "a long-running conflict between Iverson and Commissioner David Stern"], "answer": 2, "explanation": "The chapter moves from watching the lottery with Uncle Stevie, through the Philadelphia workouts and the Reebok deal, to draft night at the Meadowlands, ending with \"I had made it.\""}, {"q": "How did Iverson learn that Philadelphia had won the first pick?", "choices": ["Watching the lottery on NBC with his Uncle Stevie", "A phone call from David Falk", "A letter from Pat Croce", "At the pre-draft camp in Chicago"], "answer": 0, "explanation": "He was back home with Uncle Stevie watching the lottery on NBC when Russ Granik announced the first pick would go to the Philadelphia 76ers."}, {"q": "Which best describes Pat Croce as presented in the passage?", "choices": ["The 76ers' newly hired head coach", "A minority owner who was nonetheless the team's president and public face", "The team's new general manager", "The NBA executive who announced the lottery results"], "answer": 1, "explanation": "Croce, a fitness entrepreneur who partnered with Ed Snider, was the minority owner \"but he was president and the face of the franchise.\" Greenberg was the GM and Russ Granik announced the picks."}, {"q": "Iverson says Philadelphia \"made so much sense\" partly because", "choices": ["the team guaranteed him the largest contract in the league", "Coach Thompson had once played for the franchise", "the city had the warmest weather of any lottery team", "it was his dad's favorite team, not far from home, and it needed a point guard"], "answer": 3, "explanation": "He lists the reasons himself: his dad's team was always Philly, the city was close to home, legends had played there, and the one thing the roster was missing was a point guard."}, {"q": "What pre-draft strategy did Iverson and his agent settle on?", "choices": ["Working out for every team in the lottery", "Skipping all workouts to avoid injury", "Working out for one team only — the Philadelphia 76ers", "Demanding a trade if any other team drafted him"], "answer": 2, "explanation": "Once it was clear he would be a top pick, they decided he would work out only for Philadelphia, since Falk knew becoming the first overall pick would raise his profile and value."}, {"q": "Iverson's account of his first Philadelphia visit — the questions about his past and the two-hour psychologist session — suggests the 76ers were", "choices": ["at least as concerned with his character and history as with his basketball ability", "already convinced he was the best player available", "mainly trying to help him relax before the draft", "unaware of the bowling alley incident"], "answer": 0, "explanation": "Croce went straight to questions about the bowling alley, a detective investigated his background, and Iverson says \"it almost seemed like basketball was the last thing on their minds.\""}, {"q": "Which statement about Iverson's sneaker deal is accurate?", "choices": ["It was signed on the night of the draft", "It paid $50 million over ten years and was signed about a week before the draft", "It was worth $9 million over three years", "It required him to wear a suit at public events"], "answer": 1, "explanation": "About a week before the draft, Falk negotiated his first sneaker deal: $50 million for ten years. The $9 million over three years was the salary for the number one pick."}, {"q": "Iverson notes the appeals court had found \"insufficient evidence.\" As used here, \"insufficient\" most nearly means", "choices": ["illegal", "overwhelming", "fabricated", "inadequate"], "answer": 3, "explanation": "Insufficient evidence means there was not enough evidence — the court found the case against him lacked the proof needed."}, {"q": "The long passage recalling the rules imposed by his mom, Mo, the courts, and Coach Thompson functions mainly to", "choices": ["explain why the freedom to be himself in the Reebok partnership meant so much to him", "argue that those mentors treated him unfairly", "list the mistakes he made as a teenager", "show that he preferred living in Virginia to living in DC"], "answer": 0, "explanation": "After years of curfews, dress codes, and walking a \"cliff's edge,\" the Reebok meeting is the moment he could finally be himself — the passage sets up why that mattered."}, {"q": "When Iverson says, \"Guidance I could take. Being molded? I wasn't no ball of clay,\" he means that he", "choices": ["refused to accept advice from anyone", "blamed his mentors for his troubles", "could accept direction but not being reshaped into someone he wasn't", "believed his game needed no improvement"], "answer": 2, "explanation": "He makes clear the men in his life were positive role models whose guidance he valued, but he drew the line at being molded into a different person."}, {"q": "According to the passage, how did Iverson's second Philadelphia visit differ from the first?", "choices": ["It included a longer psychological exam", "It was broadcast live on television", "He met Pat Croce for the first time", "It focused on basketball, with game-like conditions and no press"], "answer": 3, "explanation": "The second visit came without press or hoopla; the team told him to \"just let it roll\" in real game-like conditions, and new coach Johnny Davis gave him feedback."}, {"q": "The tone of Iverson's statement \"I don't wanna be Jordan... I want to look in the mirror and say I did it my way\" is best described as", "choices": ["bitter and resentful", "self-assured but respectful", "mournful and regretful", "sarcastic and mocking"], "answer": 1, "explanation": "He asserts his individuality with confidence while adding \"That's no disrespect\" and stressing how much he revered Jordan on the court."}, {"q": "Which of the following happened on draft night at the Meadowlands?", "choices": ["Iverson held his one-and-a-half-year-old daughter Tiaura on his lap in the greenroom", "Ra, Marlon, and Arnie sat with the family in the greenroom", "Iverson wore his diamond cross outside his suit on stage", "His biological father joined the family at their table"], "answer": 0, "explanation": "Only family could sit in the greenroom, so his friends waited off to the side; he kept Tiaura on his lap while waiting, and he wore the cross under his suit."}, {"q": "At the lottery, Croce \"couldn't contain himself.\" This most nearly means he could not", "choices": ["keep his job with the team", "hold back his excitement", "find his assigned seat", "remember which pick his team had won"], "answer": 1, "explanation": "Croce jumped up, pumped his fists, and high-fived the representatives he had just beaten — he was unable to hold in his celebration."}, {"q": "In the \"Self-Expression\" section, the story of Dream wanting to wear Reebok sweats to the Hall of Fame ceremony primarily serves to", "choices": ["show that Iverson had become a strict and joyless parent", "criticize the formal dress codes of award ceremonies", "illustrate that self-expression is Iverson's legacy, passed down even to his daughter", "explain why the family arrived late to the ceremony"], "answer": 2, "explanation": "Watching Dream insist on wearing sweats with IVERSON down the side, he thinks, \"This girl is just like her daddy,\" and calls his kids — and NBA players free to be themselves — his legacy."}]}, {"id": "ch33-from-va-to-pa", "num": "33", "part": "Part V — From the Draft to Rookie of the Year", "title": "From VA to PA", "bank": [{"q": "Which choice best describes the main purpose of this chapter?", "choices": ["To argue that the city of Hampton never truly appreciated Iverson's accomplishments", "To explain the history and rules of the NBA's summer leagues", "To trace Iverson's transition from a celebrated but controversial send-off in Virginia to the start of his professional life in Philadelphia", "To compare Iverson's career prospects with those of Joe Smith"], "answer": 2, "explanation": "The chapter moves from the draft, the Hampton parade, and the lingering local debates to the minicamp and summer league games in and around Philadelphia, framing it as leaving the old controversies behind and moving on."}, {"q": "According to the passage, when did Philadelphia select Iverson with the No. 1 pick?", "choices": ["June 26, 1996", "July 6, 1996", "July 9, 1996", "June 26, 1995"], "answer": 0, "explanation": "The passage states directly that Philly selected him No. 1 on June 26, 1996; July 6 was the parade and July 9 was the start of minicamp."}, {"q": "According to the passage, who organized the Hampton parade?", "choices": ["The mayor's office", "A Poquoson car dealership", "Bethel High School's athletic boosters", "A leader of SWIS, the organization formed to advocate for the young men arrested after the bowling alley fight"], "answer": 3, "explanation": "The passage says the parade was organized by one of the leaders of SWIS, the group that had formed to advocate for those arrested after the bowling alley fight. The Poquoson dealership only loaned the convertible."}, {"q": "What connection does the passage draw between Iverson and Joe Smith?", "choices": ["They were teammates on the same AAU squad in Virginia", "They came from the same part of Virginia and were picked No. 1 in back-to-back drafts", "They both starred at Hampton University before turning professional", "They were both selected by the 76ers in consecutive years"], "answer": 1, "explanation": "The passage notes they were two kids from the same part of Virginia, separated by the James River, picked No. 1 in back-to-back years; Smith was the No. 1 pick the year before, out of Norfolk."}, {"q": "According to the passage, how did Iverson's summer league stint turn out?", "choices": ["His team won every game, and he led the league in assists", "He was held out of most games because of his size", "His team won two games and lost three, and he averaged about 30 points", "He struggled to score against bigger, stronger professionals"], "answer": 2, "explanation": "The passage says the team won two and lost three and that he averaged about 30 points, with his confidence growing each game."}, {"q": "It can most reasonably be inferred that the parade route was meaningful to Iverson because it", "choices": ["connected places tied to formative moments from his youth", "avoided the neighborhoods where he had gotten into trouble", "was the same route used for every Hampton championship celebration", "passed by the courthouse where his conviction was overturned"], "answer": 0, "explanation": "The route began at Aberdeen Elementary, where he once went to play pickup after tearing off his cast, and ended at the Coliseum, where Bethel beat Hampton High the day after he first met the police."}, {"q": "The sign reading \"Millions do not a hero make. Morals do\" most strongly suggests that some residents", "choices": ["believed the parade should have been held in Poquoson instead", "still judged Iverson's character rather than celebrating his success", "objected to the amount of money the city spent on the parade", "wanted Iverson to donate his new wealth to the community"], "answer": 1, "explanation": "The sign appears among those who hated that Hampton was celebrating him, showing that for some residents his fame and money did not erase their moral judgment of his past."}, {"q": "Iverson's reaction when coaches wanted to hold him out of a summer league game primarily reveals his", "choices": ["distrust of the Sixers' medical staff", "fear of losing his roster spot to an undrafted player", "belief that summer league games decided the starting lineup", "fierce competitiveness and refusal to miss a chance to play"], "answer": 3, "explanation": "Despite being knocked down over and over at 165 pounds, he insisted on playing every game, saying he was not missing them, which shows his competitiveness rather than any fear or distrust."}, {"q": "The passage suggests that criticism of Iverson's shot selection in summer league was sharpened by", "choices": ["his team's failure to win a single game", "his refusal to speak with local reporters", "assumptions about how a player of his height should play", "complaints from the Sixers' coaching staff"], "answer": 2, "explanation": "Iverson observes that there was something about a six-foot player not passing that especially bothered people, tying the criticism to expectations about his size."}, {"q": "As used in the passage, \"advocate\" most nearly means", "choices": ["raise money", "speak up in support of", "file lawsuits on behalf of", "publicly apologize for"], "answer": 1, "explanation": "SWIS is described as the organization formed to advocate for the young men arrested after the bowling alley fight, meaning it spoke up in their support."}, {"q": "As used in the passage, \"paying tribute\" most nearly means", "choices": ["showing honor and appreciation", "giving money as a reward", "repaying an old debt", "offering a formal apology"], "answer": 0, "explanation": "Iverson says it meant so much to see his own community there paying tribute, and he responded by thanking his family, God, and everyone who stuck with him, so the phrase refers to showing honor."}, {"q": "The quotation from the mayor primarily serves to", "choices": ["prove that the controversy over the parade had completely ended", "suggest that city officials secretly opposed the celebration", "explain why the parade route had to be changed", "show a city leader publicly defending the decision to honor Iverson despite ongoing criticism"], "answer": 3, "explanation": "The mayor acknowledges the controversy but insists the city has to move on and that honoring one of its own is the right thing to do, defending the parade against critics."}, {"q": "The tone of the chapter's final lines, in which Iverson describes being \"alive, out of jail, and achieving my dream,\" is best described as", "choices": ["bitter and resentful", "grateful and content", "anxious and uncertain", "boastful and dismissive"], "answer": 1, "explanation": "Even while brushing off a critical headline, Iverson emphasizes how happy he was to have reached that point in his life, ending the chapter on a note of gratitude."}, {"q": "The author most likely includes the headline \"By Shooting, Is Iverson Missing the Point?\" in order to", "choices": ["show that criticism followed him even during a strong summer league showing", "admit that his shot selection had genuinely hurt the team", "praise the local media for their insightful coverage", "explain why the coaches held him out of a game"], "answer": 0, "explanation": "Iverson introduces the headline with the remark that there was always controversy, using it as an example of criticism that persisted even while he was averaging about 30 points."}, {"q": "According to the passage, what happened at Iverson's first public appearance as a Sixer?", "choices": ["He scored 36 points in an overtime loss to the Knicks", "He was held out of the game with a shoulder injury", "He led the rookies past Toronto with 29 points and 7 assists", "He scored 22 points against local all-stars at McGonigle Hall while crowds waited for blocks to get in"], "answer": 3, "explanation": "His first time on the court in public as a Sixer was the exhibition against local all-stars at McGonigle Hall on Temple's campus, where people lined up for blocks and he scored 22. The Knicks and Toronto games came afterward."}]}, {"id": "ch34-let-the-games-begin", "num": "34", "part": "Part V — From the Draft to Rookie of the Year", "title": "Let the Games Begin", "bank": [{"q": "Which choice best states the central idea of this chapter?", "choices": ["Iverson's rookie season failed because the league refused to accept him", "Iverson regretted challenging veteran players during his first games", "The Sixers built a championship contender around their rookie guard", "Iverson's electrifying start as a rookie was met almost immediately with criticism and pushback from the media and the league"], "answer": 3, "explanation": "The chapter pairs his dazzling debut, the crossover, and big scoring nights with the backlash: the Jordan controversy, complaints about his shorts and socks, and the league memo targeting his crossover."}, {"q": "According to the passage, how did Iverson's first regular-season game begin?", "choices": ["In Chicago, where the Bulls received their championship rings", "On November 1 at the CoreStates Center against the Milwaukee Bucks", "At Madison Square Garden against Patrick Ewing's Knicks", "In Toronto against the Raptors' rookie squad"], "answer": 1, "explanation": "The chapter opens with the November 1 season opener at the CoreStates Center against the Bucks, with Ray Allen also making his debut for Milwaukee."}, {"q": "According to the passage, Iverson's first career points came when", "choices": ["he crossed over Sherman Douglas, drove to the baseline, and was awarded the basket on a goaltending call", "he hit a three-pointer over Ray Allen in the opening minutes", "Derrick Coleman set a screen that freed him for an open jumper", "he finished an alley-oop pass from Jerry Stackhouse"], "answer": 0, "explanation": "He waved off Derrick Coleman's screen, crossed over Sherman Douglas, rose to dunk, and although a defender got a piece of the ball, it was ruled a goaltend, giving him his first points."}, {"q": "According to the passage, what did the league's memorandum after Iverson's fourth game declare?", "choices": ["That his ankle braces had to be white from then on", "That his game shorts violated the uniform code", "That his crossover was a carrying violation", "That rookies could not play more than forty minutes per game"], "answer": 2, "explanation": "The memo, issued after just his fourth game, said his crossover was a carrying violation; the complaints about shorts and ankle braces were separate messages sent before the games began."}, {"q": "According to the passage, what did Iverson accomplish in the game at Madison Square Garden?", "choices": ["He recorded 26 points, 9 rebounds, and 9 assists", "He scored 30 points despite constant carrying calls", "He held Patrick Ewing to his lowest total of the season", "He scored a then-career-high 35 points and made five of nine three-pointers"], "answer": 3, "explanation": "At MSG he had his then-career-high 35 points, made five of nine threes, was not called for any carries, and played forty-four minutes in a win over the 5-1 Knicks."}, {"q": "Iverson's statement that, for the first time in his life, \"a human being didn't look real\" primarily conveys", "choices": ["the depth of his lifelong idolization of Michael Jordan", "his nervousness about playing in a hostile arena", "his confusion about the Bulls' pregame light show", "his resentment of the attention Jordan received"], "answer": 0, "explanation": "He describes seeing Jordan's aura, having had his poster on his door and worn his shoes as a kid, showing how completely he idolized the man in front of him."}, {"q": "Based on the passage, when Iverson said \"I don't have to respect anyone,\" he actually meant that", "choices": ["he believed Jordan's accomplishments were overrated", "veterans like Rodman and Pippen deserved to be insulted", "on the court, he would not defer to any opponent, no matter who it was", "he refused to follow the instructions of his own coaches"], "answer": 2, "explanation": "He explains that what he meant was that on the court you do not bow down to anybody, echoing Mo's line that if it is between you and me, it is me. Off the court he revered Jordan."}, {"q": "Coach Davis's comparison of Iverson to Wilt Chamberlain suggests that the league's memo was", "choices": ["a fair attempt to keep the game balanced", "backhanded evidence of how dominant and unstoppable Iverson's move was", "a punishment for Iverson's comments about Jordan", "a warning that Iverson's career would be short"], "answer": 1, "explanation": "Davis told him to take the memo as a compliment: just as the league changed rules because Chamberlain was too dominant above the rim, it was now targeting a move it could not stop."}, {"q": "It can most reasonably be inferred that the fan who yelled \"Let's go bowling\" intended to", "choices": ["taunt Iverson by reminding him of his past legal trouble", "invite Iverson to a charity event after the game", "mock the Knicks for their poor play that night", "celebrate Iverson's strong performance"], "answer": 0, "explanation": "The taunt referenced the bowling alley fight from his past; Iverson bided his time and, after sealing the win with free throws, turned the line back on the heckler."}, {"q": "In Stephen A. Smith's line about \"the mercurial guard from Georgetown,\" the word \"mercurial\" most nearly means", "choices": ["inexperienced and raw", "cautious and deliberate", "quick and unpredictable", "angry and confrontational"], "answer": 2, "explanation": "Smith wrote that it seemed as if no one was guarding Iverson, who had just dazzled the crowd with crossovers and 30 points, so the word describes his quick, unpredictable style."}, {"q": "As used in the passage, \"conceded\" most nearly means", "choices": ["denied under pressure", "complained bitterly", "predicted confidently", "admitted to be true"], "answer": 3, "explanation": "Ron Harper, who guarded Iverson in the Bulls game, conceded he was the quickest player he had seen, meaning he acknowledged it even though his team had criticized Iverson."}, {"q": "The paragraph listing the heights and weights of Ewing, Coleman, and Stackhouse primarily serves to", "choices": ["prove that the Sixers had the biggest roster in the league", "emphasize the physical mismatch Iverson faced and explain why people worried about his health", "suggest that Iverson needed to gain weight to succeed", "show why the Sixers lost to Toronto"], "answer": 1, "explanation": "By contrasting his 6-foot, 165-pound frame with players like the 7-foot, 250-pound Ewing, the passage explains why people asked how he could withstand the punishment."}, {"q": "The tone of Iverson's description of the Bulls' ring ceremony is best described as", "choices": ["awestruck", "sarcastic", "indifferent", "envious and bitter"], "answer": 0, "explanation": "He describes Jordan glowing with an aura, being unable to stop looking at him, and watching his hero receive a fourth ring, all of which convey awe rather than bitterness."}, {"q": "The author most likely includes the later story about visiting Jordan's suite in order to", "choices": ["explain why he eventually left Philadelphia", "show that Jordan never forgave him for the famous crossover", "demonstrate that his reverence for Jordan endured despite the disrespect narrative", "prove that his friends kept him from embarrassing himself"], "answer": 2, "explanation": "Years after retiring, he was praising Jordan like a fan in his suite, which undercuts the media story that he had disrespected his idol as a rookie."}, {"q": "According to the passage, what happened when Iverson returned from his shoulder injury against the Knicks in Philadelphia?", "choices": ["He aggravated the injury and left the game early", "He took a hit from Charles Oakley on the first play but finished with 26 points, 9 rebounds, and 9 assists in a win", "He wore a suit on the bench as Coach Davis had suggested", "The team doctors refused to let him enter the game"], "answer": 1, "explanation": "After begging Pat Croce, the specialist, Coach Davis, and the GM, he played forty-two minutes, shook off Oakley's first-play hit to his shoulder, and posted 26, 9, and 9 in a win."}]}, {"id": "ch35-philly-my-home", "num": "35", "part": "Part V — From the Draft to Rookie of the Year", "title": "Philly, My Home", "bank": [{"q": "Which choice best expresses the central idea of this chapter?", "choices": ["Iverson's rookie-year spending habits nearly ruined his finances", "Iverson built a life in Philadelphia on his own terms, keeping his family, friends, and personal style close despite constant criticism", "The 76ers organization forced Iverson to abandon his Virginia roots", "Iverson's friends from home prevented him from succeeding in the NBA"], "answer": 1, "explanation": "The chapter shows him buying a home for his family, defending his friends against the posse coverage, and insisting on dressing and living his own way, all framed around staying authentic."}, {"q": "According to the passage, who lived with Iverson in the house he bought in Conshohocken?", "choices": ["Tawanna and Tiaura, who moved in full-time right away", "Jerry Stackhouse and several teammates", "His mom, his two sisters, his Aunt Jessie, and his Uncles Stevie and Greg", "Only his friends from Hampton and Newport News"], "answer": 2, "explanation": "The passage lists his mom, two sisters, Aunt Jessie, and Uncles Stevie and Greg as living there, while Tawanna and Tiaura came back and forth and friends crashed there that first year."}, {"q": "According to the passage, where did the Sixers practice during Iverson's rookie year?", "choices": ["At the College of Osteopathic Medicine, off City Line Avenue", "At a large facility in Camden with whirlpools and a dining hall", "At McGonigle Hall on Temple's campus", "At the CoreStates Center"], "answer": 0, "explanation": "The passage contrasts today's huge Camden facility, which has an Iverson statue out front, with the rookie-year reality of practicing at the College of Osteopathic Medicine off City Line Avenue."}, {"q": "What does the passage reveal about the reporter Phil Jasner?", "choices": ["He was the columnist who urged Iverson to get rid of his entourage", "He fabricated the story about a fight between Iverson's and Stackhouse's friends", "He refused to interview any of Iverson's friends for his articles", "He wrote the two-page Daily News story on Iverson's friends and, five years later, was the main reporter raising \"practice\" at the press conference"], "answer": 3, "explanation": "The passage notes Jasner wrote the big posse article, interviewing Rahsaan Langford, and was the same reporter who later brought up practice; Iverson sends him love despite their friction."}, {"q": "According to the passage, which of the following describes Iverson's first signature shoe?", "choices": ["It was black and gold with a headband included in the box", "It was red and white with a blue sole and \"The Answer\" written on the bottom", "It was named The Answer, like every release that followed", "It was designed without any input from Iverson"], "answer": 1, "explanation": "The shoe, called The Question, was red and white with a blue sole, with The Answer on the bottom and the number 3 above the heel; every release after it was called The Answer."}, {"q": "Based on the passage, Iverson defended his friends so fiercely primarily because", "choices": ["he was afraid of what they might do if he cut them off", "his agent advised him that loyalty would improve his image", "he believed the media would praise him for his generosity", "they had supported him and his family during the years when he had nothing"], "answer": 3, "explanation": "He recalls that when he was in jail or barred by the NCAA from earning money, those friends kept his family's lights on, so loyalty to them was everything."}, {"q": "It can be inferred that the conversation about wearing a suit on the sideline ended differently than it would have under Coach Thompson because", "choices": ["Coach Davis, a rookie coach, could not simply dictate rules the way Thompson could", "the NBA had a rule preventing coaches from setting dress codes", "Iverson threatened to demand a trade if he was forced to wear one", "Coach Davis privately agreed that suits were bad for marketing"], "answer": 0, "explanation": "The passage says it was not like with Coach Thompson: Davis was a rookie coach and could not just say this is how it had to be, so he accepted that Iverson's style was his choice."}, {"q": "Iverson's remark that he no longer had to catch crabs off the bridge primarily highlights", "choices": ["his disappointment with the seafood in Philadelphia", "his fear that his money could disappear at any time", "how much his circumstances had changed even as he held on to comforts from childhood", "his desire to return to Virginia during the offseason"], "answer": 2, "explanation": "Eating crabs at DiNardo's was like home from his childhood, except now he could pay for them and dinner was guaranteed, underscoring how far he had come while keeping old habits."}, {"q": "Based on the passage, Reebok built The Question's launch ad around \"the real me\" because", "choices": ["focus groups showed suits and formal wear sold more shoes", "the company saw that the more critics attacked him, the more his authenticity appealed to people on the streets", "the NBA required players' ads to include biographical content", "Iverson refused to appear in any commercial at all"], "answer": 1, "explanation": "The passage says the Reebok people saw the dynamic: reporters and hecklers attacked him, he kept it authentic, and people on the streets loved it, so they sold the real him without apologies."}, {"q": "As used in the passage, \"vehemently\" most nearly means", "choices": ["privately", "sarcastically", "reluctantly", "forcefully"], "answer": 3, "explanation": "Iverson and Stackhouse vehemently denied the report of a fight between their friends, meaning they denied it in the strongest, most forceful terms."}, {"q": "As used in the passage, \"emulate\" most nearly means", "choices": ["improve upon", "secretly envy", "imitate", "compete against"], "answer": 2, "explanation": "Iverson wanted the black-sock look because of how Mike Tyson wore black boots in the ring; that was what he was trying to emulate, or copy."}, {"q": "The Charles Barkley quotation and the Inquirer's use of \"unsavory\" primarily serve to", "choices": ["show that Iverson's teammates shared the media's concerns", "prove that Iverson's friends had committed crimes in Philadelphia", "explain why Pat Croce joked about burning a house down", "illustrate how widespread the pressure was for Iverson to abandon his friends"], "answer": 3, "explanation": "Barkley's public advice and the newspaper's label are examples in a list that includes the Daily News, Washington Post, New York Times, and USA Today, showing how many voices told him to drop his friends."}, {"q": "Iverson's tone when reflecting on Phil Jasner is best described as", "choices": ["forgiving and respectful despite past friction", "coldly indifferent", "openly hostile and accusatory", "mocking and dismissive"], "answer": 0, "explanation": "Although they did not always get along, Iverson says he has nothing but love to send Jasner's way and acknowledges the reporter was doing his job."}, {"q": "The author most likely includes the paragraphs about his oversized clothes and tapered pants in order to", "choices": ["admit that his fashion choices were a calculated marketing strategy", "show that his style came from home and personal comfort rather than an attempt to make a statement", "explain why the NBA eventually created a dress code", "prove that he spent less on clothing than his teammates did"], "answer": 1, "explanation": "He says he was just dressing the way people back home dressed and wearing what he felt best expressed himself, explicitly stating he was not trying to make any statement."}, {"q": "According to the passage, what did Iverson do with his cars during his rookie year?", "choices": ["He sold the Lexus to help pay his family's bills", "He traded the Mercedes for a Rolls-Royce", "He returned the Jaguar to the dealership after the parade", "He bought himself a new Range Rover in December and gave the Lexus he had been driving to his aunt"], "answer": 3, "explanation": "After getting his mom the red Jaguar she had wished for, he bought a new Range Rover that December and passed his Lexus along to his aunt."}]}, {"id": "ch36-winning-and-losing", "num": "36", "part": "Part V — From the Draft to Rookie of the Year", "title": "Winning and Losing", "bank": [{"q": "Which choice best describes the central tension of the chapter?", "choices": ["Iverson's desire to be traded conflicts with the Sixers' plans to keep him.", "While the Sixers suffer through historic losing and Iverson faces mounting criticism, his personal life feels better than it ever has.", "Iverson's shoulder injury threatens to end his rookie season before the All-Star break.", "Iverson's teammates blame him for the losing streak, and he struggles to win them back."], "answer": 1, "explanation": "Iverson describes losing 23 of 24 games and constant criticism, yet says his life 'was better than it ever had been'—he was out of jail, in the NBA, and his family was taken care of. The chapter turns on that contrast."}, {"q": "According to the passage, what was the Sixers' record after their first fifteen games?", "choices": ["12-3", "8-7", "7-8", "4-11"], "answer": 2, "explanation": "The chapter opens by noting the team was 7-8 after fifteen games, which was not great but a big improvement for the Sixers."}, {"q": "At its worst, the losing stretch in December and January saw the Sixers lose:", "choices": ["23 of 24 games", "24 games in a row", "16 of 20 games", "every home game while winning on the road"], "answer": 0, "explanation": "Iverson says that at its worst the team lost 23 of 24 games, losing 'every way imaginable'—overtime losses, blowouts, and a six-game losing streak on a Christmas road trip."}, {"q": "Why did Iverson withdraw from the slam-dunk contest?", "choices": ["The coaches ordered him to rest for the playoff push.", "He was never actually selected to participate.", "He chose to focus his energy on the rookie game instead.", "His shoulder injury forced him to pull out."], "answer": 3, "explanation": "Iverson was invited to both the rookie game and the slam-dunk contest, but he says his shoulder injury meant he had to withdraw from the dunk contest."}, {"q": "How many of the fifty greatest players of all time attended the anniversary celebration at All-Star Weekend?", "choices": ["All fifty", "Forty-seven", "Forty-five", "Thirty-seven"], "answer": 1, "explanation": "The passage states that forty-seven of the fifty attended, each wearing an official blazer with the NBA logo and his team's logo on the lapel."}, {"q": "Iverson points out that Charles Barkley wore the Sixers logo on his blazer most likely to suggest that:", "choices": ["Barkley's claim that he loved Philadelphia was genuine.", "Barkley regretted ever playing for the Rockets.", "Barkley intended to return to Philadelphia as a coach.", "the league required players to wear their first team's logo."], "answer": 0, "explanation": "During their heart-to-heart, Barkley said he loved Philly, and Iverson notes he chose the Sixers logo over the Suns or his current team, the Rockets—behavior that backed up Barkley's words."}, {"q": "The louder boos during the MVP trophy presentation led Iverson to conclude that:", "choices": ["the fans wanted the rookie game replayed.", "Cleveland fans booed every East player equally.", "the crowd's hostility was aimed at him personally, not at how he played.", "his unselfish play had gone completely unnoticed by his teammates."], "answer": 2, "explanation": "Iverson had played unselfishly, led his team in assists, and won—yet the boos got louder. He says, 'That's when I knew it wasn't my game that made them so mad.'"}, {"q": "Why did Iverson make a point of setting up his teammates during the rookie game?", "choices": ["His coach ordered him to pass on every possession.", "His injured shoulder made shooting nearly impossible.", "He was conserving energy for the dunk contest later that night.", "He wanted to leave critics nothing to say about his game, even if they attacked his style and friends."], "answer": 3, "explanation": "Iverson says he was determined to set up his teammates: 'Maybe they could complain about my style, my friends, but I wasn't going to let them complain about my game.'"}, {"q": "The passage suggests that Iverson's decision to wear cornrows was:", "choices": ["both a practical solution to a road-trip problem and an expression of where he came from.", "a marketing plan developed by Reebok executives.", "an attempt to copy a style Latrell Sprewell had made popular.", "a protest he planned against the league's veteran players."], "answer": 0, "explanation": "Iverson explains that people back home had started wearing braids and that he was tired of barbers ruining his fade on long road trips. He was the first NBA player to wear cornrows; Sprewell followed later."}, {"q": "The passage says the league was 'putting them on the pedestal they deserved.' As used here, 'pedestal' most nearly means:", "choices": ["a place of retirement", "a physical platform at midcourt", "a position of public honor", "a team of former rivals"], "answer": 2, "explanation": "The fifty greatest players were being celebrated and elevated as legends at the anniversary event, so 'pedestal' refers to a position of high public honor."}, {"q": "In 'We built a fifteenpoint cushion,' the word 'cushion' most nearly means:", "choices": ["a soft landing", "a comfortable lead", "a rest on the bench", "a scoring average"], "answer": 1, "explanation": "Iverson is describing the East team going up by fifteen points in the rookie game, so 'cushion' means a comfortable lead over the opponent."}, {"q": "The series of questions beginning 'Maybe it was my style...' mainly serves to:", "choices": ["admit that Iverson never understood basketball tradition.", "show that Iverson blamed his friends for the negative coverage.", "prove that his shoe deal was the single cause of the criticism.", "suggest the hostility toward him had many possible sources, none of which he would apologize for."], "answer": 3, "explanation": "Iverson lists his style, his friends, his game, his past, and his shoe deal as possible reasons people disliked what he represented, then concludes it was maybe 'all those things and me making no apologies.'"}, {"q": "Iverson's tone when describing the losing streak ('We lost every way imaginable') is best described as:", "choices": ["weary and exasperated", "indifferent and detached", "lighthearted and amused", "hopeful and upbeat"], "answer": 0, "explanation": "He calls the stretch a dark period in which the team 'went through hell,' listing overtime losses, blowouts, and injuries — language that conveys exhaustion and frustration."}, {"q": "The author includes David Stern's comments from Meet the Press primarily to show that:", "choices": ["Stern opposed the way Iverson dressed off the court.", "even the league's commissioner pushed back on Barkley's criticism of Iverson.", "Stern wanted Barkley to retire from the league.", "Stern had created the rookie pay scale that limited Iverson's salary."], "answer": 1, "explanation": "Stern questioned whether Barkley should act as an 'elder statesman' given his own youth, and Iverson says, 'He had my back that day'—the quote shows the commissioner defending him."}, {"q": "In the rookie game, Iverson finished with:", "choices": ["31 points and 4 assists", "23 points and 14 assists", "25 points and 9 assists", "19 points and a team-high 9 assists"], "answer": 3, "explanation": "Iverson shot only 11 times, scored 19 points, and led his team with 9 assists on the way to winning MVP. The 23-and-14 and 25-and-9 lines came in the two Sixers wins before the break."}]}, {"id": "ch37-more-losses-and-tragedy", "num": "37", "part": "Part V — From the Draft to Rookie of the Year", "title": "More Losses and Tragedy", "bank": [{"q": "Which choice best states the main idea of the chapter?", "choices": ["Iverson's feud with Cleveland fans defined the second half of his rookie season.", "Reebok's marketing campaign for The Question failed because of Iverson's negative press.", "Even as losses and negative press continued, Iverson's life felt like a dream—until the death of his friend Biggie cut through it.", "Iverson decided to stop speaking to the media permanently after the All-Star break."], "answer": 2, "explanation": "The chapter moves between continued losing and criticism, the dream-like release of his shoe and friendship with Biggie, and ends with Biggie's death, which crushed him."}, {"q": "At the press gathering held at a Reebok event, reporters shifted the conversation to:", "choices": ["rumors that Iverson owned a gun.", "his chances of winning Rookie of the Year.", "Johnny Davis's job security.", "the release date of his signature shoe."], "answer": 0, "explanation": "Iverson tried to turn the narrative around by expressing respect for the legends, but reporters instead asked about rumors that he owned a gun, which he confirmed, saying he had to protect himself."}, {"q": "After Pat Croce persuaded him to speak with reporters again, Iverson agreed on the condition that:", "choices": ["interviews would happen only after wins.", "Croce would sit in on every interview.", "reporters would apologize for their earlier stories.", "he would answer only questions about basketball."], "answer": 3, "explanation": "Iverson says he 'took one from the Coach Thompson playbook' and agreed to talk, but only about basketball, and he handled the media that way for the rest of the season."}, {"q": "According to the passage, where did Iverson first meet Biggie?", "choices": ["At a Reebok event in Philadelphia", "At Rucker Park in Harlem", "At a recording studio in New York", "In Los Angeles after a Sixers game"], "answer": 1, "explanation": "Iverson went to play at Rucker Park before the draft, and that is when he first met Biggie and Lil' Cease. The studio visit and the Los Angeles meeting came later."}, {"q": "The March 9 game in Washington mattered to Iverson because:", "choices": ["it was his first game against Michael Jordan.", "the Sixers could clinch a playoff spot with a win.", "the arena was the closest one to Newport News and Hampton, making the game a homecoming.", "Biggie had promised to attend the game."], "answer": 2, "explanation": "Iverson had missed the earlier game in DC, so this was his chance to play in front of everyone from home—the USAir Arena was as close as any NBA arena to Newport News and Hampton."}, {"q": "When Iverson parked his car to watch a kid wearing the Questions, the moment mattered to him because:", "choices": ["he saw his own past in the kid and realized how far he had come.", "he worried the shoes on the street were counterfeit.", "he wanted to confirm that Reebok's marketing was working.", "he planned to stop and give the kid a second pair."], "answer": 0, "explanation": "Watching the kid in his rearview mirror, Iverson thinks, 'It might as well have been me,' and counts off how few years separated him from jail, hustling, and hoping his name was on a list at Bethel."}, {"q": "Iverson's mother responds to his fear that 'something bad is going to happen' by:", "choices": ["agreeing that his good luck would soon run out.", "telling him that good times are a blessing and he should not live in fear of them.", "warning him to save his money in case things went wrong.", "reminding him to keep his focus on basketball."], "answer": 1, "explanation": "She tells him never to live like that, that things going well is part of being blessed, and that he should not jinx himself by expecting something bad."}, {"q": "Based on the passage, Biggie's death hit Iverson especially hard because:", "choices": ["it was the first death Iverson had ever experienced.", "Iverson blamed himself for staying out late that night.", "the Sixers refused to postpone the game the next day.", "Biggie, like Iverson, had made it out of a dangerous life, yet was killed anyway."], "answer": 3, "explanation": "Iverson says he was sadly used to death from his youth, but that when someone gets out, as Biggie had and as he himself had, 'and it still goes that way,' it shook him deeply."}, {"q": "The passage says the gun story became 'the new focal point.' As used here, 'focal point' most nearly means:", "choices": ["center of attention", "final decision", "hidden motive", "point of agreement"], "answer": 0, "explanation": "The reporters' coverage now centered on the gun story, so 'focal point' means the main center of attention in the stories about him."}, {"q": "Iverson describes 'trying to turn the narrative around.' As used here, 'narrative' most nearly means:", "choices": ["the interview schedule", "the team's game plan", "the story being told about him", "the shoe campaign's slogan"], "answer": 2, "explanation": "Iverson held the press gathering to change the ongoing story the media was telling about him, so 'narrative' refers to that public story."}, {"q": "The chapter's final detail—that Biggie wears the Questions in the 'Hypnotize' video—serves mainly to:", "choices": ["prove that the shoes had sold out nationwide.", "show that the video was filmed before the two men met.", "criticize the record label for releasing the video too soon.", "create a bittersweet, lasting link between Iverson and his friend."], "answer": 3, "explanation": "After describing what Biggie never lived to see, Iverson closes by noting that in the video Biggie is wearing his shoes—a final, bittersweet connection between the two."}, {"q": "The paragraph counting the years ('a year removed... Three years removed from jail...') mainly emphasizes:", "choices": ["how long Iverson's sentence had originally been.", "how quickly and completely Iverson's life had changed.", "how far Bethel High was from Philadelphia.", "how many teams had scouted Iverson in high school."], "answer": 1, "explanation": "By stacking up the short spans of time between hustling, jail, high school, and riding in a Benz watching a kid wear his shoes, Iverson stresses how fast his life transformed."}, {"q": "According to the passage, why did Biggie come to see Iverson in Los Angeles?", "choices": ["He wanted to get a pair of the Questions.", "He wanted to invite Iverson to a recording session.", "He wanted to warn Iverson about the media.", "He wanted Iverson to appear in a music video."], "answer": 0, "explanation": "Biggie showed up after a game and said, 'I came to see you. I need to get me the Questions.' Iverson promised to get him the shoes, and they spent the night hanging out."}, {"q": "Iverson's remark that he was 'used to' death suggests that:", "choices": ["he no longer felt grief of any kind.", "he avoided funerals whenever he could.", "he expected reporters to ask him about it.", "he had lost so many people from home that violent death no longer surprised him."], "answer": 3, "explanation": "He mentions Tony Clark and 'too many others to count' among people he had seen killed, calling it messed up that he had grown used to it—yet Biggie's death still shook him."}, {"q": "Iverson's tone in describing the stretch after the All-Star break ('it almost felt like I had lost my legs') is best described as:", "choices": ["defiant", "discouraged", "amused", "relieved"], "answer": 1, "explanation": "He describes shooting terribly, teammates missing shots, and feeling like the team had reentered the 23-of-24 losing stretch—language that conveys discouragement."}]}, {"id": "ch38-breaking-records", "num": "38", "part": "Part V — From the Draft to Rookie of the Year", "title": "Breaking Records", "bank": [{"q": "Which choice best describes the central idea of the chapter?", "choices": ["The Sixers' late-season surge nearly earned them a playoff spot.", "Iverson responded to criticism, losing, and grief by pouring everything into his game, producing record performances even as the losses continued.", "Iverson's rivalry with Stephon Marbury dominated the end of his rookie year.", "Coach Davis's new strategies transformed the Sixers into a winning team."], "answer": 1, "explanation": "Iverson says he moved the 'baggage to the side' and put his game first, leading to the crossover on Jordan and five straight 40-point games—all while the team kept losing on its way to 22-60."}, {"q": "Just before the famous crossover, Iverson heard Phil Jackson yell:", "choices": ["'Get back on defense!'", "'Watch the crossover!'", "'Switch back, Scottie!'", "'Michael! Get up on him!'"], "answer": 3, "explanation": "After the switch left Jordan guarding him, Iverson remembers hearing Phil Jackson shout, 'Michael! Get up on him!'—and then he went to his move."}, {"q": "In the Bulls game where he crossed over Jordan, Iverson played only thirty-six minutes because:", "choices": ["he got into foul trouble.", "his shoulder injury flared up again.", "Coach Davis rested him for the next game.", "the game was a blowout by halftime."], "answer": 0, "explanation": "Iverson admits the only problem that night was foul trouble; he picked up his fourth foul seconds after the crossover and had to sit the rest of the third quarter."}, {"q": "Which player led the Bulls with 31 points in that game?", "choices": ["Michael Jordan", "Dennis Rodman", "Scottie Pippen", "Bill Wennington"], "answer": 2, "explanation": "Iverson says Scottie was the one who killed them, making everything and scoring 31, while Rodman controlled the inside with 17 rebounds."}, {"q": "Of Iverson's 50 points in Cleveland, how many came in the second half?", "choices": ["11", "23", "31", "39"], "answer": 3, "explanation": "Iverson had just 11 points at halftime, then exploded after the break; 39 of his 50 points came in the second half."}, {"q": "The detail that Elvin Hayes was 'the man who'd criticized my game for being too selfish' adds a sense of:", "choices": ["gratitude toward an early mentor.", "irony, since Iverson matched a rookie scoring feat last done by one of his critics.", "doubt about whether the record was real.", "sympathy for the older generation of players."], "answer": 1, "explanation": "Iverson became the first rookie with back-to-back 40-point games since Elvin Hayes—the same legend who had attacked his style of play—an irony the parenthetical remark highlights."}, {"q": "The final streak game against the Bullets 'didn't feel great' to Iverson most likely because:", "choices": ["the record-extending basket came in a lopsided loss, on a play set up just to keep the stat alive.", "the crowd booed Coach Davis's timeouts.", "Coach Davis refused to run any plays for him.", "he fell short of 40 points despite the extra chances."], "answer": 0, "explanation": "The Sixers were getting blown out when Coach Davis called timeouts to run plays for him, and the Bullets did not contest the three. Iverson says even Stack was mad the streak had become the main thing."}, {"q": "The Cleveland crowd's reaction at the end of the 50-point game suggests that:", "choices": ["Cleveland fans always cheered for opposing rookies.", "the fans believed the Sixers would make the playoffs.", "relentless effort could win over even fans who had booed him all season.", "the crowd wanted Iverson traded to their team."], "answer": 2, "explanation": "The same fans who booed him at introductions gradually stopped heckling, started cheering, and finally stood as he left the court—won over by how hard he played in a lost season."}, {"q": "Jordan's question—'Was I a one-man offense like that when I was a rookie?'—functions in the passage as:", "choices": ["proof that Jordan wanted the Bulls to sign Iverson.", "a sign that even Jordan took notice of Iverson's play.", "evidence that Jordan mocked every rookie he faced.", "a warning to reporters not to praise Iverson."], "answer": 1, "explanation": "The image of Jordan shaking his head on the bench and asking reporters that question shows the league's greatest player acknowledging Iverson's 44-point, full-throttle performance."}, {"q": "Iverson says, 'Our team was decimated.' As used here, 'decimated' most nearly means:", "choices": ["severely depleted", "newly assembled", "poorly coached", "unfairly criticized"], "answer": 0, "explanation": "With Coleman out for the last month, Williams out, and only nine players dressing for some games, the roster was drastically thinned out—'decimated' describes that depletion."}, {"q": "Iverson says he didn't 'realize the gravity' of the crossover until afterward. As used here, 'gravity' most nearly means:", "choices": ["danger", "pull", "sadness", "significance"], "answer": 3, "explanation": "He was 'just playing basketball that night' and only understood how important the moment was once ESPN replayed it and everyone back home celebrated—'gravity' means its significance."}, {"q": "The sentence 'I got the GOAT' conveys a tone of:", "choices": ["bitter sarcasm", "quiet relief", "triumphant pride", "playful embarrassment"], "answer": 2, "explanation": "Coming as all of Newport News and Hampton celebrated the crossover on the greatest player ever, the line expresses proud triumph at what he had just done."}, {"q": "The sentence 'I hit him with my best move, and he still almost blocked it' serves mainly to:", "choices": ["underline Jordan's greatness even in the moment Iverson beat him.", "suggest the crossover was overrated by fans.", "explain why the referees called a foul on the play.", "show that Iverson's shot barely counted."], "answer": 0, "explanation": "Iverson frames the detail as proof of 'how bad and how great Mike was'—Jordan recovered quickly enough to contest the shot even after being crossed over."}, {"q": "How did the Sixers' season end?", "choices": ["With a five-game winning streak that came too late", "At 22-60, with the coach fired but the general manager kept on", "At 31-51, with Coach Davis returning the next season", "At 22 wins and 60 losses, with Johnny Davis and Brad Greenberg fired a day later"], "answer": 3, "explanation": "The team finished 22-60, and Pat fired both Johnny Davis and Brad Greenberg the day after the season ended. Iverson headed home for his first summer rich and with time off."}, {"q": "By the end of the season, Iverson says he 'embraced' his way of being. As described in the chapter, this meant:", "choices": ["apologizing to basketball traditionalists and toning down his style.", "playing all-out and chasing personal goals on the court while sticking with his friends and his style off it.", "separating his basketball life completely from his life back home.", "letting his coaches decide how he should present himself in public."], "answer": 1, "explanation": "Iverson says he embraced putting on a show and taking on personal goals on the court while sticking with his friends and expressing himself through his style off it, even though it made him a target."}]}, {"id": "ch39-back-to-the-courtroom", "num": "39", "part": "Part V — From the Draft to Rookie of the Year", "title": "Back to the Courtroom", "bank": [{"q": "Which statement best expresses the central idea of this chapter?", "choices": ["Iverson regretted bringing his friends and family to an official NBA press conference.", "Iverson cared more about his father's trial than about winning Rookie of the Year.", "Iverson's greatest professional honor arrived side by side with a painful family crisis, revealing where his loyalty lay.", "The NBA punished Iverson for refusing to wear a suit at his award ceremony."], "answer": 2, "explanation": "The chapter deliberately pairs the Rookie of the Year announcement with his father's trial the very next day, and closes with Iverson explaining that his loyalty still belonged to his home, friends, and family."}, {"q": "According to the chapter, why was a man from the 76ers searching Iverson's Virginia neighborhoods?", "choices": ["The team wanted to discuss a trade before the news leaked.", "The team suspected Iverson was in legal trouble again.", "The team needed him
