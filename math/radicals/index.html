<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra 1 — Skills Drill</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root {
  --blue:#4A7FE5; --green:#2A9E6B; --red:#D94F4F; --amber:#C07010;
  --bg:#F5F4F0; --card:#FFFFFF; --text:#1a1a1a; --muted:#666;
  --border:rgba(0,0,0,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;}
#app{width:100%;max-width:640px;}
.header{text-align:center;margin-bottom:16px;}
.header h1{font-size:20px;font-weight:600;color:var(--text);}
.header p{font-size:13px;color:var(--muted);margin-top:3px;}
.progress-outer{background:rgba(0,0,0,0.08);border-radius:999px;height:6px;margin:10px 0;}
.progress-inner{background:var(--blue);border-radius:999px;height:6px;transition:width 0.3s;}
.q-counter{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;
  border-radius:999px;background:#EEF2FF;color:#4A7FE5;margin-bottom:14px;}
.weak-badge{background:#FFF4E5;color:#C07010;}
.card{background:var(--card);border-radius:16px;padding:24px 22px;
  border:0.5px solid var(--border);margin-bottom:16px;}
.question{font-size:24px;text-align:center;padding:14px 0 18px;
  min-height:75px;display:flex;align-items:center;justify-content:center;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cbtn{background:#F8F7F4;border:1.5px solid rgba(0,0,0,0.1);border-radius:12px;
  padding:14px 10px;font-size:18px;cursor:pointer;min-height:68px;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.12s,border-color 0.12s;-webkit-tap-highlight-color:transparent;
  line-height:1.3;}
.cbtn:active{background:#EEECEA;}
.cbtn.correct{background:#EAF7F0;border-color:var(--green);color:var(--green);}
.cbtn.wrong  {background:#FDEFEF;border-color:var(--red);  color:var(--red);}
.cbtn.reveal {background:#EAF7F0;border-color:var(--green);color:var(--green);}
.cbtn:disabled{cursor:default;}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;}
.feedback.correct{background:#EAF7F0;color:#1A6644;}
.feedback.wrong  {background:#FDEFEF;color:#8B2020;}
.key-rule{margin-top:10px;padding:11px 13px;background:#FFF8E5;
  border-left:3px solid #C07010;border-radius:6px;font-size:13px;
  color:#7A4D00;line-height:1.55;}
.key-rule .label{display:block;font-size:10.5px;font-weight:700;
  letter-spacing:0.05em;color:#C07010;margin-bottom:4px;text-transform:uppercase;}
.next-btn{width:100%;background:var(--blue);color:#fff;border:none;
  border-radius:12px;padding:16px;font-size:17px;font-weight:500;
  cursor:pointer;margin-top:12px;-webkit-tap-highlight-color:transparent;}
.next-btn:active{opacity:.85;}

/* Score screen */
.score-card{background:var(--card);border-radius:16px;padding:32px 22px;
  border:0.5px solid var(--border);margin-bottom:12px;}
.score-big{font-size:64px;font-weight:700;color:var(--blue);line-height:1;}
.score-sub{font-size:14px;color:var(--muted);margin-top:4px;}
.score-msg{font-size:19px;font-weight:600;margin:14px 0 4px;color:var(--text);}
.breakdown-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px;}
.breakdown-table th{text-align:left;padding:4px 6px;color:var(--muted);
  font-weight:500;border-bottom:0.5px solid var(--border);}
.breakdown-table td{padding:7px 6px;border-bottom:0.5px solid var(--border);}
.bar-wrap{background:rgba(0,0,0,0.07);border-radius:4px;height:6px;
  width:80px;display:inline-block;vertical-align:middle;}
.bar-fill{height:6px;border-radius:4px;}
.tag-weak{font-size:10px;padding:2px 6px;border-radius:999px;
  background:#FFF4E5;color:#C07010;font-weight:500;margin-left:4px;}
.tag-good{font-size:10px;padding:2px 6px;border-radius:999px;
  background:#EAF7F0;color:#1A6644;font-weight:500;margin-left:4px;}
.session-btn{width:100%;background:var(--blue);color:#fff;border:none;
  border-radius:12px;padding:16px;font-size:17px;font-weight:500;
  cursor:pointer;margin-top:16px;-webkit-tap-highlight-color:transparent;}
.reset-btn{background:none;color:var(--muted);border:0.5px solid var(--border);
  border-radius:12px;padding:11px 24px;font-size:14px;cursor:pointer;
  margin-top:8px;width:100%;}
.status-msg{font-size:12px;color:var(--muted);text-align:center;
  margin-top:8px;min-height:18px;}
.start-screen{background:var(--card);border-radius:16px;padding:36px 24px;
  text-align:center;border:0.5px solid var(--border);}

/* Handwriting canvas */
.work-area{margin:6px 0 14px;}
.work-header{display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.05em;font-weight:600;margin-bottom:6px;padding:0 2px;}
.work-clear{background:none;border:0.5px solid var(--border);
  border-radius:8px;padding:3px 10px;font-size:11px;color:var(--muted);
  cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;
  -webkit-tap-highlight-color:transparent;}
.work-clear:active{background:#EEECEA;}
.work-canvas{display:block;width:100%;height:200px;background:#FAFAF7;
  border:0.5px dashed rgba(0,0,0,0.18);border-radius:10px;
  touch-action:none;cursor:crosshair;}
.work-canvas.disabled{opacity:0.7;cursor:default;}
.reveal-btn{width:100%;background:#F0F0EC;color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:14px;
  font-size:15px;font-weight:500;cursor:pointer;margin-top:10px;
  -webkit-tap-highlight-color:transparent;}
.reveal-btn:active{background:#E5E5DF;}
.reveal-hint{font-size:11.5px;color:var(--muted);text-align:center;
  margin-top:6px;font-style:italic;}
.reveal-btn:disabled{cursor:default;opacity:0.7;}
.reveal-btn .reveal-spinner{display:inline-block;
  animation:reveal-pulse 1.5s ease-in-out infinite;margin-right:6px;}
@keyframes reveal-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* Gate-block: shown when Claude rejects the canvas as not-real-work */
.gate-block{background:#FFF4E5;color:#7A4D00;
  border-left:3px solid #C07010;border-radius:8px;
  padding:11px 13px;margin:10px 0 0;font-size:13.5px;line-height:1.55;}
.gate-block .gate-label{display:block;font-size:10.5px;font-weight:700;
  letter-spacing:0.05em;color:#C07010;margin-bottom:3px;text-transform:uppercase;}

/* AI inline-analysis block: appears below Key Rule after wrong answers */
.ai-analysis-pending,.ai-analysis-loaded{margin-top:10px;
  padding:12px 14px;background:#F0F4FF;border-left:3px solid #4A7FE5;
  border-radius:8px;font-size:13px;line-height:1.55;color:#1a1a1a;}
.ai-analysis-pending{display:flex;align-items:center;gap:8px;color:#2A4A8A;
  font-style:italic;}
.ai-analysis-pending .ai-spinner{animation:reveal-pulse 1.5s ease-in-out infinite;}
.ai-section{margin-bottom:8px;}
.ai-section:last-child{margin-bottom:0;}
.ai-label{display:block;font-size:10.5px;font-weight:700;
  color:#4A7FE5;text-transform:uppercase;letter-spacing:0.05em;
  margin-bottom:3px;}
.ai-body{font-size:13px;line-height:1.55;color:#1a1a1a;margin:0;}
.start-screen h2{font-size:22px;font-weight:600;margin-bottom:8px;}
.start-screen p{font-size:15px;color:var(--muted);margin-bottom:6px;line-height:1.6;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0;}
.pill{font-size:12px;padding:4px 12px;border-radius:999px;
  background:#EEF2FF;color:#4A7FE5;font-weight:500;}
.accuracy-row{display:flex;align-items:center;gap:8px;
  font-size:13px;padding:5px 0;border-bottom:0.5px solid var(--border);}
.accuracy-label{flex:1;color:var(--text);}
.accuracy-stat{color:var(--muted);min-width:50px;text-align:right;}

/* ── Learn mode ─────────────────────────────────────────────────────────── */
.learn-card-cta{background:var(--card);border-radius:14px;padding:14px 16px;
  border:0.5px solid var(--border);margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;
  width:100%;-webkit-tap-highlight-color:transparent;}
.learn-card-cta:active{background:#FAFAF7;}
.learn-card-cta .icon{font-size:22px;flex-shrink:0;}
.learn-card-cta .body{flex:1;min-width:0;}
.learn-card-cta .body strong{display:block;font-size:14.5px;
  font-weight:600;color:var(--text);}
.learn-card-cta .body span{display:block;font-size:12px;
  color:var(--muted);line-height:1.45;margin-top:2px;}
.learn-card-cta .arrow{color:var(--blue);font-size:20px;flex-shrink:0;}
.section-label{font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;
  margin:18px 0 8px;text-align:left;}
.concept-list{display:flex;flex-direction:column;gap:6px;
  margin-bottom:6px;}
.concept-card{background:var(--card);border-radius:10px;
  padding:10px 14px;border:0.5px solid var(--border);
  display:flex;align-items:center;gap:10px;font-size:13.5px;text-align:left;}
.concept-active{flex-direction:column;align-items:stretch;gap:6px;}
.concept-active .cc-row{display:flex;align-items:center;justify-content:space-between;}
.cc-name{font-weight:500;color:var(--text);flex:1;}
.cc-bar{background:rgba(0,0,0,0.07);border-radius:4px;height:5px;overflow:hidden;}
.cc-bar-fill{height:5px;border-radius:4px;}
.cstat{font-size:13px;font-weight:600;}
.cstat-empty{font-size:12px;color:var(--muted);font-style:italic;}
.cstat-sub{font-size:11.5px;color:var(--muted);margin-left:auto;}
.concept-passed{background:#F1F8F2;border-color:#CFE6D6;}
.concept-passed .cc-name{color:#1A6644;}
.cc-check{color:var(--green);font-weight:700;flex-shrink:0;}
.retention-note{font-size:11.5px;color:var(--muted);
  text-align:center;margin:6px 0 0;font-style:italic;min-height:14px;}
.promo-banner{
  background:linear-gradient(135deg,#2A9E6B,#4A7FE5);
  color:#fff;border-radius:16px;padding:22px 22px 20px;
  margin-bottom:14px;text-align:center;
  box-shadow:0 4px 14px rgba(74,127,229,0.18);
}
.promo-icon{font-size:46px;line-height:1;margin-bottom:6px;}
.promo-title{font-size:21px;font-weight:600;margin-bottom:8px;}
.promo-body{font-size:13.5px;line-height:1.55;opacity:0.95;}
.pinned-rule{background:#FFF8E5;border-left:3px solid #C07010;
  border-radius:6px;padding:10px 13px;margin-bottom:14px;
  font-size:13px;color:#7A4D00;line-height:1.55;}
.pinned-rule .label{display:block;font-size:10.5px;font-weight:700;
  letter-spacing:0.05em;color:#C07010;margin-bottom:4px;text-transform:uppercase;}
.learn-intro{font-size:14.5px;line-height:1.6;color:var(--text);
  padding:6px 2px 14px;}
.example-title{font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.05em;font-weight:600;margin-bottom:6px;}
.example-problem{font-size:22px;text-align:center;padding:10px 0 6px;}
.box-katex{
  background:#FAFAF7;border-radius:10px;
  padding:18px 14px;margin:12px 0;
  text-align:center;overflow-x:auto;
}
.box-katex .katex{font-size:1.05em;}
.lv-step{
  border-radius:3px;padding:1px 2px;
  transition:background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.lv-step.highlighted{
  background:#FFE680;color:#5A3A00;
  box-shadow:0 0 0 1px #C07010;
}
.lv-step.flash{animation:lv-flash 0.6s ease-out;}
@keyframes lv-flash{
  0%   {background:#FFD24D;}
  100% {background:#FFE680;}
}
.focus-card{
  background:#F4F8FF;border:1px solid #C9DAF7;border-radius:10px;
  padding:14px 16px;margin:10px 0 14px;min-height:64px;
  text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background 0.25s ease, border-color 0.25s ease;
}
.focus-card.focus-card-active{background:#FFF7E0;border-color:#F0D78A;color:var(--text);}
.focus-card.flash{animation:focus-flash 0.6s ease-out;}
@keyframes focus-flash{
  0%   {background:#FFD24D;}
  100% {background:#FFF7E0;}
}
.focus-card-name{font-size:12px;font-weight:600;color:#C07010;
  text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
.focus-card-math{font-size:17px;color:var(--text);}
.focus-hint{font-size:12.5px;color:var(--muted);font-style:italic;}
.learn-steps{margin:10px 0 6px;display:flex;flex-direction:column;gap:6px;}
.learn-step-clickable{
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:10px;
  width:100%;
  text-align:left;
  cursor:pointer;
  padding:10px 14px;
  display:flex;flex-direction:column;gap:4px;
  font-family:inherit;color:var(--text);
  -webkit-tap-highlight-color:transparent;
  transition:background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.learn-step-clickable:hover{background:#FAFAF7;}
.learn-step-clickable.active{
  background:#FFF7E0;border-color:#F0D78A;
  box-shadow:0 0 0 2px rgba(192,112,16,0.15);
}
.learn-step-name{
  font-size:12px;font-weight:600;color:#C07010;
  text-transform:uppercase;letter-spacing:0.04em;
}
.learn-step-math{font-size:14px;color:var(--text);}
.learn-result{background:#EAF7F0;border-radius:8px;padding:14px;
  margin:14px 0 4px;font-size:16px;text-align:center;color:#1A6644;
  border:1px solid #B6E2C8;}
.learn-nav{display:flex;gap:10px;margin-top:8px;}
.learn-nav-btn{flex:1;padding:14px;border-radius:12px;font-size:15px;
  font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;}
.learn-prev{background:#F0F0EC;color:var(--text);border:1px solid var(--border);}
.learn-prev:disabled{opacity:0.4;cursor:not-allowed;}
.learn-next{background:var(--blue);color:#fff;}
.learn-back{background:none;color:var(--muted);border:0.5px solid var(--border);
  border-radius:12px;padding:11px 24px;font-size:14px;cursor:pointer;
  margin-top:8px;width:100%;}
.streak-row{display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:12.5px;color:var(--muted);margin:6px 0 10px;}
.streak-dot{display:inline-block;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(0,0,0,0.15);background:transparent;}
.streak-dot.filled{background:var(--green);border-color:var(--green);}
.mastery-screen{text-align:center;padding:42px 22px 28px;background:var(--card);
  border-radius:16px;border:0.5px solid var(--border);margin-bottom:14px;}
.mastery-icon{font-size:54px;margin-bottom:8px;line-height:1;}
.mastery-title{font-size:22px;font-weight:600;color:var(--green);margin-bottom:8px;}
.mastery-sub{font-size:14px;color:var(--muted);line-height:1.55;
  max-width:340px;margin:0 auto;}
</style>
</head>

{c:"Factor First",
 q:"\\dfrac{16m^4}{12m^2}\\cdot\\left(m^{-2}\\right)^3", a:"\\tfrac{4}{3m^4}",
 ch:["\\tfrac{4}{3m^4}","\\tfrac{4m^4}{3}","\\tfrac{4m^2}{3}","\\tfrac{4}{3m^2}"],

{c:"Factor First",

{c:"Divide Monomials",

// ── Concept 18: Applied Quadratics — Area (8) ───────────────────────────────
// Added 2026-05-14: word problems where a shape has polynomial dimensions
// and the area is given. Mix of rectangles (A=L·W) and triangles (A=½·b·h).
{c:"Applied Quadratics — Area",
 attrs:["translate-word-to-equation","rectangle-area","factor-trinomial","reject-negative-dimension"],
 q:"The area of a rectangle is 16\\text{ sq m}. Its length is (x+5) and its width is (x-1). Find the dimensions.",
 a:"\\text{Width }=2\\text{ m},\\ \\text{Length }=8\\text{ m}",
 ch:[
   {l:"\\text{Width }=2,\\ \\text{Length }=8", ok:true},
   {l:"x=3", miss:"gave-x-instead-of-dimension"},
   {l:"x=3\\text{ and }x=-7", miss:"picked-both-roots"},
   {l:"\\text{Width }=-8,\\ \\text{Length }=-2", miss:"picked-negative-dimension"}
 ],
 h:"(x+5)(x-1)=16 \\Rightarrow x^2+4x-5=16 \\Rightarrow x^2+4x-21=0 \\Rightarrow (x+7)(x-3)=0 \\Rightarrow x=3.\\ \\text{Width}=x-1=2,\\ \\text{Length}=x+5=8."},

 ],

const PROMO_MIN_QUESTIONS = 10;

// Returns the list of concepts that just crossed the mastery threshold,
// and mutates ST.mastered in place. Caller is responsible for save() + UI.
function checkPromotions() {
  const learned  = new Set(ST.learnedConcepts);
  const mastered = new Set(ST.mastered || []);
  const promoted = [];
  CONCEPTS.forEach(c => {
    if (!learned.has(c) || mastered.has(c)) return;
    const s = ST.conceptStats[c];
    if (!s || s.total < PROMO_MIN_QUESTIONS) return;
    if (s.right / s.total >= PROMO_MIN_ACCURACY) {
      ST.mastered.push(c);
      promoted.push(c);
    }
  });
  return promoted;
}

let ST = (() => {
  const def = defaultState();
  try {
    const s = localStorage.getItem(LS);
    if (!s) return def;
    // Merge with defaults so old saved state picks up new fields.
    const merged = { ...def, ...JSON.parse(s) };
    // Migration: ensure any concept newly added to defaultState.learnedConcepts
    // gets unioned into the persisted array (otherwise saved state would lock
    // out new concepts from ever entering the drill rotation).
    def.learnedConcepts.forEach(c => {
      if (!merged.learnedConcepts.includes(c)) merged.learnedConcepts.push(c);

  } catch(e) { return def; }
})();

//  ADAPTIVE SESSION BUILDER
// ════════════════════════════════════════════════════════════════════════════

function conceptWeight(concept) {
  const base = BASE_WEIGHT[concept] ?? 0.6;
  const s = ST.conceptStats[concept];
  if (!s || s.total < 3) return base;          // not enough data, use base
  const acc = s.right / s.total;
  // Blend: 40% base priority, 60% live accuracy signal
  return 0.4 * base + 0.6 * Math.max(0.1, 1 - acc);
}

function buildSession() {
  // Two pools:
  //   ACTIVE    = learned but not yet mastered (the focal new concepts)
  //   RETENTION = mastered (only ~5% of slots, just to keep them sharp)
  const learned   = new Set(ST.learnedConcepts);
  const mastered  = new Set(ST.mastered || []);
  const isActive  = c => learned.has(c) && !mastered.has(c);

  const allIdxs       = Q.map((q,i) => ({q, i}));
  const activeIdxs    = allIdxs.filter(x => isActive(x.q.c));
  const retentionIdxs = allIdxs.filter(x => mastered.has(x.q.c));

  // If we don't have enough fresh active questions to fill ~95% of a session,
  // reset the active used pool. The active bank is small (16 questions across
  // both Divide concepts), so we'll cycle through every couple sessions.
  const activeIdxSet = new Set(activeIdxs.map(x => x.i));
  const minFresh = Math.ceil(SZ * (1 - RETENTION_RATE));
  const freshActive = activeIdxs.filter(x => !ST.usedIds.includes(x.i)).length;
  if (activeIdxs.length > 0 && freshActive < minFresh) {
    ST.usedIds = ST.usedIds.filter(i => !activeIdxSet.has(i));
  }

  const session = [];
  const usedThisSession = new Set();

  // Step 1: guarantee one question from each ACTIVE concept (focal practice),
  // but leave at least 2 slots for weighted fill + retention. With many active
  // concepts, we sort by descending weight so the highest-priority concepts
  // are guaranteed first; lower-priority ones get picked up by weighted fill.
  const activeConcepts = [...new Set(activeIdxs.map(x => x.q.c))]
    .sort((a, b) => conceptWeight(b) - conceptWeight(a));
  const guaranteeCap = Math.max(1, SZ - 2);
  for (const c of activeConcepts) {
    if (session.length >= guaranteeCap) break;
    const pool = activeIdxs.filter(x =>
      x.q.c === c && !usedThisSession.has(x.i) && !ST.usedIds.includes(x.i));
    if (pool.length === 0) continue;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    session.push(pick.q);
    usedThisSession.add(pick.i);
  }

  // Step 2: fill remaining slots — RETENTION_RATE chance of pulling from
  // mastered concepts (random pick), otherwise weighted active.
  while (session.length < SZ) {
    const activeAvail = activeIdxs.filter(x =>
      !usedThisSession.has(x.i) && !ST.usedIds.includes(x.i));
    const retentionAvail = retentionIdxs.filter(x => !usedThisSession.has(x.i));

    // Force retention if active pool is empty for this session.
    const wantRetention = activeAvail.length === 0
      || (retentionAvail.length > 0 && Math.random() < RETENTION_RATE);

    if (wantRetention && retentionAvail.length > 0) {
      const pick = retentionAvail[Math.floor(Math.random() * retentionAvail.length)];
      session.push(pick.q);
      usedThisSession.add(pick.i);
    } else if (activeAvail.length > 0) {
      const totalW = activeAvail.reduce((s, x) => s + conceptWeight(x.q.c), 0);
      let r = Math.random() * totalW;
      let chosen = 0;
      for (let i = 0; i < activeAvail.length; i++) {
        r -= conceptWeight(activeAvail[i].q.c);
        if (r <= 0) { chosen = i; break; }
      }
      session.push(activeAvail[chosen].q);
      usedThisSession.add(activeAvail[chosen].i);
    } else {
      break; // both pools exhausted
    }
  }

  // Record only active question indices to usedIds
  ST.usedIds.push(...[...usedThisSession].filter(i => activeIdxSet.has(i)));
  save();

  return shuffle(session);
}

  return `<div class="bar-wrap"><div class="bar-fill" style="width:${p}%;background:${barColor(p)}"></div></div>`;
}

async function saveToFirebase(sessionData) {
  if (!db) return;
  try {
    // Save session record
    await db.collection("sessions").add({
      studentId: STUDENT_ID,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      ...sessionData
    });
    // Update running concept stats
    await db.collection("students").doc(STUDENT_ID).set({
      conceptStats: ST.conceptStats,
      totalSessions: ST.sessionCount,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch(e) { console.warn("Firebase save failed:", e); }
}

function formatBreakdown(breakdown) {
  return CONCEPTS.map(c => {
    const s = breakdown[c] || {right:0, total:0};
    const p = pct(s.right, s.total);
    const bar = "█".repeat(Math.round(p/10)) + "░".repeat(10-Math.round(p/10));
    const flag = p < 50 ? " ⚠️" : p === 100 ? " ✓" : "";
    return `${c.padEnd(22)} ${bar} ${s.right}/${s.total} (${p}%)${flag}`;
  }).join("\n");
}

function formatRunningStats() {
  return CONCEPTS.map(c => {
    const s = ST.conceptStats[c] || {right:0, total:0};
    const p = pct(s.right, s.total);
    return `${c.padEnd(22)} ${p}% (${s.right}/${s.total} overall)`;
  }).join("\n");
}

async function uploadWork(sessionData, pdfDataUrl) {
  if (!WEBHOOK_URL) return { folderUrl: "", pdfUrl: "", summary: "(handwriting upload disabled)" };
  const work = session.map((q, i) => ({
    qNum: i + 1,
    concept: q.c,
    attrs: q.attrs || [],
    question: q.q,
    answer: q.a,
    chosen: perQuestion[i]?.chosen || null,
    miss: perQuestion[i]?.miss || null,
    correct: !!sessionData.perQuestion[i]?.correct,
    secondsBeforeReveal: perQuestion[i]?.secondsBeforeReveal ?? null,
    pngDataUrl: workShown[i] || null
  }));
  const anyWork = work.some(w => w.pngDataUrl);
  if (!anyWork && !pdfDataUrl) {
    return { folderUrl: "", pdfUrl: "", summary: "(no work shown this session)" };
  }
  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },  // avoid CORS preflight
      body: JSON.stringify({
        secret: WEBHOOK_SECRET,
        student: STUDENT_NAME,
        sessionNumber: sessionData.sessionNumber,
        date: new Date().toISOString().slice(0, 10),
        activeSeconds: sessionData.activeSeconds || 0,
        work,
        pdfDataUrl: pdfDataUrl || null
      })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || "webhook returned ok:false");
    return {
      folderUrl: data.folderUrl || "",
      pdfUrl: data.pdfUrl || "",
      summary: data.summary || "",
      analysisBlock: data.analysisBlock || "",
      analysisEnabled: data.analysisEnabled !== false
    };
  } catch (e) {
    console.warn("Work upload failed:", e);
    return {
      folderUrl: "", pdfUrl: "",
      summary: `(upload failed: ${e.message || e})`,
      analysisBlock: "(analysis unavailable — upload failed)",
      analysisEnabled: false
    };
  }
}

async function sendReport(sessionData, workResult) {
  if (!EJ_ON) return;
  const { sessionNumber, score, breakdown } = sessionData;
  const p = pct(score, SZ);
  const weakest = CONCEPTS.reduce((a, c) => {
    const sa = ST.conceptStats[a] || {right:0, total:1};
    const sc = ST.conceptStats[c] || {right:0, total:1};
    return pct(sc.right, sc.total) < pct(sa.right, sa.total) ? c : a;
  }, CONCEPTS[0]);

  const params = {
    to_email:      REPORT_EMAIL,
    student:       STUDENT_NAME,
    date:          new Date().toLocaleDateString("en-US", {weekday:"long", year:"numeric", month:"long", day:"numeric"}),
    session_num:   sessionNumber,
    score:         `${score}/${SZ}`,
    pct:           `${p}%`,
    breakdown:     formatBreakdown(breakdown),
    weakest:       weakest,
    running_stats: formatRunningStats(),
    next_focus:    weakest,
    work_folder:   workResult?.folderUrl    || "",
    work_pdf:      workResult?.pdfUrl       || "",
    work_summary:  workResult?.summary      || "",
    ai_analysis:   workResult?.analysisBlock || ""
  };

  try {
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
  } catch(e) { console.warn("Email failed:", e); }
}

// ════════════════════════════════════════════════════════════════════════════
//  HANDWRITING CANVAS
// ════════════════════════════════════════════════════════════════════════════

function setupCanvas() {
  const cv = document.getElementById("wc");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width  = Math.round(rect.width  * dpr);
  cv.height = Math.round(rect.height * dpr);
  ctx.scale(dpr, dpr);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#1a1a1a";

  let drawing = false, lastX = 0, lastY = 0;
  canvasDirty = false;

  const pos = e => {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };

  cv.addEventListener("pointerdown", e => {
    if (answered) return;
    drawing = true;
    canvasDirty = true;
    cv.setPointerCapture(e.pointerId);
    [lastX, lastY] = pos(e);
    e.preventDefault();
  });

  cv.addEventListener("pointermove", e => {
    if (!drawing) return;
    const [x, y] = pos(e);
    const w = e.pointerType === "pen"
      ? Math.max(0.6, (e.pressure || 0.5) * 4)
      : 2;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x; lastY = y;
    e.preventDefault();
  });

  const stop = () => { drawing = false; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  cv.addEventListener("pointerleave", stop);
}

function clearCanvas() {
  const cv = document.getElementById("wc");
  if (!cv || answered) return;
  const ctx = cv.getContext("2d");
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();
  canvasDirty = false;
}

function captureCanvas() {
  if (!canvasDirty) return null;
  const cv = document.getElementById("wc");
  if (!cv) return null;
  try { return cv.toDataURL("image/png"); } catch (e) { return null; }
}

// ════════════════════════════════════════════════════════════════════════════
//  ACTIVE-MINUTE TRACKING (hybrid: time accrues unless idle >60s or tab hidden)
// ════════════════════════════════════════════════════════════════════════════

const _markActive = () => { lastActivityAt = Date.now(); };
const _activityEvents = ["pointerdown","pointermove","keydown","click","touchstart","scroll"];

function startActivityTracking() {
  stopActivityTracking();
  activeMs = 0;
  lastActivityAt = Date.now();
  _activityEvents.forEach(ev => document.addEventListener(ev, _markActive, {passive:true}));
  activityTimer = setInterval(() => {
    if (document.hidden) return;
    if (Date.now() - lastActivityAt < IDLE_TIMEOUT_MS) activeMs += 1000;
  }, 1000);
}

function stopActivityTracking() {
  if (activityTimer) { clearInterval(activityTimer); activityTimer = null; }
  _activityEvents.forEach(ev => document.removeEventListener(ev, _markActive));
}

async function generatePdf(sessionData) {
  if (!window.jspdf || !window.html2canvas) return null;
  const { jsPDF } = window.jspdf;
  const dateStr = new Date().toLocaleDateString("en-US",
    {weekday:"long", year:"numeric", month:"long", day:"numeric"});

  // Build offscreen report DOM at PDF page width
  const report = document.createElement("div");
  report.style.cssText =
    "position:absolute;left:-9999px;top:0;width:780px;background:#fff;" +
    "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;" +
    "padding:40px;color:#1a1a1a;line-height:1.4;";

  const correctTotal = perQuestion.filter(p => p && p.correct).length;
  report.innerHTML = `
    <div style="text-align:center;border-bottom:2px solid #4A7FE5;
                padding-bottom:18px;margin-bottom:24px;">
      <h1 style="font-size:26px;color:#4A7FE5;margin:0;font-weight:600;">
        ${STUDENT_NAME} — Session ${sessionData.sessionNumber}</h1>
      <p style="color:#666;margin:8px 0 4px;font-size:14px;">${dateStr}</p>
      <p style="font-size:36px;font-weight:700;margin:10px 0 0;">
        ${sessionData.score}/${SZ}
        <span style="font-size:18px;color:#666;font-weight:500;">
          (${sessionData.pct}%)</span></p>
    </div>`;

  session.forEach((q, i) => {
    const correct = perQuestion[i] && perQuestion[i].correct;
    const work = workShown[i];
    const block = document.createElement("div");
    block.style.cssText =
      "border:1px solid #e6e6e6;border-radius:10px;padding:16px;" +
      "margin-bottom:14px;page-break-inside:avoid;";
    block.innerHTML = `
      <div style="display:flex;justify-content:space-between;
                  font-size:12px;color:#666;margin-bottom:10px;
                  text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">
        <span>Q${i+1} · ${q.c}</span>
        <span style="color:${correct?'#2A9E6B':'#D94F4F'};">
          ${correct?'✓ Correct':'✗ Wrong'}</span>
      </div>
      <div style="font-size:22px;text-align:center;margin:10px 0 14px;
                  padding:8px;">${k(q.q)}</div>
      ${work
        ? `<img src="${work}" style="display:block;width:100%;max-height:200px;
                                      object-fit:contain;background:#FAFAF7;
                                      border:0.5px dashed #ddd;border-radius:6px;">`
        : `<p style="color:#999;font-size:12px;text-align:center;
                     font-style:italic;padding:24px;background:#FAFAF7;
                     border-radius:6px;margin:0;">No work shown</p>`}
      <div style="font-size:13px;margin-top:10px;
                  padding-top:8px;border-top:0.5px solid #eee;">
        ${correct
          ? `<span style="color:#2A9E6B;">Picked: <strong>${k(q.a)}</strong> ✓</span>`
          : `<div style="display:flex;justify-content:space-between;gap:12px;">
               <span style="color:#D94F4F;">Picked: <strong>${k(perQuestion[i]?.chosen || '?')}</strong></span>
               <span style="color:#2A9E6B;">Correct: <strong>${k(q.a)}</strong></span>
             </div>`}
        ${perQuestion[i]?.secondsBeforeReveal != null
          ? `<div style="font-size:11px;color:#999;margin-top:6px;">
               Thought time before revealing choices: ${perQuestion[i].secondsBeforeReveal}s
             </div>`
          : ''}
      </div>`;
    report.appendChild(block);
  });

  document.body.appendChild(report);

  try {
    const canvas = await html2canvas(report, {
      scale: 1.5, backgroundColor: "#ffffff", logging: false, useCORS: true
    });
    const imgData = canvas.toDataURL("image/jpeg", 0.85);

    const pdf = new jsPDF("p", "mm", "letter");
    const pdfW = 215.9, pdfH = 279.4;  // letter size in mm
    const imgW = pdfW;
    const imgH = (canvas.height * imgW) / canvas.width;

    let position = 0;
    let heightLeft = imgH;
    pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
    heightLeft -= pdfH;
    while (heightLeft > 0) {
      position = heightLeft - imgH;   // negative offset scrolls the image up
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
      heightLeft -= pdfH;
    }

    const blob = pdf.output("blob");
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    console.warn("PDF generation failed:", e);
    return null;
  } finally {
    document.body.removeChild(report);
  }
}

function startSession() {
  session = buildSession();
  qi = 0; score = 0; answered = false;
  sessionBreakdown = {};
  workShown = [];
  perQuestion = [];
  CONCEPTS.forEach(c => sessionBreakdown[c] = {right:0, total:0});
  startActivityTracking();
  renderQ();
}

// Normalize a question's `ch` field to objects with {l, ok, miss?}.
// Supports legacy string entries (ok inferred by string-equality with q.a)
// and the new object form ({l, ok} | {l, miss}).
function normalizeChoices(q) {
  return q.ch.map(c => {
    if (typeof c === "string") return { l: c, ok: c === q.a, miss: null };
    return { l: c.l, ok: !!c.ok, miss: c.miss || null };
  });
}

function renderQ() {
  if (qi >= session.length) { renderScore(); return; }
  const q = session[qi];
  shuffChoices = shuffle(normalizeChoices(q));
  const p = Math.round((qi/SZ)*100);
  const wt = conceptWeight(q.c);
  const isWeak = wt > 0.5;

  app().innerHTML = `
    <div class="header">
      <h1>Algebra 1 — Skills Drill</h1>
      <p>Session ${ST.sessionCount + 1} &nbsp;·&nbsp; ${STUDENT_NAME}</p>
    </div>
    <div class="q-counter">${qi+1} of ${SZ}</div>
    <div class="progress-outer"><div class="progress-inner" style="width:${p}%"></div></div>
    <div class="card">
      <span class="badge ${isWeak?'weak-badge':''}">${q.c}${isWeak?' ⚠️':''}</span>
      <div class="question" id="qd"></div>
      <div class="work-area">
        <div class="work-header">
          <span>Show your work</span>
          <button class="work-clear" onclick="clearCanvas()">Clear</button>
        </div>
        <canvas id="wc" class="work-canvas"></canvas>
      </div>
      <button class="reveal-btn" id="reveal" onclick="revealChoices()">
        I have my answer — show choices ↓
      </button>
      <p class="reveal-hint">Work the problem first. You'll see the choices once you commit.</p>
      <div class="choices" id="cs" style="display:none;"></div>
      <div id="fb"></div>

    </div>`;

  document.getElementById("qd").innerHTML = k(q.q);
  revealStartTime = Date.now();

  setupCanvas();
}

// AI work-gate: before revealing the choices, send the canvas to Claude Haiku
// for a sanity check. Fail-open on any error so we never block the student on
// infrastructure. The `disabled` flag prevents double-firing while in flight.
async function gateWork(q, pngDataUrl) {
  if (!WEBHOOK_URL) return { allow: true, reason: 'no_webhook' };
  if (!pngDataUrl)  return { allow: false, reason: 'no_canvas',
    message: 'Show your work on the canvas before we open the choices.' };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);  // 12s — Haiku is fast
  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      signal: controller.signal,
      body: JSON.stringify({
        secret: WEBHOOK_SECRET,
        action: "gateWork",
        student: STUDENT_NAME,
        concept: q.c,
        question: q.q,
        pngDataUrl: pngDataUrl
      })
    });
    const data = await resp.json();
    return {
      allow: data.allow !== false,   // default to allow if response is unclear
      reason: data.reason || 'unknown',
      message: data.message || ''
    };
  } catch (err) {
    console.warn("gateWork failed (fail-open):", err);
    return { allow: true, reason: 'fetch_error_failopen' };
  } finally {
    clearTimeout(timeout);
  }
}

async function revealChoices() {
  const btn = document.getElementById("reveal");
  if (!btn || btn.disabled) return;                  // already revealed or in flight

  // Clear any previous gate-block message so it doesn't linger from a prior reject.
  const stale = document.getElementById("gate-msg");
  if (stale) stale.remove();

  // Capture canvas state BEFORE flipping anything, then start the gate check.
  const pngDataUrl = captureCanvas();

  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="reveal-spinner">⏳</span> Checking your work…';

  const result = await gateWork(session[qi], pngDataUrl);

  if (!result.allow) {
    // Blocked — surface the coaching message and re-enable the button so the
    // student can add more work and try again.
    btn.disabled = false;
    btn.innerHTML = originalText;
    const card = btn.parentElement;
    const msg = document.createElement("div");
    msg.id = "gate-msg";
    msg.className = "gate-block";
    msg.innerHTML = `<span class="gate-label">📝 Show your work</span>${
      escapeHTML(result.message || 'Try writing at least one step before we open the choices.')
    }`;
    card.insertBefore(msg, btn);
    return;
  }

  // Allowed — proceed with the original reveal flow.
  secondsBeforeReveal = Math.round((Date.now() - revealStartTime) / 1000);
  btn.remove();
  const hint = document.querySelector(".reveal-hint");
  if (hint) hint.remove();
  const cs = document.getElementById("cs");
  cs.style.display = "grid";

  const q = session[qi];
  shuffChoices.forEach((c, i) => {
    const cbtn = document.createElement("button");
    cbtn.className = "cbtn";
    cbtn.innerHTML = k(c.l);
    cbtn.onclick = () => pick(i, c.ok, q);
    cs.appendChild(cbtn);
  });
}

function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function pick(idx, ok, q) {
  if (answered) return;
  workShown[qi] = captureCanvas();   // freeze strokes BEFORE flipping `answered`
  perQuestion[qi] = {
    correct: ok,
    chosen: shuffChoices[idx].l,
    miss: ok ? null : (shuffChoices[idx].miss || null),
    secondsBeforeReveal: secondsBeforeReveal
  };
  answered = true;
  const cv = document.getElementById("wc");
  if (cv) cv.classList.add("disabled");
  if (ok) score++;

  // Update breakdown
  sessionBreakdown[q.c].total++;
  if (ok) sessionBreakdown[q.c].right++;

  // Update running concept stats
  if (!ST.conceptStats[q.c]) ST.conceptStats[q.c] = {right:0, total:0};
  ST.conceptStats[q.c].total++;
  if (ok) ST.conceptStats[q.c].right++;
  save();

  document.querySelectorAll(".cbtn").forEach((b,i) => {
    b.disabled = true;
    if (i===idx) b.classList.add(ok?"correct":"wrong");
    if (shuffChoices[i].ok && !ok) b.classList.add("reveal");
  });

  // Key-rule reminder when wrong + placeholder for AI analysis (filled async).
  const ruleHTML = ok ? "" :
    `<div class="key-rule">
       <span class="label">📌 Key Rule — ${q.c}</span>
       ${renderStepText(KEY_RULES[q.c] || "")}
     </div>
     <div id="ai-analysis" class="ai-analysis-pending">
       <span class="ai-spinner">🔍</span>
       <span>Looking at your work…</span>
     </div>`;

  document.getElementById("fb").innerHTML =
    `<div class="feedback ${ok?'correct':'wrong'}">
       ${ok?"✓ Correct!":"✗ Not quite."}&ensp;${k(q.h)}
     </div>${ruleHTML}`;
  document.getElementById("nw").innerHTML =
    `<button class="next-btn" onclick="adv()">
       ${qi+1<SZ?"Next Question →":"See My Score"}
     </button>`;

  // Fire per-question AI analysis on wrong answers — non-blocking. Student can
  // hit Next at any time; the analysis fills in when ready, or hides on failure.
  if (!ok) {
    fireAnalysis(q, perQuestion[qi], qi).catch(err => {
      console.warn("fireAnalysis failed:", err);
      const ai = document.getElementById("ai-analysis");
      if (ai) ai.style.display = "none";
    });
  }
}

async function fireAnalysis(q, pq, capturedQi) {
  const hideAI = () => {
    const ai = document.getElementById("ai-analysis");
    if (ai) ai.style.display = "none";
  };
  if (!WEBHOOK_URL) { hideAI(); return; }
  const pngDataUrl = workShown[capturedQi];
  if (!pngDataUrl) { hideAI(); return; }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);  // 25s — Opus can be slow
  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      signal: controller.signal,
      body: JSON.stringify({
        secret: WEBHOOK_SECRET,
        action: "analyzeOne",
        student: STUDENT_NAME,
        concept: q.c,
        question: q.q,
        answer: q.a,
        chosen: pq.chosen,
        correct: pq.correct,
        miss: pq.miss,
        pngDataUrl: pngDataUrl
      })
    });
    const data = await resp.json();
    // If the student already advanced past this question, ai-analysis is gone —
    // bail silently.
    const ai = document.getElementById("ai-analysis");
    if (!ai || qi !== capturedQi) return;

    if (data.ok && data.what_happened) {
      ai.classList.remove("ai-analysis-pending");
      ai.classList.add("ai-analysis-loaded");
      ai.innerHTML = `
        <div class="ai-section">
          <span class="ai-label">🔍 What I see in your work</span>
          <p class="ai-body">${escapeHTML(data.what_happened)}</p>
        </div>
        <div class="ai-section">
          <span class="ai-label">📍 Try this next time</span>
          <p class="ai-body">${escapeHTML(data.next_step || '')}</p>
        </div>`;
    } else {
      ai.style.display = "none";
    }
  } catch (err) {
    console.warn("analyzeOne fetch failed:", err);
    hideAI();
  } finally {
    clearTimeout(timeout);
  }
}

function adv() { qi++; answered=false; renderQ(); }

async function renderScore() {
  stopActivityTracking();
  ST.sessionCount++;
  save();

  // After stats are saved this session, see if any concept just earned mastery.
  const promoted = checkPromotions();
  if (promoted.length) save();

  const p = pct(score, SZ);
  const msg = p===100?"Perfect! 🎯" : p>=80?"Great work! 💪" : p>=60?"Getting there 📈" : "Keep going!";

  const promoBanner = promoted.length ? `
    <div class="promo-banner">
      <div class="promo-icon">🎉</div>
      <div class="promo-title">Concept${promoted.length>1?'s':''} Mastered!</div>
      <div class="promo-body">
        Crossed the ${Math.round(PROMO_MIN_ACCURACY*100)}% bar on
        <strong>${promoted.join(", ")}</strong>.
        Now in your Passed section — you'll still see them ~5% of the time for retention.
      </div>
    </div>` : '';

  // Find weakest in this session
  let weakConcept = null, weakPct = 101;
  CONCEPTS.forEach(c => {
    const s = sessionBreakdown[c];
    if (s.total > 0) {
      const cp = pct(s.right, s.total);
      if (cp < weakPct) { weakPct = cp; weakConcept = c; }
    }
  });

  // Breakdown rows HTML
  const rows = CONCEPTS.map(c => {
    const s = sessionBreakdown[c];
    if (s.total === 0) return "";
    const cp = pct(s.right, s.total);
    const tag = cp < 50 ? `<span class="tag-weak">needs work</span>` :
                cp===100 ? `<span class="tag-good">solid</span>` : "";
    return `<tr>
      <td>${c}</td>
      <td>${barHTML(cp)}</td>
      <td style="color:${barColor(cp)};font-weight:500">${s.right}/${s.total}</td>
      <td>${tag}</td>
    </tr>`;
  }).join("");

  // Running stats
  const runRows = CONCEPTS.map(c => {
    const s = ST.conceptStats[c] || {right:0, total:0};
    if (s.total === 0) return "";
    const cp = pct(s.right, s.total);
    return `<div class="accuracy-row">
      <span class="accuracy-label">${c}</span>
      ${barHTML(cp)}
      <span class="accuracy-stat" style="color:${barColor(cp)}">${cp}%</span>
    </div>`;
  }).join("");

  const activeMin = Math.max(1, Math.round(activeMs / 60000));
  app().innerHTML = `
    ${promoBanner}
    <div class="score-card">
      <div class="score-big">${score}/${SZ}</div>
      <div class="score-sub">Session ${ST.sessionCount} complete</div>
      <div class="score-msg">${msg}</div>
      <p style="font-size:13px;color:#888;margin-top:3px">
        ${p}% correct &nbsp;·&nbsp; ${activeMin} active min</p>

      <table class="breakdown-table">
        <thead><tr>
          <th>Concept</th><th>Score</th><th></th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>

      ${weakConcept ? `<p style="font-size:13px;color:#C07010;margin-top:12px">
        ⚠️ Next session will prioritize: <strong>${weakConcept}</strong>
      </p>` : ""}
    </div>

    <div class="score-card" style="margin-top:0">
      <p style="font-size:13px;font-weight:500;color:var(--muted);margin-bottom:10px">
        RUNNING ACCURACY — ALL SESSIONS
      </p>
      ${runRows}
    </div>

    <button class="session-btn" onclick="startSession()">Start Next Session →</button>
    <button class="reset-btn" onclick="resetAll()">↺ Reset All Progress</button>
    <div class="status-msg" id="status"></div>`;

  // Save & send async
  const sessionData = {
    sessionNumber: ST.sessionCount,
    score, total: SZ,
    pct: p,
    breakdown: sessionBreakdown,
    perQuestion: perQuestion,
    activeSeconds: Math.round(activeMs / 1000)
  };
  const status = document.getElementById("status");
  status.textContent = FB_ON ? "Saving results…" : "";
  await saveToFirebase(sessionData);

  let workResult = { folderUrl: "", pdfUrl: "", summary: "", analysisBlock: "", analysisEnabled: true };
  if (WEBHOOK_URL) {
    status.textContent = "Building report…";
    const pdfDataUrl = await generatePdf(sessionData);
    status.textContent = "Uploading and analyzing work…";   // analysis runs server-side, takes ~5–10s
    workResult = await uploadWork(sessionData, pdfDataUrl);
  }

  if (EJ_ON) {
    status.textContent = "Sending report…";
    await sendReport(sessionData, workResult);
    status.textContent = `✓ Report sent to ${REPORT_EMAIL}`;
  } else {
    status.textContent = FB_ON ? "✓ Saved to Firebase" : "";
  }
}

function resetAll() {
  ST = defaultState();
  save();
  showStart();
}

function showStart() {
  const learned   = new Set(ST.learnedConcepts);
  const mastered  = new Set(ST.mastered || []);
  const unlearned = REQUIRES_LEARN.filter(c => !learned.has(c));
  const isActive  = c => learned.has(c) && !mastered.has(c);

  // Active concepts = learned ∖ mastered
  const activeConcepts = CONCEPTS.filter(isActive);

  // Active card: name + accuracy bar (or "no data yet")
  const activeCard = c => {
    const s = ST.conceptStats[c] || {right:0, total:0};
    const p = s.total > 0 ? pct(s.right, s.total) : null;
    const stat = p === null
      ? `<span class="cstat-empty">no data yet</span>`
      : `<span class="cstat" style="color:${barColor(p)}">${p}%</span>`;
    return `<div class="concept-card concept-active">
      <div class="cc-row">
        <span class="cc-name">${c}</span>${stat}
      </div>
      ${p === null ? '' : `<div class="cc-bar"><div class="cc-bar-fill" style="width:${p}%;background:${barColor(p)}"></div></div>`}
    </div>`;
  };

  // Passed card: name with green check
  const passedCard = c => {
    const s = ST.conceptStats[c];
    const sub = s && s.total > 0
      ? `<span class="cstat-sub">${pct(s.right, s.total)}% over ${s.total} q</span>`
      : `<span class="cstat-sub">retention only</span>`;
    return `<div class="concept-card concept-passed">
      <span class="cc-check">✓</span>
      <span class="cc-name">${c}</span>
      ${sub}
    </div>`;
  };

  const activeSection = activeConcepts.length > 0 ? `
    <p class="section-label">📊 Active practice</p>
    <div class="concept-list">${activeConcepts.map(activeCard).join('')}</div>
  ` : '';

  // Group passed concepts. Show a group only if at least one of its concepts
  // is in `mastered` (so empty groups are hidden).
  const groupSections = Object.entries(CONCEPT_GROUPS).map(([group, members]) => {
    const passedMembers = members.filter(c => mastered.has(c));
    if (passedMembers.length === 0) return '';
    return `
      <p class="section-label">${group} — passed ✓</p>
      <div class="concept-list">${passedMembers.map(passedCard).join('')}</div>`;
  }).join('');

  const learnSection = unlearned.length > 0 ? `
    <p class="section-label">📚 New concepts to learn</p>
    ${unlearned.map(c => `
      <button class="learn-card-cta" onclick="showLearnIntro('${c.replace(/'/g,"\\'")}')">
        <span class="icon">📘</span>
        <span class="body">
          <strong>${c}</strong>
          <span>${LEARN_CONTENT[c]?.intro?.split('.')[0] || 'Tap to start learning'}.</span>
        </span>
        <span class="arrow">›</span>
      </button>`).join("")}
  ` : '';

  app().innerHTML = `
    <div class="start-screen">
      <h2>Algebra 1 — Skills Drill</h2>
      <p>${STUDENT_NAME} &nbsp;·&nbsp; Session ${ST.sessionCount+1}
        &nbsp;·&nbsp; ${activeConcepts.length > 0 ? `Focusing on ${activeConcepts.length} new concept${activeConcepts.length>1?'s':''}` : 'Retention only'}</p>

      ${activeSection}

      <button class="session-btn" style="margin-top:14px" onclick="startSession()">
        ${ST.sessionCount===0 ? "Start Session 1" : `Continue — Session ${ST.sessionCount+1}`}
      </button>
      <p class="retention-note">${activeConcepts.length > 0 ? `Mastered concepts mixed in at ~5% for retention.` : ''}</p>

      ${learnSection}

      ${groupSections}

      ${ST.sessionCount>0 ? `<button class="reset-btn" onclick="resetAll()">↺ Reset All Progress</button>` : ""}
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
//  LEARN MODE
// ════════════════════════════════════════════════════════════════════════════

const LEARN_STREAK_TARGET = 3;
let learnState = null;
// {concept, examplesLen, queue:[q...], qi, streak, answered, shuffChoices}

// Renders a step that may contain inline LaTeX wrapped in $...$
function renderStepText(s) {
  return s.split("$").map((part, i) =>
    i % 2 === 0 ? part : k(part)
  ).join("");
}

function pinnedRuleHTML(concept) {
  return `<div class="pinned-rule">
    <span class="label">📌 Key Rule — ${concept}</span>
    ${renderStepText(KEY_RULES[concept] || "")}
  </div>`;
}

function showLearnIntro(concept) {
  const data = LEARN_CONTENT[concept];
  if (!data) return showStart();
  app().innerHTML = `
    <div class="header">
      <h1>📚 Learn — ${concept}</h1>
      <p>Walk through worked examples, then practice ${LEARN_STREAK_TARGET} in a row.</p>
    </div>
    ${pinnedRuleHTML(concept)}
    <div class="card">
      <p class="example-title">What this is</p>
      <p class="learn-intro">${data.intro}</p>
      <button class="next-btn" onclick="showLearnExample('${concept.replace(/'/g,"\\'")}', 0)">
        See worked example →
      </button>
    </div>
    <button class="learn-back" onclick="showStart()">← Back</button>`;
}

// Cache the active example so highlightStep can look up step.math without re-rendering everything
let _currentExample = null;

function showLearnExample(concept, idx) {
  const data = LEARN_CONTENT[concept];
  if (!data) return showStart();
  const ex = data.examples[idx];
  if (!ex) return showStart();
  _currentExample = ex;
  const last = idx === data.examples.length - 1;
  const cescaped = concept.replace(/'/g,"\\'");

  app().innerHTML = `
    <div class="header">
      <h1>📚 ${concept}</h1>
      <p>Example ${idx+1} of ${data.examples.length}</p>
    </div>
    ${pinnedRuleHTML(concept)}
    <div class="card">
      <p class="example-title">${ex.title || 'Worked example'}</p>
      <div class="example-problem" id="exq"></div>
      <div class="focus-card" id="focus-card">
        <span class="focus-hint">Tap a step below to see the operation</span>
      </div>
      ${ex.boxLatex ? `<div class="box-katex" id="lvbox"></div>` : ""}
      <div class="learn-steps">
        ${ex.steps.map((s, i) => `
          <button type="button" class="learn-step-clickable"
                  data-step="${i+1}" onclick="highlightStep(${i+1})">
            <span class="learn-step-name">${s.name}</span>
            <span class="learn-step-math" id="step-math-${i+1}"></span>
          </button>`).join("")}
      </div>
      <div class="learn-result" id="exr"></div>
      <div class="learn-nav">
        <button class="learn-nav-btn learn-prev"
                onclick="showLearnExample('${cescaped}', ${idx-1})"
                ${idx === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="learn-nav-btn learn-next"
                onclick="${last ? `startLearnPractice('${cescaped}')` : `showLearnExample('${cescaped}', ${idx+1})`}">
          ${last ? 'Try Practice →' : 'Next Example →'}
        </button>
      </div>
    </div>
    <button class="learn-back" onclick="showStart()">← Back to home</button>`;

  document.getElementById("exq").innerHTML = k(ex.problem);
  if (ex.boxLatex) document.getElementById("lvbox").innerHTML = kbox(ex.boxLatex);
  ex.steps.forEach((s, i) => {
    const el = document.getElementById(`step-math-${i+1}`);
    if (el) el.innerHTML = k(s.math);
  });
  document.getElementById("exr").innerHTML = k(ex.result);
}

// Highlights .lv-N spans inside the box, marks the step active in the list,
// and pops the step's math operation into the focus card up top.
function highlightStep(n) {
  document.querySelectorAll('.lv-step').forEach(el => el.classList.remove('highlighted','flash'));
  document.querySelectorAll('.learn-step-clickable').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.lv-step.lv-' + n).forEach(el => {
    el.classList.add('highlighted','flash');
  });
  const btn = document.querySelector('.learn-step-clickable[data-step="'+n+'"]');
  if (btn) btn.classList.add('active');
  // Update focus card
  const card = document.getElementById('focus-card');
  if (card && _currentExample && _currentExample.steps[n-1]) {
    const step = _currentExample.steps[n-1];
    card.classList.add('focus-card-active','flash');
    card.innerHTML = `
      <div class="focus-card-name">${step.name}</div>
      <div class="focus-card-math">${k(step.math)}</div>`;
    setTimeout(() => card.classList.remove('flash'), 600);
  }
}

function startLearnPractice(concept) {
  const pool = Q.filter(q => q.c === concept);
  if (pool.length === 0) return showStart();
  learnState = {
    concept,
    queue: shuffle(pool),
    qi: 0,
    streak: 0,
    answered: false,
    shuffChoices: []
  };
  renderLearnQ();
}

function renderLearnQ() {
  if (!learnState) return showStart();
  // Recycle the pool if exhausted
  if (learnState.qi >= learnState.queue.length) {
    learnState.queue = shuffle(Q.filter(q => q.c === learnState.concept));
    learnState.qi = 0;
  }
  const q = learnState.queue[learnState.qi];
  learnState.shuffChoices = shuffle(normalizeChoices(q));
  learnState.answered = false;

  // Streak dots (filled = consecutive correct)
  const dots = Array.from({length: LEARN_STREAK_TARGET}, (_, i) =>
    `<span class="streak-dot ${i < learnState.streak ? 'filled' : ''}"></span>`).join("");

  app().innerHTML = `
    <div class="header">
      <h1>📚 Practice — ${learnState.concept}</h1>
      <p>Get ${LEARN_STREAK_TARGET} in a row to master this concept.</p>
    </div>
    <div class="streak-row">
      ${dots} <span style="margin-left:6px">${learnState.streak}/${LEARN_STREAK_TARGET}</span>
    </div>
    ${pinnedRuleHTML(learnState.concept)}
    <div class="card">
      <span class="badge">${q.c}</span>
      <div class="question" id="qd"></div>
      <div class="work-area">
        <div class="work-header">
          <span>Show your work</span>
          <button class="work-clear" onclick="clearLearnCanvas()">Clear</button>
        </div>
        <canvas id="wc" class="work-canvas"></canvas>
      </div>
      <button class="reveal-btn" id="reveal" onclick="revealLearnChoices()">
        I have my answer — show choices ↓
      </button>
      <p class="reveal-hint">Work the problem first. You'll see the choices once you commit.</p>
      <div class="choices" id="cs" style="display:none;"></div>
      <div id="fb"></div>
      <div id="nw"></div>
    </div>
    <button class="learn-back" onclick="exitLearnPractice()">← Save & exit</button>`;

  document.getElementById("qd").innerHTML = k(q.q);
  setupCanvas();
}

function clearLearnCanvas() {
  // Reuse drill's clear (it gates on `answered` global; flip it briefly)
  const wasAnswered = answered;
  answered = learnState ? learnState.answered : answered;
  clearCanvas();
  answered = wasAnswered;
}

function revealLearnChoices() {
  if (!learnState) return;
  const btn = document.getElementById("reveal");
  if (!btn) return;
  btn.remove();
  const hint = document.querySelector(".reveal-hint");
  if (hint) hint.remove();
  const cs = document.getElementById("cs");
  cs.style.display = "grid";

  learnState.shuffChoices.forEach((c, i) => {
    const cbtn = document.createElement("button");
    cbtn.className = "cbtn";
    cbtn.innerHTML = k(c.l);
    cbtn.onclick = () => learnPick(i, c.ok);
    cs.appendChild(cbtn);
  });
}

function learnPick(idx, ok) {
  if (!learnState || learnState.answered) return;
  learnState.answered = true;
  const cv = document.getElementById("wc");
  if (cv) cv.classList.add("disabled");

  if (ok) learnState.streak++;
  else    learnState.streak = 0;

  // Persist progress (so a refresh mid-streak doesn't lose state)
  ST.learnProgress[learnState.concept] = { streak: learnState.streak };
  save();

  document.querySelectorAll(".cbtn").forEach((b, i) => {
    b.disabled = true;
    if (i === idx) b.classList.add(ok ? "correct" : "wrong");
    if (learnState.shuffChoices[i].ok && !ok) b.classList.add("reveal");
  });

  const q = learnState.queue[learnState.qi];
  const ruleHTML = ok ? "" : `<div class="key-rule">
    <span class="label">📌 Remember</span>
    ${renderStepText(KEY_RULES[learnState.concept] || "")}
  </div>`;

  document.getElementById("fb").innerHTML =
    `<div class="feedback ${ok?'correct':'wrong'}">
       ${ok ? `✓ Correct!` : `✗ Not quite — streak resets.`}
       &ensp;${k(q.h)}
     </div>${ruleHTML}`;

  // Mastery check
  if (learnState.streak >= LEARN_STREAK_TARGET) {
    document.getElementById("nw").innerHTML =
      `<button class="next-btn" onclick="showLearnComplete('${learnState.concept.replace(/'/g,"\\'")}')">
         🎉 Concept mastered — see results →
       </button>`;
  } else {
    document.getElementById("nw").innerHTML =
      `<button class="next-btn" onclick="advanceLearn()">Next Question →</button>`;
  }
}

function advanceLearn() {
  if (!learnState) return;
  learnState.qi++;
  renderLearnQ();
}

function exitLearnPractice() {
  // Streak is already persisted, just go back home
  learnState = null;
  showStart();
}

function showLearnComplete(concept) {
  if (!ST.learnedConcepts.includes(concept)) {
    ST.learnedConcepts.push(concept);
  }
  delete ST.learnProgress[concept];
  save();
  learnState = null;

  app().innerHTML = `
    <div class="mastery-screen">
      <div class="mastery-icon">🎉</div>
      <div class="mastery-title">${concept} — Learned!</div>
      <p class="mastery-sub">Nice work. This concept is now part of your regular drill rotation, so you'll keep seeing it mixed in with everything else.</p>
    </div>
    <button class="session-btn" onclick="startSession()">Start a Drill Session →</button>
    <button class="learn-back" onclick="showStart()">← Back to home</button>`;
}

showStart();
</script>
</body>
</html>
